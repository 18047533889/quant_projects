# Evidence
evidence:
  - scenario: multi-field mixed availability retained
    expected: same_day + next_trading_day + knowledge_time all present
    actual: 3 ResolvedFieldIdentity entries; avails {price: same_day, roe: next_trading_day, announcement: knowledge_time}
  - scenario: field order independence
    expected: reversed declaration order -> same digest
    actual: identical digest
  - scenario: bogus caller digest
    expected: rejected (init=False) / deserialization raises
    actual: TypeError on digest= kwarg; ValidationError on from_dict mismatch
  - scenario: production missing revision
    expected: raise (fail closed)
    actual: ValidationError "无法解析 dataset='daily' 的 revision"
  - scenario: production missing required universe
    expected: raise (fail closed)
    actual: ValidationError "无法解析 required universe='hs300'"
  - scenario: production missing physical source snapshot
    expected: raise (fail closed)
    actual: ValidationError "物理 source snapshot 不可得"
  - scenario: research missing provenance
    expected: no raise; explicit UNKNOWN status
    actual: provenance_status="unknown", provenance_notes populated
  - scenario: unpublised/legacy dataset (no manifest) revision
    expected: stable object-set fallback token instead of UNKNOWN
    actual: revision="demo:objects:1", provenance_status="available"
  - scenario: identical content under different request_id
    expected: same content hash; different execution identity
    actual: same digest, same DataReadContentIdentity, distinct execution.request_id

