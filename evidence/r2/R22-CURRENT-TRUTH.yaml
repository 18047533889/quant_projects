  file: tests/evidence/test_current_truth.py
  tests:
    - test_current_json_binds_full_sha_set
    - test_bound_shas_match_live_tree
    - test_stale_auto_detects_on_sha_change
    - test_stale_detected_when_file_generated_at_old_sha
    - test_generator_dry_run_reproduces_file
  result:
    command: cd /home/shw/quant_projects && OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 POLARS_MAX_THREADS=1 python3 -m pytest tests/evidence/test_current_truth.py -q
    passed: 5
    failed: 0

existing_suite_guard:
  test_evidence_registry: 16 passed
  test_evidence_refresh_cli: included in the above 16 (test_evidence_refresh_cli.py has 5 tests, all pass)

known_limitations:
  - ImplementationClosureHashSet is the canonical-set hash, NOT the per-operator
    implementation closure hashes.  Computing implementation_closure_hash_for() for all
    1565 operators takes 60-140 min (measured ~2.9 s/op marginal, 88 s for 5 after cold
    import), so the set hash is the release-closure identity; it changes iff the catalog
    canonical population changes.
  - RootRepoSHA carries a (working-tree-dirty) suffix because the working tree is dirty by
    design (working tree is truth).  test_bound_shas_match_live_tree recomputes this value
    identically, so the file still evaluates CURRENT.
  - SemanticCatalogIdentity is computed against dataaccess/config/semantic_fields.yaml
    (config has an uncommitted diff adding market/availability/cross_market_comparable but
    identity is deterministic across runs; stale root copies of FE packages remain on disk
    but are shadowed by the submodule on sys.path — R22-SINGLE-SOURCE-AUTHORITY).

