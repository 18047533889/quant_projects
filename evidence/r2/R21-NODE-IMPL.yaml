problem:
  "BackendRegion had a single implementation_id field for the whole region.
  Heterogeneous regions where different nodes use different physical
  implementations (PIs) had no way to express per-node implementation identity."

root_cause:
  "1. implementation_id was a single string binding for the entire region.
  2. No mechanism to track node_id → PhysicalImplementationID mapping.
  3. Plan hash did not include per-node implementation details."

fix:
  "1. Added node_implementations: dict[str, str] field to BackendRegion
     mapping node_id → PhysicalImplementationID ('pi:v1:...').
  2. Added RegionImplementationManifestHash computation:
     'rimh:v1:' + SHA256(sorted node_implementations items).
  3. Backward compatibility: when node_implementations is provided,
     implementation_id auto-populates to manifest hash if empty.
  4. Consistency validation: if both are provided, implementation_id
     must match computed manifest hash.
  5. to_dict() exposes node_implementations and manifest hash.
  6. Plan hash payload includes node_implementations and manifest hash
     for stable identity of heterogeneous regions.
  7. Added compute_region_implementation_manifest_hash() static method."

