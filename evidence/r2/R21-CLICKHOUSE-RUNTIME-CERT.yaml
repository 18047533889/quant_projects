      - test_cert_canonicals_cover_required_semantics: PASSED

evidence:
  - scenario: run_clickhouse_runtime_cert() with no live server
    expected: status NOT_RUN for every canonical
    actual: "status=NOT_RUN, client_available=False, 17/17 canonicals NOT_RUN"
  - scenario: DuckDB evidence sets monkeypatched to claim all canonicals PASS
    expected: harness still returns NOT_RUN (no DuckDB inheritance)
    actual: "status=NOT_RUN, all canonicals NOT_RUN"
  - scenario: probe_client() default (no CLICKHOUSE_ENABLE_CONNECT_PROBE)
    expected: None
    actual: "None (clickhouse-connect missing, ports 8123/9000 refused)"

limitations:
  - "No live ClickHouse server in this workspace: the live-server execution path (status PASS/PARTIAL) is NOT_RUN and untested; only fail-closed behavior is verified."
  - "clickhouse-connect is not installed; CLICKHOUSE_ENABLE_CONNECT_PROBE=1 + real server required to exercise the live path."
  - "CLICKHOUSE_SQL_PRODUCTION_SAFE remains empty; this harness is certification infrastructure, not an admission gate."

