scope: "backend/duckdb_pushdown_backend.py (ClickHousePushdownBackend) runtime boundary"

# Problem
# --------
# ClickHousePushdownBackend subclasses DuckDBPushdownBackend and shares the SQL
# compiler IR / emitter / executor chain, but had no independent runtime
# certification. DuckDB parity (55-operator triple-parity suite,
# R21-DUCKDB-TIER1-CERT) proves DuckDB semantics only. There is no live
# ClickHouse server in this workspace (clickhouse-connect not installed, ports
# 8123/9000 refused, no CLICKHOUSE_* env/config), so any claim of ClickHouse
# parity derived from DuckDB would be unsubstantiated. DuckDB parity !=
# ClickHouse parity.

# Fix
# ----
# Added backend/clickhouse_runtime_cert.py — an independent per-canonical
# ClickHouse runtime certification harness:
#
# 1. Per-canonical runtime checks (CLICKHOUSE_RUNTIME_CHECKS, 17 canonicals):
#    NULL / NaN / Inf (is_nan, protected_div), window frame (ts_rank, ts_median,
#    ts_mean), rank tie (rank, cs_rank, group_rank), quantile (cs_quantile,
#    group_percentile), DateTime64/timezone (ts_delay), decimal (divide),
#    group ordering (group_mean, group_rank).
# 2. Fail-closed availability detection (probe_client): returns a live client
#    only when (a) clickhouse-connect is installed, (b)
#    CLICKHOUSE_ENABLE_CONNECT_PROBE is explicitly enabled, and (c) a TCP probe
#    to a non-localhost host succeeds. No network is attempted otherwise.
# 3. Independent status: run_clickhouse_runtime_cert() returns status NOT_RUN
#    per canonical when no live server exists. It never reads DuckDB evidence
#    sets (DUCKDB_REAL_SQL_VERIFIED etc.), so a DuckDB PASS can never be
#    inherited as a ClickHouse PASS.
# 4. When a live client is injected/present, each canonical is PASS/FAIL and the
#    overall status is PASS or PARTIAL — but this path cannot run in this
#    workspace (no server), so it stays NOT_RUN.

files:
  - path: backend/clickhouse_runtime_cert.py
    change: NEW cert harness (fail-closed availability detection + per-canonical checks)
  - path: tests/backend/test_clickhouse_runtime_cert.py
