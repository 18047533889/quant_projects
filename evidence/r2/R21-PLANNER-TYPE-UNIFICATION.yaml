task:
  id: R21-PLANNER-TYPE-UNIFICATION
  mission: "Eliminate the dual Physical Planner type systems — planner/backend_region.py AND planning/backend_region.py."
  status: COMPLETED_LOCAL
  timestamp: "2026-08-21"
  git_sha: c15fbcb7c719a2277e8b2c72f83d654612a49323
  commit: "R21 batch 17: planner type unification (Writer DA, committed)"

problem:
  "planning/backend_region.py defined its own PhysicalBackend/Representation/
  StateContract/BackendRegion with incompatible enum values
  (POLARS_LAZY/POLARS_EAGER/Q_TABLE/ARROW_COMPUTE/NUMBA_CPU) versus the
  planner/backend_region.py physical ABI (PANDAS_NUMPY/POLARS_PANEL/
  POLARS_LONG/DUCKDB_SQL/CLICKHOUSE_SQL/Q_KDB). The dual type systems caused
  cross-module type confusion: a BackendRegion produced by planning code could
  not be consumed by planner/runtime code, and planning enum values (e.g.
  NUMBA_CPU, ARROW_COMPUTE) leaked into physical planning as if they were
  execution backends."

root_cause:
  "1. planning/backend_region.py duplicated the physical ABI with different
     enum values instead of re-exporting the single authority.
  2. POLARS_LAZY / POLARS_EAGER / Q_TABLE were backend identities that did not
     exist on the canonical PhysicalBackend; Q_TABLE collided with a
     Representation value.
  3. NUMBA_CPU was modeled as a backend, but Numba is an Accelerator
     (backend.contracts.Accelerator.NUMBA_CPU, ExecutionKind.NUMBA_CPU_KERNEL).
  4. ARROW_COMPUTE was modeled as a backend, but Arrow is an interchange
     Representation (Representation.ARROW_TABLE)."

fix:
  "1. planning/backend_region.py is now a re-export shim of
     planner.backend_region (the single physical ABI authority). No physical
     types are defined there; everything is imported from planner.backend_region.
     PhysicalProperty alias (MB-P2-002 name) maps to PhysicalProperties so
     planning/transfer_edge.py and planning consumers keep working.
  2. planning/backend_selector.py: removed the NUMBA_CPU BackendCharacteristics
     entry and the JIT cost-model branch in _evaluate_costs; POLARS_EAGER and
     POLARS_LAZY characteristic entries now key on the canonical
     POLARS_PANEL/POLARS_LONG; conversion cost matrix updated to unified enums;
     the Numba JIT cost capability fields (cold_jit_ms/warm_ms/
     cache_hit_probability) remain optional BackendCharacteristics fields
     (defaulted to 0.0) for future accelerator-aware cost modeling.
  3. planning/hybrid_execution_planner.py: backend_map/repr_map and candidate
     backend list now use only unified PhysicalBackend members; BackendRegion/
     TransferEdge construction uses the single-authority dataclass fields
     (estimated_compute_ms / estimated_memory_bytes).
  4. planning/region_optimizer.py: _infer_representation maps only unified
     backends (PANDAS_NUMPY/POLARS_PANEL/POLARS_LONG/DUCKDB_SQL/
     CLICKHOUSE_SQL/Q_KDB); BackendRegion construction adapted to the
     single-authority dataclass.
  5. planning/physical_region_plan.py: region byte/memory field reads adapted
     to the unified BackendRegion (estimated_memory_bytes, streaming_capable,
     required_properties None-safe)."
  constraints:
    - "KEPT IT SMALL: no refactor beyond the re-export shim and the minimal
       enum/candidate alignment; planning.backend_region module kept (re-export)."
    - "LOCAL ONLY: working tree is truth; no git checkout/restore/stash/reset."

