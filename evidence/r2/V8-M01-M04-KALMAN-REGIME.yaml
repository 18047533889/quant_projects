changes:
  - Stable Welford prefix population moments replace sum/sum-square subtraction.
  - Dimensionless trend scales the legacy rank-one initial covariance matrix;
    absolute fixed-q/r recursion remains unchanged.
  - Dimensionless through-origin beta uses finite-pair prefix scales: r*var(y)
    and q*var(y)/var(x); P is beta-squared covariance, not standard error.
  - Dimensionless beta initialization uses an exact long-double degeneracy gate,
    so predictor unit changes cannot cross an absolute epsilon or select a new prior.
  - Regime emissions update in long-double log space with logaddexp normalization;
    the fixed zero-mean emission, transition matrix, clipping, and heuristic remain.
