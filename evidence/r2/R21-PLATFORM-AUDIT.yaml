  - id: QE-P0-12
    title: numerical oracle 13 tests pass
    verdict: FAIL
    evidence:
      - quant_evaluator/tests/test_numerical_oracle.py exists with 13 tests
      - Runtime: 3 FAILED / 10 PASSED (4.55s)
      - The 3 failures are TEST-BUGS, not kernel bugs (all three are oracle expectation errors):
      - test_rank_ic_with_ties_matches_hand_computed_spearman (line 186): the test's hand-built rank vectors rx/ry (lines 176-177) are WRONG. It assigns factor value 5 rank 9.0 and return value 8 rank 8.0, but correct average-tie ranks are 7.0/7.0 (there are values 3,4 in between). Correct full-panel Spearman = scipy = kernel = 0.9964973622679556; test oracle 0.9894797752097305. Kernel is CORRECT (matches scipy.stats.spearmanr exactly).
      - test_pearson_ic_matches_hand_computed_correlation (line 221): embeds the 5-asset tie-heavy panel into 12 assets; the embedded sub-panel's Pearson is NOT preserved by the full-panel correlation (unlike Spearman ranks, Pearson is scale/rank sensitive). Kernel returns full-panel Pearson 0.9880037996214396 which is mathematically correct; test wrongly expects the sub-panel value 0.9798191986792546. The tiny-panel assertion (line 205, _pearson on the 5 assets) is itself correct and passes.
      - test_hac_tstat_close_to_statsmodels_within_loose_tolerance (line 368): tolerance too tight (1e-6). QE Newey-West with no small-sample correction differs from statsmodels cov_hac at ~9.2e-5 in this fixture (kernel matches the manual NW lag-1 formula EXACTLY, verified to 1e-12). The manual-lag1 test (line 326-346) PASSES. statsmodels comparison should be loosened or QE should apply the same finite-sample correction.
      - The fix agent should correct the two oracle math errors and relax the statsmodels tolerance (or add the NW finite-sample correction to the kernel).

