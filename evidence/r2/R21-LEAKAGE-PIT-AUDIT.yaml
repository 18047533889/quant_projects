questions:

  - id: Q1
    title: "FO LabelBundle timestamp semantics / PIT-embargoed labels"
    verdict: PARTIAL
    answer: >
      A PIT-aware LabelBundle EXISTS in factor_optimizer/factor_optimizer/contracts/splits.py
      (class LabelBundle, lines 91-105; fields label_start_time / label_end_time /
      label_horizon).  It is wired into validate_split_plan: label_bundle.label_horizon
      takes precedence over SplitPlan.label_horizon when computing the train->test and
      train->validation leakage lookback (splits.py:243-247, 255-268, 273-284), and
      SplitPlan also carries embargo / validation_embargo (lines 37-53).  The docstring
      itself (lines 3-7) states the boundary is STRUCTURAL plus OPTIONAL temporal: it
      does NOT sandbox evaluator access to data or prove PIT correctness - a trusted QE
      adapter remains responsible for enforcing the plan during evaluation.
    evidence:
      - "factor_optimizer/factor_optimizer/contracts/splits.py:91-105 (class LabelBundle)"
      - "factor_optimizer/factor_optimizer/contracts/splits.py:243-247 (label_bundle.label_horizon precedence)"
      - "factor_optimizer/factor_optimizer/contracts/splits.py:255-313 (purge/embargo/validation_embargo rejection)"
      - "factor_optimizer/factor_optimizer/contracts/splits.py:3-7 (structural-only caveat)"
    tests:
      - "factor_optimizer/tests/search/test_split_safety.py:115-151 (embargo violation/pass tests)"
      - "factor_optimizer/tests/search/test_split_safety.py:82-108 (purge + label_horizon rejection)"
    test_runs:
      - "cd factor_optimizer && pytest tests/search/test_split_safety.py tests/search/test_sealed_test_hardening.py -> 61 passed"
    gaps:
      - "NO FO test constructs a LabelBundle (grep LabelBundle( in factor_optimizer/tests is empty) and NO test exercises label_bundle timestamp precedence or validation_embargo (grep validation_embargo in tests is empty)."
      - "The label_bundle timestamp fields (label_start_time/label_end_time) are NOT compared against time_index at all - only label_bundle.label_horizon is used; real timestamps are not consumed by the leakage arithmetic."
      - "No test proves 'labels cannot leak into search-time evaluation' at the evaluator level - the contract itself documents it does not sandbox evaluation."

