# Problem

When `sql_backend = "clickhouse_sql"` for a ClickHouse data source, the candidate
key was still written as `"duckdb_sql"` in `choose_plan_route`. This caused:

1. The candidate key in `candidates` was `"duckdb_sql"` even for ClickHouse routes.
2. The execution certificate was built without `requested_backend`, `resolved_dialect`,
   and `datasource_identity`, causing ClickHouse routes to be silently mapped to DuckDB.
3. The DuckDB-fused penalty only fired when `"duckdb_sql"` was in `candidates`.
4. The measured-baseline path could inherit DuckDB entries for ClickHouse routes.

# Fix

Modified the following files at HEAD `4f1863e9`:

## `backend/plan_cost_router.py`

1. **Candidate key**: `_within_budget(sql_backend, rows)` + `candidates[sql_backend]` (was hardcoded `"duckdb_sql"`).
2. **Certificate identity**: `_build_execution_certificate(..., data_kind=data_kind)` with `requested_backend` / `resolved_dialect` / `datasource_identity`.
3. **Fused penalty**: fires for either `"duckdb_sql"` or `"clickhouse_sql"` in `candidates`.
4. **Measured baseline**: `clickhouse_sql` returns `False` (DuckDB entries must not inherit).
5. **TTDC execute rate**: `clickhouse_sql` added to `_execute_ms_for_backend`.
6. **TTDC predictor**: ClickHouse treated like DuckDB for scan-to-materialize path.

## `runtime/production_execution_certificate.py`

4. **Dialect identity check**: if both certificate and runtime event declare a dialect, they must match — a DuckDB certificate must not validate a ClickHouse event.

## `runtime/hybrid_executor.py`

5. **Runtime event dialect**: `record_runtime_backend_event(..., dialect=None)` records datasource dialect alongside executor backend.

