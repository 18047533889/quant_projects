scope: |
  Fast daily aggregation over wide resample('D') instead of per-feature long-table
  merge+groupby. Semantics identical to the old implementation (output index
  (timestamp, instrument), dtype, name; last/first = last/first bar of the day;
  all-NaN day -> NaN; empty panel -> ValueError; missing column -> KeyError).

