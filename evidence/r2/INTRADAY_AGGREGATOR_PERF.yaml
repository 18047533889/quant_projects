owned_files:
  - factor_engine/runtime/intraday_aggregator.py
      # IntradayAggregator PERF-1 fast path: each MultiIndex(timestamp,
      # instrument) panel is unstack(level='instrument') into a wide frame and
      # cached once at construction (_wide_frames); trade_date via
      # index.normalize() computed once and shared by every feature; last/first/
      # sum/mean via wide.resample('D'); vwap via resample('D').sum()(amount)/
      # sum()(volume). The old long-table implementation (_stack_frame N-way
      # outer merge + groupby(["trade_date","asset"])) is preserved verbatim as
      # the equivalence reference (_*_long).
  - factor_engine/tests/runtime/test_intraday_aggregator.py
  - factor_engine/tests/runtime/test_intraday_aggregator_perf1_equivalence.py
