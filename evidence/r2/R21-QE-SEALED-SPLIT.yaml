    expected: "existing callers unchanged; new field optional and backward compatible"
    actual: "106 pre-existing tests still pass; total suite 127 passed, 2 skipped"
  - contract: "SealedSplitRef window strictly after all decision times + label ends"
    expected: "overlapping split raises typed SealedSplitOverlapError"
