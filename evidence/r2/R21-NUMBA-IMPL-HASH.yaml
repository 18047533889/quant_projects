## Test results

All 12 new tests pass. All 17 existing numba kernel tests pass (no regression).

## Implementation ID format

```
nki:v1:<sha256-hex-digest>
```

Payload structure:
```
REF:<reference_fn source>
---
NUMBA:<numba_fn source or "none">
---
REF_HELPER[0]:<helper source>
---
NUMBA_HELPER[0]:<helper source>
```
