# R21-NUMBA-IMPL-HASH

task_id: R21-NUMBA-IMPL-HASH
date: 2026-08-21
author: Writer BM
status: COMPLETE

## Problem

The `NumbaKernelRegistry` dedup logic compared only `NumbaKernelSpec` fields
(kernel_name + semantic_version + supported_dtype).  This allowed a silent swap:
same spec but different function implementations (e.g. someone registers a
different reference_fn or numba_fn under the same kernel_name with identical
spec fields).  The registry would silently overwrite the existing kernel without
raising an error.

## Solution

Introduced `NumbaKernelImplementationID = SHA256(reference_fn source + numba_fn source + transitive helpers)`.

The implementation_id is computed at registration time from:
- `reference_fn` source text (via `inspect.getsource`)
- `numba_fn` source text (via `inspect.getsource`)
- Transitive helper functions referenced in the source text

### Dedup policy (§14.1):

| Same spec | Same impl_id | Result |
|-----------|--------------|--------|
| Yes       | Yes          | Idempotent re-registration (allowed) |
| Yes       | No           | `DuplicateKernelRegistrationError` (silent swap detected) |
| No        | Any          | `DuplicateSpecMismatchError` |

## Changes

### backend/numba_kernel_registry.py

1. **New helper functions:**
   - `_get_source_safely(fn)` — safely get source text, returns "" for C/builtin/JIT
   - `_resolve_helper_sources(fn)` — collect transitive helper sources from same module
   - `_compute_numba_kernel_implementation_id(ref, numba)` — compute SHA256-based ID

2. **NumbaKernel dataclass:**
   - Added `implementation_id: str = ""` field, set at registration time

3. **NumbaKernelRegistry.register():**
   - Computes `impl_id` via `_compute_numba_kernel_implementation_id()`
   - Passes `implementation_id` to `NumbaKernel` constructor
   - New dedup check: same spec but different `impl_id` → `DuplicateKernelRegistrationError`

4. **New exception class:**
   - `DuplicateSpecMismatchError` — raised when kernel_name registered with different spec

5. **New audit function:**
   - `get_implementation_registry()` — returns implementation IDs for all registered kernels

