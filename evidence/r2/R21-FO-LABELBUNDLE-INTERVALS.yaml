title: >-
  FO LabelBundle timestamp-based interval leakage validation (FO-P0-01) --
  closes GAP-1 of evidence/r2/R21-INTEGRATION-TEMPORAL-SEPARATION.yaml and
  audit Q1 "real timestamps are not consumed by the leakage arithmetic"
status: CLOSED_LOCAL
production_certification: NOT_RUN
