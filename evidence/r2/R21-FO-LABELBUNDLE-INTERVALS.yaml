integration_test_update: >-
  INT-T3 (test_label_horizon_beyond_t_is_rejected) previously PINNED the old
  wiring gap: its FO section asserted only the enforced path (bundle +
  plan-level label_horizon=3) and documented that a bundle alone with zero
  plan-level fields silently skipped validation.  With GAP-1 closed, the test
  now ALSO asserts the NEW behavior: a LabelBundle carrying aligned
  label_start_times/label_end_times/decision_times with all plan-level integer
  fields zero is rejected ("label interval overlaps test") by the
  timestamp-interval path.  The QE-side evaluation-boundary gap (GAP-2,
  label_end_time past the evaluation window) remains PINNED as acceptance and
  is untouched.

wiring_gaps:
  - id: GAP-1
    status: CLOSED
    owner: factor_optimizer
    file: factor_optimizer/factor_optimizer/contracts/splits.py
    description: >-
      The plan-level zero early-return no longer skips a LabelBundle with real
      timestamps; timestamp interval validation is mandatory whenever the
      bundle carries aligned vectors.
  - id: GAP-2
    status: OPEN
    owner: quant_evaluator
    severity: HIGH
    description: >-
      QE has no evaluation-boundary guard tying label_end_time to the factor
      evaluation window.  A causal-chain-valid QE LabelBundle whose
      label_end_time extends past the last evaluated factor row constructs and
      evaluates today.  INT-T3 still pins this acceptance; a writer should add
      the QE label-boundary guard and flip the pin to rejection.  Out of scope
      for FO-P0-01.

runtime_notes:
  - "Synthetic vectors only; no full datasets.  The 10k-sample case is a
     per-sample hour-spaced datetime vector with 30-minute label windows and a
     30-minute inter-sample gap, chosen so no label window crosses any other
     segment's availability point."
  - "Vectorized interval intersection uses np.searchsorted on a sorted union of
     the foreign segment's availability points; runtime is O(N log N), asserted
     in test_large_vectorized_case_completes_quickly (< 5s wall for 10k)."
