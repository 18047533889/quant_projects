scope: factor_optimizer only (+ integration_tests/test_temporal_separation.py)

summary: >-
  FO _validate_temporal_leakage early-returned when SplitPlan.label_horizon ==
  purge == embargo == validation_embargo == 0 BEFORE consulting the LabelBundle,
  so a bundle carrying real label timestamps could not express forward-label
  leakage -- train/validation label intervals silently overlapping test (or
  validation) availability passed validation.  This change makes timestamp-based
  interval validation run whenever a LabelBundle with aligned per-sample
  timestamp vectors is present, even with every plan-level integer field zero,
  and validates the exact interval intersections vectorized (numpy searchsorted,
  O(N log N), never O(N^2)).

implementation:
  problem: >-
    splits.py:209-212 skipped ALL temporal-leakage validation when label_horizon
    == purge == embargo == validation_embargo == 0.  The LabelBundle's real
    label_start_time/label_end_time were only consulted as a label_horizon
    fallback inside the integer-arithmetic path, so a bundle whose label windows
    reach forward into the test (or validation) segment was silently accepted.
  contract_shape:
    - "LabelBundle gains aligned 1-D vector fields: sample_ids, decision_times,
       label_start_times, label_end_times, label_availability_times (all optional;
       scalar label_start_time/label_end_time/label_horizon retained for backward
       compat)."
    - "LabelBundle.has_timestamps() -> True when any aligned vector field is set."
    - "_coerce_timestamp_vector(values, name, n): coerces an aligned 1-D field to
       a UTC-normalized numpy datetime64 array; typed ValueError for None/non-sized,
       misaligned length, NaT/None, tz ambiguity (mixed aware/naive or non-UTC
       non-resolvable), and non-datetime content."
    - "_validate_label_bundle_intervals(split_plan, bundle): vectorized interval
       validation (see rules)."
    - "_validate_temporal_leakage: early-return is now conditioned on the bundle
       also lacking timestamps; when a bundle with timestamps is present it takes
       PRECEDENCE over the integer horizon fallback and the interval validation
       runs (and returns) before the integer arithmetic."
  interval_rules:
    - "Train label interval [label_start_times, label_end_times] intersect
       Validation availability (label_availability_times or decision_times) must
       be empty -> ValueError 'train label interval overlaps validation'."
    - "Train label interval intersect Test availability must be empty ->
       ValueError 'train label interval overlaps test'."
    - "Validation label interval intersect Test availability must be empty ->
       ValueError 'validation label interval overlaps test'."
    - "availability == label_availability_times if supplied else decision_times;
       if neither is supplied the availability is UNKNOWN and validation fails
       closed ('availability is unknown')."
    - "decision_times defaults to label_start_times when not supplied."
    - "end < start at any sample -> ValueError 'end < start' (typed)."
    - "duplicate sample_ids -> ValueError 'must be unique' (typed)."
    - "misaligned vector lengths -> ValueError 'must be mutually aligned'."
    - "vectorized via np.searchsorted on a sorted union of foreign availability
       points (O(N log N)); no O(N^2) loops."
  fail_closed_semantics:
    - "A present LabelBundle with timestamps can NEVER be skipped by the plan-level
       zero early-return (FO-P0-01 regression test)."
    - "Timestamps take precedence over the integer label_horizon fallback; the
       integer arithmetic remains the fallback only when no timestamps are
       present."
    - "A LabelBundle with timestamps but without decision_times or
       label_availability_times is rejected (unknown availability), never silently
       skipped."

