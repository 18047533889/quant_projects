part_a_identity:
  model:
    - "factor_engine/runtime/factor_value_identity.py: FactorValueIdentity (factor_id, factor_definition_hash, factor_implementation_hash, treatment_preprocess_hash, market, frequency, partition_time, universe_snapshot_id, ordered_instrument_hash, data_snapshot_id, calendar_snapshot_id, decision_time_policy, numeric_policy, dtype, build_sha, block_content_hash) + identity_hash (excludes block_content_hash, the verification bound)."
    - "FeatureSetIdentity (feature_set_version_id, feature_set_content_hash, ordered tuple[FactorValueIdentity]) — content hash binds version_id + ordered identity_hash list + each block_content_hash."
    - "compute_block_content_hash: sha256 over the block's float32 bytes + factor_ids + numeric_policy (written by writer, recomputed by reader)."
    - "feature_set_identity_for_backtest(backtest_id, factor_ids, identities, version/universe/frequency/build_sha/numeric_policy/dtype): model-layer helper returning FeatureSetIdentity — factors lacking a manifest identity are synthesized from explicit context (never a bare factor name)."
  wiring:
    - "feature_block.py: BlockManifest gains identities {factor_id: FactorValueIdentity dict} + feature_set_identity (dict); to_dict/from_dict round-trip; FeatureBlockWriter.set_identity/set_feature_set_identity + _build_missing_identities (backfills real block content hash; explicit identity with missing content hash also backfilled); FeatureBlockReader.verify_manifest_identities() recomputes content hash per factor and returns mismatch list."
    - "remote_factor_block_writer.py: same identity API (set_identity/set_feature_set_identity/_build_missing_identities) and finish() emits identities in the generation manifest."
  verification:
    - "Identity round-trips: FactorValueIdentity<->dict and FeatureSetIdentity<->dict preserve identity/feature-set content hash."
    - "Changing ANY component (numeric_policy, universe_snapshot_id, factor_definition_hash, ..., build_sha) changes identity_hash (parametrized over all 14 semantic fields)."
    - "FeatureSetIdentity content hash changes when member block content changes, when universe changes, and when member ORDER is reversed."
    - "Reader REJECTS a block whose identity content hash does not match the stored bytes (tamper block then verify_manifest_identities returns mismatches)."
