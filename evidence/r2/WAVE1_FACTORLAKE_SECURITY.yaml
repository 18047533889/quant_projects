part_b_security:
  model:
    - "quant_platform/app/contracts/permission.py: ResourceScope gains allowed_actions (tuple[str,...]); covers(..., action=...) fails closed when the scope constrains actions and the requested action is not among them. authorize(..., action=...) now requires BOTH action AND path scope coverage."
    - "data_access/write/object_storage_boundary.py: ObjectResourceScope gains allowed_actions (frozenset); matches(resource, action) requires path coverage AND action membership (legacy scopes with empty allowed_actions stay path-only). authorize_object now enforces per-action grants (read-only scope cannot write/delete/multipart/metadata-commit)."
    - "ObjectStorageAuthorizationBoundary(environment='production') REQUIRES an explicit factor_target_resolver (constructor raises ValidationError otherwise — no placeholder default)."
    - "ProductionTargetResolver: explicit layout authority; unknown factor / empty bucket or prefix raises ValidationError (never falls back to factor-lake/factors/{id}); made callable (__call__) so it implements FactorWriteTargetResolver."
  behavior_changes:
    - "read-only scope (allowed_actions={object:read, object:list}) denied object:write/delete/multipart:*/metadata:commit — verified via both permission.authorize and ObjectStorageAuthorizationBoundary."
    - "prefix A scope cannot touch prefix B (cos_prefix and key_prefix scoping both enforced; trailing-slash key_prefix now matches directory subtree, e.g. inbox/ covers inbox/f1)."
    - "production resolver with no target raises (missing layout entry, empty bucket, or missing resolver)."
  files_written:
    - quant_platform/app/contracts/permission.py (modified)
    - data_access/write/object_storage_boundary.py (modified)
    - data_access/tests/unit/test_object_storage_action_granularity.py (new, 13 tests)

constraints:
  - "data_access/read/object_store.py streaming NOT touched."
  - "OperatorRegistry semantics NOT touched."
  - "BlockManifest identities added as optional fields — loaders/from_dict keep working for legacy manifests (identities default to {})."

