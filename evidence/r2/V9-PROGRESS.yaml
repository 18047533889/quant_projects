  FIR_Q05: Independent v8_protocol scoped diff approved; not native backend certification.
  M38_M40_M41: Root reviewed stage against current baseline hashes before copying; no global gates removed.
limitations:
  - M35 now explicitly compares two fixed regularized blocked-OOS models with train-only centered kernels and an unpenalized intercept; it is not a nested causal test. Independent KKT, constant control and synthetic predictive/block-permutation checks pass. Additional probes expose tiny/huge unit failures in Granger and tiny-unit HSIC; separate numerical-hardening candidate is in progress.
  - M11 first candidate was mistakenly written to main before review. Root verified exact hashes, archived it and its new test in /tmp/v9-m11-stage.XeNcjm, then restored only those unreviewed edits to the known M08/Huber baseline ea3f72b6. Nothing was deleted. Existing OLS already publishes status; unpublished status concerns custom callables. Follow-up remains isolated and M11 OPEN.
  - Q03 four real in-memory DuckDB emitter queries validate add/square/ts_sum and shared-window execution against handwritten oracles with a pandas-operator fallback tripwire. This is research-kernel execution only, not default auto/production/native-all-operator certification. Transfer-byte instrumentation remains open.
  - This is an intermediate checkpoint, not closure of all 51 tasks or certification of 1756 operators.
  - M37 now uses FieldSpec canonical units and explicitly unit-preserving ts_std signatures. Unknown derived units fail closed in production; log-price/return-vol derivation remains unsupported until authoritative units exist. M39 structural gate lives in Analyzer; FieldRef catalog hashes round-trip and affect identity.
  - M43 merged. Under immediate-predecessor gap episode membership, refractory-1 extra bars before the earliest eligible anchor establish first status. Unknown predecessor coverage excludes unproven response anchors; unknown raw diagnostic cohorts remain NaN. Public/history/prefix/replay tests pass; this is not a persistent stateful checkpoint adapter.
  - Bessel uses stable prewarped phase-normalized SOS and full-history replay; M30 freezes event-clock state across nonfinite input and masks the first order finite events,89 tests passed. Runtime SOS checkpoint remains NOT_RUN/unimplemented. Butterworth also declares full replay; false checkpointable tags removed and phase-delay metadata unified as variable.
  - M25 overflow fallback now uses exact Decimal products/totals once, with O(N) leave-one-out subtraction; root Fraction oracle passed. This is not a universal throughput guarantee.
  - M32 Polars registered winner depends on import order (ts_advanced_batch5 or polars_dynamics); batch5 now uses the authoritative Hill CPU kernel, and both startup orders have fresh-process tests. No native certification.
  - M25 peer and M03 expectile Polars bridges have valid explicit CPU-delegation identities and both research/production classification tests. These are wrapper-content identities, not complete transitive-kernel or production certificates.
  - First M01 Huber candidate rejected. Final60823f2e candidate merged after centered-scale, original-coefficient restoration, true MAD/std and ContextVar corrections;26 tests passed. Context-local status is not full task/window outcome identity (M11 OPEN). Default100 iterations is not a hardcap on explicitly supplied finite budgets.
  - M16/M17 first stage rejected; corrected patch17c4c74c merged after independent reference and 105 actual-main tests. Zero future separation uses existing log(d+EPS), zero initial distance is excluded before argmin.
  - HSIC timing checkpoint predates M18 RBF geometry and M35 intercept changes; retain its recorded source hash, do not attribute timing to later source or model.
  - M13/M14 use bounded ADMM with one banded Cholesky per window; exhausting iterations raises typed convergence error. Full parameter-domain throughput not certified.
  - Actual default/pandas semantic versions checked on four operators; expanded public contract identity tests ongoing.
  - Actual Polars/DuckDB/GPU full parity, full compile/import, registry/duplicate authority, ABI/placeholder, CI and production gates NOT_RUN.
  - Real approved-data auto80/100k throughput, memory, transfers and recovery NOT_RUN.
  - Existing v8 descendant retirement and pending-resume limitations remain; no system delegation change authorized.
  - Current tests use synthetic data; no existing production factors recomputed or removed.
  - ENOSPC interrupted wavelet and M10 report writes; those runs are not PASS. Combined rerun25passed completed after removing one byte-identical 6177468564-byte temporary dataset copy from /tmp/v9-m37-stage only. Original data intact. About7GB free; no more full-repository staging copies.
  - M27/Bessel batch1 placeholders now call the authoritative pandas reference;57 actual-main tests passed. Pre-startup method+helper closure hashes are verified in fresh processes. Registry startup normalizes both class-level spec hashes to a separate shared value; no claim that normalized value is a transitive-kernel certificate.
  - M21 uses sparse HiGHS LP with maxiter10000/time_limit5s/local rowcap10000 and original-unit objective verification. The cap is not broker admission; lack of typed per-factor LAD failure receipts remains open.
  - M08/M09 sparse quantile LP validates primal/dual feasibility, stationarity, objective restoration and a sufficient uniqueness certificate. Full-rank design alone is insufficient; conservative rejection is possible. Local row/nnz/time guards are not broker admission. Semantic version review remains pending.
  - M22 pairwise distances use two-pass row blocks and linear workspace (roughly8MiB for typical n, not an absolute cap), same biased estimator. Covariance restored to sqrt(unit_x*unit_y). Broker allocation/real throughput not certified.
  - M23 ordered categories retained when unique<=bins, otherwise deduplicated quantiles; default target bins include both causal current/successor states and peak uses full causal-window shared bins. Requested/effective bin counts are diagnostic, not receipts. Opposite-sign extreme quantile interpolation uses bounded fallback. Legacy information tests fixed to call binary signatures with feasible fixtures and finite basic outputs;44 actual tests pass. Native/alternate TE backends not certified.
