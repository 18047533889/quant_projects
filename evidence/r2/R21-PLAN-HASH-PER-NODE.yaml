evidence:
  - The updated compute_plan_hash function now includes per-node implementation details when provided.
  - Regression tests verify that:
    1. Hash changes when node implementations are added
    2. Same implementations produce same hash (stability)
    3. Different implementations produce different hash (sensitivity)
  - This ensures plan identity is bound to specific node implementations, preventing accidental reuse of plans with different node-level details.

conclusion: |
  The compute_plan_hash function now binds each node's physical_implementation_id, bound_params, accelerator, and kernel_signature.
  This strengthens plan identity by ensuring that two plans with identical region structure but different node implementations
  will produce different hashes. The changes are backward compatible as the node_implementations parameter is optional.
