problem:
  "implementation_source_hash accepted arbitrary label strings such as
  'ts_mean:v2' or 'ts_mean:v1' and did not semantically bind the full
  closure of the operator implementation.  The missing signal meant two
  operator snapshots differing only in transitive helper source, emitter/
  kernel identity source, production ParamSpec, or numerical semantic
  policy could still compare as identical for certification / admission."

root_cause:
  "The implementation-source binding was originally a review label.  R7
  added _impl_source_hash and evidence_provenance began binding file-level
  digests, but PhysicalImplementationSpec never gained a dedicated closure
  field and never enforced SHA-256 format, so loose strings remained
  admissible and production-eligible."

fix:
  "1. Added a new frozen field implementation_closure_hash to
  PhysicalImplementationSpec (backend/contracts/__init__.py).
  2. validation_errors() now requires implementation_closure_hash to be
  present and to match ^[0-9-a-f]{64}$ (SHA-256); blank or malformed
  values fail closed and make the spec ineligible for production.
  3. physical_implementation_id payload was upgraded to pi:v3 to include
  implementation_closure_hash in the deterministic digest, so any change
  to closure semantics invalidates the physical identity.
  4. Added backend.evidence_provenance.implementation_closure_hash_for()
  as the canonical computation site.  It binds:
     - source/AST of the implementation module,
     - transitive helper sources discovered within the operator package,
     - emitter sources (Polars + DuckDB),
     - kernel identity text,
     - production parameter signature via parameter_domain_hash_for(),
     - numerical semantic policies (numeric_semantics, cross_section_spec,
       production_signature, operator_policy).
  5. Existing tests were hardened to supply valid 64-hex closure hashes
  before asserting production eligibility, and new regression coverage
  confirms blank closure-hash rejection."

