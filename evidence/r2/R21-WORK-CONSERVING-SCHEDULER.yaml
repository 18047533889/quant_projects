problem:
- 'Previous implementation used strict layer barrier: Layer 0 all done -> Layer 1 all
  done -> ... This meant a child region could not start until ALL its siblings in
  the same layer finished, even if the child only depended on one completed sibling.'
- 'Under the old approach, a slow non-critical-path region in Layer N would block all
  critical-path children in Layer N+1 from starting, increasing total execution time.'
implementation:
- 'runtime/multibackend/parallel_region_scheduler.py: Replaced _topological_layers-based
  strict barrier with work-conserving ready-queue DAG scheduler.'
- 'New schedule_parallel() method uses reverse dependency graph to push children to
  ready queue immediately when their parent completes.'
- 'Added _topological_depth() helper for estimating parallel speedup.'
- 'Uses FIRST_COMPLETED event-driven wait instead of per-layer blocking.'
- 'Children start as soon as all their dependencies complete, not when all siblings
  complete.'
- 'tests/runtime/test_r21_work_conserving_scheduler.py: 6 regression tests verifying
  work-conserving behavior.'
