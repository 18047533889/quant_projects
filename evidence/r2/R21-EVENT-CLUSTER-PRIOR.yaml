id: R21-EVENT-CLUSTER-PRIOR
slice: R21-P0-EVENTSTATE-FRAMEWORK-PRIOR
git_sha: (working-tree; local only)
timestamp: 2026-08-20T18:00:00Z
owned_files:
  - cleaned_operators/technical/event_state_derivations_v1.py (event_cluster_surprise_prior added)
  - tests/operators/test_r21_event_state_derivations.py (oracle + 9 tests added)
  - mining/direct_use.py (_RELATIVE_ALPHA_OPS appended)
problem: >
  The event cluster surprise operator (event_cluster_score in event_state_v2)
  uses a rate baseline that INCLUDES the observation window being scored,
  contaminating the surprise statistic.  No prior-only baseline variant existed
  in the tree.
fix: >
  New canonical event_cluster_surprise_prior(event, short_window, long_window)
  computes a Poisson z-score where the rate baseline is derived exclusively from
  the PRIOR window [t-long_window+1, t-short_window] which EXCLUDES the
  observation window [t-short_window+1, t].  This ensures the surprise
  statistic is not contaminated by the observation being scored.  Implemented as
  a manual loop (not _trailing_map) because it requires two non-overlapping
  sub-windows within a single long_window.  Registration follows the
  event_state_v2 / event_state_derivations_v1 spec-table idiom exactly.
new_canonicals:
  event_cluster_surprise_prior:
    params: [event, short_window, long_window]
    description: >
      Trailing event count vs Poisson-expected count under a PRIOR-ONLY baseline
      (long_window excluding the short_window); dimensionless burstiness z-score;
      prior_rate=0 -> NaN (degenerate null); long_window > short_window required.
    kernel: >
      prior_count = sum(events in [t-long_window+1, t-short_window]);
      prior_rate = prior_count / (long_window - short_window);
      expected = prior_rate * short_window;
      observed = sum(events in [t-short_window+1, t]);
      z = (observed - expected) / sqrt(expected).
    validators: strict EventBool {0,1,NaN}; reject out-of-domain.
    params_validation: short_window >= 2 (int), long_window >= 2 (int).
    relational: long_window > short_window (enforced at runtime + RelationalParamSpec).
duplicates_skipped:
  event_cluster_score: existing in event_state_v2 — rate_window INCLUDES the
    count window (documented overlap).  event_cluster_surprise_prior is
    deliberately DISTINCT: the baseline EXCLUDES the observation window.
  documented_non_duplicates:
    - event_cluster_score (overlapping baseline) vs event_cluster_surprise_prior
      (non-overlapping prior-only baseline) — different mathematical contracts
