guards_in_tests:
  - brute-force Python loop oracle independent of implementation helpers
  - baseline exclusion test: prior=all-events, short=all-no-event -> z = -5/sqrt(5)
  - prefix invariance: full.iloc[:70] == calculate(frame.iloc[:70])
  - causality mutation: late row mutation cannot touch earlier rows
  - fail-closed NaN in window: NaN at row 15 -> rows [15,34) NaN, before warmup, after finite
  - zero prior rate -> expected=0 -> degenerate NaN (never 0)
  - window validation: short_window=1, long_window=10, long_window=short_window, long_window<short_window all rejected
  - governance: ParamSpec (short_window int min=2, long_window int min=2),
    RelationalParamSpec (long_window > short_window), tags causal+pit_safe,
    EXTENDED_ONLY_CANONICALS membership, classify_canonical == "extended",
    _RELATIVE_ALPHA_OPS membership, not in _PRICE_LEVEL_INTERMEDIATE_OPS
  - available_at == "close_of_t", same_session_usable == False
known_limitations:
  - pandas_numpy backend only (manual loop per column per row)
  - prior-only baseline means the warmup is long_window-1 bars (not short_window-1)
  - prior_rate=0 yields NaN (degenerate null, documented)
