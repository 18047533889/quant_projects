implementation:
  - QBackend.execute_physical_region(region, ctx, *, input_data, return_resident_handle, workspace_id, generation_id, nodes) executes a planner-admitted BackendRegion directly (no whole-tree re-derivation).
  - QBackend.execute_physical_plan(plan, ctx) executes a q PhysicalRegionPlan in topological order; non-root q regions return QResidentTableHandle, so intermediates stay Q-resident (q_to_python_bytes=0).
  - QBackend.execute() production path routes PhysicalRegionPlan → execute_physical_plan; whole-tree PlanNode self-routing still fails closed (BackendUnavailableError when q runtime unavailable, QPhysicalRegionNotImplemented when q available but plan not planner-admitted).
  - QExecutor._load_inputs_to_q accepts Arrow tables (pyarrow.Table) at the q boundary (R21 Q_TO_ARROW), not pandas-only; zero-copy stays an optimization.
