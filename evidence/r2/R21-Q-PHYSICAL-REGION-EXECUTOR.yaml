implementation:
  - QBackend.execute_physical_region wires materialize_output=not return_resident_handle, so a q region intermediate stays Q-resident: QExecutionResult.output_df is empty and only the QResidentTableHandle is returned.
  - QExecutor.execute_region materializes output only when materialize_output and not return_resident_handle (q_to_python_bytes=0 for resident results); resident metadata is read without a q-to-pandas round trip.
  - QExecutor._load_inputs_to_q accepts pyarrow.Table inputs (Q_TO_ARROW cross-backend boundary) and converts them at the q boundary.
  - Regression suite stubs a q runtime and drives the real QBackend.execute_physical_region production path via the certified compiler.
