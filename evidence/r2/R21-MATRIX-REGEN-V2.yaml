problem:
  "Review finding R21-MT-P2a (R21-P0-MATRIX-TRUTH): docs/PHYSICAL_IMPLEMENTATION_MATRIX.md
  line 3476 (ts_regression_slope polars row) had raw `|` chars inside the
  parameter_domain_hash cell (retval enum `slope|beta|intercept|resid|...`),
  so the row rendered with 23 cells instead of 22 and broke the markdown
  table. Since the last regen, 16 new canonicals from
  cleaned_operators/technical/event_state_derivations_v1 landed (event_streak,
  event_cluster_duration, event_decay_window, signed_event_rate,
  positive_event_rate, negative_event_rate, positive_event_age,
  negative_event_age, signed_event_decay, event_direction_imbalance,
  event_flip_density, state_age, state_persistence, state_transition_count,
  state_transition_rate, state_flip_density; state_episode_duration is an
  ALIAS of state_age, not its own canonical) and several polars kernels
  changed (ts_corr native rewrite, ts_ewm_corr/cov pandas-delegate,
  Supertrend/SupertrendDirection/PSAR in polars_tech_misc), so the matrix was
  stale on both structure and counts."

root_cause:
  "The emitter rendered cell values via str(value) with no markdown-table
  escaping: any cell containing `|` (parameter_domain_hash retval enums),
  newlines, or tabs would split or corrupt its row."

fix:
  "Single emitter-level fix in scripts/generate_physical_implementation_matrix.py
  `_cell()`: after the yes/no/- normalization, every rendered cell has `|`
  escaped to `\\|`, and \\r/\\n/\\t flattened to single spaces. Backslashes
  are left untouched (values are hashes/identifiers; double-escaping would
  corrupt them). All per-(canonical, backend) row cells already route through
  `_cell`; the DIRECT_USE_MATRIX table previously interpolated
  canonical/direct_use_status raw — both now go through `_cell` too, so the
  fix is enforced at the emitter, not per call site."

