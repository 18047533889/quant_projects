problem:
  "CostModel calibration key was only (backend, operator, shape) — measurements
  from different physical implementations (PI-ID), builds, machines (CPU model /
  cores / threads), backend versions, representations, dtypes, or markets silently
  shared one calibration model.  Persistent calibration timestamps were
  time.monotonic() (boot-relative), meaningless across processes/restarts.
  Calibration persistence used a bare open/write with no atomicity or process
  lock, so concurrent writers could tear/corrupt the file."

root_cause:
  "runtime/multibackend/cost_model_calibrator.py keyed _observations/_models on
  (backend, operator, shape_key) tuples and stamped observations/models with
  time.monotonic()*1000 (MB-P1-017).  _save_to_disk did json.dump(open(path,'w'))
  with no tmp+rename and no lock.  runtime/resource_calibration_store.py also
  wrote ShapeCalibration.updated_at_ms = time.monotonic()*1000 and save() wrote
  parquet/json directly to the target path."

fix:
  "1. New frozen CalibrationKey binds 12 dimensions: pi_id, build, cpu_model,
  cores, threads, backend_version, representation, dtype, market + backend,
  operator, shape_key.  to_key() = stable '|' string; digest() = full 256-bit
  SHA-256.  _build_calibration_key() resolves identities: PI-ID via
  OperatorRegistry + backend.operator_capability._declared_physical_spec
  (best-effort, 'unknown' on failure), build via factor_engine==version[@git
  sha], CPU model/cores via platform + runtime.resource_governor
  effective_cpu_slots, threads from POLARS_MAX_THREADS / DUCKDB_THREADS /
  OMP_NUM_THREADS (then cores), backend version from the imported module,
  market from FACTOR_ENGINE_MARKET env or storage.trading_calendar.infer_market.
  2. Calibration schema_version bumped to 2; old v1 files (triple-key +
  monotonic timestamps) are not loaded (fail-closed).
  3. All persisted timestamps are UTC wall-clock: CostObservation.timestamp_ms,
  CalibratedCostModel.last_updated_ms, ShapeCalibration.updated_at_ms (now
  restored on ResourceCalibrationStore load).  time.monotonic() remains only for
  in-process throttle and lock timeout (never persisted).
  4. Atomic write + process lock: _save_to_disk writes to .tmp then os.replace,
  guarded by O_EXCL .lock file (skip-on-busy, fail-closed).  ResourceCalibrationStore.save
  uses the same _CalibrationAtomicWrite context (parquet or JSON fallback).  Lock
  contention on save raises RuntimeError (calibration is performance data; the
  cost calibrator's _save_to_disk skips without raising).
  5. research/production calibration namespace isolation:
  default_calibration_path() = ~/.cache/factor_engine/calibration/<run_mode>/
  cost_calibration.json (FACTOR_ENGINE_CACHE_DIR override honored)."

