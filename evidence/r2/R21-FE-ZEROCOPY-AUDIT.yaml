gaps_for_writer:
  - id: GAP-1
    severity: P1
    gap: "No BufferOwnership enum / documented read-only default policy. Implement
          BufferOwnership (READ_ONLY / OWNED_MUTABLE / BORROWED_READ_ONLY) or an equivalent documented
          contract, and either a) a typed ownership field on BufferRef replacing the free string
          'shared', and/or b) a documented policy in the operator/bridge docs: caller buffers are
          read-only unless ownership is explicitly transferred. (Mirrors open ledger item R42-061 /
          R42-106 typed ownership contract.)"
  - id: GAP-2
    severity: P1
    gap: "No input-non-mutation test. Add a test that (a) builds a single-dtype float DataFrame,
          passes it to a factor operator kernel, and asserts np.shares_memory view semantics and that
          the caller's frame/array is byte-identical after the run; (b) proves zero-copy path ==
          reference-copy path (same inputs -> identical results); (c) proves different execution order
          -> identical outputs (stage-by-stage vs whole-root already exists in
          tests/r38/test_stage_by_stage_parity_2026_08.py and can be the basis). The empirical
          aliasing fact (df.to_numpy(dtype=float) returns a VIEW on single-dtype float frames) makes
          this a genuine, non-vacuous guard."
  - id: GAP-3
    severity: P2
    gap: "Fast path is unprotected. The zero-copy .iloc view and BufferRef shared index/values are
          returned to callers without a writeable=False / readonly marker. Consider setting
          np.flags.writeable=False on shared read-only views (or documenting the read-only contract)
          so an accidental in-place kernel write fails loudly instead of corrupting downstream
          factors."
  - id: GAP-4
    severity: P2
    gap: "Gap-2's different-execution-order equivalence has a strong existing basis
          (tests/r38/test_stage_by_stage_parity_2026_08.py, 3 tests) but is not linked to buffer
          ownership. A writer should add a focused test that reorders two operators sharing one
          input buffer and asserts identical outputs AND unchanged input."

