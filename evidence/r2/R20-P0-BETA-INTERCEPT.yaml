id: R20-P0-BETA-INTERCEPT
slice: R20-P0-BETA-INTERCEPT — fix missing OLS intercept in beta_residual_z / beta_divergence_pct signal-row residuals + independent test oracle rewrite
campaign: Operator Rehabilitation (R20 follow-up; LOCAL ONLY, working tree is truth)
git_sha: working-tree  # no commit; working tree is truth
