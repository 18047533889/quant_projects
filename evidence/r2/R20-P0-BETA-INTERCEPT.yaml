owned_files:
  - cleaned_operators/technical/group_state_v1.py     # _prior_beta_stats now returns (alpha, beta, resid_std); both kernels use r_t - (alpha + beta*m_t)
  - tests/operators/test_r20_group_state_direct_use_rehab.py  # oracle rewritten to polyfit(deg=1) closed form + intercept counterexample tests
  - evidence/r2/R20-P0-BETA-INTERCEPT.yaml            # this file

problem:
  "P0-01: _prior_beta_stats fitted r ~ 1 + m (intercept alpha = r.mean() -
  beta*m.mean(), correctly used INSIDE the fit for resid_std) but returned
  only (beta, resid_std). The SIGNAL-row residuals in beta_residual_z
  (resid = r_t - beta*m_t) and beta_divergence_pct omitted alpha-hat, so
  every signal row carried a spurious constant ~alpha bias (~alpha/resid_std
  in z units; ~alpha/|m_t| in divergence units) even when the market model
  fit the prior window exactly.  P0-02: the existing test oracle replicated
  the same missing-intercept bug (asserted against r_t - beta*m_t), so the
  error was structurally invisible to the suite."

fix:
  "_prior_beta_stats now returns (alpha, beta, resid_std) with
  alpha = float(r.mean()) - beta*float(m.mean()); beta_residual_z and
  beta_divergence_pct compute resid = r_t - (alpha + beta*m_t).  All
  fail-closed guards unchanged (NaN/Inf window, sxx<=eps -> degenerate
  market variance, dof<1, zero resid_std, |m_t|<=eps divergence guard).
  Docstrings updated (removed 'alpha term absorbed into the prior-window
  mean' wording; intercept explicitly included).  _prior_beta_stats has no
  other callers in the module (verified by grep).  Test oracle rewritten:
  expected values from numpy.polyfit(m_fit, r_fit, deg=1) (high->low:
  beta, alpha) on the strictly-prior window [t-w, t-1], structurally
  independent of the implementation's cov/var closed form; plus an exact
  intercept counterexample (r = 0.01 + 1.5*m exactly -> signal-row
  residuals must be ~0; pre-fix they were ~0.01)."

commands_run:
  - "OPENBLAS/OMP/MKL/POLARS threads=1 pytest tests/operators/test_r20_group_state_direct_use_rehab.py -q -> first run 1 failed 41 passed (new z-counterexample test's own warmup assert was wrong: exact-relation windows yield resid_std==0 -> NaN by design, not finite); corrected the TEST's expected NaN rows -> 42 passed in 82.20s (serial, no xdist)"
  - "threads=1 pytest tests/operators/test_r20_relalpha_promotion.py -q (only other tests/ module referencing beta_residual_z/beta_divergence_pct, per grep) -> 4 passed in 76.90s"

results:
  new_tests: 4   # intercept counterexample family (divergence-zero-resid, z-zero-resid-std NaN, tiny-burnin-noise z, sign preservation)
  new_tests_passed: 4
  regression_tests: 38   # pre-existing tests in the module re-passing post-fix
  regression_tests_passed: 38
  unrelated_failures: none

guards_in_tests:
  - "exact-intercept counterexample: r = 0.01 + 1.5*m over burn-in -> prior fit recovers alpha~0.01, beta~1.5; divergence residual at signal rows |resid| < 1e-10 (regression note: pre-fix ~0.01)"
  - "tiny-burnin-noise z variant: single +1e-6 noise bar -> |z| < 2 at rows whose window contains it (pre-fix ~0.01/resid_std ~ 30); pure windows stay NaN (resid_std == 0 fail-closed)"
  - "zero-noise exact relation: beta_residual_z NaN everywhere (zero resid_std guard unchanged by the intercept fix)"
  - "sign preservation: +/-0.005 shocks at a signal row give antisymmetric divergence outputs"
  - "oracle structurally independent: numpy.polyfit(deg=1) OLS, NOT the implementation's cov/var closed form; strictly-prior window (signal row excluded from fit, pinned by the no-contemporaneous-leak outlier test)"
  - "warmup rows NaN; NaN/Inf in prior window poisons exactly [k+1, k+w]; degenerate market variance -> NaN; |m_t|<=eps -> NaN for divergence"

known_limitations:
  - "oracle independence is at the estimator level (polyfit lstsq vs hand cov/var); both are OLS on the same window so exact-integer agreement is expected by construction"
  - "the first gate run's single failure was a bug in the NEW test's warmup expectation (expected finite z where the zero-resid-std guard mandates NaN), not in the kernel; corrected before the final green run"
  - "kernel numerical path unchanged apart from the added intercept; no DirectUse matrix or production artifacts regenerated"

