implementation:
  objective_spec:
    - Added factor_optimizer/contracts/objective.py: ObjectiveSpec frozen dataclass
      (metric_name, direction) validated fail-closed on construction; to_dict/from_dict;
      equality by content; hashable; picklable.
    - SearchConfig now holds objective_spec as the single authority for direction.
      The legacy bare `objective_direction` field is retained as a backward-compatible
      convenience and is reconciled into the spec at __post_init__:
        * spec supplied -> field derived from spec (never drifts);
        * field only    -> promoted to spec over default metric "score";
        * both supplied and disagree -> ValueError (no silent drift);
        * neither       -> defaults to maximize.
    - SearchSession.update_best now reads self.config.objective_spec.direction
      instead of the parallel bare field.
    - SearchConfig.to_dict serializes objective_spec (not the bare field);
      from_dict restores the spec and reconstructs the legacy field so
      to_dict/from_dict round-trips remain comparable. Pre-spec checkpoint
      payloads (bare objective_direction only) still restore.
  strategy_validation:
    - ParameterSpace.__post_init__ now validates fail-closed: name non-empty,
      known kind, numeric non-boolean low<high bounds for float/int, non-empty
      string/unique choices for choice, log_scale bounds positive, log_scale
      not applicable to choice.
    - SearchSpace.__post_init__ validates parameter list types and unique names.
    - Each strategy validates its own constructor args (grid_points,
      max_combinations, n_initial, acquisition, ucb_kappa, gamma, n_candidates,
      maximize).
    - BayesianSearch/TPESearch reject categorical (choice) parameters at
      construction via _check_categorical_support (FO-P0-03), so a categorical
      param never produces a garbage float proposal. TPE's choice branch was
      replaced with an unreachable ValueError.
    - SearchSpace.to_array fails closed on categorical spaces.
    - RandomSearch/GridSearch still support categorical parameters natively.
  checkpoint_resume_bridge:
    - Fixed a latent pre-existing bug in SearchRunner.resume: the finished-session
      guard (is_finished) was missing, so resuming an exhausted/finished session
      raised the strategy-missing error instead of "cannot resume a finished
      session". Restored the guard as the first check.
