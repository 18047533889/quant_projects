# Limitations / NOT_RUN

- LIRS is intentionally NOT implemented (fail-closed). Wiring the optimizer into
  `SharedBufferStore` / `AdaptiveBatchScheduler` is a follow-up, not done here.
- No full-dataset runs; synthetic in-memory values only.
- Serial pytest only; no xdist.
