# Problem

MiningCampaignSnapshot recorded metadata (source/universe/compiler identities)
but MiningCampaignSession.run_many_iter() never injected the pinned identities
into the ExecutionContext / data access path. evaluate_many_iter() could pass
snapshot A while the engine actually read snapshot B, silently evaluating every
candidate against the wrong data state. Compiled/failure maps were also keyed by
factor.name, so two factors sharing a display name could alias each other's
records.

# Fix

Code changes in factor_engine/mining/campaign.py:
- source_identity_hex(data_source) and universe_identity_hex(data_source) provide
  canonical read identities derived from the source's serializable
  execution_spec plus its live snapshot_token (manifest token first, then
  resolved DataAccess snapshot id) and from instrument_filter semantics
  (ALL / EMPTY / LIST are distinct execution semantics).
- MiningCampaignSession._require_pinned_identity() checks, before any
  streaming, that the engine's real read identity matches the pinned
  source_snapshot / universe_snapshot. A mismatch raises CampaignSnapshotPinError
  (hard fail) before the engine yields a single result. run_many_iter() and
  evaluate_many_iter() both gate on it.
- compile_many() and the session compiled map are keyed by the semantic
  CandidateID (candidate_semantic_hash) instead of factor.name; failures too.
  session.compiled[candidate_hash] = (dag, analysis, factor_name).

