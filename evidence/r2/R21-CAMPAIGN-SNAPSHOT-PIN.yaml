# Limitations

- The engine-side ExecutionContext itself is not yet constructed BY the session
  with the pinned identities; the pin is enforced at the campaign layer by
  verifying the engine's actual read identity before evaluation. A caller that
  rebuilds the engine / data source must pass the same pinned snapshot.
- Five pre-existing r42 failures (test_r42_testing_infrastructure /
  test_r42_contextvar_and_aggregation / test_r42_sink_cache_051_059) fail on
  HEAD as well (missing PhysicalRepresentation, writer_count,
  _estimate_cache_values) and are unrelated to this change.
- tests/conftest.py re-imports the editable mining package before the monorepo
  root is put back on sys.path, so tests/ always resolves the factor_engine
  copy of mining/campaign.py (the workspace root also has a mining/ package that
  would otherwise shadow it).
