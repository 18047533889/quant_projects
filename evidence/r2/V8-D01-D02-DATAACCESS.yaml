changes:
  V8-D01: Cache hits are captured under the cache lock as request-owned strong references before miss I/O; return assembly no longer depends on cache residency after insertion/eviction.
  V8-D02: The eager handle dataset and exact physical source_snapshot digest are checked before snapshot recording, Arrow conversion, normalization, or cache insertion; mismatch closes the handle and clears reusable caches.
  snapshot_rule: A mixed hit/miss request rejects eager or lazy results whose observed snapshot differs from the snapshot owning its captured hits.
  concurrency_rule: Snapshot recording, approval binding, and guarded cache insertion use one metadata lock; remote I/O and conversion do not hold it.
  lifecycle_rule: All eager pre-conversion failures close the handle; first exact-content binding atomically discards caches created before approval.
