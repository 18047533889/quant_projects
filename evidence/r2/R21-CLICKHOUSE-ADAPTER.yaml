# Problem

ClickHouse SQL execution was routed through `DuckDBPushdownBackend` with runtime
attribute injection (`_requested_backend`, `_resolved_dialect`, `_datasource_identity`)
to pretend a separate backend identity. This created a fragile boundary where:

1. The concrete backend class was still `DuckDBPushdownBackend` for both engines.
2. The factory had to patch private attributes after construction.
3. The adapter identity depended on caller discipline instead of type structure.
4. Telemetry, certificate chain, and adapter boundary relied on runtime monkey-patching.

# Fix

Refactored `backend/duckdb_pushdown_backend.py` and `backend/factory.py`:

1. Introduced `ClickHousePushdownBackend(SqlBackend)` as a first-class adapter.
2. `DuckDBPushdownBackend` remains the DuckDB adapter (shared compiler IR, independent runtime label).
3. `build_backend('clickhouse_sql')` now returns `ClickHousePushdownBackend`.
4. Removed runtime attribute injection for ClickHouse factory routing.
5. `ClickHousePushdownBackend` carries the R40 #141 choice-chain defaults (`_requested_backend`, `_resolved_dialect`, `_datasource_identity`), so `build_backend_execution_certificate` inherits adapter identity without new factory branches.
6. `build_backend_execution_certificate` behavior unchanged for existing callers.

# Scope

- Compiler IR / emitter / executor chain is still shared (no query generation duplication).
- Adapter boundary is now explicit via subclass + `runtime_backend_label` + adapter-owned metadata defaults.
- Existing tests remain compatible; adapter regression tests added.

