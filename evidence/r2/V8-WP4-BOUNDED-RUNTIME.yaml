observed_overlap:
  ordering: with A blocked, B_terminal < C_start, C_terminal < D_start, and D_terminal < E_start; A remains active until explicitly released
  processes: peak active compute count is exactly two; five dispatched waves use five distinct fresh PIDs
  dispatch_accounting: five valid roots at lookahead one report execution_batches=5 and attempts=1 each; a rejected compile reports attempt=0 and no batch, while the following valid root still dispatches
  cpu: recorded per-slot proxy quotas sum to no more than parent hard CPU slots; the compile client is separately retained in the broker ledger rather than treated as resource-free because idle
  egress: artifact manifest workspace budgets are each total_writer_bytes/2 and their sum does not exceed the single protected parent writer lease
  failure_boundary: invalid B prevents C start and leaves C attempt=0; B descriptor/ACK loss aborts under its own slot identity, conservatively retaining uncertain commit authority rather than recovering it
  boundary: deterministic blocking engines validate scheduling, persistence ordering, PID retirement, and ownership only; real default auto throughput and real-dataset performance are NOT_RUN
limitations:
  - Phase progress identifies the latest factor ordinal but does not provide sub-write checkpoints inside an atomic artifact writer.
  - Multi-request FIFO fairness is broker-unit tested; full concurrent pipeline fairness remains NOT_RUN.
  - Safe worker epoch reuse: NOT_RUN / OPEN
  - B descriptor/ACK loss and other uncertain commits terminate conservatively as UNKNOWN/ABORTED; automatic recovery of that pending work is NOT_IMPLEMENTED.
  - Pending same-run resume and per-operator tiling: NOT_IMPLEMENTED; terminal-only artifact revalidation is implemented.
  - Real auto-operator/native-backend throughput, real datasets, and 100k-factor scale: NOT_RUN
