implementation:
  - "Existing recursive Supertrend REUSED (not reimplemented): a shared
    _supertrend_state(high,low,close,atr_window,multiplier) helper mirrors the
    _psar_state pattern and reads level + regime sign from the SAME registered
    Supertrend machine (Wilder ATR + band ratchet/flip, no future
    displacement)."
  - supertrend_direction: +1 when close >= Supertrend line (bull regime), -1
    below; NaN where Supertrend is NaN (warmup / post-gap UNKNOWN) or close is
    not finite.  Sign contract matches SupertrendDirection exactly.
  - supertrend_distance_pct: (close - Supertrend line) / close with
    strict-positive close masking (bad close -> NaN, never an abs-flipped
    ratio).
  - supertrend_flip: +1 on flip up, -1 on flip down, 0 on hold; defined only
    after both sides of the direction series are finite (same
    both-sides-finite contract as psar_flip); NaN during warmup.
  - supertrend_days_since_flip: bars since the last regime flip; NaN before
    the first flip (mirrors psar_days_since_flip exactly).
  - Registered via _SPECS with ParamSpecs (atr_window int>=2 HORIZON,
    multiplier positive float STATE_THRESHOLD) — same param contract as
    Supertrend itself.  No relational spec needed (atr_window/multiplier have
    no ordering constraint; family precedent Supertrend has none either).
  - All four names added to _RECURSIVE_EWM (stateful/full_replay tags;
    recursive full-replay governance, not prefix-invariant by design).
  - Classified in _TECHNICAL_V2_CANONICALS and in DAILY_FACTOR_MIGRATED via a
    new _DAILY_SUPERTREND_PACK_2026_08 frozenset (mirrors
    _DAILY_MA_DISTANCE_PACK_2026_08).  Raw price-scale
    "Supertrend"/"SupertrendDirection" stay intermediate-only.
  - Added the four dimensionless names to _RELATIVE_ALPHA_OPS
    (mining/direct_use.py); raw Supertrend level NOT added.
