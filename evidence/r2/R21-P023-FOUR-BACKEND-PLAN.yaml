problem:
  "ExecKind only had SQL/PYTHON/MATERIALIZED. PhysicalRegionPlan lacked support
  for 4 distinct backends (Pandas/NumPy, Polars, DuckDB, ClickHouse) and
  Numba CPU kernel execution. TransferEdge lacked materialization cost tracking
  for Arrow/NumPy/Polars/SQL conversions."

root_cause:
  "1. ExecKind enum was too coarse - only 3 members for all execution backends.
  2. Backend contracts lacked NUMBA_CPU_KERNEL, CLICKHOUSE_NATIVE_SQL, Q_NATIVE.
  3. PhysicalRegionPlan had no mechanism to track per-backend implementation
  identity, representation, sortedness, grain, availability, memory, liveness,
  source identity, or parameter-domain identity."

fix:
  "1. Added 7 new ExecKind members to planner/physical_plan.py:
     - PANDAS_NUMPY: pandas DataFrame + NumPy ufunc
     - POLARS_NATIVE_EXPR: Polars expression engine
     - POLARS_NUMPY_KERNEL: Polars column + NumPy kernel
     - NUMBA_CPU_KERNEL: Numba JIT compiled CPU kernel
     - DUCKDB_NATIVE_SQL: DuckDB native SQL execution
     - CLICKHOUSE_NATIVE_SQL: ClickHouse native SQL execution
     - Q_NATIVE: Q/kdb+ native execution
  2. Added 3 new ExecutionKind members to backend/contracts/__init__.py:
     - NUMBA_CPU_KERNEL
     - CLICKHOUSE_NATIVE_SQL
     - Q_NATIVE
  3. Updated is_native_execution() to include new native backends.
  4. BackendRegion (planner/backend_region.py) now carries:
     implementation_id (PhysicalImplementationID binding), input_bytes,
     output_bytes, liveness (eager/lazy/stream), parameter_domain_identity;
     all exposed in to_dict(). Existing fields already cover representation,
     sortedness (PhysicalProperties.sorted_by), grain, availability
     (available_at), memory (estimated_memory_bytes), and source identity
     (source_snapshot).
  5. TransferEdge now carries materialization cost decomposition:
     materialization_cost_arrow_ms / _numpy_ms / _polars_ms / _sql_ms,
     exposed in to_dict()."

