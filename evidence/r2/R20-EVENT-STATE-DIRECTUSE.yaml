landed_canonicals:
  - name: event_rate_pct
    math: "count(event==1 in trailing window) / window — events/bar in [0,1] for a 0/1 indicator"
    params: {window: ParamSpec(int, min=2, HORIZON)}
    guards: "strict EventBool {0,1,NaN} input (out-of-domain incl. +/-Inf -> ValueError); NaN-in-window -> NaN (fail-closed)"
  - name: event_recency_z
    math: "(bars-since-last-event - mean(inter-arrival gaps)) / std(gaps, ddof=1); gaps from event positions fully inside the window (right-censored current gap)"
    params: {window: ParamSpec(int, min=3, HORIZON)}
    guards: "<3 events in window -> NaN (documented); zero gap dispersion -> NaN; fail-closed NaN-in-window"
  - name: event_cluster_score
    math: "(K - E) / sqrt(E); K = count in count-window, lambda = count in longer rate-window / rate_window, E = lambda*window (Poisson z; rate window contains the count window — documented overlap)"
    params: {window: min=2 HORIZON, rate_window: min=2 HORIZON, relational: window < rate_window}
    guards: "rate_window <= window -> ValueError (spec + runtime, messages match); zero events in rate window -> NaN; fail-closed NaN-in-window (rate window covers count window)"
  - name: state_dwell_pct
    math: "count(state == state_t in trailing window) / window — regime persistence in (0,1]"
    params: {window: ParamSpec(int, min=2, HORIZON)}
    guards: "state panel finite-or-NaN (±Inf -> ValueError); NaN-in-window or NaN current state -> NaN; constant window -> exactly 1.0"
  - name: state_transition_surprise
    math: "(T - E) / sqrt(Var); T = adjacent-pair transitions in window, m = distinct states in TRAILING window only, p = 1-1/m, E = (w-1)p, Var = (w-1)p(1-p) — uniform-iid null"
    params: {window: ParamSpec(int, min=2, HORIZON)}
    guards: "unseen states never enter m (trailing counts only — no look-ahead, no support declaration); m<=1 -> NaN; degenerate Var -> NaN; fail-closed NaN-in-window"

