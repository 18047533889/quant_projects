limitations:
  - Learned_params_hash canonicalization uses a repr-based stable serializer
    (handles Mapping/ndarray/list/set/datetime); exotic non-builtin param
    objects fall back to repr(value) and therefore only hash stably within the
    same object model version.
  - Rolling transforms operate per-asset on lagged windows; the prefix/split
    properties are asserted for rolling_mean. Other windowed transforms
    (rolling_std, ewma, missing_rate) share the same _groupwise_lagged_stat
    helper but are not individually exercised.
  - cs_rank uses scipy rankdata; property asserted on average-tie ranking.
  - No production certification run; tests are local synthetic-data only.
  - Evidence YAML filename is R21-FP-LEAKAGE per task; owned_files point at
    factor_preprocess paths under the quant_projects working tree.
