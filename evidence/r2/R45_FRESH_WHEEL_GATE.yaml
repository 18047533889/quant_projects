summary: >-
  Fresh-wheel packaging gate. Build of HEAD produced a wheel whose dataaccess /
  data_access package did not land in the archive, so `import data_access` /
  `import dataaccess` FAILED in a clean venv (ModuleNotFoundError). A minimal,
  safe pyproject.toml fix (add "dataaccess", "dataaccess.*", "data_access" to
  the [tool.setuptools.packages.find] include list) makes the wheel import
  cleanly and pass all smoke tests. Original build: FAILED (P0 packaging
  defect). Fixed build: PASS.

