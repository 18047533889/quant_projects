verdict: PASS_WITH_MINIMAL_FIX
verdict_detail: >-
  Original HEAD wheel (git rev-parse HEAD == c0893da0) is a CONFIRMED P0
  packaging defect: [tool.setuptools.packages.find].include listed only
  `dataaccess.data_access.<sub>` names, so the top-level `dataaccess` and
  `data_access` packages were dropped from the wheel -> `import data_access`
  FAILED in a clean venv. Minimal safe fix applied to pyproject.toml (add
  `dataaccess`, `dataaccess.*`, `data_access` to include). After fix the wheel
  imports all 5 required modules and both minimal smokes PASS. No code edited.

