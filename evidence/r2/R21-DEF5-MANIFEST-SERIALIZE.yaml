problem: |
  refresh_operator_manifest stage of scripts/certify_primitive_evidence.py crashed.
  Traceback: operator_capability.py:614 _sql_emitter_ok(name) ->
  _safe_payload_hash(_sql_contract(canon)) -> evidence_provenance.py:84
  compute_payload_hash json.dumps TypeError: Object of type ParamSpec is not
  JSON serializable -> CapabilityInfrastructureError -> export_operator_manifest
  exit 1.
root_cause: |
  _sql_contract(canon) returned dict(OperatorRegistry._catalog.get(canon, {}) or {})
  — the RAW registry catalog entry. Catalog-wide scan (466 entries) found the only
  non-JSON-native values are live cleaned_operators.base.ParamSpec dataclass objects
  inside param_specs (100 occurrences across 20+ canonicals; ParamSpec fields also
  carry a live dtype `type` object and a live ParamRole enum). json.dumps of live
  objects raises TypeError; _safe_payload_hash correctly fails closed (#213) with
  CapabilityInfrastructureError.
fix: |
  backend/operator_capability.py (+59/-1):
  - New _json_contract_value(): typed serialization of a registry contract value to
    plain JSON. ParamSpec -> dict of its 11 declared dataclass fields; dtype type
    object -> __name__ string; ParamRole enum -> .value string; MISSING default
    sentinel -> "__MISSING__" (None default is preserved as None); tuples -> lists;
    dicts recursed with str keys. Any other live object type (non-ParamSpec
    dataclass, arbitrary class instance) still raises CapabilityInfrastructureError
    — fail-closed, no repr fallback, no silent coercion.
  - _sql_contract() now returns _json_contract_value(raw catalog entry) so every
    consumer (lines ~553 _sql_bound_param_names, ~614 _sql_emitter_ok cache key,
    ~755 _sql_status) gets the same deterministic plain-JSON contract view.
    _safe_payload_hash and evidence_provenance.compute_payload_hash are unchanged
    and stay fail-closed. Registry and cleaned_operators NOT modified.
  - Catalog scan confirmed no sets, no non-str dict keys, no other exotic types in
  any entry; non-ParamSpec dataclasses are rejected loudly by design.
  - Hash inputs change once (contract now hashes serialized ParamSpec fields instead
  of crashing); _EMITTER_OK_CACHE key is derived from the same _sql_contract, so it
  is consistent everywhere it is consumed.
