summary: |
  RIDGE2-P0-07 关闭：COSObjectStore multipart 从「整块 bytes 二次拷贝 + 整读回程
  校验」升级为有界内存流式上传。
  - put_object 接受 BinaryIO 入口：逐 part（part_size）从流读，有界 in-flight
    队列（<= inflight=max_concurrency）并发 UploadPart，part 上传即释放；
    sha256/MD5 边传边算，complete 后校验（不再整读回程）。
  - bytes 入口保持小对象单 PUT / 大对象 multipart 不变，intent 兼容。
  - PartNumber 统一 1..10000（_validate_part_number）与 PartNumber set 连续。
  - 流 producer 失败（part 数越界 / 源读失败）通过 _StreamingProduceFailure 标记
    → 立即 abort 不重试（同流不可重放；修复「重试用空流掩盖初始失败」NO-RAISE）。
  - 新增依赖 boto3/botocore（数据平面拉真 multipart 的运行时依赖，P0-05 补全）。
