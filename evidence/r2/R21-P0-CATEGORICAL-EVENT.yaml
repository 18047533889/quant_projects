1. **test_cat_event_oracle_match**: Oracle match tests for all 7 new canonicals using independent brute-force Python loops.

2. **test_categorical_event_family_semantics**: Deliberate scenario tests for all 7 new canonicals with specific expected values.

3. **test_categorical_event_family_available_at**: Metadata validation for the new canonicals.

Updated existing tests to include the new canonicals:
- **test_causality_mutation_does_not_touch_earlier_rows**: Added CategoricalEvent family causality tests.
- **test_prefix_invariance**: Added CategoricalEvent family prefix invariance tests.
- **test_nan_in_window_fail_closed**: Updated to handle CategoricalEvent family input types.
- **test_invalid_state_panel_rejected**: Updated to include CategoricalEvent family state panel validation.

### 3. `evidence/r2/R21-P0-EVENTSTATE-FRAMEWORK.yaml`

Updated evidence YAML to reflect the new canonicals and test results.

