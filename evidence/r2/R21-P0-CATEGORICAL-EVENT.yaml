# R21-P0-CATEGORICAL-EVENT: CategoricalEvent typed canonicals

## Slice Overview

**Problem:** The Event/State derivation framework lacked CategoricalEvent typed canonicals for category-level analysis (category_age, category_frequency, category_transition_rate, category_transition_surprise), event_direction_persistence, state_episode_age, and state_flip_age.

**Solution:** Implemented 7 new CategoricalEvent canonicals in `cleaned_operators/technical/event_state_derivations_v1.py` with typed contracts, brute-loop oracles, prefix invariance + causality mutation tests, and evidence YAML.

## Files Modified

### 1. `cleaned_operators/technical/event_state_derivations_v1.py`

Added 7 new canonicals:

1. **category_age(state, window)**: Bars since the state last changed to a different category within the trailing window. Dimensionless episode age in [0, window-1]. Fail-closed: NaN in window -> NaN; constant window (episode start censored) -> NaN.

2. **category_frequency(state, window)**: Fraction of the trailing window in the current category. Dimensionless in [0, 1]. Fail-closed: NaN in window -> NaN.

3. **category_transition_rate(state, window)**: Adjacent-pair category changes per bar: transitions / (window - 1). Dimensionless in [0, 1]. Fail-closed: NaN in window -> NaN.

4. **category_transition_surprise(state, window)**: Z-score of observed category transitions vs uniform-iid null. Dimensionless in (-inf, inf). Fail-closed: NaN in window -> NaN; degenerate null (<=1 distinct category) -> NaN.

5. **event_direction_persistence(event, window)**: Persistence of the current event direction: fraction of the last k events (where k is the current streak) that are in the same direction. Dimensionless in [0, 1]. Fail-closed: NaN in window -> NaN; no events in window -> NaN.

6. **state_episode_age(state, window)**: Bars since the state last changed to a different category within the trailing window. Dimensionless episode age in [0, window-1]. Fail-closed: NaN in window -> NaN; constant window (episode start censored) -> NaN.

7. **state_flip_age(state, window)**: Bars since the last state flip (alternation between distinct successive states) within the trailing window. Dimensionless flip age in [0, window-1]. Fail-closed: NaN in window -> NaN; no flip in window -> NaN (flip age censored).

All canonicals follow the Event/State derivation framework contract:
- Trailing windows END at t (prefix-causal)
- min_periods=window (fail-closed)
- Dimensionless outputs
- Degenerate denominators -> NaN never 0
- Censored quantities -> NaN never fabricated

