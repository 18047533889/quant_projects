## Guards in Tests

- Brute-force Python loop oracles independent of implementation helpers
- Prefix invariance (full.iloc[:70] == calculate(frame.iloc[:70]) for all 23 canonicals)
- Causality mutation (late event/state mutation cannot touch earlier rows)
- Fail-closed NaN in window (all 23: rows [20,30) NaN, before/after finite)
- Invalid input rejection (EventBool [-1,0.5,2,±inf]; SignedEvent [-2,0.5,2,±inf]; state ±inf)
- Deliberate-NaN vs deliberate-0 scenarios
- Window validation (1/True/5.5/nan/0/-3 rejected) and halflife validation (0/-1/inf/True rejected; halflife <= window relational)
- ParamSpec governance (window int min=2 HORIZON role; halflife float; tags causal+pit_safe, no stateful/full_replay)
- Promotion membership (all 23 in _RELATIVE_ALPHA_OPS, none in _PRICE_LEVEL_INTERMEDIATE_OPS, all in EXTENDED_ONLY_CANONICALS, classify_canonical == "extended")
- Duplicate-shadow check (event_age/event_decay remain the pre-existing aliases, not shadowed)

## Known Limitations

- pandas_numpy backend only; no Polars-native implementation
- Trailing-window estimators forget episodes/events older than the window (censored -> NaN by design)
- Signed family treats NaN as unknown row (fail-closed), not as 0

