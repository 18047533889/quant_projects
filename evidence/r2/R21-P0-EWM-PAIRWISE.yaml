problem: >
  ts_ewm_corr/ts_ewm_cov were built from nested polars ewm_mean expressions
  (EWM means of same-row EWM-centered products). That recursion is NOT the
  pandas reference: it diverged on cov from row 0 (cov[1]=0.197 vs pandas
  0.674 at window=6 on the recorded seed-11 case) and at every NaN hole,
  because pandas ewm().corr/.cov is a gap-decayed sum_wt/sum_wt2 bias-corrected
  state machine that cannot be expressed as nested ewm_mean of centered
  products. The previous writer instance was killed by an API 521 mid-run
  with the pandas-delegate rewrite in the tree and the new test battery
  partially broken (one malformed expectation loop, unresolved None-vs-nan
  assertion contract).
fix: >
  Kept and completed the pandas-reference delegation rewrite:
  (1) _ewm_pairwise_columns pre-masks Inf to NaN, applies the
  pairwise-finite cohort (row valid only when BOTH operands finite; either
  invalid drops the row from BOTH streams), then calls pandas
  Series.ewm(span=window, adjust=False, ignore_na=False,
  min_periods=2).corr/.cov per column; pandas NaN output (warmup < 2 valid
  pairs, zero-variance corr, all-invalid prefix) maps to polars null.
  (2) Both kernels honor the span= alias explicitly (registry does not
  forward it) and are declared POLARS_PANDAS_DELEGATE via _physical_spec
  (execution_kind, emitter_identity, semantic_contract_hash
  pandas_ewm_span_adjustfalse_pairwise_finite:v2, supports_inf=False).
  (3) Test-side: fixed the malformed expectation loop in
  test_ewm_pairwise_exact_linear_correlation_is_plus_minus_one (now a clean
  [None, sign, sign, sign] per sign case); pinned the None contract in
  _assert_ewm (kernel emits polars null -> Python None; pandas NaN in the
  oracle maps to None; finite outputs compared at rel=1e-10/abs=1e-12).
  (4) Added the missing property guards: corr(x,x)=1 wherever finite and
  cov(x,x)=ewm_var(x) (with NaN holes), span/alpha alias (span=w ==
  alpha=2/(w+1) via a dedicated alpha oracle), cov bias=False (unbiased
  default; biased stream asserted different), window=2 minimum, warmup
  min_periods=2 with leading-invalid delay, NaN holes carry-forward, Inf
  invalid, constant-series corr null / cov 0, multi-column independent
  alignment, random-series exact match to the oracle.
oracle_independence: >
  All EWM oracles (_ewm_oracle, _ewm_oracle_alpha, _ewm_oracle_var) are
  brute-force pandas ewm().corr()/cov()/var() computations over raw Python
  lists built inside the test file; they never call the kernel, the emitter,
  or any factor_engine code path. The kernel's own delegation is what is
  under test against them.
