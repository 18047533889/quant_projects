guards_in_tests:
  - brute-force pandas ewm().corr/cov/var oracles independent of kernel code path
  - ewm_corr(x,x) == 1 wherever finite; ewm_cov(x,x) == ewm_var(x) (incl. NaN holes)
  - span/alpha alias: span=w == alpha=2/(w+1)
  - cov default bias=False (unbiased); biased stream asserted numerically different
  - warmup min_periods=2, first row always null, leading-invalid pair delays warmup
  - NaN holes carry previous output forward, do not update EWM state (pandas parity)
  - +/-Inf treated as invalid (pre-masked to NaN), never propagated
  - constant series: corr null, cov 0
  - exact linear relation: corr == +/-1 after warmup
  - window < 2 fails closed; missing counterpart column fails closed
  - multi-column panels align independently per column
  - span= alias drives the kernel (not silently absorbed)
  - delegation declared POLARS_PANDAS_DELEGATE, not POLARS_NATIVE_EXPR
known_limitations:
  - >
    Kernels are pandas-delegate, NOT Polars-native (declared in _physical_spec
    and module docstring); polars has no ewm_corr/ewm_cov expression and the
    pandas gap-decayed bias-correction recursion cannot be reproduced from
    nested ewm_mean expressions.
  - >
    EWM family has no ddof/min_periods parameters (pandas ewm pairwise pins
    min_periods=2 and cov bias=False); the module's ddof/min_periods tests
    cover the non-EWM ts_cov family only.
  - >
    2 UserWarnings during collection from
    backend/polars_backend_kind.py:235 (operators without _physical_spec
    classified UNSUPPORTED) — pre-existing, outside this slice's ownership.
  - >
    large-offset stability guard exists for the non-EWM pairwise family
    (test_large_offset_* in the same file, passing); not separately
    parametrized for EWM because EWM output is bounded in [-1,1]/centered
    by construction.
