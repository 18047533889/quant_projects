    `available_at="close_of_t"` and `same_session_usable=False` fields
    in the `OperatorMetadata` dataclass. This ensures that the registry
    correctly declares when these operators become available and that they
    are not used within the same session (preventing look-ahead bias).
  - Confirmed that the output at row `t` only consumes data up to row
    `t` — prefix-causal and PIT-safe.
