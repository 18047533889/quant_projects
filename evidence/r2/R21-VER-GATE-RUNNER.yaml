# generated this session records git_sha 940750b8 (a working-tree HEAD produced
# by an intervening concurrent commit); the machine fields below are the truth
# that matters: command_hash + exit_code + counts from ACTUAL pytest runs.
timestamp: 2026-08-22T02:20:00Z
status: LOCAL_TESTED
commit: NONE
remotes: NOT_USED
production_certified: false

purpose: >-
  VER-P0-01 (highest-priority red-team finding).  The old
  scripts/refresh_gate_evidence.py hard-coded result="passed"/count=N for each
  gate and main() only checked test_path.is_file() -- it never ran pytest, so
  PASS could be fabricated from configuration.  This task rewrites the gate
  evidence system so PASS is ONLY produced by ACTUALLY executing pytest and
  reading back a structured JUnit XML result.  No count/result is written from
  configuration anywhere.

architecture:
  scripts/gate_runner.py: >-
    NEW.  GateSpec dataclass (gate_id, exact pytest argv list including
    --junitxml={junitxml} and -p no:cacheprovider, expected test files,
    timeout_sec, env, skip_policy, failure_policy).  GateRunner executes each
    command via subprocess using .venv/bin/python -m pytest, with a timeout,
    and parses the JUnit XML (xml.etree) into tests/failures/errors/skipped/
    xfailed/xpassed; exit_code + duration recorded.  Status derivation is
    strict: PASS <=> exit_code==0 AND junit.failures==0 AND junit.errors==0
    AND junit.tests>0; anything else is FAIL (test failures/errors/non-zero
    exit/timeout) or BLOCKED (tests==0 / junit missing AND nothing collected).
    Every evidence entry carries command_hash (sha256 of the full argv),
    exit_code, passed/failed/errors/skipped/xfailed/xpassed, duration_sec,
    executed_at.  --co fallback counts collection only, can never upgrade a
    gate to PASS.
  scripts/refresh_gate_evidence.py: >-
    REWRITTEN.  No hard-coded result/count anywhere.  It runs the GateRunner
    over GATE_SPECS and writes evidence/verified_gate_evidence.json with the
    machine fields verbatim from the runner.
  scripts/gen_verification_manifest.py: >-
    apply_verified_evidence() hardened: an evidence entry is acceptable for
    PASS ONLY if it carries real machine fields (command_hash non-empty AND
    exit_code==0 AND failed==0 AND errors==0 AND tests>0).  Entries missing
    those fields, or with any failure/error/non-zero exit/empty run, are
    treated as NOT_RUN -- never PASS.  The per-gate status/result strings in
    the evidence file are NOT trusted.

honesty_tests:
  file: scripts/tests/test_gate_runner_honesty.py
  command: >-
    OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
    .venv/bin/python -m pytest scripts/tests/test_gate_runner_honesty.py -q
    --tb=short
  result: 5 passed
  cases:
    - id: a
      scenario: test file EXISTS but the test FAILS
      assertion: status == FAIL, never PASS
      passed: true
    - id: b
      scenario: gate points at a NON-EXISTENT test file
      assertion: status != PASS (BLOCKED/FAIL)
      passed: true
    - id: c
      scenario: test file EXISTS and the test PASSES
      assertion: status == PASS
      passed: true
    - id: d
      scenario: evidence artifact shape carries all machine fields
      assertion: command_hash/exit_code/counts/duration/executed_at present
      passed: true
    - id: e
      scenario: FABRICATED evidence (result="passed" + bare count, no
        command_hash/exit_code) fed to apply_verified_evidence()
      assertion: gate stays NOT_RUN, never PASS
      passed: true

