problem:
  "PhysicalRegionPlan.compute_plan_hash (planner/backend_region.py) only hashed
  logical_hash, per-region {region_id, backend, node_count}, and per-edge
  {producer, consumer, source_repr, target_repr}.  Two physical plans that
  would execute differently collided silently whenever the difference lived in
  node identity (node_count == len(node_ids) hides different node IDs),
  representation, execution axis, implementation identity
  (PhysicalImplementationID), liveness, parameter domain, source identity,
  semantic contracts (grain/available_at/pit), physical properties
  (sorted/partitioned/grouped/unique key), state contract, transfer
  transforms (sort/repartition/reshape/dtype cast, producer ordering), or
  edge-preserved contracts (pit/universe/grain/source snapshot)."

root_cause:
  "The hash payload was written as a minimal structural sketch (§68 MB-P2-014)
  and never extended when R21-P023 added identity/resource fields
  (implementation_id, liveness, parameter_domain_identity) to BackendRegion
  and materialization/transform fields to TransferEdge.  Cost estimates were
  already correctly excluded, but so was everything else that distinguishes
  one executable plan from another."

fix:
  "compute_plan_hash now builds the payload from two full-semantics helpers:
  _region_hash_payload binds, per region: region_id, backend, node_ids (the
  full ID list, not a count), representation, execution_axis,
  implementation_id (PhysicalImplementationID 'pi:v1:...' binding), liveness
  (eager/lazy/stream), parameter_domain_identity, source identity
  (source_snapshot, universe_contract), semantic contract (grain, available_at,
  pit_safe), required_properties and output_properties (sorted_by,
  partitioned_by, grouped_by, unique_key, grain; absent vs empty explicitly
  distinguished via '__absent__'), and state_contract (requires_checkpoint,
  checkpoint_seed, stateful_operators, checkpoint_interval, sequential_only).
  _edge_hash_payload binds, per edge: edge_id, producer/consumer regions,
  source/target backend, source/target representation, transfer transforms
  (requires_sort, requires_repartition, requires_reshape, requires_dtype_cast,
  producer_sorted_by, producer_guarantees_order), and preserved semantic
  contracts (preserves_pit, preserves_universe, preserves_grain,
  source_snapshot_id).
  The logical DAG hash remains bound as before, and a
  _PLAN_HASH_PAYLOAD_VERSION=1 field was added so a change in the binding
  contract itself cannot be confused with stale hashes from an older
  contract.
  Deliberately NOT hashed (predictions, not plan identity, per §68):
  estimated_rows, estimated_compute_ms, estimated_memory_bytes,
  estimated_transfer_ms, input_bytes, output_bytes — a regression test pins
  this exclusion so estimates never leak into plan identity.
  Execution-kind / accelerator / q-implementation / Numba-kernel identity
  enter the hash through the fields that already carry them on the physical
  plan surface: implementation_id (the PhysicalImplementationID digest binds
  canonical operator, bound parameters via parameter_domain_hash, execution
  kind, accelerator, kernel identity, q implementation source hash) and
  parameter_domain_identity.  The planner BackendRegion has no separate
  execution_kind/accelerator/q_impl/numba_kernel columns of its own — binding
  implementation_id binds them all transitively; no schema change was needed
  (and adding redundant columns would desync from
  backend/contracts.PhysicalImplementationSpec, the single authority)."

