behavior:
  - Private opt-in snapshot plumbing preserves default public result shape and accepts exact legacy envelopes.
  - Parent-generated wave evidence IDs; snapshot run/factor ownership validated against actual assignments.
  - Snapshot wire bytes charged to transport before ordinary result admission; direct artifact descriptors also budget-checked.
  - Evidence persists before success terminalization; unavailable is distinct from observed empty and cannot overwrite observed evidence.
  - Ordinal link table and ordered streaming digest avoid unbounded assignment JSON and preserve legal large waves.
  - Per-record payload length checked before fetch; evidence pages capped at 1MiB charged wire size and 512 rows.
  - Resume validates schema markers, references, payloads, digests, manifest names, link counts and orphan links.
  - Missing receipt does not by itself invalidate a new evidence schema; real legacy repeated terminal-artifact resumes remain unavailable.
  - Actual failed slot owns FAILED/UNKNOWN terminalization and evidence; other slots are not incorrectly reconciled.
