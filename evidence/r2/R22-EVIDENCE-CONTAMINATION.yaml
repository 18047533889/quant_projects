# R22-EVIDENCE-CONTAMINATION
# Production evidence discovery must never read _test_certified/fixtures/tests/synthetic.
# Date: 2026-08-21
# Author: Writer ED (evidence contamination)

id: R22-EVIDENCE-CONTAMINATION
title: "Separate test-certified/synthetic evidence from production evidence discovery"
type: evidence
created: 2026-08-21
author: Claude Code (Writer ED)

# Summary
summary: |
  `evidence/r2/_test_certified/` contains 264 PASS-looking artifacts (q_version
  4.1, pykx 2.6.0, executed=true, status=PASS) that look like real evidence but
  are test fixtures, generated on demand by
  `tests/q_backend/q_certified_compiler.py` so the Q region-executor tests can
  exercise the production compile path without a live q runtime.  Production
  evidence discovery now excludes every `_test_certified/` / `fixtures/` /
  `tests/` / `synthetic/` subtree from recursive evidence scans.

# Root cause
root_cause: |
  The test-certified fixtures were committed under `evidence/r2/_test_certified/`
  and matched the same `.json`/`.py` discovery patterns as production evidence.
  A generic recursive evidence loader (dirty-tree hash, TCB tree hash, source
  snapshot, recipe source tree hash) would silently fold these synthetic PASS
  artifacts into production evidence digests, contaminating provenance binding.

# Fix
fix: |
  Added a single exclusion authority plus explicit recursive-scan exclusions:

  - `backend/evidence_provenance.py`:
    - `EVIDENCE_EXCLUDED_DIRS = {"_test_certified", "fixtures", "tests", "synthetic"}`
    - `evidence_path_excluded(path, *, root=None)` — every path whose components
      (relative to the hashed root) contain an excluded dir name is not
      production evidence.  Root-relative so deliberate test-binding hashes
      (e.g. `_tree_hash(tests/backend_parity)`, golden-data dirs used by
      `test_source_hash` / `golden_data_hash`) keep working, while whole-repo
      production discovery still skips them.
    - `_tracked_tree_files(..., root)` now filters via `evidence_path_excluded`.
  - `backend/recipe_evidence.py`: `_hash_tree` filters `factor_recipes` *.py with
    the same predicate.
  - `evidence/source_snapshot.py`: `EXCLUDE_DIRS` now includes `_test_certified`,
    `fixtures`, `synthetic`.

  Guard regression tests: `tests/evidence/test_evidence_contamination.py`
  (9 tests) asserting production discovery returns zero artifacts from
  `_test_certified/`, the exclusion predicate covers the required names, golden
  / test-binding tree hashes are unaffected, and the source-snapshot walk skips
  fixture subtrees.

  Follow-on: removed the lone `ts_beta` declaration from
  `QPhysicalImplementationRegistry._DECLARED_TARGETS` because the compiler has no
  `ts_beta` lowering (it is quarantined — see
  `test_q_compatibility_contract.py::test_ts_beta_is_quarantined_instead_of_returning_final_window_scalar`).
  This restored the 66==66 declared/lowering equality and the
  `Q_CAPABILITY_SINGLE_AUTHORITY` hard gate, and the committed assembly-scale
  declaration was itself a false-positive declaration gap that the exclusion
  would otherwise surface as a production capability mismatch.

# Files
files:
  - path: backend/evidence_provenance.py
    changes:
      - Added EVIDENCE_EXCLUDED_DIRS + evidence_path_excluded().
      - _tracked_tree_files now excludes test-certified/fixture/synthetic paths.
  - path: backend/recipe_evidence.py
    changes:
      - _hash_tree skips excluded subtrees.
  - path: evidence/source_snapshot.py
    changes:
      - EXCLUDE_DIRS += _test_certified, fixtures, synthetic.
  - path: backend/q_backend/q_physical_implementation_registry.py
    changes:
      - Removed declared-but-unlowered ts_beta from _DECLARED_TARGETS.
  - path: tests/q_backend/test_q_capability_evidence.py
    changes:
      - declared/lowering count 67 -> 66 (matches the compiler authority).
  - path: tests/evidence/test_evidence_contamination.py
    changes:
      - New 9-test guard module.

