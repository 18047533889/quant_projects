# Limitations
limitations: |
  `evidence/r2/_test_certified/` remains on disk (and git-tracked) because the
  Q region-executor tests regenerate the fixtures idempotently.  Discovery is
  now guaranteed to skip it.  The committed primitive/factor evidence artifact
  was already stale on this tree (239 validation errors: bridge_parameter_hash /
  test_source_hash / golden_data_hash mismatches); those pre-existed this change
  and are unrelated to exclusion (they also fail for explicit test-binding roofs
  that are exclusion no-ops).  `tests/q_backend/test_q_backend.py` capability
  tests fail because they expect the legacy manual native set while production
  capability is now evidence-backed and fail-closed (validation_context missing
  until a certified compiler fixture is installed) — pre-existing, not caused by
  this change.