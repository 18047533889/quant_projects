  - python3 -m pytest tests/q_backend/test_q_capability_evidence.py tests/q_backend/test_q2_p0_001_005_gates.py tests/q_backend/test_q_compatibility_contract.py tests/q_backend/test_q_physical_region_executor.py -q -> 92 passed
  - python3 -m pytest tests/q_backend/test_q_capability_evidence.py tests/q_backend/test_q2_p0_001_005_gates.py tests/q_backend/test_q_compatibility_contract.py tests/q_backend/test_q_physical_region_executor.py tests/backend/test_primitive_evidence_contract.py -q -> 97 passed

