audit_basis:
  id: R21-FE-ZEROCOPY-AUDIT
  overall_verdict: FAIL  # enum + policy + mutation guard + tests were never delivered
  gaps_addressed:
    - GAP-1 (P1) BufferOwnership enum / documented read-only default policy
    - GAP-2 (P1) input-non-mutation test + zero-copy==copy parity + execution-order parity
    - GAP-3 (P2) writeable=False on shared read-only views (loud failure)
    - GAP-4 (P2) focused two-operator reorder test sharing one input buffer

policy:
  - "caller buffers are READ_ONLY unless ownership is explicitly transferred"
  - "zero-copy sharing of a caller buffer MUST be READ_ONLY"
  - "an accidental in-place write on a shared read-only view raises numpy ValueError
     (loud) instead of silently corrupting the caller's frame"

implementation:
  - file: factor_engine/runtime/ownership.py  # NEW
    items:
      - "BufferOwnership(str, enum.Enum): READ_ONLY='shared' / OWNED_MUTABLE='owned_mutable'
         / BORROWED_READ_ONLY='borrowed_read_only' (str-based -> JSON-serializable)."
      - "make_readonly_shared_view(value): zero-copy np.ndarray .view() with
         flags.writeable=False (GAP-3 guard); non-array values unchanged."
  - file: factor_engine/runtime/buffer_ref.py
    items:
      - "BufferRef.ownership: BufferOwnership = BufferOwnership.READ_ONLY (was free
         string ownership: str = 'shared'); READ_ONLY.value == 'shared' so default
         unchanged."
      - "BufferRef.to_dict() emits ownership.value -> legacy JSON byte-compatible
         ('shared' for the default)."
      - "SourceWaveExecutor._execute_wave sets ownership=BufferOwnership.READ_ONLY
         (was 'shared')."
      - "Module docstring documents the read-only-default policy."
  - file: factor_engine/runtime/factor_block_ref.py
    items:
      - "values_ref.ownership = BORROWED_READ_ONLY (zero-copy borrow of caller
         buffer) and values_ref.location is make_readonly_shared_view(values) ->
         WRITEABLE=False shared view (GAP-3)."
      - "validity_ref.ownership = OWNED_MUTABLE (freshly allocated NaN/Inf mask)."
      - "build_factor_block docstring/comment updated: shared caller buffers MUST be
         read-only; in-place kernel writes fail loudly."

tests:
