id: R21-FE-ZEROCOPY-OWNERSHIP
slice: R21-FE-ZEROCOPY-OWNERSHIP — implement typed buffer ownership contract + zero-copy hardening (GAP-1..4 of R21-FE-ZEROCOPY-AUDIT)
campaign: FactorEngine hardening implementation
git_sha: working tree is truth (no commit made by writer)
timestamp: "2026-08-22"
