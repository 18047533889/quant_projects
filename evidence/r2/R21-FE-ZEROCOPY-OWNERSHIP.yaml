      - name: test_factor_block_ref_uses_typed_ownership
        covers: GAP-1/GAP-3  # values BORROWED_READ_ONLY, validity OWNED_MUTABLE
      - name: test_standardize_kernel_does_not_mutate_caller_buffer
        covers: GAP-2a  # _standardize vector path; input byte-identical after
      - name: test_panel_operator_does_not_mutate_caller_frame
