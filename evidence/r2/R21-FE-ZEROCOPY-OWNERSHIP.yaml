      - name: test_shared_vs_copied_buffer_identical_results
        covers: GAP-2b  # shared (zero-copy) vs explicit copy -> bit-identical
      - name: test_reordered_operators_share_one_input_buffer_identical_and_input_unchanged
        covers: GAP-4  # two ops share one 'close' buffer (run_many CSE); swapped
