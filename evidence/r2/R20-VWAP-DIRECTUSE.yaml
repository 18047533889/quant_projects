implementation:
  - Added three causal, dimensionless rolling-VWAP canonicals in
    indicators_v2 (trailing window ENDS at t, min_periods=window,
    rolling-only bounded state — deliberately NOT in _RECURSIVE_EWM, no
    full-replay governance needed):
    vwap_distance_pct = (close - rolling VWAP(close, volume, w)) / close,
    vwap_slope_pct = rolling VWAP.diff() / close (dimensionless slope),
    vwap_premium_pct = (close - rolling VWAP(HLC3, volume, w)) / close
    (typical-price variant; tested materially distinct from the close-only
    kernel — kept, not skipped, because the wide high/low spread makes it a
    genuinely different cost basis, and the test asserts >50% of bars differ
    by >1e-4 on the adversarial panel).
  - Reuse note: a registered price-scale ``rolling_vwap`` canonical already
    exists (cleaned_operators/price_volume/technical_extensions.py, params
    [price, volume, window]).  It was NOT reimplemented blind: the R20 slice
    requires the stricter cohort contract (volume <= 0 or NaN excluded from
    BOTH sums; volume sum <= 0 -> NaN) plus min_periods=window on both sums,
    which the legacy kernel does not guarantee, so a local strict helper
    _rolling_vwap_strict mirrors the legacy math with the hardened masking.
    The legacy rolling_vwap / vwap_deviation canonicals are untouched.
  - Data-integrity contract (never launder bad data):
    * strict-positive close masking (R5-38): non-positive close -> NaN in
      every canonical, never abs();
    * valid-volume cohort: a bar with volume <= 0 or NaN is excluded from
      numerator AND denominator; a window whose valid volume sum is <= 0
      -> NaN (all-zero-volume panel emits all-NaN, verified).
  - ParamSpecs: window _WIN_GE2 for all three (a real rolling window, same
    contract as the registered rolling_vwap family); no relational specs
    (single window, no swap-duplicate search nodes).
  - operator_surface.py: names appended to _TECHNICAL_V2_CANONICALS and
    added to DAILY_FACTOR_MIGRATED via a new _DAILY_VWAP_PACK_2026_08
    frozenset (mirrors _DAILY_MA_DISTANCE_PACK_2026_08 style).
  - mining/direct_use.py: ONLY the three dimensionless names appended to
    _RELATIVE_ALPHA_OPS; the raw price-scale "rolling_vwap" stays
    intermediate (asserted not promoted in the test).
  - Concurrent-writer note: Supertrend and Ichimoku writers edited the same
    three source files in parallel; every VWAP edit is anchored solely on
    vwap_* lines or clearly-shared insertion points (end of _SPECS list,
    _PARAM_SPECS tail, tail of _RELATIVE_ALPHA_OPS / _TECHNICAL_V2_CANONICALS,
    after the last _DAILY_*_PACK union) — never on atr_*/psar_*/keltner_*/
    donchian_*/ma-family/ichimoku_*/supertrend_* blocks.
