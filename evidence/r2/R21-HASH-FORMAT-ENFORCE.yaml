title: R21-HASH-FORMAT-ENFORCE
date: 2026-08-21
author: Writer BR
type: hash_validation
status: implemented

summary: |
  Enforced SHA256 format validation for PhysicalImplementationSpec hash fields.
  Hash fields (implementation_source_hash, parameter_domain_hash, semantic_contract_hash, implementation_closure_hash)
  now validate against pattern ^[0-9a-f]{64}$ (64-character lowercase hexadecimal SHA256).

changes:
  - file: backend/contracts/__init__.py
    description: |
      Added _valid_sha256() static method to PhysicalImplementationSpec class.
      Modified validation_errors() to check hash format in addition to nonblank.
      Any non-SHA256 string (like "ts_mean:v2") now raises ValidationError.

  - file: tests/backend/test_unified_capability_contracts.py
    description: |
      Added 3 regression tests:
      1. test_valid_sha256_hashes_pass_validation - valid hashes pass
      2. test_invalid_hash_format_with_label_prefix - "ts_mean:v2" fails
      3. test_invalid_hash_format_uppercase_hex - uppercase hex fails

validation:
  pattern: "^[0-9a-f]{64}$"
  method: _valid_sha256() static method
  fields:
    - implementation_source_hash
    - parameter_domain_hash
    - semantic_contract_hash
    - implementation_closure_hash

examples:
  valid:
    - "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
  invalid:
    - "ts_mean:v2"
    - "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2"
    - "short"
    - "65 characters exceeds limit for 64 char hash value here more chars needed"
    - ""

regression_tests:
  - test_valid_sha256_hashes_pass_validation
  - test_invalid_hash_format_with_label_prefix
  - test_invalid_hash_format_uppercase_hex
