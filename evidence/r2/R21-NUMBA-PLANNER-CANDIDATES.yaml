nba_backend_characteristics:
  description: |
    For operators with known NUMBA_CPU_KERNEL implementations, add
    Polars+Numba / Pandas+Numba as candidates in the backend selector.
  cost_model_fields:
    - cold_jit_ms: "Cold JIT compilation cost (typical: 50-200ms)"
    - warm_ms: "Warm execution cost after JIT (typical: 1-10ms)"
    - cache_hit_probability: "Probability of JIT cache hit (0.0-1.0)"
  candidate_combinations:
    - name: "Polars+Numba"
      base_backend: "polars"
      accelerator: "numba_cpu"
      preferred_for:
        - recursive_time_per_instrument
        - window_heavy
        - stateful_operators
    - name: "Pandas+Numba"
      base_backend: "pandas_numpy"
      accelerator: "numba_cpu"
      preferred_for:
        - elementwise_heavy
        - stateful_operators

cost_model_integration:
  description: |
    Cost model in _evaluate_costs() should include Numba-specific fields.
  proposed_additions:
    - field: cold_jit_ms
      description: "One-time JIT compilation cost"
      impact: "Penalizes cold starts, benefits warm runs"
    - field: warm_ms
      description: "Execution cost after JIT warmup"
      impact: "Reflects optimized native execution speed"
    - field: cache_hit_probability
      description: "Likelihood of hitting cached JIT binary"
      impact: "Reduces effective cold_jit_ms cost"

backend_selector_changes:
  file: planning/backend_selector.py
  modifications:
    - section: "_BACKEND_CHARACTERISTICS"
      action: "Add NUMBA_CPU entries"
      description: |
        Add PhysicalBackend entries for Numba-accelerated backends
        with cold_jit_ms, warm_ms, cache_hit_probability fields.
    - section: "_evaluate_costs()"
      action: "Add Numba cost model logic"
      description: |
        Calculate effective cost as:
        effective_cost = (1 - cache_hit_probability) * cold_jit_ms + warm_ms
    - section: "_filter_candidates()"
      action: "Add Numba candidate filtering"
      description: |
        Include Numba candidates for operators with NUMBA_CPU_KERNEL
        execution kind in their PhysicalImplementationSpec.

execution_kind_contract:
  file: factor_engine/backend/contracts/__init__.py
  existing_definition: |
    ExecutionKind.NUMBA_CPU_KERNEL = "numba_cpu_kernel"
  classification: "Native execution (not delegate)"
