migration:
  - Oversized empty-queue admission is deliberately removed. Typed ResultBudgetExceeded promptly requests split/spill or a larger broker lease; automatic split/spill is not implemented here.
  - Queue get/drain now transfer ownership. Consumers must call release(item) only after dropping the payload; writers clear values before releasing, including terminal failure.
  - current_bytes/backpressure include queued plus batching plus in-flight writes, including retry and timed-out active writer ownership.
  - Unknown/nonpositive estimates fail closed with ResultSizeUnknown; opaque objects and bytes unsupported by current estimator need known-size payloads.
  - Default no-partition sink still uses one writer. Explicit multiple writers without partition_key now reject rather than splitting budgets among idle writers.
  - Explicit join_timeout is honored. Fatal leftovers are discarded/accounted, never manually replayed on the caller thread.
  - Unknown compute errors now fail closed, not automatically retried; known transient microbatch transport failures retain bounded retries.
limitations:
  - Queue accounting is not a separate governor. Caller derives its budget from the broker; pre-submit compute allocations and writer temporary/copy memory remain caller resource-contract responsibilities.
  - FE-19 typed WriteReceipt and IN_DOUBT reconciliation await parent integration. Legacy None callbacks still count success on return.
  - No claim that all oversized results can execute, all server memory is usable, or process RSS cannot exceed this queue's budget.
  - Mirrored tests under tests/ were migrated but final command ran canonical factor_engine/tests copies only.
