summary: >-
  Added 3 end-to-end temporal-separation tests that prove a factor computed for
  evaluation at date t uses ONLY data available at or before t, and that a label
  bundle whose horizon extends beyond t is rejected at the boundary that exists.
  All 3 pass; the full integration suite (17 tests) passes with no regressions.

audit_finding_resolved: >-
  Q6: "Cross-package integration tests prove factor->label temporal separation" --
  verdict NOT_FOUND.  integration_tests/ asserted refs and source-level PIT
  semantics only; no test computed a factor at t and asserted no information
  after t is used.  This file adds exactly that gate.

tests:
  file: integration_tests/test_temporal_separation.py
  total: 3
  passed: 3
  failed: 0
  run_command: >-
    cd /home/shw/quant_projects &&
    OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
    /home/shw/quant_projects/.venv/bin/python -m pytest
    integration_tests/test_temporal_separation.py -q --tb=short
  per_test:
    - id: INT-T1
      name: test_factor_computed_at_t_uses_only_data_le_t
      what: >-
        Compute ts_mean(close, 5) through the REAL FactorEngine (pandas
        backend, research mode) on a synthetic 16-day x 12-asset panel; then
        perturb every row strictly AFTER t=2026-01-09 by an ASSET-DEPENDENT
        +1e6 * (asset_idx+1) offset and recompute.  The factor value AT t must
        be bit-identical (structural equality, NaN==NaN), and the QE per-day
        Pearson IC AT t evaluated on those factor rows must be bit-identical.
        IC rows strictly AFTER t must move (contrast guard, so the test cannot
        pass on a no-op perturbation).
      result: PASS
      end_to_end_legs:
        - "FE: FactorEngine.run returns MultiIndex Series (timestamp, instrument)"
        - "QE: Evaluator.evaluate(pearson_ic_series) on FactorBatch built from the FE rows"
    - id: INT-T2
      name: test_factor_prefix_invariance
      what: >-
        CausalPrefixInvariance fed end-to-end across FE -> FP -> QE.  Factor
        value at t computed from the FULL panel must equal the value at t
        computed from the PREFIX [0..t] only:
        (a) FE leg: FactorEngine ts_mean(close,5) full vs prefix, value at t
        bit-identical;
        (b) FP leg: factor_preprocess.transforms.rolling.rolling_mean(window=5)
        on the long panel, value at t full vs prefix bit-identical;
        (c) QE leg: per-day IC at t evaluated on full-panel factor rows equals
        IC evaluated on prefix-only factor rows (prefix padded with NaN past t).
      result: PASS
    - id: INT-T3
      name: test_label_horizon_beyond_t_is_rejected
      what: >-
        A factor at t combined with a label bundle whose window reaches past t
        must be rejected.  Asserted at the REAL fail-closed boundaries:
        (a) FO factor_optimizer.contracts.splits.validate_split_plan rejects a
        train segment ending at t whose label horizon reaches into the test
        segment ("forward-label overlap") -- via SplitPlan.label_horizon=3 and
        via a FO LabelBundle(label_horizon=3) plus plan-level label_horizon=3;
        a purge=2 plan that fully absorbs the 3-day label window is accepted;
        (b) QE LabelBundle causal-chain validation rejects a label window that
        STARTS before its decision_time (label knowable before the signal) and
        rejects a non-monotonic decision axis;
        (c) the missing QE evaluation-boundary guard is PINNED as a documented
        wiring gap (see gaps below): a causal-chain-valid bundle whose
        label_end_time extends PAST the last evaluated factor row constructs
        and evaluates today.
      result: PASS

