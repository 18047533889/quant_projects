wiring_gaps:
  - id: GAP-1
    owner: factor_optimizer
    file: factor_optimizer/factor_optimizer/contracts/splits.py
    lines: 209-212
    severity: MEDIUM
    description: >-
      FO _validate_temporal_leakage early-returns when SplitPlan.label_horizon
      == purge == embargo == validation_embargo == 0 (splits.py:210-211) BEFORE
      it consults label_bundle.  A FO LabelBundle with label_horizon=3 (real
      timestamps in label_start_time/label_end_time) does NOT by itself trigger
      the leakage arithmetic; the bundle's label_horizon only takes effect when
      a plan-level temporal field is non-zero.  A bundle alone therefore cannot
      express forward-label leakage into a test segment -- the label_bundle
      timestamp fields are compared only through the label_horizon fallback,
      never directly (matches audit Q1 finding "real timestamps are not consumed
      by the leakage arithmetic").  The integration test asserts the enforced
      path (bundle + plan-level label_horizon=3) and documents this gap.
  - id: GAP-2
    owner: quant_evaluator
    severity: HIGH
    description: >-
      QE has NO evaluation-boundary guard tying label_end_time to the factor
      evaluation window (matches audit Q1/Q5/Q6 findings: QE's
      EvaluationRequest/EvaluationBundle carry no snapshot_ref/split_ref and no
      sealed-test or label-boundary concept).  A causal-chain-valid QE
      LabelBundle whose label_end_time extends PAST the last evaluated factor
      row constructs and evaluates successfully today.  INT-T3 pins this vector:
      a 10-day label window on a 16-day panel (last label_end_time 2026-01-25 >
      last factor row 2026-01-16) is accepted.  A writer should add a
      label-boundary validation to QE LabelBundle/EvaluationRequest (e.g.
      label_end_time <= evaluation boundary) and flip the INT-T3 gap-pin to
      assert the rejection.

runtime_notes:
  - >-
    FactorEngine construction spends ~80s once per process on a cold
    operator-registry bootstrap (backend certification / polars capability
    classification).  The test module builds ONE engine with a swappable
    in-memory panel via a module-scoped pytest fixture (_fe_run_factor); every
    subsequent run is <1s.  Module wall time ~83s (single warmup + 3 tests),
    full integration suite ~83s.  Synthetic panels only (16 days x 12 assets);
    no full datasets.
  - >-
    QE per-day Pearson IC uses min_obs=10 (metrics/ic.py _pearson_correlation);
    the panel uses 12 assets so daily IC is defined and the after-t IC contrast
    is meaningful.
