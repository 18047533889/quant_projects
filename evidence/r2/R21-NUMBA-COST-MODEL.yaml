  numba_cpu:
    backend: "NUMBA_CPU"
    startup_cost_ms: 5.0
    per_row_throughput_mrows_per_sec: 2.0
    memory_overhead_factor: 1.1
    supports_streaming: false
    preferred_scale: ["SMALL", "MEDIUM", "LARGE"]
    preferred_profiles: ["WINDOW_HEAVY", "ELEMENTWISE_HEAVY", "MIXED"]
    parallel_efficiency: 0.7
    conversion_penalty_ms: 12.0
    cold_jit_ms: 100.0
    warm_ms: 5.0
    cache_hit_probability: 0.8

ttdc_integration:
  description: |
    TTDC (Time To Durable Commit) calculation in predict_ttdc() now accounts for
    Numba JIT cost model through BackendCharacteristics.cold_jit_ms, warm_ms, and
    cache_hit_probability fields.
  calculation: |
    For NUMBA_CPU backend:
    effective_cost = (1 - cache_hit_probability) * cold_jit_ms + warm_ms

    This cost is added to the total TTDC estimate alongside:
    - scan_ms: Data scan time
    - conversion_ms: Representation conversion time
    - execute_ms: Execution time (now includes JIT overhead for Numba)
    - materialize_ms: Materialization time

