implementation:
  - Added four causal, dimensionless PSAR canonicals: psar_direction,
    psar_distance_pct, psar_flip, psar_days_since_flip — all derived via a
    shared _psar_state(high,low,close,acceleration,maximum) helper that reuses
    the existing recursive PSAR state machine (no future displacement).
  - psar_direction: +1 when close > PSAR (bull regime), -1 otherwise; NaN where
    PSAR is NaN (warmup / post-gap re-seed) or close is not finite.
  - psar_distance_pct: (close - PSAR) / close with strict-positive close
    masking (bad close -> NaN, never an abs-flipped ratio).
  - psar_flip: +1 on flip up, -1 on flip down, 0 on hold; defined only after
    both sides of the direction series are finite; NaN during warmup.
  - psar_days_since_flip: bars since the last regime flip; NaN before the
    first flip.
  - Registered via _SPECS with ParamSpecs (acceleration/maximum positive
    floats, ParamRole.STATE_THRESHOLD) and the shared _PSAR_REL relational
    spec (0 < acceleration <= maximum).
  - All four names added to the stateful/full_replay tag condition alongside
    PSAR (recursive full-replay governance; not prefix-invariant by design).
  - Classified in _TECHNICAL_V2_CANONICALS and DAILY_FACTOR_MIGRATED
    (operator_surface.py: surface classify -> daily; verified).
  - Added to _RELATIVE_ALPHA_OPS (mining/direct_use.py).  Raw price-scale
    "PSAR" NOT added — remains intermediate.
