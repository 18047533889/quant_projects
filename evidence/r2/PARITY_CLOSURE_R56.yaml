parity_closure_r56:
  date: 2026-08-28
  items:
    ts_topk_family_wrapper:
      status: fixed
      symptom: >
        ts_topk_sum/ts_topk_mean/ts_topk_std/ts_bottomk_* both pandas_numpy and
        polars threw `_spec.<locals>.<lambda>() missing 1 required positional
        argument: 'window'` under the canonical DSL binding (d=, k= kwargs).
      root_cause: layer_topk_compat.py::_spec built wrapper kernels as lambdas
        requiring positional ``window`` while the canonical contract for
        ts_topk_sum is ["x","d","k"] (R19-050); the binder passes the canonical
        key ``d`` as kwarg. overhaul/daily.py::_top_spec was already fixed;
        layer_topk_compat (loaded later via layer_composite_fixes) final-won.
      fix: rewrote _spec to named kernels _pand/_pola accepting
        (window=None, d=None, n=None), w = window or d, kk = k or n — identical
        contract to overhaul/daily.py::_top_spec.
      files: [factor_engine/cleaned_operators/layer_topk_compat.py]
      verification: dual-backend smoke PASS 6/6 + legacy window= spelling OK.
    ts_beta_small_window_relation:
      status: fixed
      symptom: >
        F("rolling_beta")(ret, bm, 3) failed planning-time
        `m_beta: min_periods must not exceed window` because the kernel default
        min_periods=5 merged into the relational gate against an explicit
        window=3.
      root_cause: R19-033 reviewed default min_periods=5 is unconditional;
        a legal small-window call inherited a default larger than the window.
      fix: min_periods default -> None on pandas MovingBeta + polars TSBetaPolars
        (kernel resolves min(5, window)); PairWindowSpec.from_plan_node clamps
        the UNTAXED default to min(default_min_periods, window) and still
        hard-fails explicit min_periods > window.
      files:
        - factor_engine/cleaned_operators/common/time_series.py
        - factor_engine/cleaned_operators/price_volume/polars_price_volume.py
        - factor_engine/backend/pair_window_spec.py
      verification: pandas + polars_long alias==canonical OK end-to-end.
    protected_div_kernel_missing:
      status: fixed
      symptom: >
        F("div_or_null") == F("protected_div") pandas test hit
        `KeyError: 'protected_div'` in kernels.py — protected_div has an
        ``internal`` surface so production OperatorRegistry.get returns None and
        list_cleaned_ops_for_backend never bridged it; then the capability gate
        raised UnsupportedOperatorBackendError for the (legitimately
        registered) pandas_numpy backend.
      fix:
        - cleaned_bridge.list_cleaned_ops_for_backend now also includes every
          registered name via the raw _operators dict (internal-surface nodes
          get a kernel).
        - operator_capability.get_best_backend returns the raw registered
          pandas_numpy object in research mode for implemented-status compiler
          internal nodes (protected_div/identity/constant), never in production.
      files:
        - factor_engine/backend/cleaned_bridge.py
        - factor_engine/backend/operator_capability.py
      verification: protected_div[pandas] now passes; div_or_null ==
        safe_div_null proven end-to-end on both backends.
  backend_parity_suite:
    status: re-running
    command: >
      PYTHONPATH=factor_engine .venv/bin/python -m pytest
      factor_engine/tests/backend_parity/test_alias_semantic_equivalence.py
      factor_engine/tests/backend_parity/test_active_polars_statistics_authority.py -q
  residuals:
    - polars_long emitter for rolling_beta still delegates to the pandas bridge
      (pairwise parity); the PairWindowSpec clamp makes min_periods==window for
      small windows so polars rolling_var/cov no longer raise.
