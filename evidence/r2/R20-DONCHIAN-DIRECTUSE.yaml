implementation:
  - Added four causal, dimensionless Donchian canonicals:
    donchian_width_pct, donchian_channel_position, donchian_breakout_up,
    donchian_breakout_down.
  - Channel bands are trailing rolling max(high)/min(low) with
    min_periods=window, window ENDING at t (PIT-safe); rolling-only bounded
    state => NOT added to _RECURSIVE_EWM (no full_replay governance).
  - donchian_width_pct: (upper - lower) / close with strict-positive close
    masking (bad close -> NaN, never abs()).
  - donchian_channel_position: (close - lower) / (upper - lower), NaN when
    width==0 or either band NaN.  Named donchian_channel_position because the
    legacy donchian_position canonical (prior-window semantics, different
    param order) already exists in production_technical_extensions and cannot
    be silently re-registered under the duplicate-overwrite ban.
  - donchian_breakout_up/down: breakout magnitude vs the PRIOR channel
    (rolling(w).max().shift(1) / .min().shift(1)) — the channel a bar-t
    breakout breaks through must exist before t; an inclusive-t window would
    contain the very high/low being broken and clip every breakout to <= 0.
    Output is the signed relative distance, emitted ONLY on fresh N-bar
    extreme bars (close >= prior max / close <= prior min), exactly 0.0 on
    other post-warmup bars, NaN during warmup and on non-positive close
    (bad-data -> NaN, never laundered 0.0).
  - All four get _WIN_GE2 ParamSpec (window, HORIZON role).
  - Raw donchian_upper / donchian_lower / donchian_mid price levels stay
    intermediate (_PRICE_LEVEL_INTERMEDIATE_OPS); only the dimensionless
    names enter _RELATIVE_ALPHA_OPS.
  - Classified the new canonicals in _TECHNICAL_V2_CANONICALS and
    DAILY_FACTOR_MIGRATED (_DAILY_DONCHIAN_PACK_2026_08) so layer governance
    finalization stays exact (classify_canonical -> "daily").
