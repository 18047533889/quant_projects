fixes:
  - Reject missing/noncallable sink and unknown result policies before compilation.
  - Bound legacy parallel submissions and release consumed future result references.
  - Do not retain adaptive normal, fusion, microbatch, or serial sink outputs.
  - Abort serial execution when sink rejects a result.
  - Restore documented single oversize item admission into an empty writer queue.
  - Resolve absent HybridBackend SQL delegate as typed unsupported rather than AttributeError.
  - Replan legacy ResourcePlan using n_jobs and recompute total_runnable.
  - Match executor pool capacity to scheduler concurrency.
  - Dispatch shared-context batch closures as threads; reject explicit process request.
  - Shut down owned batch executor on success and failure.
  - Bound microbatch Future-level transport failure retries using existing error policy.
  - Add byte units to DuckDB memory and temporary-directory budgets.
  - Restore process-global environment when strict resource scope entry fails.
  - Release completed leases on sink failure and defer in-flight lease release until completion.
  - Release reserved leases if executor submission raises.
  - Treat explicit False from callable sinks as failure; preserve None-return callbacks.
  - Replace discarded per-operator process-memory telemetry with root-local degradation counters surfaced in backend paths.
