status: CLOSED_LOCAL
implementation:
  - "QOutputContract.value dtype is now derived from the canonical semantic kind
    (IRNode.semantic_attrs[\"semantic_kind\"], vocabulary ir.types.SemanticType)
    via the new authority semantic_kind_to_output_dtype() instead of hardcoded
    float64: EventBool/MaskBool/ConditionBool -> bool, StateSigned/GroupKey/
    FiscalPeriodId/StatusCode/CategoryCode -> int64, KnowledgeTimestamp/
    EffectiveTimestamp/RevisionTimestamp -> datetime64[ns], else float64."
  - "Null policy is derived from the semantic kind too (semantic_null_policy()):
    condition/event/mask panels allow structural nulls (NaN == absent event,
    policy any_allowed); numeric/categorical outputs allow only rolling-warmup
    NaN (warmup_ok); timestamp-role outputs forbid nulls (strict).  This
    replaces the blanket allow_nulls=True."
  - "QOutputContract gains derived fields warmup_nulls_allowed /
    structural_nulls_allowed / output_null_policy."
  - "QBackend._build_output_contract now reads semantic_attrs[\"semantic_kind\"]
    (with sibling-attr fallback) and forwards the derived dtype + null policy."
  - "Incidental fix while running adjacent regression: QBackend.execute moved the
    q-runtime availability check behind the PhysicalRegionPlan branch so a
    production whole-tree PlanNode raises QPhysicalRegionNotImplemented without
    requiring a live q process
    (test_production_whole_tree_execution_remains_disabled)."
