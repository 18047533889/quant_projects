fixes:
  FP-P0-01:
    defect: >-
      FeatureManifest tiling allowed holes (columns {0,2} for F=3 passed) because
      only no-overlap + max_end==F were enforced.
    fix: >-
      Added exact-tiling check: occupied columns must equal {0..width-1}.
      Holed tiling, hole-at-start, and non-contiguous layouts are rejected.
  FP-P0-02:
    defect: >-
      Auxiliary channels (missing/freshness/exposure) could be advertised but the
      auto manifest only mapped channel_type="feature", so get_channel_values
      could not address a metadata-only channel.
    fix: >-
      Unified ColumnManifest design: FeatureManifest.from_channels builds a
      manifest over ALL channels; total_width is the physical feature-axis width
      (sum of all channel sizes). has_missing_channel / has_freshness_channel /
      has_exposure_channel must agree with actual channels (fail-closed). Every
      advertised channel is addressable via get_channel_values.
  FP-P0-03:
    defect: >-
      AxisRef vs tensor shape was unenforced: TNF/NF ndim, axis lengths, and
      duplicate axis labels were not validated.
    fix: >-
      FeatureBundle._validate_shape enforces TNF->ndim==3, NF->ndim==2,
      T==len(time_axis), N==len(asset_axis), F==manifest width. Duplicate axis
      labels rejected unless allow_duplicate_axis_labels=True.
  FP-P0-04:
    defect: >-
      FittedState.state_id was an arbitrary caller string in production.
    fix: >-
      In production=True, state_id is SHA256-derived over (transform identity,
      implementation hash, learned params hash, data snapshot, split, universe,
      calendar, fit coordinate hash, feature order, policy hash). Caller-supplied
      state_id is rejected; provenance fields are required (fail-closed).
  FP-P0-05:
    defect: >-
      Empty feature_ids -> "compatible with anything" applied to stateful
      transforms (fail-open).
    fix: >-
      Added StateKind.STATELESS / StateKind.FITTED. A FITTED transform with empty
      feature contract raises at construction and is_compatible_with raises
      (fail-closed). STATELESS with empty contract remains OK (explicit).
