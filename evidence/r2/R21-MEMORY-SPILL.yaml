problem:
- 'ConcurrentRegionMemoryPool oversells: default new-region limits were computed as
  total / (region_count + 1) without checking the remaining budget. With total=100_000,
  creating a, b, c produced limits 100_000 + 50_000 + 33_333 = 183_333 > total.
  The first region takes the full budget, the second takes half, and the first never
  shrinks, so the sum of limits exceeds the available memory.'
- 'rebalance_limits() only wrote pool._limit_bytes (private attribute) and left
  RegionMemoryStats.limit_bytes at the stale value. The public stats view (stats(),
  global_stats()["regions"][rid]["limit_bytes"], utilization denominator) kept the old
  limit, so enforcement and reporting diverged: after a 1_000_000 rebalance the pool
  enforced 500_000 while stats still reported 1_000_000.'

implementation:
- 'runtime/multibackend/concurrent_region_isolation.py create_region(): default limits
  are now clamped to the remaining budget (total - sum of existing region limits).
  Explicit caller-supplied limits are left untouched. This guarantees default limits
  never oversell.'
- 'runtime/multibackend/concurrent_region_isolation.py rebalance_limits(): now updates
  BOTH pool._limit_bytes and pool._stats.limit_bytes atomically under the pool lock,
  keeping enforcement and the public RegionMemoryStats view consistent.'
- 'tests/runtime/test_memory_region_limits.py: 3 regression tests covering the
  rebalance accounting consistency and the no-oversell invariant.'

regression_repro:
  old_logic_create_region:
    total: 100_000
    observed_limits: {a: 100000, b: 50000, c: 33333}
    sum: 183333
    oversell: true
  old_logic_rebalance:
    total: 1_000_000
    pool._limit_bytes: 500000
    stats().limit_bytes: 1000000
    stale: true

