public_api: FactorEngine.run_many_stream
contract:
  input: Iterable of globally uniquely named Factor definitions
  output: compact counters and empty results; no accumulated DAGs, analyses or backend paths
  execution: each wave delegates to existing run_many_parallel resource and production gates
  sink: mandatory synchronous callable; serialized, rejects False, duplicate or unknown output names
  failure: propagates original errors and stops consuming subsequent waves; prior writes remain
  memory: one factor wave plus O(F) global name metadata; no cross-wave CSE or warmup union
  legacy: existing run_many and run_many_parallel contracts unchanged
