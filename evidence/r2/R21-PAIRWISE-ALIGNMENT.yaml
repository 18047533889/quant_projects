known_limitations:
- The contract is currently defined and importable; wiring it into polars_expr_emitter.ts_regression_slope
  (bare LEFT JOIN at line 2807) and SQL emitter ts_regression_slope/ts_corr/ts_cov/ts_beta
  bare LEFT JOINs is a follow-up slice.
- Polars_LONG backend path already raises AlignmentError via anchor_left_join_binary
  for ts_corr/ts_cov/ts_beta; the new contract wraps this as PanelSchemaMismatchError
