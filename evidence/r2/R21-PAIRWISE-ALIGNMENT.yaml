problem:
- 'For ts_corr / ts_cov / ts_beta / ts_regression: no single named contract ensured
  that date axis, instrument axis, ordering, universe snapshot, grain and session
  were EXACTLY aligned before pairwise computation.'
- ts_regression_slope emitter (polars + SQL) used a bare LEFT JOIN, meaning a missing
  counterpart column silently produced NULL instead of raising.
- There was no PanelSchemaMismatchError exception — the only alignment error was AlignmentError
  (long-path) or PanelAxisMismatch (wide-path), neither of which was the canonical
  pairwise contract.
implementation:
- 'backend/pairwise_alignment.py — NEW module: AlignmentMode enum (EXACT_ALIGNMENT
  default, LEFT_JOIN_ALIGNMENT research-only), PanelSchemaMismatchError (fail-closed
  ValueError subclass), PairwiseAlignmentSpec (6 boolean checks: date_axis, instrument_axis,
  ordering, universe_snapshot, grain, session), PAIRWISE_ALIGNMENT_SPECS registry
  covering ts_corr/ts_cov/ts_beta/ts_regression* + cs_resid + cs_regression, assert_wide_pairwise_aligned
  (pandas), assert_long_frames_exact (Polars, delegates to long_alignment with wrapped
  exception), pairwise_alignment_evidence helper.'
- backend/production_checklist.py — §14 updated from "defined" to "implemented", module
  updated to backend.pairwise_alignment.
