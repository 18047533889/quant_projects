trigger_and_affected_paths: >-
  Ambient mode could disagree with the engine; anonymous and read-option-distinct
  sources could share identities; identity failure reused the base cache;
  filters impersonated historical membership; precompiled triples were freely
  mixed; config groups could overwrite duplicate names; segmented incremental
  omitted mode/context and could return before public run preflight; boundary
  probing shallow-copied warmed source caches.
regression_before_fix: >-
  Audit report probes reproduced anonymous-source and read-option scope
  collisions, ambient/instance mode disagreement, and warmed-boundary cache
  leakage. Repository-level focused regressions were added with the patch;
  a separate clean-checkout run was NOT_RUN.
