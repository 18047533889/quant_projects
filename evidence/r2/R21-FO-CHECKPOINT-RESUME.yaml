      OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
      /home/shw/quant_projects/.venv/bin/python -m pytest tests/search/ -q --tb=short
    result: "355 passed"

limitations:
