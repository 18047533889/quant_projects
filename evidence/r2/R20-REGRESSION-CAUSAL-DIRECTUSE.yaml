independent_review:
  reviewer: scoped-reviewer pattern (read-only subagent; indicators_v2 diff + promotion diff + this YAML only)
  date: 2026-08-19
  verdict: PASS-with-findings (no P0)
  verified:
    - Causality: forecast fit window is a[:-1] (t-w..t-1), extrapolated to t — target bar genuinely excluded; the contemporaneous three roll to t inclusive with no shift; reg_residual_zscore fit-includes-t documented, not look-ahead.
    - Fail-closed: all four use rolling(w, min_periods=w).apply(raw=True); non-positive close masked via _channel_pos_close -> true NaN; np.isfinite also rejects inf; no zero-fill anywhere.
    - Dimensionless / no inf: all degenerate denominators (s_tt<=eps, ss_tot<=eps, resid_std<=0, slope_se<=0) -> NaN, never 0 or inf.
    - Duplicate audit consistent across code header, _RELATIVE_ALPHA_OPS comment, and this YAML (ts_mean_reversion_half_life ln(0.5)/ln(phi) rationale).
    - Promotion: 4 names in _TECHNICAL_V2_CANONICALS / _DAILY_REGRESSION_PACK_2026_08 / _RELATIVE_ALPHA_OPS; _PRICE_LEVEL_INTERMEDIATE_OPS untouched; not in _RECURSIVE_EWM.
  findings_and_resolution:
    - "P1: reg_forecast_error_pct window=3 was a silently all-NaN search node (fit cohort a[:-1] has 2 bars -> _reg_fit_window returns None for every bar) while the docstring, _pi minimum, and _WIN_GE3 spec all advertised 3 as valid. CLOSED: runtime _pi minimum raised to 4, spec switched to _WIN_GE4, docstring rewritten (3 fit bars + target bar), and test_forecast_window_three_rejected added (window=3 -> ValueError for the forecast canonical; contemporaneous three remain valid at 3 and asserted notna)."
    - "P2: dead branch 'if n <= 2: resid_std = nan' in _reg_fit_window (unreachable after the n < 3 return). CLOSED: branch removed; n >= 3 always holds at that point."
    - "P2: 'ddof=1' label invited confusion with a sample-std /(n-1) — the code computes sqrt(ss_res/(n-2)), the correct OLS residual SE. CLOSED: comment now says 'residual SE with n-2 dof (the fit consumes 2: slope + intercept)'."
  focused_tests_after_review: 18 passed (2026-08-19, after P1/P2 fixes; serial threads-pinned run)
  independent_review_status: CLOSED_VERIFIED

known_limitations:
  - "reg_slope_tstat on an EXACTLY linear window returns NaN (residual std 0 -> SE 0, fail-closed); an infinitely precise t-stat is undefined, not large — near-linear panels give large finite |t| (tested)."
  - "reg_r2_trailing on a constant window returns NaN (ss_tot=0); the [0,1] bound holds only on non-degenerate windows."
  - "reg_forecast_error_pct warmup is w-1 bars (first t with a full fit window t-w..t-1 plus target is t=w-1)."
  - "reviewer caution: a read-only reviewer was concurrently editing spectral code in indicators_v2.py; edits were anchored on reg_/family tails only — spectral lines were not touched by this slice."
  - "operator_policy.py registration NOT_RUN (not an owned file; the technical_v2 family precedent registers no policy rows) — full-policy parity is NOT_RUN."
