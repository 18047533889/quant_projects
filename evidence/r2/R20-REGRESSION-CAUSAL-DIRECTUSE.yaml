landed_canonicals:
  - name: reg_forecast_error_pct
    math: "(close_t - OLS_forecast_t) / close_t; OLS of close on time fit on bars t-window..t-1 ONLY (forecast target bar t EXCLUDED from the fit window), extrapolated one step to t; dimensionless surprise"
    params: {window: _WIN_GE4 (HORIZON) — raised from 3 by review P1}
    guards: "min_periods=window; NaN anywhere in the fit window or at t -> NaN (fail-closed); close<=0 anywhere in window -> NaN (R5-38, never abs()); degenerate fit -> NaN; runtime _pi(window,'window',4) matches the spec (window=3 leaves a 2-bar fit -> all-NaN by construction, pruned up front)"
  - name: reg_slope_tstat
    math: "slope / SE(slope) of trailing-window OLS of close on time; SE = resid_std(ddof=1 via ss_res/(n-2)) / sqrt(sum((t-tbar)^2)); dimensionless trend strength in units of its own uncertainty"
    params: {window: _WIN_GE3}
    guards: "resid_std 0 or non-finite -> NaN (never 0 / inf); NaN-in-window fail-closed; R5-38 masking"
  - name: reg_r2_trailing
    math: "1 - ss_res/ss_tot of the trailing-window OLS on time; [0,1]; constant window (ss_tot=0) -> NaN (degenerate denominator, never a fabricated 0/1)"
    params: {window: _WIN_GE3}
    guards: "NaN-in-window fail-closed; R5-38 masking"
  - name: reg_residual_zscore
    math: "(close_t - fitted_t)/resid_std where fitted_t comes from the OLS fit over the window ENDING at t (fit INCLUDES t — contemporaneous, NOT look-ahead; no data after t enters); resid_std = sqrt(ss_res/(n-2)) of the same window"
    params: {window: _WIN_GE3}
    guards: "resid_std 0 (perfect line) -> NaN; NaN-in-window fail-closed; R5-38 masking"
  - name: mean_reversion_half_life
    status: SKIPPED_DUPLICATE
    rationale: "ts_mean_reversion_half_life (ts_model/ar_meanrev.py) implements the identical exact discrete AR(1) half-life ln(0.5)/ln(phi) with the same 0<phi<1 NaN guard (phi>=1 -> NaN, phi<=0 -> NaN); estimator sanity re-verified on a synthetic phi=0.75 panel (2.4225 vs expected 2.4094) in the new test module."

family_contract:
  windows: "single trailing window per canonical, ENDS at t, min_periods=window; NO future shift anywhere; forecast family EXCLUDES the target bar from its fit window"
  state: "rolling-only -> NOT in _RECURSIVE_EWM; tags causal/pit_safe; no relational specs (single window knob)"
  dimensionless: "error normalized by close; t-stat by SE; R^2 and z-score by construction; degenerate denominators -> NaN never 0"

