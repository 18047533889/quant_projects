id: R21-VER-CURRENT-HONESTY
title: CURRENT.json cannot self-certify — bound-input CURRENT/STALE honest gating
status: done
date: 2026-08-22
role: Red-team/fix producer (VER-P0-03/04 on evidence truth honesty)
scope: evidence/current.py, evidence/CURRENT.json, tests/test_evidence_current_honesty.py, tests/evidence/test_current_truth.py, .github/workflows/release_gates.yml
git_sha: 940750b8edf91ba973833465032c26e4d46a3008 (HEAD; working tree dirty by design)

summary: >
  Closed the CURRENT.json self-certification hole: the generator compared the
  freshly-written binding set against the SAME fresh bindings (its own
  generated_at), so it could never be STALE.  Now an artifact is CURRENT only
  when its BOUND input identity (source_snapshot_id + ImplementationClosureHashSet
  + SemanticCatalogIdentity captured at build time) equals the LIVE identity set
  AND the artifact carries an executed_at from an actual verification run.  A
  source/closure/catalog/snapshot change makes the SAME call yield STALE, and
  an unresolvable source snapshot yields UNRESOLVED (fail-closed) — never
  CURRENT.  main() exits non-zero on any STALE/UNRESOLVED.

root_cause: |
  evidence/current.py build_current()/_main previously:
  1. set every artifact status to CURRENT unconditionally (no bound-input
     comparison, no executed_at gate);
  2. evaluated staleness only against the file it had just written (current vs
     current) — self-certification by construction;
  3. hashed only sorted canonical NAMES for ImplementationClosureHashSet, so a
     source change with unchanged names left the binding unchanged;
  4. used strict=False for SemanticCatalogIdentity (could ratify a disabled
     diagnostic identity as a valid binding);
  5. treated an unresolved source snapshot as certifiable (src:v1:unresolved…
     still marked CURRENT);
  6. always returned exit code 0, so CI could not block on staleness;
  7. used a by-value RootRepoSHA "HEAD (working-tree-dirty)" string — different
     uncommitted modifications were indistinguishable.

fix: |
  evidence/current.py (schema_version 3):
  - implementation_closure_hash_for(canonical) = name + sha256(implementing
    module source resolved from the catalog module path without importing)
    + contract/metadata identity digest.  Memoized with mtime+size
    self-invalidation (a mutation in the same process is detected); the
    ~175-distinct-module set hashes in <0.5 s.
  - build_current() computes only the LIVE identity set and carries the
    per-artifact BOUND identity from the previous run; artifact status is
    decided by evaluate() — CURRENT if bound inputs match live inputs AND
    executed_at present, STALE if any bound input differs or executed_at is
    missing, UNRESOLVED if the source snapshot cannot be resolved.
  - semantic_catalog_identity() uses strict=True (identity.unavailable raises).
  - _set_source_snapshot_id() failure marks every artifact UNRESOLVED
    (fail-closed) and surfaces the error on stderr.
  - main() returns 0 ONLY when every artifact is CURRENT
    (evaluation.status == CURRENT, stale==0, failed==0) and stderr-prints the
    failing artifacts otherwise.
  - root_repo_sha()/DirtyTreeDigest: clean -> plain HEAD string (backwards
    compatible with scripts/gen_verification_manifest.py); dirty -> a digest
    dict {HEAD, diff_hash, cached_diff_hash, untracked_source_hash, dirty}
    serialized into RootRepoSHA, so two different uncommitted changes get
    different identities.
  - _load_catalog_cached()/…: catalog is loaded once per run and the per-canonical
    index is memoized (release-level set hashing stays deterministic and fast).

  .github/workflows/release_gates.yml (stage 17): now also asserts
  evaluation.status == CURRENT and current == total, and the python -m
  evidence.current step fails the job on any STALE/UNRESOLVED (non-zero exit).

files_changed:
  - evidence/current.py            # VER-P0-03/04 honest gating (schema v3)
  - evidence/CURRENT.json          # regenerated by python -m evidence.current --write
  - tests/test_evidence_current_honesty.py  # NEW regression suite (12 tests)
  - tests/evidence/test_current_truth.py    # adjusted for DirtyTreeDigest/closure semantics
  - .github/workflows/release_gates.yml     # CI gate asserts CURRENT, fails on STALE

commands_run:
  - "OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest tests/test_evidence_current_honesty.py -q"
  - "python -m pytest tests/evidence/test_current_truth.py tests/test_evidence_registry.py tests/evidence/test_evidence_refresh_cli.py tests/evidence/test_evidence_contamination.py -q"
  - "python -m evidence.current --write"

results:
  matched_bound_inputs_current: true
  mutated_operator_source_stale: true
  closure_set_hash_changes_on_source_change_same_names: true
  main_exit_nonzero_on_stale: true
  snapshot_unresolved_never_certifies: true
  full_catalog_closure_hash_time_sec: "<1.0"
  strict_semantic_identity: a336cab3bf6b4113942c317e1949efdb2b749e334910cc458b1daef9ff16774d
  test_suite:
    test_evidence_current_honesty: "12 passed"
    test_current_truth: "5 passed"
    test_evidence_registry: "16 passed"
    test_evidence_contamination: "4 passed, 1 skipped"
    test_evidence_refresh_cli: "5 passed"

notes:
  - "built.json under evidence/current/ is NOT treated as an actual verification
    run marker; executed_at must come from a real gate/verification product."
  - "evaluate()/build_current() never certify an artifact with no recorded
    executed_at, even when every SHA binding matches the live tree."
  - "Working tree remains dirty by design (working tree is truth); DirtyTreeDigest
    binds the dirty content so the release remains honest."
  - "LOCAL ONLY - no git mutations (only readonly git status/rev-parse/diff),
    no network."

