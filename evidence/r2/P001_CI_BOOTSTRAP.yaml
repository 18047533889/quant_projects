    # reports NOT_RUN honestly on schedule; NOT a fake pass, NOT a required check)
  - ASHARE_REAL_DATA_SHADOW
    # optional: job-level `if` on vars.ASHARE_DATA_AVAILABLE — when unset the
    # platform SKIPS it honestly, never a fabricated pass
tier_layout:
  tier0: CI_BOOTSTRAP
  tier1: SUPPLY_CHAIN
  tier2: PACKAGE_BUILD
  tier3: IMPORT
  tier4:
    - UNIT
    - DETERMINISM
  tier5: SEMANTIC
  tier6: PIT_LEAKAGE
  tier7: BACKEND_PARITY
  tier8: SCALE (1K_SCALE/10K_SCALE default; 100K_SCALE manual/scheduled NOT_RUN)
  optional: ASHARE_REAL_DATA_SHADOW
dependency_edges:
