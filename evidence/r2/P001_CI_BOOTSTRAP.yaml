problem:
  'Last GitHub Actions run failed fast at the bootstrap/env stage.  Root-cause
   candidates observable from the yml WITHOUT runner output (no `gh` installed
   locally, runner unreachable):
   (a) locks/ci-toolchain-py312.lock does NOT exist in the repo, yet the old
       fresh-wheel-matrix job HARD-FAILED if it was missing ("ERROR: locks/... is
       required ... missing" exit 1) — guaranteed bootstrap failure;
   (b) every job depended on scripts/ci_smoke.sh installing --require-hashes
       from requirements-production.lock BEFORE any checkout/env sanity check —
       a minimal env failure surfaced through a second-level gate, not a first
       diagnostic;
   (c) there was NO explicit bootstrap job: nothing verified checkout /
       interpreter / HEAD before the dependency install.'
fix:
  - 'Re-structured ci.yml into an explicit tiered pipeline: CI_BOOTSTRAP
     (checkout -> python --version -> pwd -> git rev-parse HEAD -> ls ->
     echo CI_BOOTSTRAP_PASS; fail-closed, NOT silently skippable) then
     SUPPLY_CHAIN -> PACKAGE_BUILD -> IMPORT -> UNIT -> SEMANTIC -> PIT_LEAKAGE
     -> BACKEND_PARITY -> SCALE (1K/10K default-on; 100K manual/scheduled
     gated -> reports NOT_RUN honestly, never a fake PASS), plus the
     ASHARE_REAL_DATA_SHADOW optional job kept gated on the repo variable.'
  - 'New scripts/ci_bootstrap_smoke.sh — hermetic, stdlib-only, fail-closed:
     (1) .git present; (2) .github/workflows/ci.yml present; (3) python3 exists
     and runs; (4) git rev-parse HEAD resolves; (5) workspace listings;
     (6) workflow triggers sane.  Outputs CI_BOOTSTRAP_PASS only when every
     requirement holds; any missing piece exits != 0 (job hard-fails).'
  - 'No gate was softened, no test deleted, nothing monkey-patched.  Every tier
     runs the REAL command on the freshly-checked-out tree.'
  - 'Lockfile changes deliberately left OUT: requirements-production.lock is
     owned by the packaging agent (P0-03 follow-up).  factor_engine/pyproject.toml
     NOT touched (P0-03 owns it) — the empty factor_engine wheel surfaced by the
     PACKAGE_BUILD non-vacuous check here is recorded as a P0-03 defect.
     test_same_clock_lag.py / cs_batch1.py NOT re-edited (owners pinned).'
ci_yml_jobs:
