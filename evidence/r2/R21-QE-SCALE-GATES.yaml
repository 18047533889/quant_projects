problem:
  "The 1K/10K/100K_SCALE release gates had no correctness suite: nothing asserted
  that the same metric computed at 1K, 10K, and 100K rows agrees with the
  reference kernel and with itself when the panel is subsampled consistently.
  Scale gates risk being treated as performance benchmarks (wall-clock) rather
  than as correctness gates (values must converge), and a rank-based kernel or
  per-time/per-asset metric that silently changed under universe growth would
  ship."

