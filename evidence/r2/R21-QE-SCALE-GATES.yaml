gate_math:
  ic_rank_scale_consistency: |
    IC is per-time: compute_daily_ic (reference) computes one Spearman IC per
    (t, f) cross-section on pairwise-finite observations; mean-of-time is the
    average of T per-time estimates.  At 1K (N=10) per-time Spearman sd ~ 0.33,
    mean sd ~ 0.033; at 100K (N=1000) mean sd ~ 0.003.  Gate: |mean_scale -
    mean_100K| <= 3 x (sd_scale / sqrt(T)), a statistical tolerance for inputs
    that differ by scale (fresh iid draws at each scale).
  turnover_scale_consistency: |
    Canonical turnover metrics/turnover.compute_turnover_series on explicit
    sum-1 weights is per-asset and EXACTLY scale-invariant: duplicating every
    asset with its weight divided by k preserves each asset's weight trajectory,
    so 0.5*sum|w_t - w_{t-1}| is bit-for-bit unchanged.  Gate: rtol=1e-12 exact
    parity of the full series at 1K vs 10K and 1K vs 100K (NaN weights included).
  quantile_returns_scale_consistency: |
    compute_quantile_returns (reference, n_quantiles=5, min_assets=10).  At 1K
    (N=10) each quantile has ~2 members < min_assets=10 -> all-NaN (documented
    kernel contract, pinned by the gate).  At 10K/100K every cell is finite and
    the grand mean (T x 5 cells) is a sampling estimate of the population label
    mean.  Gate: |grand_mean_10K - grand_mean_100K| <= 3 x (cell sd / sqrt(500)).
  streaming_parity: |
    StreamingEvaluator + streaming_ic_updater (sufficient statistics per chunk,
    internal splitter reconstructing (time_slice, factor_slice) IC blocks) over
    the 10K panel must equal reference batch compute_daily_ic (Pearson) to
    ~1e-16 and must be invariant to chunk layout (chunk_size_time in 10/7/25).
  runs_and_finite: |
    100K-row NaN-masked reference IC (Spearman) + quantile returns + rank
    turnover must all complete and return finite aggregates; bounds the gate to
    'runs and is correct', not a wall-clock benchmark.  Observed ~0.035 s.

