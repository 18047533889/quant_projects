known_limitations:
  - "The fast rank-based turnover kernel (kernels/fast.fast_turnover_estimate)
    is NOT per-asset scale-invariant under universe growth (ranks are
    cross-sectional: rankdata over N assets gives per-asset weights that shrink
    as N grows).  The per-asset turnover gate therefore uses the canonical
    weight-based kernel compute_turnover_series; the rank-based kernel is
    covered at 100K by test_rank_turnover_reference_parity_at_100k (finite,
    bounded [0, 1], reference parity)."
  - "Quantile returns at 1K (N=10) are all-NaN by the documented min_assets=10
    contract; the 1K-vs-larger comparison is therefore a contract pin (all-NaN
    at 1K, finite at 10K/100K) rather than a value comparison.  A scale
    definition with N>=50 at 1K would exercise the value comparison but would
    no longer be a 1K-row panel."
  - "IC mean-of-time uses a statistical tolerance (3x sampling error of the
    noisier scale) because inputs differ by scale (fresh iid draws).  The
    duplication-construction for IC/quantile-returns is bit-exact across scales
    and was verified during exploration (np.repeat duplication leaves Spearman
    IC exactly invariant), but the committed gate uses fresh draws to exercise
    the subsample-consistency semantics."
  - "No full dataset runs; synthetic data only.  Total runtime < 1 s, far under
    the 30 s budget."
