limitations:
  - >-
    Metadata-only check: factor_assets.assembly never computes factor values or
    label values, so the contract verifies REFERENCE-LEVEL temporal separation
    (declared snapshot boundaries must not overlap in the leaking direction).
    Enforcement that the referenced snapshots actually materialized those
    boundaries remains the responsibility of the snapshot producers/evaluator.
  - >-
    The check is opt-in for legacy callers (no label snapshot declared = no
    check).  Callers who want the guarantee must declare label_snapshot_ref +
    as-of boundaries; when declared it is strict.
  - >-
    A single factor_as_of/label_as_of date per assembly (a set-level boundary),
    not per-factor or per-date-window; per-date horizon enforcement belongs to
    downstream evaluation.
  - >-
    Base sha and current head are both the working tree HEAD 1bce0a3; changes
    are uncommitted in the working tree per constraints (no commit was requested).

