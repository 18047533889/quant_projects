  ref, no factor-vs-label time-overlap check existed)

implementation:
  problem: >-
    FactorSetAssembler.assemble failed closed on a MISSING data_snapshot_ref
    (assembly/engine.py:363-368) but carried a single metadata-only snapshot_ref
    with NO label snapshot reference and NO factor-vs-label snapshot time-overlap
    check anywhere in factor_assets.  A factor snapshot computed at time t could
    be combined with a label snapshot that uses information beyond t (label
    look-ahead leakage) without any rejection.
  decision: >-
    Default = NO check (backward compatible) for legacy specs that declare no
    label snapshot.  When a label snapshot IS declared, the contract is strict
    and fail-closed: label_snapshot_ref requires both factor_as_of and
    label_as_of, and label_as_of must be <= factor_as_of.  Equal boundaries are
    allowed (same-day is fine).  A declared-but-uncheckable contract raises
    rather than being silently skipped.  Malformed dates raise rather than
    silently disabling the check.
  api_added:
    - "FactorSetSpec.label_snapshot_ref: Optional[str] = None (label snapshot provenance, optional for backward compatibility)"
    - "FactorSetSpec.factor_as_of: Optional[str] = None (ISO date YYYY-MM-DD, point-in-time boundary of the factor snapshot)"
    - "FactorSetSpec.label_as_of: Optional[str] = None (ISO date YYYY-MM-DD, point-in-time boundary of the label snapshot; must be <= factor_as_of)"
    - "FactorSetArtifact.label_snapshot_ref / factor_as_of / label_as_of (record the checked boundaries on the artifact; None defaults for legacy construction)"
    - "factor_assets.assembly._validate_snapshot_temporal_contract(spec) - the fail-closed check, called from FactorSetAssembler.assemble after the existing data_snapshot_ref check"
  fail_closed_semantics:
    - "label_snapshot_ref declared without factor_as_of or label_as_of -> InvalidContractError ('requires both factor_as_of and label_as_of')"
    - "label_as_of > factor_as_of -> InvalidContractError ('label look-ahead leakage') - the core leak rejection"
    - "empty/whitespace label_snapshot_ref -> InvalidContractError"
    - "bare factor_as_of/label_as_of without label_snapshot_ref -> InvalidContractError (refusing to guess what snapshot a bare as-of refers to)"
    - "malformed as-of date -> InvalidContractError ('must be an ISO date') - a typo can never silently disable the check"
    - "missing data_snapshot_ref -> ValueError (pre-existing, unchanged)"
    - "equal as_of boundaries -> allowed; label_as_of < factor_as_of -> allowed (label strictly inside factor window)"
    - "legacy specs without label_snapshot_ref -> no check, exactly the pre-change behaviour"
  error_type: >-
    InvalidContractError (from factor_assets.errors, a ContractError/FactorAssetsError),
    re-exported from factor_assets.assembly.  Raises are typed so callers can
    catch ContractError or the base FactorAssetsError.
  policy_hash: >-
    label_snapshot_ref, factor_as_of, label_as_of were added to the policy_hash
    semantic fields in FactorSetAssembler._policy_hash, so the temporal contract
    is content-addressed (changing a boundary changes the policy hash).  Test
    test_policy_hash_sensitive_to_label_snapshot_and_boundaries covers it.

