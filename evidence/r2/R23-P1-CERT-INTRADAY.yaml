# Audit analysis
# ---------------
# Scope: 133 canonicals from docs/R23_PER_CANONICAL_AUDIT.json with category in
#   ('intraday_microstructure', 'market_microstructure', 'intraday_session').
# Blocker on every item: "experimental lifecycle: not production-certified (R23-303)".
# No P0 severity: all 133 rows are severity P1.
# No pit_issue on any row; no row is in the R23-P0-PIT11/PIT18 denied set.
#
# Certification gate: MINUTE-SHAPE parity evidence.  The intraday family consumes
# a MINUTE panel (one value per minute bar) and emits a DAILY panel.  It cannot be
# certified through the daily-primitive six-way fixture in primitive_verified.json:
#   a daily fixture has one row per instrument-day, so a minute kernel evaluated on
#   it degenerates to a single-bar day and the three backends trivially agree on
#   all-NaN output (fake parity).  Real evidence must compare backends on genuine
#   minute-shaped panels, which is exactly what the committed
#   evidence/intraday_minute_parity.json (intraday_minute_parity.v1) records.
#
# A canonical is certified only when its artifact record has status == "certified"
#   (polars=True AND duckdb_sql=True) — both a native Polars expression and a
#   DuckDB SQL query agree with the pandas semantic reference on genuine minute
#   panels.  This is the intraday analogue of the daily six-way evidence bar.

