work_package: WP2_MOE_DEBUG_TELEMETRY
baseline_head: 2bac7209c00e302728b810513c91f5475ec6954f
scope:
  modified_files:
    - factor_engine/cleaned_operators/cross_section/panel_model.py
    - factor_engine/tests/operators/test_v7_pca_moe_oracles.py
    - evidence/v7/WP2_MOE_DEBUG_TELEMETRY.yaml
  claim: >-
    MOE telemetry is an explicitly debug-only, execution-context-local snapshot
    of the last visited call/cell. It is not execution authority and is not an
    aligned per-cell status result.
implementation:
  - ContextVar storage prevents mutable process-global residue across threads and async contexts.
  - Every MOE call receives a UUID call_id and resets telemetry before structural validation.
  - Every visited cell records row, col, and a concrete fit_status before an unchanged exit path.
  - Numerical output shape, prediction branches, fit boundaries, and timing semantics are unchanged.
