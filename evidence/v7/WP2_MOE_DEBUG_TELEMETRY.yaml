coverage:
  - valid call followed by final-row nonfinite market state
  - structural early return after a prior successful call
  - distinct call identities across sequential calls
  - concurrent thread isolation with different terminal statuses
  - existing MOE prediction, gating, and missing-output oracles
full_suite: NOT_RUN
limitations:
  - The accessor reports only the latest visited cell in the current execution context.
  - Consumers needing aligned status data require a separate shaped result contract.
