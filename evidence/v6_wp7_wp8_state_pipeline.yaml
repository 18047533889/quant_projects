limitations:
  full_test_suite: NOT_RUN
  full_compile_import: NOT_RUN
  production_data: NOT_RUN
  backend_parity: NOT_RUN
  pit_poison: NOT_RUN
  ci_image_wheel: NOT_RUN
  production_gate: NOT_RUN
  process_transport: >-
    Results are measured before serialization; oversized results are rejected
    before allocating their pickle, smaller peers are admitted first, and the
    parent decodes/delivers one result blob at a time. End-to-end allocator peak,
    pipe-copy residency calibration, and a production-size stress run remain NOT_RUN.
  physical_preflight_isolation: >-
    Shared per-wave source preparation and per-root unknown-field/unsupported-operator
    isolation are implemented with unique-source counters and survivor shared-node
    closure tests. The full production-data backend matrix remains NOT_RUN.
  compatibility_fork: >-
    Running physical-source tests and legacy fork-based bounded-pipeline tests in
    the same already-multithreaded Python process reproduced a DuckDB live-PRAGMA
    segmentation fault. Isolated fresh-interpreter suites pass, and the default
    spawn-factory oracle passes; unsafe compatibility-fork composition is NOT_RUN
    as a supported production claim.
  transparent_worker_recovery: >-
    NOT_IMPLEMENTED. A retired compile/compute worker aborts the run and terminalizes
    later accepted ordinals instead of reusing an IPC proxy bound to an old PID.
    Default-writer timeout, lost acknowledgement, and stale-response paths may only
    perform read-only reconciliation for a previously persisted generation after
    worker retirement is proven; they never rewrite the artifact.
  native_ownership: >-
    Rust/native result ownership is conservatively retained until process exit.
    Native multi-wave execution under a small pool remains fail-closed and is not
    claimed as fully resolved.
  cross_process_resource_authority: >-
    Spawn factory workers use parent-mediated ResourceBroker IPC and PID-bound
    reclaim. The production broker pressure/stress matrix remains NOT_RUN here;
    the pipeline integration oracle uses a deterministic bounded broker fixture.
  manifest_scaling: >-
    SQLite keeps definitions and indexes on disk and execution loads bounded
    waves; no 100k production-data run was performed.
  publish_deploy: NOT_RUN
