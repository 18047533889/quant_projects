[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factor-optimizer"
version = "0.1.0"
description = "Factor mutation grammar, search orchestration, and evidence-guided optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
factor_engine = ["factor-engine>=0.3.0"]
quant_evaluator = ["quant-evaluator>=0.1.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["factor_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires FE/QE adapters",
    "slow: expensive search scenarios",
]
