[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-optimizer"
version = "0.1.0"
description = "Factor mutation grammar, search orchestration, and evidence-guided optimization"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
factor_engine = ["factor-engine>=0.3.0"]
quant_evaluator = ["quant-evaluator>=0.0.1a1,<0.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
# R55 #99 wheel-matrix: FO is a NESTED package (the real code lives at
# factor_optimizer/factor_optimizer/). packages.find with where="." + include
# factor_optimizer* discovers the nested tree; the previous hatchling
# force-include/packages mix shipped the payload TWICE (106 wheel .py vs 53 in
# source). Same layout as factor_preprocess, which works.
where = ["."]
include = ["factor_optimizer*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "tests", "tests.*",
    "*.pyc", "__pycache__",
    "test_*.py", "*_test.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires FE/QE adapters",
    "slow: expensive search scenarios",
]
