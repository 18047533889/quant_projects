environment: development
service_name: quant-platform-dev
version: "1.0.0"

logging:
  level: DEBUG
  format: text
  output_dir: ./logs
  max_file_size_mb: 10
  backup_count: 3
  enable_console: true
  enable_file: true
  enable_syslog: false
  sanitize_sensitive: true
  include_context: true

metrics:
  enabled: true
  export_port: 9090
  export_path: /metrics
  collect_interval_seconds: 30
  enable_latency_metrics: true
  enable_throughput_metrics: true
  enable_error_metrics: true
  enable_memory_metrics: true
  enable_cpu_metrics: true
  enable_disk_metrics: false
  enable_factor_metrics: true
  enable_evaluation_metrics: true

health_check:
  enabled: true
  port: 8080
  path: /health
  check_database: false
  check_cache: false
  check_disk_space: false
  check_memory: false

resource_limits:
  max_memory_mb: 8192
  warning_memory_threshold_percent: 80.0
  max_concurrent_evaluations: 10
  max_concurrent_io_operations: 20
  max_queue_size: 100
  default_operation_timeout_seconds: 60
  enable_rate_limiting: false

security:
  require_authentication: false
  enable_tls: false
  validate_input: true
  max_request_size_mb: 10
  enable_cors: true
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8000
  enable_audit_log: false

shutdown_timeout_seconds: 10
enable_graceful_shutdown: true
