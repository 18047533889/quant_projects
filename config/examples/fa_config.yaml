# Factor Assets Configuration Example

project_name: factor_assets

# Data directories
factors_dir: /home/shw/quant_projects/factor_assets/factors
metadata_dir: /home/shw/quant_projects/factor_assets/metadata
archive_dir: /home/shw/quant_projects/factor_assets/archive

# Database configuration
database:
  type: duckdb
  database: factor_assets.db
  pool_size: 5
  timeout: 30

# Cache configuration
cache:
  backend: memory
  max_size_mb: 512
  ttl_seconds: 1800

# Logging configuration
logging:
  level: INFO
  file: /home/shw/quant_projects/logs/factor_assets.log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  max_bytes: 10485760
  backup_count: 5

# Factor management
max_factor_age_days: 365
auto_archive: true
compression: gzip

# Storage formats
factor_format: parquet
metadata_format: json

# Versioning
enable_versioning: true
max_versions: 10
