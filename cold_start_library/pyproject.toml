[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-start-library"
version = "9.0.0"
description = "FactorEngine cold-start factor library (backend-audited V9) for AlphaPROBE"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "factor-engine>=0.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
