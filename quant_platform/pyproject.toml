[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Quant Research Platform — thin integration DTO layer (pure-stdlib contracts)."
readme = "docs/PLATFORM_CONTRACTS_DRAFT.md"
requires-python = ">=3.10"
# PURE-DTO rule: stdlib dataclasses + typing.Protocol + enum only. No runtime
# third-party dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[tool.setuptools]
py-modules = []
# The source tree lives at the repo root of this package (quant_platform/__init__.py
# is this directory's __init__.py), so ``packages.find`` cannot be used: from
# where="." discovery only sees ``app.*`` (no physical quant_platform/ dir),
# and include=["quant_platform", "quant_platform.*"] therefore matches nothing
# and silently produces an EMPTY wheel (R55 #96).  The full package list is
# explicit instead — including api / adapters / db / security, which the old
# hand-written list dropped from the wheel.
packages = [
    "quant_platform",
    "quant_platform.app",
    "quant_platform.app.adapters",
    "quant_platform.app.api",
    "quant_platform.app.candidate",
    "quant_platform.app.contracts",
    "quant_platform.app.db",
    "quant_platform.app.export",
    "quant_platform.app.observability",
    "quant_platform.app.security",
    "quant_platform.app.storage",
    "quant_platform.app.worker",
]
[tool.setuptools.package-dir]
"quant_platform" = "."

[tool.setuptools.exclude-package-data]
"*" = [
    "tests", "tests.*",
    "*.pyc", "__pycache__",
    "test_*.py", "*_test.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
