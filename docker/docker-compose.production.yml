version: '3.8'

services:
  dataaccess:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY}/dataaccess:${IMAGE_TAG:-latest}
    container_name: quant-dataaccess-prod
    ports:
      - "8765:8765"
    environment:
      - DATA_ACCESS_API_HOST=0.0.0.0
      - DATA_ACCESS_API_PORT=8765
      - DUCKDB_TEMP_DIRECTORY=/tmp/duckdb
      - DATA_ACCESS_LOG_LEVEL=WARNING
      - DATA_ACCESS_ENABLE_METRICS=true
    volumes:
      - /var/lib/quant/dataaccess:/var/lib/dataaccess
      - /tmp/duckdb:/tmp/duckdb
      - /data/quant:/data:ro
    networks:
      - quant-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8765/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  factorengine:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY}/factor-engine:${IMAGE_TAG:-latest}
    container_name: quant-factorengine-prod
    ports:
      - "8766:8766"
    environment:
      - FACTOR_ENGINE_SERVICE_PORT=8766
      - PYTHONPATH=/opt/factor_engine
      - FACTOR_ENGINE_LOG_LEVEL=WARNING
      - DATA_ACCESS_API_URL=http://dataaccess:8765
      - FACTOR_ENGINE_ENABLE_METRICS=true
    volumes:
      - /var/lib/quant/factorengine:/data/quant_workspace
      - /tmp/factor_cache:/tmp/factor_cache
    networks:
      - quant-network
    depends_on:
      - dataaccess
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8766/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  nginx:
    image: nginx:alpine
    container_name: quant-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - quant-network
    depends_on:
      - dataaccess
      - factorengine
    deploy:
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  quant-network:
    driver: overlay
    attachable: true
