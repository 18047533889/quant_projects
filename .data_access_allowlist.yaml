# ============================================================================
# data_access 禁用例外清单
# ----------------------------------------------------------------------------
# 团队规范：业务代码一律走 data_access.store，不得直接 import duckdb /
# pd.read_parquet / pyarrow.parquet.read_table。
#
# 但是有一批文件必须豁免，要么是 data_access 自己的实现，要么是真有
# 「按文件逐个读」的 pipeline 语义，走 data_access 会引入无谓的抽象开销。
# 这份清单就是把这些例外显式登记下来；PR6 的静态检查（scripts/check_data_access_allowlist.py
# + pre-commit hook）把「import duckdb」「pd.read_parquet」「pq.read_table」
# 都列为禁用 API，豁免靠本文件。
#
# 新增豁免 = 提 PR，在本清单补一行 + 说明理由。评审人要把关，尽量不开口子。
# 规划路径：
#   - PR4 ✅：先把 streaming/raw 数据源登记到 datasets.yaml
#   - PR5 ✅：登记 daily_market_summary / stocks_floats；能迁的（factor_evaluation/io.py、
#            multiple_factor_composite/factor_reader.py、factor_panel.py）迁到 store；
#            明确不能迁的（业务自定义路径、中间产物、NQ 期货、demo 自造数据）永久豁免
#   - PR6 ✅：开启静态检查，拒绝清单外的直读 + per-operator 查询配额和慢查询告警
#   - PR7+：factor_engine 下线 → data_access；Polars lazy；read_arrow_stream 迭代
# ============================================================================


