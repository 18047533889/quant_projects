# Historical-covariance CLI smoke test using data_access market returns.
config_version: 1

adapter:
  type: data_access
  benchmark_index: 000905.SH
  minimum_benchmark_weight_coverage: 0.95
  alpha_input_type: expected_return
  alpha_horizon_days: 5
  calendar_name: XSHG
  risk_data_lag_periods: 0
  annualization_factor: 252

inputs:
  alpha:
    path: alpha_expected_return_5d.parquet
    layout: wide

smoother:
  mode: never

run:
  optimizer_name: meanvar_enhance_hist
  data_version_hash: ridge_h5_data_access_historical_smoke
  allow_fallback: false
  runtime_overrides:
    tracking_error_cap_annual: 0.03
    turnover_cap: 0.20
    single_name_max: 0.03
    active_weight_abs_max: 0.02

output:
  directory: cli_historical_smoke_output
  overwrite: false
