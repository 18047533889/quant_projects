[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskfolio-qs"
version = "0.3.0"
description = "A configuration-driven portfolio optimization and risk control toolkit built on cvxpy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "cvxpy>=1.7,<1.8",
  "exchange-calendars>=4.5,<5",
  "PyYAML>=6.0",
  "data_access>=0.1.0",
]

[project.scripts]
riskfolio-qs = "riskfolio_qs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskfolio_qs = ["configs/optimizer/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
