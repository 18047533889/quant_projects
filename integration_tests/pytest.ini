[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

markers =
    qe_fp: QE + FP pipeline tests
    fa_fo: FA + FO workflow tests
    qe_fa: QE + FA evidence flow tests
    all_packages: Tests requiring all four packages
    import_isolation: Import isolation and dependency tests
    slow: Slow-running integration tests

# Test discovery
norecursedirs = .git .pytest_cache __pycache__ *.egg-info

# Output options
console_output_style = progress

# Warnings
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:factor_preprocess.*
    ignore::PendingDeprecationWarning
