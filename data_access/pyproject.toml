[build-system]
# P0-04: build-time generation of data_access/_build_info.py.  A private
# backend under this directory delegates to setuptools and runs
# ``scripts/regenerate_build_info.py`` before the wheel is assembled, so an
# installed data_access wheel always carries build facts matching the exact
# revision it was built from (build_sha == the SHA at build time, dirty=False
# for a clean production build).  ``backend-path`` is ``["."]`` so the private
# backend module resolves from THIS directory.
requires = ["setuptools>=68", "wheel"]
build-backend = "_fe_build_backend"
backend-path = ["."]

# Canonical DataAccess packaging config (R46).
#
# The DataAccess source root is the flat `dataaccess/` directory: top-level
# modules (cos_contract.py, store.py, ...) and subpackages (core/, read/,
# cos/, ...) sit directly inside it, and every internal import uses the
# `data_access` dotted name (e.g. `from data_access.core.engine import ...`).
# To make the source root importable as the canonical `data_access` package
# without rewriting hundreds of internal imports, we map the `data_access`
# package to this directory — the same `"data_access" = "."` mapping that the
# fresh-wheel matrix used ad-hoc at build time. That mapping is now a
# committed, canonical config; the wheel matrix builds DataAccess from HERE,
# not from a temporary staged copy.

[project]
name = "data-access"
version = "0.10.2"
description = "Team DataAccess API with executable COS panel and PIT contracts"
readme = "CHANGELOG.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Quant Platform Team"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "sqlglot>=25.0",
    "clickhouse-connect>=0.8",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typing-extensions>=4.5",
    # COS/S3 multipart remote plane (R44-P0/R45): data_access.read.object_store
    # real-multipart (CreateMultipartUpload -> UploadPart -> CompleteMultipartUpload)
    # and transparent-credential refresh both import boto3 + botocore at runtime.
    # P0-05: pinned production floors 1.43.81 (boto3/botocore exactly paired in
    # requirements-production.lock; jmespath + s3transfer arrive transitively).
    "boto3>=1.43.81",
    "botocore>=1.43.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "build>=1.2",
]
service = ["uvicorn[standard]>=0.27"]

[tool.setuptools]
# Explicit package list: only these become `data_access.*` in the wheel.
# tests/, benchmarks/, ops/, deploy/, constraints/, scripts/ are intentionally
# excluded (they are not part of the runtime distribution).
packages = [
    "data_access",
    "data_access.core",
    "data_access.read",
    "data_access.write",
    "data_access.registry",
    "data_access.cos",
    "data_access.contract",
    "data_access.clickhouse",
    "data_access.security",
    "data_access.runtime",
    "data_access.snapshot",
    "data_access.r30",
    "data_access.export",
    "data_access.telemetry",
    "data_access.service",
    "data_access.quality",
]

[tool.setuptools.package-dir]
"data_access" = "."

# R58 #7：wheel 必须携带 config/ 下的运行时数据（datasets.yaml /
# semantic_fields.yaml / README.md）。``data_access`` 包映射到仓库根，因此
# ``data_access/config/*`` 对应 ``config/*``。缺了这些文件，安装后的 wheel
# 无法 ``get_store()`` / ``get_semantic_catalog()``（默认路径解析到
# ``data_access/config/...`` 会 NotFound）。读取走 ``importlib.resources``
# （见 registry/loader.py / read/semantic_catalog.py），不依赖 source path。
[tool.setuptools.package-data]
"data_access" = ["config/*.yaml", "config/README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__", "test_*.py", "*_test.py"]
