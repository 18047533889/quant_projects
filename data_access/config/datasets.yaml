# ============================================================================
# data_access 数据集登记表
# ----------------------------------------------------------------------------
# 本文件是团队读数据的"单一事实来源"。
# 加数据集 / 改路径 / 改分区规则，全在这里改，业务代码不动。
#
# 字段说明（详见 data_access/config/README.md）：
#   kind            : static | parametric
#   access_mode     : published（全员只读）| namespaced（个人隔离）| staging（发布前暂存）
#   layout          : plain（普通目录树）| hive（year=YYYY/ 这类 hive 分区）
#   time_column     : 该数据集在业务约定里的「时间列」
#   instrument_column: 该数据集在业务约定里的「标的列」
#   hive_partitioning: 传给 DuckDB read_parquet(hive_partitioning=)
#   union_by_name   : 传给 DuckDB read_parquet(union_by_name=)，schema 演进安全
#   root / glob              : static 用
#   root_template / glob_template / params_schema : parametric 用
#
# 环境变量展开：支持 ${VAR} 和 ~，在 registry 加载时展开一次
#   - MASSIVE_PARQUET_ROOT: 默认指向 /home/yluel/share/projects/massive_parquet
#   - FACTOR_LAKE_ROOT:     默认指向 $QUANTSOCIETY_WORKSPACE_DATA_ROOT/factors/lake
#                          （不设时 workspace_paths.py 会兜底到仓库内 workspace_data）
#   - RUN_NAMESPACE:       namespaced/staging 路径会自动替换为当前运行的 namespace
#   - ASHARE_PARQUET_ROOT: A 股 lqtp 本地 COS 镜像根（默认 quant_projects/data/a_share/lqtp_data）
#   - ASHARE_LQTP_COS_PREFIX: COS 真源前缀（默认 cos://qs-cold/clean_data/ashare/lqtp_data）
#   - US_MASSIVE_ROOT:       美股 massive_data 本地镜像根
#   - US_CLEAN_ROOT:         美股 clean_data 衍生层本地镜像根
# ============================================================================


# ============================================================================
# A 股 lqtp 全量数据集（COS: clean_data/ashare/lqtp_data/*，本地镜像按需 sync）
# ----------------------------------------------------------------------------
# 命名：ashare_{语义}；root 均落在 ${ASHARE_PARQUET_ROOT}/{TableName}
# 读前缺文件时 data_access.cos_mirror 会按 time_range 从 COS 增量拉取。
# ============================================================================

_ashare_lqtp_defaults: &ashare_lqtp_defaults
  kind: static
  access_mode: published
  layout: plain
  hive_partitioning: false
  union_by_name: true

ashare_stock_daily:
  <<: *ashare_lqtp_defaults
  root: ${ASHARE_PARQUET_ROOT:-/home/shw/quant_projects/data/a_share/lqtp_data}/StockDailyBar
  glob: "**/*.parquet"
  time_column: TradeDate
  instrument_column: Symbol
  schema:
    TradeDate: date
    Symbol: string
    Open: double
    High: double
    Low: double
    Close: double
    PreClose: double
    Volume: int
    Amount: double
    Return: double
    Vwap: double

ashare_stock_minute:
  <<: *ashare_lqtp_defaults
  root: ${ASHARE_PARQUET_ROOT:-/home/shw/quant_projects/data/a_share/lqtp_data}/StockMinuteBar
  glob: "**/*.parquet"
  time_column: QuoteTime
  instrument_column: Symbol
  # 读路径 bucket 剪枝（物理迁移至 year/month/bucket 后取消下行注释）
  # partition_columns: [year, month, bucket]
  layout_policy:
    bucket:
      column: bucket
      count: 64
  query_policy:
    require_explicit_columns: true
    max_rows: 20_000_000
  schema:
    TradeDate: date
    QuoteTime: timestamp
    Symbol: string
    Open: double
    High: double
    Low: double
    Close: double
    Volume: int
    Amount: double
    Vwap: double

