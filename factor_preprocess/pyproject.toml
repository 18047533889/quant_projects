[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-preprocess"
version = "0.1.0"
description = "Factor preprocessing and representation layer for quantitative research"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Quant Platform Team"}
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.13.0",
    "PyWavelets>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

fast = [
    "numba>=0.57.0",
    "bottleneck>=1.3.0",
    "polars>=0.19.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["factor_preprocess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "future_poison: tests for temporal leakage detection",
    "fold_local: tests for train/test split safety",
    "parity: reference vs fast implementation parity tests",
    "benchmark: performance benchmark tests (not run by default)",
]
