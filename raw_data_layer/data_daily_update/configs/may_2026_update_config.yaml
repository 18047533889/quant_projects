  category: market_operations
  sub: condition_codes
  p: condition_codes
  mode: all

- enabled: true
  name: balance_sheet
  type: rest_or_sdk
  sdk:
    method: list_financials_balance_sheets
  category: fundamentals
  sub: balance_sheet
  p: balance_sheet
  mode: fiscal
  time_column: period_end

- enabled: true
