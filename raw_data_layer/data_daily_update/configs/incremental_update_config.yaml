# 增量更新配置
# TASK-ENG-004: output 已指向主库 raw_massive_data；cron 在 CRON_PAUSED 解除前仍禁止运行

system:
  name: 增量数据更新系统
  version: 1.0.0
  log_level: INFO
  max_parallel_workers: 8
  retry_attempts: 3

incremental_update:
  max_retry_attempts: 3
  retry_delay_seconds: 60
  parallel_workers: 8
  quality_threshold: 0.8
  async_reporting: true
  enable_auto_retry: true
  continue_on_failure: true

performance:
  chunk_size: 50000
  max_memory_usage_mb: 4096
  enable_streaming: true

monitoring:
  enable_performance_monitoring: true
  enable_memory_monitoring: true
  report_interval_seconds: 300

quality_rules:
  enabled: true
  config_path: configs/quality_rules_config.yaml

cursor:
  storage_path: /home/yluel/share/projects/quantsociety_backend_project/raw_data_layer/data_daily_update/_meta/cursors

reporting:
  enabled: true
  output_path: /home/yluel/share/projects/quantsociety_backend_project/raw_data_layer/data_daily_update/_meta/reports

# 主库 — 与手册 §0.5 / TASK-ENG-004 目标态一致
output:
  path: /home/yluel/share/projects/massive_parquet/raw_massive_data
  format: parquet

api:
  # 仅环境变量；禁止在仓库写死 key（TASK-ENG-005）
  default_api_key: ""

  raw_data:
    path: /home/yluel/share/projects/massive_parquet/raw_massive_data
    format: parquet
    compression: snappy
    enabled: true

  cleaned_data:
    path: /home/yluel/share/projects/massive_parquet/cleaned_massive_data
    format: parquet
    compression: snappy
