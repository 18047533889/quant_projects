[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "quant-projects"
version = "0.4.0"
description = "Quantitative research umbrella project: factor engine, data access, vectorbt backtesting, and orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "packaging>=23.0",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "duckdb>=0.10",
    "sqlglot>=25.0",
    "psutil>=5.9",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14.0", "scipy>=1.10"]
accel = ["bottleneck>=1.3", "numba>=0.58"]
talib = ["TA-Lib>=0.4.28"]
polars = ["polars>=0.20"]
modin = ["modin>=0.28"]
backtest = ["backtrader>=1.9.78.123"]
data = ["data-access>=0.10.0"]
performance = ["psutil>=5.9", "threadpoolctl>=3.1"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
validation = ["pydantic>=2.0"]
client = ["httpx>=0.27", "pydantic>=2.0"]
clickhouse = ["clickhouse-connect>=0.8"]
sql = ["sqlglot>=25.0"]
dev = ["pytest>=8.0", "pydantic>=2.0", "fastapi>=0.110", "httpx>=0.27", "build>=1.2", "twine>=5.0"]
full = ["polars>=0.20", "duckdb>=0.10", "psutil>=5.9", "data-access>=0.10.0"]
# vectorbt-qs backtesting (requires Python >=3.11,<3.13)
vectorbt = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy",
    "matplotlib",
    "plotly>=4.12.0",
    "ipywidgets>=7.0.0",
    "anywidget",
    "numba>=0.60,<0.61",
    "dill",
    "tqdm",
    "dateparser",
    "imageio",
    "scikit-learn",
    "schedule",
    "requests",
    "pytz",
    "mypy-extensions",
    "pyarrow>=15",
    "duckdb>=1.0",
    "cos-python-sdk-v5>=1.9.0",
]

[project.scripts]
factor-engine-serve = "factor_engine.service.app:main"
data-access-server = "data_access.service.__main__:main"
data-access-quality = "data_access.quality.cli:main"
vectorbt-qs = "vectorbt_qs.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "modeling",
    "modeling.*",
    # R45: source authority is factor_engine.* ONLY. The historical root
    # packages (api/backend/cache/cleaned_operators/expr/factor_recipes/fields/
    # ir/market/mining/planner/runtime/security/semantic/service/storage/util/
    # validation) were consolidated into factor_engine/ and deleted from root.
    "evidence*",
    "factor_engine",
    "factor_engine.*",
    "factor_engine.api*",
    "factor_engine.backend*",
    "factor_engine.cache*",
    "factor_engine.cleaned_operators",
    "factor_engine.docs*",
    "factor_engine.expr*",
    "factor_engine.factor_recipes*",
    "factor_engine.fields*",
    "factor_engine.ir*",
    "factor_engine.market*",
    "factor_engine.mining*",
    "factor_engine.modeling",
    "factor_engine.modeling.*",
    "factor_engine.planner*",
    "factor_engine.planning*",
    "factor_engine.research_tools*",
    "factor_engine.runtime*",
    "factor_engine.security*",
    "factor_engine.semantic*",
    "factor_engine.service*",
    "factor_engine.storage*",
    "factor_engine.util*",
    "factor_engine.validation*",
    "factor_engine.audit*",
    "factor_engine.execution*",
    "factor_engine.export*",
    "factor_engine.operator_contracts*",
    "factor_engine.research_operators*",
    "factor_engine.telemetry*",
    "data_access",
    "data_access.*",
    # QRP-P0R-C4: quant_platform is also independently installable (own
    # pyproject.toml) and ships in the umbrella wheel too.
    "quant_platform",
    "quant_platform.*",
    "vectorbt_qs",
    "vectorbt_qs.mvp",
    "vectorbt_qs.mvp.analysis",
    "vectorbt_qs.mvp.constraints",
    "vectorbt_qs.mvp.data",
    "vectorbt_qs.mvp.engine",
    "vectorbt_qs.mvp.examples",
]
exclude = [
    "tests", "tests.*",
    "benchmarks", "benchmarks.*",
    "audit", "audit.*",
    "*.tests", "*.tests.*",
    "*.__pycache__",
    # Archived legacy copy is history-only; must NOT ship in the umbrella wheel.
    # Production `cleaned_operators` source is the canonical repo-root tree.
    "cleaned_operators_archived",
    "cleaned_operators_archived.*",
    "factor_engine.cleaned_operators_archived",
    "factor_engine.cleaned_operators_archived.*",
    "factor_engine.cleaned_operators.cleaned_operators",
    "factor_engine.cleaned_operators.cleaned_operators.*",
    # R49: factor_engine.evidence was consolidated into root evidence/ (live
    # authority); the factor_engine.evidence package must NOT ship in the wheel.
    # Root "evidence" package (included via "evidence*") is the sole wheel
    # representation.
    "factor_engine.evidence",
    "factor_engine.evidence.*",
]

[tool.setuptools.package-dir]
"data_access" = "data_access"
"vectorbt_qs" = "vectorbt_qs"

[tool.setuptools.package-data]
"evidence" = ["*.json", "*.yaml"]
"cleaned_operators" = ["docs/*"]
# R45: factor_engine.* is the source authority. Ship its data files too so the
# engine's runtime data dependencies (canonical_data_fields.json, operator docs,
# evidence) are present inside the wheel.
"factor_engine.docs" = ["*.json", "*.yaml", "*.md"]
"factor_engine.cleaned_operators" = ["docs/*"]
data_access = ["config/*.yaml", "config/README.md", "docs/*.md"]
vectorbt_qs = [
    "vectorbt/vectorbt/*.py",
    "vectorbt/vectorbt/**/*.py",
    "vectorbt/vectorbt/**/*.json",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "tests", "tests.*",
    "benchmarks", "benchmarks.*",
    "audit", "audit.*",
    "scripts", "scripts.*",
    "*.pyc", "__pycache__",
    "test_*.py", "*_test.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: 需本地 parquet 或 RUN_* 环境变量",
    "slow: 大面板 nightly 基准",
    "modin: 需要安装 modin，默认 CI 不跑",
    "perf: 轻量性能回归 smoke",
]
