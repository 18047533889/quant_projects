[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "quant-projects"
version = "0.1.0"
description = "Quantitative research umbrella project (orchestration only; FactorEngine lives in factor_engine/ submodule)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[tool.setuptools]
py-modules = [
    "logging_utils",
    "workspace_paths",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "planning*",
    "modeling",
    "modeling.*",
]
exclude = [
    "tests", "tests.*",
    "benchmarks", "benchmarks.*",
    "audit", "audit.*",
    "factor_engine", "factor_engine.*",
    "dataaccess", "dataaccess.*",
    "*.tests", "*.tests.*",
    "*.__pycache__",
]

[tool.setuptools.package-data]
"evidence" = ["*.json", "*.yaml"]
"docs" = ["*.json", "*.yaml", "*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["tests", "tests.*", "benchmarks", "benchmarks.*", "audit", "audit.*", "*.pyc", "__pycache__", "test_*.py", "*_test.py"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pydantic>=2.0"]
data = ["data-access>=0.10.0"]
full = ["data-access>=0.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需本地 parquet 或 RUN_* 环境变量",
    "slow: 大面板 nightly 基准",
]
