    1)) + 1e-08) * flex_max(abs(high - ts_delay(close, 1)), abs(low - ts_delay(close,
    1))), 20)
  freq: 1d
  universe: ASHARE_ALL
  description: GTJA-191 gtja191_alpha_055
  surface: compat
