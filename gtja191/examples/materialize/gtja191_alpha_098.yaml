factor:
  name: gtja191_alpha_098
  expr: where(or_(ts_delta(ts_sum(close, 100) / 100, 100) / (ts_delay(close, 100)
    + 1e-08) < 0.05, ts_delta(ts_sum(close, 100) / 100, 100) / (ts_delay(close, 100)
    + 1e-08) == 0.05), -1 * (close - ts_min(close, 100)), -1 * ts_delta(close, 3))
  freq: 1d
  universe: ASHARE_ALL
  description: GTJA-191 gtja191_alpha_098
data_source:
  type: data_access
  dataset: ashare_stock_daily
  read_auto: true
  start_date: '2014-01-01'
  end_date: '2026-06-25'
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
    vwap: Vwap
    amount: Amount
    ret: Return
    preclose: PreClose
backend:
  type: pandas
engine:
  enable_cache: true
  plan_cache_dir: /home/shw/quant_projects/data/factors/plan_cache/gtja191
materialization:
  lake_root: /home/shw/quant_projects/data/factors/lake/gtja191
  factor_id: gtja191_alpha_098
  author: gtja191
  frequency: 1d
  expression: where(or_(ts_delta(ts_sum(close, 100) / 100, 100) / (ts_delay(close,
    100) + 1e-08) < 0.05, ts_delta(ts_sum(close, 100) / 100, 100) / (ts_delay(close,
    100) + 1e-08) == 0.05), -1 * (close - ts_min(close, 100)), -1 * ts_delta(close,
