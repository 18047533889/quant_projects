factor:
  name: gtja191_alpha_004
  expr: where(ts_sum(close, 8) / 8 + ts_std(close, 8) < ts_sum(close, 2) / 2, -1,
    where(ts_sum(close, 2) / 2 < ts_sum(close, 8) / 8 - ts_std(close, 8), 1, where(or_(1
    < volume / ts_mean(volume, 20), volume / ts_mean(volume, 20) == 1), 1, -1)))
  freq: 1d
  universe: ASHARE_ALL
  description: GTJA-191 gtja191_alpha_004
data_source:
  type: data_access
  dataset: ashare_stock_daily
  read_auto: true
  start_date: '2014-01-01'
  end_date: '2026-06-25'
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
    vwap: Vwap
    amount: Amount
    ret: Return
    preclose: PreClose
backend:
  type: pandas
engine:
  enable_cache: true
  plan_cache_dir: data/factors/plan_cache/gtja191
materialization:
  lake_root: data/factors/lake/gtja191
  factor_id: gtja191_alpha_004
  author: gtja191
  frequency: 1d
  expression: where(ts_sum(close, 8) / 8 + ts_std(close, 8) < ts_sum(close, 2) / 2,
    -1, where(ts_sum(close, 2) / 2 < ts_sum(close, 8) / 8 - ts_std(close, 8), 1, where(or_(1
    < volume / ts_mean(volume, 20), volume / ts_mean(volume, 20) == 1), 1, -1)))
  target: local
  preserve_invalid_rows: true
  value_dtype: float32
