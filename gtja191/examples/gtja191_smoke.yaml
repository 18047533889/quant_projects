# GTJA-191 smoke：最快执行路径
# data_access(read_auto) + backend auto (SQL 下推 + Polars，失败自动降级)
#
# cd factor_engine && PYTHONPATH=. python3 run_pipeline.py config ../gtja191/examples/gtja191_smoke.yaml --run-only

factor:
  name: gtja191_alpha_001
  expr: -1 * ts_corr(rank(ts_delta(log(volume), 1)), rank((close - open) / open), 6)
  freq: 1d
  universe: ASHARE_ALL
  description: GTJA-191 Alpha 001 smoke (canonical DSL + auto backend)

data_source:
  type: data_access
  dataset: ashare_stock_daily
  start_date: "2016-01-04"
  end_date: "2016-01-10"
  read_auto: true
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
    vwap: Vwap
    amount: Amount
    ret: Return
    preclose: PreClose

backend:
  type: auto

engine:
  enable_cache: true
