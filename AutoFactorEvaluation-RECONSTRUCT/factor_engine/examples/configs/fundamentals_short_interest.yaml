factor:
  name: short_interest_rank_days_to_cover
  expr: rank(col("days_to_cover"))
  freq: 1d
  universe: equities
  description: 融券兴趣 - 空头回补天数截面排名，越高代表做空压力越大

data_source:
  type: multi_parquet
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/short_interest
  timestamp_col: settlement_date
  instrument_col: ticker
  max_files: 3
  # start_date: "2017-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2018-06-30"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true
