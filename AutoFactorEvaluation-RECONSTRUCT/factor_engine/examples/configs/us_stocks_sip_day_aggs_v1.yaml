factor:
  name: day_aggs_rank_ts_mean_close_3
  expr: rank(ts_mean(col("close"), 3))
  freq: 1d
  universe: equities
  description: 日K线 - 3日收盘价均线截面排名，动量方向因子

data_source:
  type: multi_parquet
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/us_stocks_sip/day_aggs_v1
  timestamp_col: window_start
  instrument_col: ticker
  max_files: 3
  timestamp_unit: "ns"
  # start_date: "2003-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2003-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true
