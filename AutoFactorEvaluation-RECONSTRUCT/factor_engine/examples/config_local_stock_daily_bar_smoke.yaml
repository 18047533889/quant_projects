# 本地 massive_data/StockDailyBar smoke（COS 镜像，TradeDate + Symbol）
factor:
  name: local_stock_daily_bar_rank
  expr: rank(ts_mean(col("close"), 3))
  freq: 1d
  universe: equities
  description: Smoke on ~/quant_projects/data/us_stock/massive_data/StockDailyBar

data_source:
  type: parquet
  root: ~/quant_projects/data/us_stock/massive_data/StockDailyBar
  timestamp_col: TradeDate
  instrument_col: Ticker
  fields:
    close: Close
  max_files: 5

backend:
  type: pandas

engine:
  enable_cache: true
