# GTJA-191 smoke：factor_engine + data_access
#
# 等价 CLI：
#   cd gtja191/scripts && python3 run_smoke.py --factor gtja191_alpha_001
#
# 或在 factor_engine 根目录：
#   PYTHONPATH=. python run_pipeline.py config ../gtja191/examples/gtja191_smoke.yaml --run-only

factor:
  name: gtja191_alpha_001
  expr: (-1 * ts_corr(rank(ts_delta(log(volume), 1)), rank(((close - open) / open)), 6))
  freq: 1d
  universe: ASHARE_ALL
  description: GTJA-191 Alpha 001 smoke

data_source:
  type: data_access
  dataset: ashare_stock_daily
  start_date: "2016-01-04"
  end_date: "2016-01-10"
  read_auto: true
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
    vwap: Vwap
    amount: Amount
    ret: Return
    preclose: PreClose

backend:
  type: auto

engine:
  enable_cache: true
