[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-access"
version = "0.8.0"
description = "Unified quantitative data access with executable COS panel and point-in-time contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
client = ["httpx>=0.27", "pydantic>=2.0"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
clickhouse = ["clickhouse-connect>=0.8"]
sql = ["sqlglot>=25.0"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]
all = [
    "polars>=0.20",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "clickhouse-connect>=0.8",
    "sqlglot>=25.0",
]

[project.urls]
Repository = "https://github.com/HKUST-QUANT-SOCIETY/data_access"

[project.scripts]
data-access-server = "data_access.service.__main__:main"

[project.entry-points."console_scripts"]
data-access-quality = "data_access.quality.cli:main"

[tool.setuptools]
packages = [
    "data_access",
    "data_access.core",
    "data_access.registry",
    "data_access.read",
    "data_access.write",
    "data_access.cos",
    "data_access.service",
    "data_access.clickhouse",
    "data_access.quality",
]

[tool.setuptools.package-dir]
"data_access" = "."
"data_access.core" = "core"
"data_access.registry" = "registry"
"data_access.read" = "read"
"data_access.write" = "write"
"data_access.cos" = "cos"
"data_access.clickhouse" = "clickhouse"
"data_access.quality" = "quality"

[tool.setuptools.package-data]
data_access = ["config/*.yaml", "config/README.md", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
