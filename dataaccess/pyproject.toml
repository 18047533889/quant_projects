[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-access"
version = "0.8.0"
description = "Unified quantitative data access with executable COS panel and point-in-time contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
client = ["httpx>=0.27", "pydantic>=2.0"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
clickhouse = ["clickhouse-connect>=0.8"]
sql = ["sqlglot>=25.0"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]
all = [
    "polars>=0.20",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "clickhouse-connect>=0.8",
    "sqlglot>=25.0",
]

[project.urls]
Repository = "https://github.com/HKUST-QUANT-SOCIETY/data_access"

[project.scripts]
data-access-server = "data_access.service.__main__:main"

[project.entry-points."console_scripts"]
data-access-quality = "data_access.quality.cli:main"

# 说明：本项目采用「物理目录 = data_access.X 子包」的非标准布局
# （package-dir 把每个顶层目录映射成带前缀的 dotted package），因此
# setuptools 的自动 discovery 无法把物理名 core/read/... 重命名成
# data_access.*，只能显式列出（R26-P0-002）。
# 防漂移：dataaccess/scripts/check_wheel_inventory.py 会构建 wheel 并校验
# 所有物理包目录都进入了 distribution，缺失即 CI fail。
[tool.setuptools]
packages = [
    "data_access",
    "data_access.core",
    "data_access.registry",
    "data_access.read",
    "data_access.write",
    "data_access.cos",
    "data_access.service",
    "data_access.clickhouse",
    "data_access.quality",
    "data_access.contract",
    "data_access.security",
    "data_access.runtime",
    "data_access.snapshot",
]

[tool.setuptools.package-dir]
"data_access" = "."
"data_access.core" = "core"
"data_access.registry" = "registry"
"data_access.read" = "read"
"data_access.write" = "write"
"data_access.cos" = "cos"
"data_access.clickhouse" = "clickhouse"
"data_access.quality" = "quality"
"data_access.contract" = "contract"
"data_access.security" = "security"
"data_access.runtime" = "runtime"
"data_access.snapshot" = "snapshot"

[tool.setuptools.package-data]
data_access = ["config/*.yaml", "config/README.md", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
