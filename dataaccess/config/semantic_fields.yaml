# ---- 美股真实市值（derived，字典 §C23.2 / #P0-24） ----
# X0 market_cap 只作为 sparse raw reference；挖掘/因子用 derived 日频市值
# = us_stock_daily.Close × us_ticker_shares_snapshot.weighted_shares_outstanding。
us_market_cap_daily:
  market: us
  logical_name: market_cap_daily
  dtype: double
  frequency: daily
  grain: instrument
  time_role: event_time
  temporal_model: panel
  join_policy: exact
  derived_expression: >-
    us_stock_daily.Close *
    us_ticker_shares_snapshot.weighted_shares_outstanding
  derived_from: [us_stock_daily.Close, us_ticker_shares_snapshot.weighted_shares_outstanding]
  # #P1-final closure 7：DerivedFieldCompiler 未实现执行链 → 明确 fail-closed。
  # 不宣称 mining_allowed=true；Planner 遇到 derived 字段给清晰 ValidationError。
  mining_allowed: false

