# ---- 美股分红（E2 事件）----
# R24 P0-XM1 §17：契约漂移修复——DA semantic field 必须与 cos_contract_us.py
# 一致：knowledge_time=declaration_date（strict PIT）、effective_time=
# ex_dividend_date（secondary）、missing declaration_date => unavailable（绝不
# ex-date fallback）。旧逻辑（effective_time_only / exact / mining_allowed）已废止。
# R24 P0-XM2 §18：cash_amount 币种不恒为 USD（HKD/EUR/CAD/GBP...）。COS 无统一
# FX 表 → 禁止把 cash_amount 直接当 USD。拆成 local / usd 两个概念：
#   cash_dividend_local ：value + currency（cross_market_comparable=false）
#   cash_dividend_usd    ：仅 currency==USD 的行；其他币种 unavailable/filtered
cash_dividend_local:
  market: us
  dataset: us_stock_dividend
  physical_name: cash_amount
  dtype: double
  frequency: event
  grain: instrument
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: declaration_date
  effective_time: ex_dividend_date
  period_time: ex_dividend_date
  join_policy: pit_asof_backward
  availability: next_session_open
  time_representation: date_label
  time_precision: date
  currency_column: currency
  cross_market_comparable: false
  requires_fx: true
  mining_allowed: false
  duplicate_policy: error  # missing declaration_date => unavailable

cash_dividend_usd:
  market: us
  dataset: us_stock_dividend
  physical_name: cash_amount
  dtype: double
  frequency: event
  grain: instrument
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: declaration_date
  effective_time: ex_dividend_date
  period_time: ex_dividend_date
  join_policy: pit_asof_backward
  availability: next_session_open
  time_representation: date_label
  time_precision: date
  currency: USD
  currency_column: currency
  cross_market_comparable: true
  mining_allowed: false
  duplicate_policy: error
  # 仅当 currency == USD；其他币种必须被过滤/不可用，绝不静默当 USD。

# 兼容旧名 cash_dividend → local（value+currency）；语义不再暗示 USD。
cash_dividend:
  market: us
  dataset: us_stock_dividend
  physical_name: cash_amount
  dtype: double
  frequency: event
  grain: instrument
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: declaration_date
  effective_time: ex_dividend_date
  period_time: ex_dividend_date
  join_policy: pit_asof_backward
  availability: next_session_open
  time_representation: date_label
  time_precision: date
  currency_column: currency
  cross_market_comparable: false
  requires_fx: true
  mining_allowed: false
  aliases: [cash_dividend_local]


# ---- R24 P1-XM7 §23：canonical adjusted_price_backward ----
# A 股 Close*Factor 与美股 Close*AdjFactor 公式同类（backward adjustment
# multiplier），但基期不同 / source 不同 / corporate action 覆盖不同 / US 有
# clamped marker——**禁止**把 Factor / AdjFactor 直接统一成一个 raw column。
# canonical concept 由 market provider 构造，物理列仍是各自市场的原始列。
adjusted_price_backward:
  market: any
  dtype: double
  frequency: daily
  grain: instrument
  time_role: event_time
  temporal_model: panel
  join_policy: exact
  dimension: price
  derived_expression: >-
    market provider constructs adjusted close (A: Close*Factor; US: Close*AdjFactor)
  derived_from: []
  mining_allowed: false
