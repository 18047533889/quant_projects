# TurnoverRatio % → ratio（A股专属；美股无同构换手面板）
turnover_ratio:
  market: ashare
  dataset: ashare_stock_valuation_daily
  physical_name: TurnoverRatio
  dtype: double
  frequency: daily
  grain: instrument
