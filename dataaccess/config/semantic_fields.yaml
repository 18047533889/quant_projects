# 收益率 bp → decimal（A股专属；alias 'ret' 在美股上下文解析到美股小数 ret）
return_bp:
  market: ashare
  dataset: ashare_stock_daily
  physical_name: Return
  dtype: double
  frequency: daily
  grain: instrument
  source_unit: bp
  canonical_unit: decimal
  scale: 0.0001
  time_role: event_time
  temporal_model: panel
  join_policy: exact
  aliases: [ret, returns]

# ---- 估值（日频，随行情 exact join） ----

