# ############################################################################
# SemanticFieldCatalog —— 逻辑字段语义单一事实源
#
# 每个条目声明：逻辑字段 → 物理数据集 + 物理列，以及单位/时间语义/PIT·join
# 策略/mining 权限。DataAccess 的 store.resolve_fields() 消费它；FactorEngine
# 的 FIELD_REGISTRY 应改为消费或生成自这份 catalog，禁止两套定义长期漂移。
#
# 字段约定：
#   dataset        datasets.yaml 里注册的数据集名（必填）
#   physical_name 数据集内的物理列名（缺省 = 逻辑名）
#   scale          source_unit → canonical_unit 的乘子；None/1.0 表示不归一化
#   join_policy    exact / pit_asof_backward / latest_period ...
#   _ 前缀的键是锚点模板，不会当字段。
# ############################################################################

_ratio_field: &ratio_field
  source_unit: percent
  canonical_unit: ratio

# ---- 行情（价格/量，无单位归一化） ----

close:
  dataset: ashare_stock_daily
  physical_name: Close
  dtype: double
  frequency: daily
  grain: instrument
  time_role: event_time
  temporal_model: panel
  join_policy: exact
  mining_allowed: true

