  scale: 0.01
  time_role: event_time
  temporal_model: panel
  join_policy: exact
  aliases: [turnover]

# ---- 指标（日频，含财报期引用；ROE % → ratio） ----

eps:
  dataset: ashare_stock_indicator
  physical_name: Eps
  dtype: double
  frequency: daily
  grain: instrument
  # #P0-15 与 ROE 同类：eps 是财务指标，编译成 financial PIT——
  # knowledge=PubDate 可见、period=ReportPeriodEndDate、UpdateTime 修订、
  # 下一交易日可用、latest_period 选择。不是随行情 exact join 的日频面板。
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: PubDate
  effective_time: ReportPeriodEndDate
  period_time: ReportPeriodEndDate
  revision_order: [UpdateTime]
  availability: next_trading_day
  join_policy: pit_asof_backward
  period_selection: latest_period
  mining_allowed: true

roe:
  market: ashare
  dataset: ashare_stock_indicator
  physical_name: Roe
  dtype: double
  frequency: daily
  grain: instrument
  <<: *ratio_field
  scale: 0.01
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: PubDate
  effective_time: ReportPeriodEndDate
  period_time: ReportPeriodEndDate
  join_policy: pit_asof_backward
  mining_allowed: true

# ---- 资产负债表（事件/时点表，PIT asof 对齐） ----
# 注意：knowledge_time 用 PubDate（公告可见时点），不是 TradeDate（供应商记录日）。
# FactorEngine 财务 PIT 严格用 PubDate 可见性 + 下一交易日可用；revision_order
# 让同一 (instrument, PubDate) 的多版本在 join 前确定性去重（取 UpdateTime 最新）。

total_assets:
  market: ashare
  dataset: ashare_stock_balance
  physical_name: TotalAssets
  dtype: double
  frequency: quarterly
  grain: instrument
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: PubDate
  effective_time: ReportPeriodEndDate
  period_time: ReportPeriodEndDate
  revision_order: [UpdateTime]
  availability: next_trading_day
  join_policy: pit_asof_backward
  mining_allowed: true

total_liabilities:
  market: ashare
  dataset: ashare_stock_balance
  physical_name: TotalLiability
  dtype: double
  frequency: quarterly
  grain: instrument
  time_role: knowledge_time
  temporal_model: financial_event
  knowledge_time: PubDate
  effective_time: ReportPeriodEndDate
  period_time: ReportPeriodEndDate
  revision_order: [UpdateTime]
  availability: next_trading_day
  join_policy: pit_asof_backward
  mining_allowed: true

