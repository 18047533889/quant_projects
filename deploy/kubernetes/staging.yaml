apiVersion: v1
kind: Namespace
metadata:
  name: quant-staging
  labels:
    environment: staging
    project: quant

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataaccess-config
  namespace: quant-staging
data:
  DATA_ACCESS_LOG_LEVEL: "INFO"
  DATA_ACCESS_ENABLE_METRICS: "true"
  DUCKDB_TEMP_DIRECTORY: "/tmp/duckdb"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: factorengine-config
  namespace: quant-staging
data:
  FACTOR_ENGINE_LOG_LEVEL: "INFO"
  FACTOR_ENGINE_ENABLE_METRICS: "true"
  DATA_ACCESS_API_URL: "http://dataaccess:8765"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataaccess
  namespace: quant-staging
  labels:
    app: dataaccess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataaccess
  template:
    metadata:
      labels:
        app: dataaccess
    spec:
      containers:
      - name: dataaccess
        image: ghcr.io/REPOSITORY/dataaccess:develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8765
        envFrom:
        - configMapRef:
            name: dataaccess-config
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8765
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8765
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: dataaccess
  namespace: quant-staging
spec:
  type: ClusterIP
  ports:
  - port: 8765
    targetPort: 8765
  selector:
    app: dataaccess

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorengine
  namespace: quant-staging
  labels:
    app: factorengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factorengine
  template:
    metadata:
      labels:
        app: factorengine
    spec:
      containers:
      - name: factorengine
        image: ghcr.io/REPOSITORY/factor-engine:develop
        imagePullPolicy: Always
        ports:
        - containerPort: 8766
        envFrom:
        - configMapRef:
            name: factorengine-config
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8766
          initialDelaySeconds: 45
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8766
          initialDelaySeconds: 20
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: factorengine
  namespace: quant-staging
spec:
  type: ClusterIP
  ports:
  - port: 8766
    targetPort: 8766
  selector:
    app: factorengine

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quant-ingress
  namespace: quant-staging
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: dataaccess-staging.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dataaccess
            port:
              number: 8765
  - host: factorengine-staging.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: factorengine
            port:
              number: 8766
