factor:
  name: day_aggs_v1_fundamental_low_leverage_rank_2016_2025_v1
  expr: rank(1 / (1 + col("debt_to_equity")))
  freq: 1d
  universe: equities
  description: 基本面稳健因子 - 低债务权益比截面排名，数值越高表示杠杆越低

data_source:
  type: composite
  anchor: price
  anchor_column: close
  aliases:
    debt_to_equity: ratios.debt_to_equity
  sources:
    price:
      type: data_access
      dataset: us_stocks_sip_day_aggs
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
    ratios:
      type: data_access
      dataset: financials_ratios
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
  joins:
    ratios: asof_backward

backend:
  type: pandas

engine:
  enable_cache: true

materialization:
  lake_root: ~/quant_projects/data/factors/lake
  factor_id: day_aggs_v1_fundamental_low_leverage_rank_2016_2025_v1