# SIP 日 K + 资产负债表 asof 复合因子
profile: prod

factor:
  name: us_sip_total_assets_rank
  expr: rank(col("total_assets"))

data_source:
  type: composite
  anchor: price
  anchor_column: close
  aliases:
    total_assets: balance_sheet.total_assets
  sources:
    price:
      type: data_access
      dataset: us_stocks_sip_day_aggs
    balance_sheet:
      type: data_access
      dataset: fundamentals_balance_sheet
  joins:
    balance_sheet: asof_backward
  start_date: "2016-01-01"
  end_date: "2024-12-31"

materialization:
  factor_id: us_sip_total_assets_rank_v1
