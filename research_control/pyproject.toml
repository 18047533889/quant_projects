[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research_control"
version = "0.1.0"
description = "Lightweight append-only ledger for research control events"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["research_control", "research_control.ledger", "research_control.sync"]

[tool.setuptools.dynamic]
version = {attr = "research_control.__version__"}

[tool.setuptools.exclude-package-data]
"*" = ["tests", "tests.*", "*.pyc", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
