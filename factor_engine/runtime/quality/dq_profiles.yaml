# DQ Profile：research（开发宽松） vs production（企业门禁）
#
# output → runtime/dq_gates.DQThresholds
# input  → runtime/input_dq.InputDQThresholds

profiles:
  research:
    output:
      min_coverage: 0.05
      max_nan_ratio: 0.95
      max_inf_ratio: 0.0
      max_abs_value: 1.0e8
      min_rows: 1
      min_instruments_per_day: 1
    input:
      min_rows: 1
      min_non_null_ratio: 0.01
      min_instruments: 1
      max_inf_ratio: 0.0

  us_equity_daily_prod:
    output:
      min_coverage: 0.85
      max_nan_ratio: 0.15
      max_inf_ratio: 0.0
      max_abs_value: 1.0e6
      min_rows: 100
      min_instruments_per_day: 500
    input:
      min_rows: 100
      min_non_null_ratio: 0.80
      min_instruments: 500
      max_inf_ratio: 0.0
    # R21-095/096: role-aware output DQ contracts.  A profile's ``roles`` section
    # overrides the generic ``output`` thresholds for that factor role
    # (alpha / condition / event / state / group_state / global_state).
    # Unknown roles fall back to the profile's generic output thresholds.
    roles:
      condition:
        min_coverage: 0.20
        max_nan_ratio: 0.80
        max_inf_ratio: 0.0
        min_instruments_per_day: 100
      event:
        min_coverage: 0.01
        max_nan_ratio: 0.99
        max_inf_ratio: 0.0
        min_instruments_per_day: 10
      alpha:
        min_coverage: 0.85
        max_nan_ratio: 0.15
        max_inf_ratio: 0.0
        min_instruments_per_day: 500

  us_equity_daily_research:
    output:
      min_coverage: 0.30
      max_nan_ratio: 0.70
      max_inf_ratio: 0.0
      max_abs_value: 1.0e7
      min_rows: 10
      min_instruments_per_day: 10
    input:
      min_rows: 10
      min_non_null_ratio: 0.50
      min_instruments: 10
      max_inf_ratio: 0.0
