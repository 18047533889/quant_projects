[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-engine"
version = "0.3.1"
description = "Factor engine: DSL parser, IR, planner, runtime, modeling, and service"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "packaging>=23.0",
    "pyarrow>=14.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
pandas = ["pandas>=2.0", "pyarrow>=14.0", "scipy>=1.10"]
accel = ["bottleneck>=1.3", "numba>=0.58"]
polars = ["polars>=0.20"]
validation = ["pydantic>=2.0"]
dev = ["pytest>=8.0", "pydantic>=2.0", "fastapi>=0.110", "build>=1.2"]

[tool.setuptools]
py-modules = [
    "logging_utils",
    "pit_contract",
    "stateful_contract",
    "stateful_runtime",
    "workspace_paths",
]
