name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas polars pyarrow duckdb pyyaml

      - name: Backend / parity / planner tests
        working-directory: factor_engine
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/factor_engine"
          python -m pytest tests/backend tests/backend_parity tests/planner -q

      - name: Operator manifest freshness
        working-directory: factor_engine
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/factor_engine"
          python scripts/export_operator_manifest.py --check

      - name: Phase1 scope freshness
        working-directory: factor_engine
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/factor_engine"
          python scripts/export_phase1_scope.py --check

      - name: Primitive / composite evidence contracts
        working-directory: factor_engine
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/factor_engine"
          python -m pytest tests/backend/test_primitive_evidence_contract.py tests/backend/test_composite_evidence_contract.py -q
