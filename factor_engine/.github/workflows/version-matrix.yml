name: Version Matrix

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  polars-duckdb-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        polars: ["1.20.0", "1.21.0"]
        duckdb: ["1.1.3", "1.2.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install matrix dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pyarrow pyyaml
          pip install "polars==${{ matrix.polars }}"
          pip install "duckdb==${{ matrix.duckdb }}"

      - name: Core triple parity
        working-directory: factor_engine
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/factor_engine"
          python -m pytest \
            tests/backend_parity/test_production_core_triple_parity.py \
            tests/backend_parity/test_batch2_rolling_triple_parity.py \
            -q
