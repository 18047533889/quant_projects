  evidence:
    - "factor_engine/docs/evidence/V4_LOCAL_STAGING_IDENTITY_LOCK_20260907.yaml"
reproduction:
  prior_state: >-
    sync_local_factor_to_staging released the staging dataset mutation lock after
    replacing parquet children, then called write_staging_identity without a lock.
    Therefore another writer could acquire the root while identity was being bound.
  oracle: >-
    test_sync_writes_identity_before_releasing_staging_lock starts a competing
    mutation_lock acquisition from inside atomic_write_text; it must time out, and
    the returned identity must verify against the staged parquet inventory.
fix: >-
  Identity inventory verification and atomic identity write now always run under
  the staging mutation lock. Sync writes identity and counts rows inside the same
  lock transaction as parquet replacement. Public local helpers reject a declared
  non-local staging backend before resolving paths or acquiring mutation locks;
  identity-write failure rolls the full prior staged generation back.
