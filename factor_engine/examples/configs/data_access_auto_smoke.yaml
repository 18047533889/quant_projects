# data_access + hybrid auto：DuckDB 读 parquet，SQL 可下推子树 + Polars/Pandas fallback
#
# PYTHONPATH=. python run_pipeline.py config examples/configs/data_access_auto_smoke.yaml --run-only

factor:
  name: da_auto_smoke
  expr: rank(ts_mean(col("close"), 5))
  freq: 1d
  universe: equities
  description: data_access + backend auto smoke

data_source:
  type: data_access
  dataset: us_stocks_sip_day_aggs
  start_date: "2024-01-02"
  end_date: "2024-01-31"
  fields:
    close: close

backend:
  type: auto

engine:
  enable_cache: true
