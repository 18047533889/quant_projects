factor:
  name: financials_ratios_rank_pe
  expr: rank(col("price_to_earnings"))
  freq: 1d
  universe: equities
  description: 财务比率 - PE 截面排名，排名越低代表估值越便宜

data_source:
  type: multi_parquet
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/financials_ratios
  timestamp_col: date
  instrument_col: ticker
  max_files: 3
  # start_date: "2026-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2026-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true
