factor:
  name: financials_ratios_rank_pe
  expr: rank(col("price_to_earnings"))
  freq: 1d
  universe: equities
  description: 财务比率 - PE 截面排名，排名越低代表估值越便宜

data_source:
  type: data_access
  dataset: financials_ratios
  fields:
    price_to_earnings: price_to_earnings
  start_date: "2024-01-01"
  end_date: "2024-12-31"

backend:
  type: pandas

engine:
  enable_cache: true
