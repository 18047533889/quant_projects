factor:
  name: minute_aggs_rank_ts_mean_close_5
  expr: rank(ts_mean(col("close"), 5))
  freq: 1min
  universe: equities
  description: 分钟K线 - 5分钟收盘价均线截面排名，短周期动量因子

data_source:
  type: data_access
  dataset: us_stocks_sip_minute_aggs
  normalize_timestamp: true
  timestamp_unit: ns
  start_date: "2003-01-01"
  end_date: "2003-12-31"

backend:
  type: pandas

engine:
  enable_cache: true
