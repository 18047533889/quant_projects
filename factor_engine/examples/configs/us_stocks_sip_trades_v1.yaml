factor:
  name: trades_rank_price
  expr: rank(col("price"))
  freq: 1d
  universe: equities
  description: 逐笔成交 - 成交价格截面排名，反映股票价格相对高低水平

data_source:
  type: multi_parquet
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/us_stocks_sip/trades_v1
  timestamp_col: sip_timestamp
  instrument_col: ticker
  max_files: 2
  timestamp_unit: "ns"
  # start_date: "2003-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2003-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true
