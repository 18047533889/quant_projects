factor:
  name: trades_rank_price
  expr: rank(col("price"))
  freq: 1d
  universe: equities
  description: 逐笔成交 - 成交价格截面排名，反映股票价格相对高低水平

data_source:
  type: data_access
  dataset: us_stocks_sip_trades
  fields:
    price: price
    size: size
  normalize_timestamp: true
  timestamp_unit: ns
  # start_date: "2003-01-01"
  # end_date: "2003-12-31"

backend:
  type: pandas

engine:
  enable_cache: true
