factor:
  name: short_interest_rank_days_to_cover
  expr: rank(col("days_to_cover"))
  freq: 1d
  universe: equities
  description: 融券兴趣 - 空头回补天数截面排名，越高代表做空压力越大

data_source:
  type: data_access
  dataset: fundamentals_short_interest
  fields:
    days_to_cover: days_to_cover
  start_date: "2024-01-01"
  end_date: "2024-12-31"

backend:
  type: pandas

engine:
  enable_cache: true
