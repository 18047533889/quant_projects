factor:
  name: day_aggs_v1_fundamental_earnings_yield_rank_2016_2025_v1
  expr: rank(1 / col("pe"))
  freq: 1d
  universe: equities
  description: 基本面估值因子 - PE 倒数截面排名，数值越高表示估值越便宜

data_source:
  type: composite
  anchor: price
  anchor_column: close
  aliases:
    pe: ratios.price_to_earnings
  sources:
    price:
      type: cleaned_parquet
      root: ~/quant_projects/data/us_stock/cleaned_massive_data/us_stocks_sip/day_aggs_v1
      recursive: true
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
    ratios:
      type: cleaned_parquet
      root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/financials_ratios
      recursive: true
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
  joins:
    ratios:
      method: asof_backward

backend:
  type: pandas

engine:
  enable_cache: true

materialization:
  lake_root: ~/quant_projects/data/factors/lake
  factor_id: day_aggs_v1_fundamental_earnings_yield_rank_2016_2025_v1