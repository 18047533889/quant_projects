factor:
  name: day_aggs_v1_fundamental_operating_margin_proxy_rank_2016_2025_v1
  expr: rank(col("operating_income") / (1 + col("revenue")))
  freq: 1d
  universe: equities
  description: 基本面盈利能力因子 - 营业利润率代理截面排名，数值越高表示利润率越高

data_source:
  type: composite
  anchor: price
  anchor_column: close
  aliases:
    operating_income: income_statement.operating_income
    revenue: income_statement.revenue
  sources:
    price:
      type: cleaned_parquet
      root: ~/quant_projects/data/us_stock/cleaned_massive_data/us_stocks_sip/day_aggs_v1
      recursive: true
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
    income_statement:
      type: cleaned_parquet
      root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/income_statement
      recursive: true
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
  joins:
    income_statement:
      method: asof_backward

backend:
  type: pandas

engine:
  enable_cache: true

materialization:
  lake_root: ~/quant_projects/data/factors/lake
  factor_id: day_aggs_v1_fundamental_operating_margin_proxy_rank_2016_2025_v1