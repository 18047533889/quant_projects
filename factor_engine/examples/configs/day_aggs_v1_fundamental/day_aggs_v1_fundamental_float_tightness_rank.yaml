factor:
  name: day_aggs_v1_fundamental_float_tightness_rank_2016_2025_v1
  expr: rank(1 / (1 + col("free_float_percent")))
  freq: 1d
  universe: equities
  description: 基本面流通盘因子 - 流通比例紧致度截面排名，数值越高表示可流通比例越低

data_source:
  type: composite
  anchor: price
  anchor_column: close
  aliases:
    free_float_percent: floats.free_float_percent
  sources:
    price:
      type: cleaned_parquet
      root: ~/quant_projects/data/us_stock/cleaned_massive_data/us_stocks_sip/day_aggs_v1
      recursive: true
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
    floats:
      type: cleaned_parquet
      root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/stocks_floats
      recursive: true
      start_date: 2016-01-01
      end_date: 2025-12-31 23:59:59
  joins:
    floats:
      method: asof_backward

backend:
  type: pandas

engine:
  enable_cache: true

materialization:
  lake_root: ~/quant_projects/data/factors/lake
  factor_id: day_aggs_v1_fundamental_float_tightness_rank_2016_2025_v1