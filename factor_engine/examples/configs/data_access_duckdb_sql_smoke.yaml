# data_access + duckdb_sql：因子计划在 DuckDB 内执行（88 算子 SQL 下推）
#
# PYTHONPATH=. python run_pipeline.py config examples/configs/data_access_duckdb_sql_smoke.yaml --run-only

factor:
  name: da_duckdb_sql_smoke
  expr: rank(ts_mean(col("close"), 3))
  freq: 1d
  universe: equities
  description: DuckDB SQL pushdown via data_access

data_source:
  type: data_access
  dataset: us_stocks_sip_day_aggs
  start_date: "2024-01-02"
  end_date: "2024-01-31"
  fields:
    close: close

backend:
  type: duckdb_sql

engine:
  enable_cache: true
