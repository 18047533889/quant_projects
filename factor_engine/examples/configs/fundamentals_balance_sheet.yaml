factor:
  name: balance_sheet_rank_total_assets
  expr: rank(col("total_assets"))
  freq: 1d
  universe: equities
  description: 资产负债表 - 总资产截面排名，越高代表规模越大

data_source:
  type: multi_parquet
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/balance_sheet
  timestamp_col: period_end
  instrument_col: tickers
  max_files: 3
  # start_date: "2010-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2011-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true
