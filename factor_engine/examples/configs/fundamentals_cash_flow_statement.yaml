factor:
  name: cash_flow_zscore_operating
  expr: zscore(col("net_cash_from_operating_activities"))
  freq: 1d
  universe: equities
  description: 现金流量表 - 经营活动现金流截面标准化，正值代表现金流强劲

data_source:
  type: multi_parquet
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/fundamentals/cash_flow_statement
  timestamp_col: period_end
  instrument_col: tickers
  max_files: 3
  # start_date: "2010-01-01"   # 可选：限定时间范围左端（行级过滤）
  # end_date:   "2011-12-31"   # 可选：限定时间范围右端（行级过滤）

backend:
  type: pandas

engine:
  enable_cache: true
