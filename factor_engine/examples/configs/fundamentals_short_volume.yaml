factor:
  name: short_volume_zscore_ratio
  expr: zscore(col("short_volume_ratio"))
  freq: 1d
  universe: equities
  description: 融券成交量 - 做空成交比例截面标准化，正值代表做空意愿高于均值

data_source:
  type: data_access
  dataset: fundamentals_short_volume
  fields:
    short_volume_ratio: short_volume_ratio
  start_date: "2024-01-01"
  end_date: "2024-12-31"

backend:
  type: pandas

engine:
  enable_cache: true
