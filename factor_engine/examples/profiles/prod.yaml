# prod profile：生产级缓存、因子湖、warmup、DQ 门禁与 ClickHouse 双写
# preserve_invalid_rows=true 时 inf 行保留为 is_valid=0，DQ 跳过 inf_ratio 检查
# ClickHouse 连接优先读 quant_projects/.env 中 CLICKHOUSE_*
backend:
  type: auto   # SQL 下推（DuckDB/CH）+ Polars + Pandas fallback

run:
  mode: production
  auto_warmup: true
  trim_warmup: true
  calendar: us

pipeline:
  batched_engine: true

dq:
  profile: us_equity_daily_prod
  strict: true
  input_strict: true

pit:
  enforce: true
  forbid_forward_fill: true

engine:
  enable_cache: true
  plan_cache_dir: ../data/factors/plan_cache

# data_access 源建议开启 read_auto（Arrow/Polars 零拷贝读 Parquet）
# 在 YAML 数据源配置中设置：type: data_access, read_auto: true
data_access:
  read_auto: true

materialization:
  lake_root: ../data/factors/lake
  target: staging_clickhouse
  preserve_invalid_rows: true
  value_dtype: float32
  isolate_partition_failures: true
  clickhouse_table: factor_values
  incremental:
    lookback_extra: 5
