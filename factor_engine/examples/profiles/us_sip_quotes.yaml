# SIP 报价 tick 因子模板（``us_stocks_sip_quotes``）
factor:
  name: quotes_zscore_bid_ask_spread
  expr: zscore(col("bid_price") / (col("ask_price") + 1e-9))
  freq: 1d
  universe: equities

data_source:
  type: data_access
  dataset: us_stocks_sip_quotes
  fields:
    bid_price: bid_price
    ask_price: ask_price
  normalize_timestamp: true
  timestamp_unit: ns

backend:
  type: pandas

engine:
  enable_cache: true
