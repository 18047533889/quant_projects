# SIP 日 K + 现金流量表 asof 复合因子
profile: prod

factor:
  name: us_sip_operating_cf_rank
  expr: rank(col("operating_cf"))

data_source:
  type: composite
  anchor: price
  anchor_column: close
  aliases:
    operating_cf: cash_flow.operating_cf
  sources:
    price:
      type: data_access
      dataset: us_stocks_sip_day_aggs
    cash_flow:
      type: data_access
      dataset: fundamentals_cash_flow_statement
      fields:
        operating_cf: net_cash_from_operating_activities
  joins:
    cash_flow: asof_backward
  start_date: "2016-01-01"
  end_date: "2024-12-31"

materialization:
  factor_id: us_sip_operating_cf_rank_v1
