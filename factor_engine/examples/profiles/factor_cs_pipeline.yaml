# 截面因子流水线模板：缺失处理 → winsorize → neutralize → zscore
profile: prod

factor:
  name: cs_momentum_z
  expr: zscore(neutralize(winsorize(rank(ts_mean(ts_pct(close, 20), 20)), 0.01, 0.99)))

label:
  horizon_bars: 5
  feature_lookback_bars: 20
  gap_bars: 1
  formula: ts_pct(close, 5)

data_source:
  type: data_access
  dataset: us_stock_daily
  start_date: "2024-01-02"
  end_date: "2024-12-31"

materialization:
  factor_id: cs_momentum_z_v1
