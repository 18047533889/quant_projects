# prod + ClickHouse 双写 profile（连接优先读 quant_projects/.env 中 CLICKHOUSE_*）
run:
  mode: production
  auto_warmup: true
  trim_warmup: true
  calendar: us

dq:
  profile: us_equity_daily_prod
  strict: true
  input_strict: true

pit:
  enforce: true
  forbid_forward_fill: true

engine:
  enable_cache: true
  plan_cache_dir: ../data/factors/plan_cache

materialization:
  lake_root: ../data/factors/lake
  target: staging_clickhouse
  preserve_invalid_rows: true
  value_dtype: float32
  isolate_partition_failures: true
  clickhouse_table: factor_values
  incremental:
    lookback_extra: 5
