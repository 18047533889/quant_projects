# 美股价量投递模板：走 data_access（us_stock_daily）
#
# PYTHONPATH=. python run_pipeline.py config examples/config_us_stock_pv_data_access_template.yaml --run-only

factor:
  name: us_pv_delivery_smoke
  expr: rank(ts_mean(close, 5))
  freq: 1d
  universe: US_MASSIVE_ALL
  description: 5 日收盘均线截面排名（data_access 投递 smoke）

data_source:
  type: data_access
  dataset: us_stock_daily
  start_date: "2003-09-10"
  end_date: "2003-09-30"
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
    vwap: VWAP
    amount: Amount
    ret: Ret
    preclose: PreClose
    adj_factor: AdjFactor

backend:
  type: auto

engine:
  enable_cache: true
