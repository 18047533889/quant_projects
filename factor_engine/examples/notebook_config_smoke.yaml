factor:
  name: notebook_rank_ts_mean_3
  expr: rank(ts_mean(col("close"), 3))
  freq: 1d
  universe: equities
  description: Notebook config-driven smoke test.
data_source:
  type: parquet_kline
  root: ~/quant_projects/data/us_stock/cleaned_massive_data/us_stocks_sip/day_aggs_v1
  instrument_column: ticker
  timestamp_column: window_start
  fields:
    close: close
  max_files: 20
backend:
  type: pandas
engine:
  enable_cache: true
