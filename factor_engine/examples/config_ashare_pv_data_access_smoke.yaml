# A 股价量 smoke：走 data_access + COS 本地镜像
#
# PYTHONPATH=. python run_pipeline.py config examples/config_ashare_pv_data_access_smoke.yaml --run-only

factor:
  name: ashare_pv_smoke
  expr: rank(ts_mean(close, 5))
  freq: 1d
  universe: ASHARE_ALL
  description: A 股 5 日均线截面排名（data_access smoke）

data_source:
  type: data_access
  dataset: ashare_stock_daily
  start_date: "2016-01-04"
  end_date: "2016-01-10"
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
    vwap: Vwap
    amount: Amount
    ret: Return
    preclose: PreClose

backend:
  type: auto

engine:
  enable_cache: true
