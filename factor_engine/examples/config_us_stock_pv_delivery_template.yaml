# 美股价量挖掘 → 本地试算 → disk.v1 投递（模板）
#
# 用法：
#   PYTHONPATH=. python -c "from runtime.engine import FactorEngine; print(FactorEngine.run_from_config('examples/config_us_stock_pv_delivery_template.yaml'))"
#   python scripts/validate_delivery_formula.py --manifest path/to/manifest.json
#
factor:
  name: us_pv_delivery_smoke
  expr: rank(ts_mean(close, 5))
  freq: 1d
  universe: US_MASSIVE_ALL
  description: 5 日收盘均线截面排名（投递前本地 smoke）

data_source:
  type: data_access
  dataset: us_stock_daily
  fields:
    open: Open
    high: High
    low: Low
    close: Close
    volume: Volume
  start_date: "2024-01-02"
  end_date: "2024-06-30"

backend:
  type: pandas

engine:
  enable_cache: true

# 投递 disk.v1 时另写 candidate_pool/{campaign_id}/config.json + manifest.json
# 见 miner_delivery_spec.md 与 api/mining_integration.py
