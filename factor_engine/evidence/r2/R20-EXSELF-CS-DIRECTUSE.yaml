landed_canonicals:
  - name: ex_self_mean_gap
    math: "x_i - (S_g - x_i)/(n_g - 1) via per-row running group sums (stable (n*mean-x)/(n-1), never a per-member re-scan); unit of x (documented gap canonical)"
    params: {min_peers: ParamSpec(int, min=3, default=3, SUPPORT_POLICY)}
    guards: "strict integer >= 3 (bools and 3.5-style floats rejected) == spec min; self NaN/±Inf -> NaN; < min_peers finite in-group peers EXCLUDING self -> NaN"
  - name: ex_self_zscore
    math: "(x - LOO mean) / LOO std, ddof=0 over the n-1 peers, from running sums: peer_S2 = S2-x^2, ss = peer_S2 - peer_sum^2/m with catastrophic-cancellation clamp (ss in (-1e-9*max(1,|peer_s2|), 0) -> 0, else fail-closed NaN)"
    params: {min_peers: ParamSpec(int, min=3, default=3, SUPPORT_POLICY)}
    guards: "LOO std == 0 (or broken ss) -> NaN never 0; same self/peer/min_peers policy as mean_gap"
  - name: ex_self_rank_pct
    math: "(|{p<x}| + 0.5*|{p==x}|) / m over the m finite in-group peers — average-rank convention, self excluded from numerator AND denominator; bounded [0,1]"
    params: {min_peers: ParamSpec(int, min=3, default=3, SUPPORT_POLICY)}
    guards: "same self/peer/min_peers policy; 0 = strictly below all peers, 1 = strictly above, ties split halfway"
  - name: ex_self_mad_z
    math: "(x - LOO median) / LOO MAD, exact per-member np.median over the peer set (no running-sum shortcut exists for medians); RAW MAD units, NO 1.4826 constant (matches group_peer_deviation_index)"
    params: {min_peers: ParamSpec(int, min=3, default=3, SUPPORT_POLICY)}
    guards: "LOO MAD == 0 -> NaN never 0; same self/peer/min_peers policy"

