  findings:
    - id: R20-EXSELF-P1
      severity: P1
      finding: >
        ex_self_zscore running-sum variance (ss = S2 - S^2/m) catastrophically
        cancellative at |mean|/sigma >= ~1e7 (probe: level 1e9, spread 1e-6
        -> error ratio ~1e13; finite-but-wrong z ~1e-7 where oracle ~1.3, or
        NaN by rounding sign — nondeterministic on the same row).  Clamp
        covered only the negative branch.
      resolution: FIXED — replaced with EXACT TWO-PASS peer variance (peer
        mean, then sum((p-mean)^2)/(m)); non-negative by construction, no
        clamp.  New oracle test test_zscore_high_level_low_dispersion
        (level 1e9 / spread 1e-6) passes.
    - id: R20-EXSELF-P2a
      severity: P2
      finding: overflow peers (±1e200) gave var=inf -> z=x/inf=exactly 0.0 — finite-0 emission disclaimed by the never-0 contract.
      resolution: FIXED — two-pass kernel detects non-finite var and fails closed to NaN; new test test_zscore_overflow_peers_fail_closed_never_zero.
    - id: R20-EXSELF-P2b
      severity: P2
      finding: absolute dispersion floor _EPS=1e-12 is scale-dependent (peer std < 1e-6 -> NaN even when well-posed); same for MAD floor.
      resolution: DOCUMENTED — added "Known numeric limitations" block to the module docstring (pre-scale panels to O(1); DirectUse input domain is returns/standardized factors).
    - id: R20-EXSELF-P2c
      severity: P2
      finding: test_group_zscore_zero_fill_separated never invoked group_zscore — vacuous w.r.t. the neighbor.
      resolution: FIXED — test now calls the group_zscore polars backend on the same degenerate input (labels factorized for the common/group_polars row-wrapper path) and asserts 0.0 zero-FILL on its side vs NaN on ours.
    - id: R20-EXSELF-P2d
      severity: P2
      finding: (pre-existing, out of scope) group_peer_deviation_index has two divergent implementations — polars (x-med)/MAD vs pandas multi-panel zscore aggregation.
      resolution: RECORDED — not this slice's defect; flagged to campaign queue.
