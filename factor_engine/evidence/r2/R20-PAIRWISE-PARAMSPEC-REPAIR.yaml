status: CLOSED_LOCAL
problem:
  - ts_ewm_corr / ts_ewm_cov (renamed from ewm_corr / ewm_cov by
    layer_governance._normalize_semantic_names at import time) had empty
    param_specs on their Polars-native operator classes, letting span=1 and
    non-integer span reach the kernels.
  - The rolling-operator registration gate in polars_ts_rolling.py rejected
    the pairwise TSEwmCorrNative / TSEwmCovNative classes (pairwise inputs do
    not fit the single-panel rolling-operator pattern).
  - operator_policy.py's active-surface filter (applied twice, ~lines 966 and
    ~1093) dropped ts_ewm_corr/ts_ewm_cov policy entries because
    _ACTIVE_POLICY_CANONICALS only contained the pre-rename ewm_corr name.
  - ROOT CAUSE of the residual min_periods=1-vs-2 split-brain —
    production_hardening.apply_production_hardening() overwrites
    _EXPLICIT_POLICIES[canonical] for _scope_is_authoritative names (ts_
    prefix) with patch min_periods derived from _MIN_PERIODS_FLOORS in
    contract_hardening.py; ts_ewm_corr / ts_ewm_cov were absent from that map
    so the floor fell back to 1 and clobbered the explicit min_periods=2
    policy at load_all() time.
implementation:
  - contract_hardening.py — added ts_ewm_corr=2 and ts_ewm_cov=2 to
    _MIN_PERIODS_FLOORS so the runtime hardening patch carries min_periods=2
    instead of the fallback 1.  This is the authoritative root-cause fix.
  - operator_policy.py — _PAIRWISE_EWM_POLICIES blocks applied unconditionally
    AFTER both active-surface filters (first block also pins ewm_corr/ewm_cov
    to min_periods=2 pre-rename; second block re-pins the ts_ewm_* canonicals
    post-filter) with scope=ts, pit_safe=True, min_periods=2 aligned with
    operator_policy's pairwise floor.
  - common/polars_ts_rolling.py — ts_ewm_corr/ts_ewm_cov added to
    _PAIRWISE_CANONICALS so the registration gate routes pairwise operators
    instead of rejecting them; TSEwmCorrNative/TSEwmCovNative carry a window
    ParamSpec (dtype int, min=2, ParamRole.HORIZON) and kernels enforce
    strict_integer(window, minimum=2).
  - polars_native/ts_batch1.py — EWMCorr (~line 2477) and EWMCov (~line 2521)
    span ParamSpec min raised from 1 to 2 (ParamRole.HORIZON), aligning the
    SQL/polars-native EWM family with the pairwise floor.
  - common/data_cleaning.py — EWMCorr/EWMCov backend decorators now attach
    param_specs (span, dtype int, min 2) instead of leaving empty contracts.
  - rolling_pack.py — _PolarsUdf registration path now derives param_specs
    from the pack policy so udf-wrapped rolling operators keep a machine-
    readable parameter contract.
  - layer_governance.py _enrich_catalog — falls back to
    infer_operator_policy(None, canonical=canonical) when the registry lookup
    returns None (ts_ewm_* has no pandas_numpy backend, so
    OperatorRegistry.get(canonical, mode=any) previously missed them and
    governance skipped scope enrichment).
  - Removed the two vestigial module-level
    _POLICY_REQUIRED_CANONICALS = None assignments left from debugging (dead
    code; nothing reads the module attribute — policy_required_canonicals()
    is computed lazily from operator_spec/operator_surface unions).
