implementation:
  - Added seven causal, dimensionless MA-family canonicals (transforms of
    EXISTING MAs — no new MA math):
    ema_distance_pct / sma_distance_pct / dema_distance_pct /
    tema_distance_pct ((close - MA) / close, strict-positive close masked),
    kama_distance_pct ((close - registered KAMA) / close),
    ma_slope_pct (EMA.diff() / close),
    ema_crossover (sign((fast EMA - slow EMA) / close) in {-1, 0, +1};
    documented bounded-regime semantic — the close normalization only
    localizes the sign, magnitude lives in ema_distance_pct/PPO).
  - Shared helper _ma_distance(close, ma) = (close - MA)/close.where(close>0):
    a non-positive close bar is bad data -> NaN, never abs() (R5-38 rule).
  - DEMA/TEMA reuse the existing indicators_v2 helpers (DEMA = 2*EMA -
    EMA(EMA); TEMA = 3EMA - 3EMA(EMA) + EMA(EMA(EMA))) — helpers already
    existed, none reimplemented.
  - kama_distance_pct REUSES the registered indicators_v2.KAMA (the round-7
    chain-pinned implementation that replaces composite_fastpath's KAMA) —
    KAMA math is NOT reimplemented; ParamSpec contract mirrors the registered
    KAMA spec (er_window _WIN_GE2, fast/slow _WIN_GE1) and inherits the same
    fast<slow relational family.
  - ParamSpecs: EMA-family windows _WIN_GE1 (DEMA/TEMA/KAMA fast/slow
    precedent), sma_distance_pct window _WIN_GE2 (a real rolling window),
    ema_crossover fast/slow _WIN_GE1 + _PPO_REL (fast_window < slow_window,
    ValueError guard mirrors PPO).
  - _RECURSIVE_EWM: ema/dema/tema_distance_pct, ma_slope_pct, ema_crossover
    added (EMA-recursive state -> stateful/full_replay governance);
    kama_distance_pct tagged via the hard-coded stateful set next to KAMA;
    sma_distance_pct deliberately NOT (bounded rolling window state).
  - operator_surface.py: names added to _TECHNICAL_V2_CANONICALS and to
    DAILY_FACTOR_MIGRATED via a new _DAILY_MA_DISTANCE_PACK_2026_08 frozenset.
  - mining/direct_use.py: ONLY the dimensionless names added to
    _RELATIVE_ALPHA_OPS; raw MA levels (KAMA/DEMA/TEMA/ts_ema/ts_sma) stay in
    _PRICE_LEVEL_INTERMEDIATE_OPS (untouched) and are excluded from promotion.
  - Windows end at t (PIT): EMA-family ops verified prefix-invariant
    (truncated panel == full-panel prefix, exact frame equality).
  - Concurrent-writer note: a Donchian writer edited the same three source
    files in parallel; all MA-family edits are anchored solely on
    MA-family/new lines, never on donchian_*/psar_*/keltner_*/atr_* blocks.
