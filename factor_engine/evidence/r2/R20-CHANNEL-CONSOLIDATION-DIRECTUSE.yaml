    close.where(close>0); never abs(), never laundered zeros; rolling
    mean<=0 also masked.  Constant series -> exact 0.0 (max tightness),
    never NaN-by-zero-division (zero-width guard n/a for std/mean form).
  - ParamSpec {"window": _WIN_GE2} for both; NO relational specs
