  - Landed 2 causal dimensionless close-only consolidation canonicals in
    indicators_v2.py: consolidation_pct (rolling_std(close,w,ddof=1) /
    rolling_mean(close,w) — coefficient of variation, low = consolidation)
    and consolidation_range_pct ((rolling_max(close,w)-rolling_min(close,w)) /
    close — close-only range tightness).
  - Trailing windows END at t, min_periods=window, NO future shift;
    rolling-only bounded state => NOT in _RECURSIVE_EWM, no stateful tags;
    {"causal","pit_safe"} via the existing _register machinery.
