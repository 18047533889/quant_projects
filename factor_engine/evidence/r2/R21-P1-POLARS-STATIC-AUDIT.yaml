problem:
  "The primitive-evidence certification pipeline
  (scripts/certify_primitive_evidence.py) aborts at stage
  polars_native_static_audit with exit=1:
  'ts_corr native 块含 forbidden: map_groups'. The audit
  (backend/polars_long_static_audit.py) scans the emitter's per-op native
  blocks for forbidden tokens (rolling_map / map_groups / map_batches /
  map_elements / to_pandas / pd.Series / pd.DataFrame). ts_corr is
  classified POLARS_LONG_NATIVE (backend/polars_long_policy.py:110) and
  P1_BINARY_TS_CANONICALS (production_fastpath_tiers.py:144), yet both of
  its dispatch sites returned _rolling_corr_centered_map_groups(...) — a
  group_by(_INST).map_groups(python callback) kernel running a per-row
  numpy loop. Because the 17-stage pipeline is fail-closed, the whole
  evidence/primitive_verified.json regeneration was blocked (artifact
  stale at Aug 14 with 1503 validation errors)."

root_cause:
  "The map_groups call was real, not a misclassification: the ts_corr
  native block in backend/polars_expr_emitter.py implemented 'centered
  two-pass rolling correlation to avoid catastrophic cancellation for
  large-offset series' via
  joined.group_by(_INST, maintain_order=True).map_groups(_apply) where
  _apply ran a per-row numpy loop (np.isfinite mask, per-window means,
  np.dot). That is a Python-group callback — genuinely forbidden under
  the NATIVE tier rules (the audit's rule is correct; see fix). The
  kernel existed because pl.rolling_corr forms E[xy]-E[x]E[y] internally
  which loses signal at large offsets; the native tier had no
  offset-stable expression, so a map_groups escape hatch was silently
  used inside a native-labeled block."

fix:
  "Route (a): rewrote the kernel as a genuine native Polars expression
  and kept ts_corr in POLARS_LONG_NATIVE. New helper
  _rolling_corr_centered_expr(x, y, window, min_periods) -> pl.Expr:
  (1) finite_pair mask (x.is_finite() & y.is_finite(), fill_null(False))
  nulls non-finite values per PAIR — identical ±Inf/NaN-as-missing
  contract to the old kernel and TSCorrNative; (2) each trailing window
  is materialized horizontally via pair.shift(k) for k in 0..w-1 and the
  whole expression evaluated .over(_INST, order_by=_TS), so partitions
  never mix (equivalent to the old per-inst group_by); (3) numerics use
  the SAME centered two-pass trick as the authoritative oracle
  cleaned_operators.common.polars_ts_rolling._pairwise_rolling_moments
  (TSCorrNative): a per-window anchor (pl.coalesce of the shifted
  window, i.e. first finite pair) removes the large common offset before
  squaring, then a second re-centering around the window mean
  (x_anchor + sum_x/count) keeps low-order covariance signal;
  (4) output NULL when count < min_periods, count/ss null (all-NULL
  window), or ss_x <= 0 / ss_y <= 0 / denom <= 0 (degenerate variance —
  old kernel's denom>0 guard). The old
  _rolling_corr_centered_map_groups function is deleted, not left as
  dead code. Route (b) (reclassify as POLARS_NUMPY_KERNEL / MAP_GROUPS
  tier) was rejected because the audit rule is correct and a genuine
  native expression IS achievable — TSCorrNative proves the semantics
  are expressible with pure expressions, and demoting ts_corr would have
  additionally broken P1_BINARY_TS production-safe tiering and the
  ownership test tests/backend/test_polars_operator_ownership.py which
  pins ts_corr as the quarantined-from-generated-surface native op."

