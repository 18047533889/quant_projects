known_limitations:
  - "worst-case |diff| vs a non-fsum numpy oracle at adversarial offsets is ~1.5e-06 (float summation order in pl.sum_horizontal vs np.dot); within the audit-relevant tolerance and the same order of disagreement the old map_groups kernel had vs the math.fsum oracle. The strict rel=1e-12 regressions only pin ordinary-scale windows."
  - "raw pandas .rolling().corr() itself produces |corr|>1 at 1e6+ offsets (E[xy]-E[x]E[y] cancellation, reproduced: -1.0055…); the long path (old and new) deliberately centers per window, so parity with the pandas backend holds at ordinary scale (rtol=1e-6 in the parity suite) and is intentionally BETTER than pandas at extreme offsets. No behavior change vs the old kernel."
  - "build/lib/backend/polars_expr_emitter.py (stale setuptools copy) still contains the old map_groups text; it is not imported by the test suite and is not part of the source of truth."
  - "window is materialized as w horizontal shift columns (same complexity class as TSCorrNative's _pairwise_rolling_moments); very large windows amplify expression width exactly as the authoritative operator already does."

