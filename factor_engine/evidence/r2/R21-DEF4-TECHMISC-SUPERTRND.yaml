problem:
  "Ticket R21-DEF4 (loop/tickets_r21.md): two PRE-EXISTING failures in
  tests/backend/test_polars_tech_misc.py.  (1)
  test_native_polars_tech_misc_matches_pandas — Supertrend nan-location
  mismatch: the pandas reference (cleaned_operators/technical/indicators_v2.py
  Supertrend, verified canonical) emits its first finite row 15 on the test
  panel (w=14); the polars kernel emitted row 14.  On shared-finite rows the
  max abs diff was 1.42e-14 (float association in the Wilder ewm) — values
  fine, WARMUP BOUNDARY wrong.  (2)
  test_native_polars_tech_misc_nan_warmup_matches_pandas — post-gap rows:
  pandas emits NaN UNKNOWN after gaps; the polars kernel re-seeded trend=1
  and emitted a value (manufactured long bias out of a data hole).  During
  fixing, a THIRD latent defect surfaced in the same test functions: the
  polars PSAR kernel also diverged from the pandas reference (row-1 seed on
  an indeterminate two-bar move, hardcoded bullish re-seed after gaps,
  raw-index t-1/t-2 clamps reading inside suspensions) — both disclosed test
  functions exercise PSAR, so the disclosed failures could not be closed
  without aligning PSAR to the audited reference too."

root_cause:
  "Supertrend: (a) ATR came from the polars expression helper _wilder
  (ewm_mean(alpha=1/w, adjust=False, min_samples=w) then fill_null forward):
  polars ewm_mean with forward-filled nulls publishes from the FIRST
  observation (one row early vs pandas min_periods=window, which holds NaN
  until w finite observations — TR row 0 is NaN because prev-close is
  missing, so pandas ATR first publishes at row w) and re-blends the first
  finite observation after a NaN gap at the wrong effective weight (pandas
  ewm(adjust=False) across k consecutive NaNs re-blends as
  state=(x+r*s)/(1+r), r=(1-alpha)^(gap+1)/alpha; the forward-fill path
  instead blends as x*alpha + s*(1-alpha)).  (b) _supertrend_1d re-seeded
  after a gap with trend=1 and out=final_l (hardcoded bullish restart) while
  the pandas reference (R30 §22, P0-017) publishes UNKNOWN (trend=0, NaN) on
  the first valid post-gap bar and re-asserts direction from close vs band
  midline on the next bar.  PSAR: the polars _psar_1d mirrored a STALE
  pre-R30 §23/R5-37 version of the reference — it seeded from row 0 with
  bull=True (emitting a SAR on row 1 even when the first two-bar move was
  indeterminate), hardcoded bull=True on re-seed, and clamped with raw
  t-1/t-2 indices; the audited pandas reference seeds direction from TWO
  consecutive valid bars' own high/low movement (indeterminate -> keep
  waiting, no output), resets the valid-bar history on re-seed, and emits
  nothing during UNKNOWN."

fix:
  "cleaned_operators/technical/polars_tech_misc.py, surgical kernel edits
  (net +113/-61 lines): (1) NEW _wilder_atr_1d(h,l,c,w) — per-column NumPy
  reproduction of pandas ewm(alpha=1/w, adjust=False, min_periods=w) on
  max(h-l,|h-pc|,|l-pc|) with NaN propagation (np.maximum.reduce semantics):
  NaN rows hold the previous state forward once min_periods is met; the next
  finite observation after k consecutive NaNs re-blends as
  state=(x+r*s)/(1+r), r=(1-alpha)^(gap+1)/alpha.  Same math as the
  CLOSED_VERIFIED R21-DEF1 SupertrendNative kernel
  (cleaned_operators/common/polars_technical_indicators.py
  _wilder_atr_1d/_supertrend_1d), rewritten into this file's
  module-function idiom.  (2) _supertrend_1d: added post_gap flag — first
  valid bar after a break publishes UNKNOWN (trend=0, out=NaN), resets the
  final bands to that bar's basic bands, and the NEXT valid bar re-asserts
  direction from close vs band midline (close >= mid -> +1 else -1); out=NaN
  whenever trend==0; unchanged ratchet and close-cross flip logic.  (3)
  Supertrend now calls _wilder_atr_1d instead of the polars _wilder
  expression path.  (4) _psar_1d rewritten to the audited pandas reference:
  seed/re-seed waits for two consecutive valid bars and reads direction from
  their own high/low movement (rising -> bull, falling -> bear, else keep
  waiting with NO output), valid-bar prev1/prev2 history reset on every
  re-seed, no hardcoded bullish restart.  SupertrendDirection/PSAR wrappers,
  parameter validation, registration/spec idiom and _SPECS table unchanged —
  this module's idiom is module-level functions registered via _register
  (no per-class _physical_spec); the stateful Supertrend/PSAR entries keep
  their existing 'stateful'/'full_replay' tags and the kernels remain NumPy
  per-row loops over polars column arrays (never claimed POLARS_NATIVE_EXPR;
  the production-mode UNSUPPORTED warning in polars_backend_kind is
  pre-existing and out of this slice's ownership).  No placeholders/TODOs."

