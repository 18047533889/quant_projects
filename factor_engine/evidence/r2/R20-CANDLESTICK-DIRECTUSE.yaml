implementation:
  - Added four causal, dimensionless AGGREGATE candlestick-pattern-strength
    canonicals in indicators_v2 (trailing window ENDS at t, rolling-only
    bounded state — deliberately NOT in _RECURSIVE_EWM, no full-replay
    governance needed).  These are NOT one-off binary cdl_* detectors:
    candle_body_strength = mean over w of sign(close-open)*|close-open|/range
    (aggregate directional candle strength in [-1,1]);
    candle_wick_balance = mean over w of (lower_wick-upper_wick)/range
    (buying-vs-selling pressure proxy in [-1,1]);
    candle_range_pct = mean over w of (high-low)/close (dimensionless
    bar-range volatility; plain range over close — no Wilder smoothing, no
    prev-close gaps; asserted materially distinct from the registered
    true_range_pct kernel);
    candle_pattern_count = fraction of VALID w-bars classified as
    |body/range|<0.1 (doji) OR a >=70%-of-range dominant wick whose opposite
    wick <=15% of range (hammer / inverted-hammer / shooting-star rejection
    shapes); bounded [0,1], bad bars excluded from BOTH numerator and
    denominator (never counted as non-patterns).
  - Reuse note: existing per-bar candle geometry canonicals
    (cleaned_operators/price_volume/candle_geometry_v2.py, candle_body_ratio /
    candle_upper_shadow_ratio / candle_lower_shadow_ratio in
    price_volume/candle_patterns_extended) and the binary cdl_* family were
    surveyed.  None provides the aggregate trailing-window strength contract
    this slice requires (they are single-bar ratios or prior-window
    z-scores/percentiles), so a local _candle_valid/_candle_geometry helper
    was written in indicators_v2 mirroring the spirit of the registered
    _validate_ohlc mask (close>0, OHLC nesting) plus the STRICT high>low
    range requirement (a zero range cannot normalize the geometry).  No
    existing canonical was modified.
  - Data-integrity contract (never launder bad data): a bar is structurally
    valid only when all four OHLC fields are present, close > 0, high > low
    (STRICT) and high >= max(open,close) / low <= min(open,close); anything
    else (high<low, non-positive close, zero range, NaN fields) is NaN on
    that bar and excluded from the trailing mean (skipna) — verified: bad
    bars produce NaN in body/wick/range kernels and never leak a fabricated
    0/±1 geometry term; neighbours and clean-panel prefixes are bit-equal.
  - candle_pattern_count exclusion semantics: a deformed bar drops out of
    numerator AND denominator (fraction over VALID bars, min_periods=1
    inner count with an explicit rows-presence warmup mask restoring the
    strict w-row trailing-window contract), pinned by a dedicated
    adversarial test (2-doji + 1-bad-bar window -> 2/3-over-valid, not
    counted-as-non-pattern arithmetic).
  - ParamSpecs: window _WIN_GE2 for all four (same contract as the
    vwap_/donchian_ rolling families); no relational specs (single window,
    no swap-duplicate search nodes).
  - operator_surface.py: names appended to _TECHNICAL_V2_CANONICALS and
    added to DAILY_FACTOR_MIGRATED via a new
    _DAILY_CANDLE_PATTERN_PACK_2026_08 frozenset (mirrors
    _DAILY_SUPERTREND_PACK_2026_08 / _DAILY_VWAP_PACK_2026_08 style).
  - mining/direct_use.py: ONLY the four dimensionless aggregate names
    appended to _RELATIVE_ALPHA_OPS; the one-off binary cdl_* detectors and
    raw candle_* geometry levels are asserted NOT promoted.
  - Concurrent-writer note: sibling writers may edit the same three source
    files; every candlestick edit is anchored solely on the new candle_*
    lines or clearly-shared insertion points (tail of _SPECS list,
    _PARAM_SPECS tail, tail of _RELATIVE_ALPHA_OPS, tail of
    _TECHNICAL_V2_CANONICALS, after the last _DAILY_*_PACK union) — never on
    atr_*/psar_*/keltner_*/donchian_*/ma-family/ichimoku_*/supertrend_*/vwap_*
    blocks.
focused_tests:
  command: cd /home/shw/quant_projects/factor_engine && OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 POLARS_MAX_THREADS=1 python3 -m pytest tests/operators/test_r20_candlestick_direct_use_rehab.py -q
