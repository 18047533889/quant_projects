  coverage:
    - candle_body_strength manual pandas oracle (geometry recomputed from raw
      OHLC, independent of the operator helper) + warmup NaN boundaries
      (window-1 leading NaN, finite from index window) + |value| <= 1 bound
    - candle_body_strength sign on deterministic directional panels (rising
      closes -> strictly positive; falling -> strictly negative)
    - candle_wick_balance manual oracle + deterministic hammer-panel exact
      value ((lower-upper)/range) + sign + [-1,1] bound
    - candle_range_pct manual oracle + distinctness vs the registered
      true_range_pct kernel (>50% of bars differ by >1e-6 on the test panel)
    - candle_pattern_count manual oracle (doji / dominant-wick+small-opposite
      classification recomputed in numpy) + [0,1] bound + deterministic
      all-doji panel -> exactly 1.0 + all-marubozu panel -> exactly 0.0
    - malformed-OHLC masking: high<low, close<=0, zero-range and NaN-field
      bars are NaN in every op (never laundered); neighbouring valid bars
      stay finite
    - candle_pattern_count bad-bar exclusion arithmetic: fraction over VALID
      bars only (1/3 with one bad bar in a w=4 window; 1/4 once the bad bar
      leaves; 0 for all-valid all-marubozu windows)
    - prefix-invariance: truncated panel == full-panel prefix for all four
      canonicals (exact frame equality, rolling-only kernels)
    - ParamSpec keys/dtype, NOT in _RECURSIVE_EWM, no stateful tag,
      causal+pit_safe tags present, window=1 ValueError guard
    - _RELATIVE_ALPHA_OPS membership + binary cdl_* exclusion +
      DAILY_FACTOR_MIGRATED and _TECHNICAL_V2_CANONICALS promotion membership
