landed_canonicals:
  - name: beta_residual_z
    math: "(r_t - beta_prior * m_t) / resid_std_prior; beta and residual std (dof = window-2: intercept + slope consumed — OLS residual SE, NOT ddof=1; review P1 wording fix) from OLS r~1+m on the STRICTLY PRIOR window [t-w, t-1] (signal row t never enters its own fit)"
    params: "ret, market_ret, window (ParamSpec dtype=int, min=5, default=20, searchable, ParamRole.HORIZON)"
    guards: "NaN/±Inf in prior window or at signal row -> NaN; degenerate market variance (sxx<=1e-12) -> NaN; zero prior residual std -> NaN, never 0"
  - name: beta_divergence_pct
    math: "(r_t - beta_prior * m_t) / |m_t| — market-model divergence ratio (dimensionless, sign-preserving)"
    params: "ret, market_ret, window (same spec)"
    guards: "same fail-closed window semantics; |m_t| <= 1e-12 (flat market bar) -> NaN, never 0"
  - name: relative_strength_group_pct
    math: "trailing compound return (window ending at and including t) minus the group ex-self mean trailing compound return (per-row cross-sectional LOO mean over same-label finite peers, self excluded)"
    params: "ret, group, window (same spec)"
    guards: "NaN/±Inf inside trailing window -> NaN; zero finite same-label peers ex-self -> NaN never 0; self NaN/±Inf -> NaN; shape mismatch -> ValueError"

