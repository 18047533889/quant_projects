defects:

  - id: DEF-1
    severity: P1
    op: Supertrend (polars backend SupertrendNative)
    file: cleaned_operators/common/polars_technical_indicators.py:1307-1353
    class: wrong-math (indicator is not what its name claims)
    counterexample: |
      Executed: SupertrendNative._calculate_series(high, low, close, window=4,
      multiplier=3.0) on 8-bar panel returns EXACTLY (high+low)/2 for every row
      (verified identical=True). Source comment admits it: "Simplified: return
      the band midpoint (full stateful version would track trend direction)"
      (L1350-1351). A Supertrend must equal the ratcheted lower band in an
      uptrend and the upper band in a downtrend (flip on close-cross), and must
      NEVER be (h+l)/2 on both trend sides simultaneously. Downstream ATR
      multipliers (L1347-1348) cancel identically in (upper+lower)/2, so
      `window` and `multiplier` are dead parameters. Any alpha consuming the
      polars "Supertrend" canonical consumes a midpoint-of-bar proxy with zero
      trend information. The pandas Supertrend in
      technical/indicators_v2.py:257-321 is correct (verified above) — the
      polars registration shadows the name with wrong math. Also uses ATR =
      simple rolling_mean of TR (L1343), not Wilder.
    recommendation: repoint the polars "Supertrend" canonical at the verified
      pandas kernel or implement the stateful ratchet; until then mark the
      polars source NOT production-usable.

  - id: DEF-2
    severity: P2
    op: polars rolling indicator warmup policy (rolling_vwap / donchian /
      ichimoku-class rolling in common/polars_technical_indicators.py)
    file: cleaned_operators/common/polars_technical_indicators.py (multiple
      rolling_* sites using min_samples=1)
    class: warmup false-value (partial-window emission)
    counterexample: |
      polars rolling aggregations use min_samples=1, emitting partial-window
      values from the first row. The R20 pandas kernels deliberately use
      min_periods=window (fail-closed warmup) — the same canonical computed
      through the polars backend yields materially different values for the
      first window-1 rows (e.g. Donchian upper band at row 0 = high_0 instead
      of NaN). Not executed as a full battery (probe only); flagged from code
      reading + the Supertrend probe showing the polars layer diverges from
      the audited pandas math.
    recommendation: align min_samples with the pandas family contract or
      document the backend divergence; classify NOT production-usable for
      DirectUse alphas until aligned.

