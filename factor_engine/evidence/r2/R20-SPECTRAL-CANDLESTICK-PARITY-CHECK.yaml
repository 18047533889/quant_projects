infrastructure_fix:
  description: >
    load_all() failed with RuntimeError: active canonical 'Beta' has no explicit
    scope policy. Root cause: 869 operators are registered in _operators/_catalog
    but NOT classified in any surface partition (DAILY/EXTENDED/RESEARCH/UNSAFE/
    LEGACY/INTERNAL). When _EXPLICIT_POLICIES is filtered at import time to only
    keep entries in _ACTIVE_POLICY_CANONICALS, these operators lose their policies.
    When _enrich_catalog() iterates over _catalog items, it finds these operators,
    calls infer_operator_policy(), gets scope="unknown", and raises RuntimeError.
  fix: >
    Modified _enrich_catalog() in layer_governance.py to skip operators that are
    NOT in any active surface (daily/extended/research) and have unknown scope.
    This allows internal/legacy/unclassified catalog entries to pass through
    governance without requiring explicit scope policies.
  file_modified: cleaned_operators/layer_governance.py
  change: >
    Added conditional check before RuntimeError: if surface not in ("daily",
    "extended", "research") and policy_scope == "unknown", skip the operator
    instead of raising.

