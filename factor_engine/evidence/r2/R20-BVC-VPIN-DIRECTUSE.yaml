  - "vpin_pct uses an O(window * n * columns) positional numpy loop (fail-closed window validation forces a python-level inner loop); acceptable for daily-bar canonical use, NOT vectorized rolling."
  - "bvc_sign_pct warmup is window NaNs (first window needs close[t-window] formed); vpin_pct warmup is w-1 NaNs (diffs formed inside the kernel) — different by one bar, documented and asserted."
  - "BVC is the sign-of-diff approximation of true bulk classification (no tick-level data); VPIN here uses BVC flow per bar, matching the flow_impact.py reference pipeline."
