landed_canonicals:
  - name: bvc_sign_pct
    math: "bvc_t = sign(close_t - close_{t-1}) * volume_t on the strict-valid cohort (both closes finite & > 0, volume finite & > 0); bvc_sign_pct = sum(bvc)/sum(volume) over the trailing window; [-1,1] dimensionless"
    params: {window: _WIN_GE2 (HORIZON)}
    guards: "runtime _pi(window,'window',2) matches spec min exactly; min_periods=window (fail-closed NaN-in-window); non-positive close/volume masked NaN via cohort (R5-38, never abs()); zero-volume window -> NaN; warmup = window NaNs (first window needs close[t-window] formed)"
    tags: causal / pit_safe / production_extension (NOT in _RECURSIVE_EWM)
  - name: vpin_pct
    math: "trailing-window volume bucketed into `buckets` equal-volume buckets (proportional bar-splitting: a bar's flow is apportioned as flow*(take/volume_bar), signed remainder preserved, never per-half abs — reference _equal_volume_vpin in flow_impact.py); per-bucket |bulk-direction imbalance| summed / total window volume; [0,1] dimensionless"
    params: {window: _WIN_GE2 (HORIZON), buckets: _WIN_GE2 (HORIZON — no WEIGHT role in the ParamRole enum)}
    guards: "runtime _pi(window,'window',2) and _pi(buckets,'buckets',2) match spec minimums exactly; fail-closed: any NaN / non-finite / non-positive close or volume anywhere in the window, or zero total window volume -> NaN (volume NaN must not shrink buckets); warmup = w-1 NaNs (diffs formed inside the kernel)"
    tags: causal / pit_safe / production_extension (NOT in _RECURSIVE_EWM)
  - name: bvc_imbalance_ma
    math: "(EMA(bvc_flow, fast_window) - EMA(bvc_flow, slow_window)) / EMA(volume_cohort, slow_window); fast/slow EMA spread of BVC flow normalized by total-volume EMA; dimensionless"
    params: {fast_window: _WIN_GE1, slow_window: _WIN_GE1, relational: _PPO_REL (fast_window < slow_window)}
    guards: "runtime _pi minimums 1/1 match spec; f >= s -> ValueError('fast_window must be < slow_window'); den masked to > 0 (zero-volume EMA -> NaN); ewm(adjust=False, min_periods=span) skip-if-NaN state semantics"
    tags: causal / pit_safe / production_extension / stateful / full_replay (in _RECURSIVE_EWM — only the EMA-spread member is recursive)

family_contract:
  windows: "trailing windows only (bvc_sign_pct/vpin_pct rolling min_periods=window; bvc_imbalance_ma EMA min_periods=span); no future shift anywhere; strictly causal"
  masking: "strict-positive close AND volume cohort (R5-38): non-positive -> NaN, never abs(); zero-volume window -> NaN; NaN-in-window fail-closed for the rolling pair; EMA member freezes state across NaN gaps (pandas skip-if-NaN)"
  dimensionless: "all three outputs are ratios of volume-like quantities; degenerate/zero denominators -> NaN never 0"

