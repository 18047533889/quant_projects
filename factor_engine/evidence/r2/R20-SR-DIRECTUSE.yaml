  coverage:
    - sr_distance_pct manual pandas oracle (prior pivot recomputed from raw
      OHLC, independent of the operator helper) + warmup NaN boundary (NaN
      through index w-1, finite from w) + exact frame equality
    - no-lookahead oracle: last-bar spike — pivot at t equals the median of
      the w typical prices ENDING AT t-1 only; mutating bar t's own inputs
      never changes the pivot at t (own-bar data cannot leak into the
      reference level)
    - sr_distance_pct sign on deterministic panels (rising -> strictly
      positive; falling -> strictly negative) + malformed-bar masking
      (close<=0 bar and NaN-close bar -> NaN on that bar, neighbours
      finite)
    - sr_touch_count manual per-bar oracle (numpy loops; each window bar i
      judged against pivot_i at its OWN row) + [0,1] bound + warmup NaN
    - deterministic flat panel: exact 1.0 at tol=0.031 (all touch) and
      exact 0.0 at tol=0.0299 (no touch); tol=0.03 deliberately avoided —
      band == |high-pivot| is an FP knife-edge (0.3 vs
      0.3000000000000007) and would make the test roundoff-dependent
    - malformed-bar exclusion semantics: NaN-high bar NaNs its own row
      (present-extremes requirement) while the covering window's fraction
      stays finite over the remaining judgeable bars (excluded, never
      counted as a non-touch); non-positive close on the judged bar -> NaN
    - prefix-invariance: truncated panel == full-panel prefix for both
      canonicals (exact frame equality, rolling-only kernels)
    - ParamSpec keys/dtypes (window int; tol float), NOT in
      _RECURSIVE_EWM, no stateful tag, causal+pit_safe tags, window<2 and
      tol<=0 ValueError guards
    - _RELATIVE_ALPHA_OPS membership + ts_support_level /
