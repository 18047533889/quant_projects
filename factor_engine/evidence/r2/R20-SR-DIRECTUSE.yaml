implementation:
  - Added two causal, dimensionless support/resistance canonicals in
    indicators_v2 over ONE documented pivot definition — the PRIOR-window
    typical-price median pivot
    pivot_t = ((h+l+c)/3).rolling(w, min_periods=w).median().shift(1),
    i.e. the level a bar-t decision acts against is formed from the w bars
    ENDING AT t-1 (strictly trailing, PIT-safe; mirrors the
    donchian_breakout_* prior-window precedent).  Helper _sr_prior_pivot.
  - sr_distance_pct = (close - pivot_t) / pivot-anchored close
    ((close - pivot)/close): signed dimensionless distance of price from
    the prior median typical-price level; strict-positive close masked
    (non-positive close -> NaN, R5-38 never-laundered); warmup NaN (needs
    w+1 rows).  Bounded, rolling-only kernel.
  - sr_touch_count = fraction of the last w bars whose high OR low came
    within tol (dimensionless relative tolerance, tol*pivot, _POS_FLOAT)
    of the pivot.  A touch is a TIME-COINCIDENT event: window bar i is
    judged against pivot_i — the prior-window median typical price AT
    BAR i'S OWN ROW (rows i-w..i-1) — NEVER against the level formed
    later at t (comparing bar i against pivot_t would leak t's
    information backwards).  Bounded [0,1]; bars that cannot be judged
    (missing high/low, no comparable level at their own row) drop out of
    BOTH numerator and denominator — never counted as non-touches; the
    judged bar t itself must have present extremes and a strict-positive
    close (R5-38).
  - Kernel-alignment note: the typical-price pivot is a DataFrame aligned
    with the OHLC panel (typical price is computed columnwise), so
    elementwise DataFrame arithmetic (high - pivot) correctly compares
    bar i against its own row's level; the earlier
    Series-broadcast/`[:, None]` variants were wrong (a pandas Series
    aligns against DataFrame COLUMNS; an (n,1) numpy broadcast against an
    (n,n) frame is a shape error).
  - SKIP DECISION (per task brief): sr_breakout_up / sr_breakout_down
    were considered and SKIPPED as near-duplicates — a prior-window
    fresh-extreme breakout IS donchian_breakout_up/down (registered,
    rolling(w).max().shift(1) prior extremes), and a close-beyond-pivot
    breakout against the median pivot reduces to thresholding
    sr_distance_pct, which already carries the distinct median-pivot
    semantics.  No new breakout canonicals were added.
  - Reuse survey: ts_support_level / ts_resistance_level are pivot-cluster
    regression levels with left/right confirmation windows
    (future-confirmation semantics, price-scale) — a different contract
    and NOT dimensionless; they stay intermediate and are asserted NOT
    promoted.  No existing canonical was modified.
  - ParamSpecs: window _WIN_GE2 for both; tol _POS_FLOAT for
    sr_touch_count (validated > 0 at the call boundary, ValueError on
    tol <= 0 and window < 2).  Rolling-only bounded state — NOT in
    _RECURSIVE_EWM (no full-replay governance needed); tags
    causal/pit_safe/production_extension.
  - operator_surface.py: names appended to _TECHNICAL_V2_CANONICALS and
    added to DAILY_FACTOR_MIGRATED via a new _DAILY_SR_PACK_2026_08
    frozenset (mirrors _DAILY_CANDLE_PATTERN_PACK_2026_08 style).
  - mining/direct_use.py: ONLY the two dimensionless names appended to
    _RELATIVE_ALPHA_OPS; the price-scale ts_support_level /
    ts_resistance_level levels stay intermediate (never in the set).
  - Concurrent-writer note: sibling writers edit the same three source
    files; every SR edit is anchored solely on the new sr_* lines or
    clearly-shared insertion points (tail of _SPECS, _PARAM_SPECS tail,
    tail of _RELATIVE_ALPHA_OPS, tail of _TECHNICAL_V2_CANONICALS, after
    the last _DAILY_*_PACK union) — never on
    atr_*/psar_*/keltner_*/donchian_*/ma-family/ichimoku_*/supertrend_*/
    vwap_*/candle_* blocks.
