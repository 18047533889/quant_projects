independent_review:
  reviewer: scoped-reviewer (read-only subagent, diff + evidence YAML only;
    joint dispatch with the channel/consolidation slice)
  date: 2026-08-19
  verdict: PASS (with findings, no P0/P1)
  verified:
    - Causality: _sr_prior_pivot is strictly prior rows
      (((h+l+c)/3).rolling(w).median().shift(1)); sr_touch_count judges
      window bar i against pivot_i at bar i's OWN row via elementwise
      DataFrame arithmetic — no backwards leakage of the level formed at t.
    - den.where(den>0) -> NaN not 0 for all-unjudgeable windows; tol
      _POS_FLOAT + explicit ValueError; warmup first finite pivot at row w.
    - Genuine independent numpy-loop oracle; no-lookahead test mutates the
      last bar's own inputs and proves the pivot at t is unchanged;
      prefix-invariance computes the clean full panel before truncation.
    - Flat-panel tol test pinned on both sides of the 0.3 FP knife-edge.
    - Governance/promotion/skip rationale all confirmed (sr_breakout_* ==
      donchian_breakout_* prior-window semantics; ts_support_level /
      ts_resistance_level correctly absent).
  p2_findings_and_resolution:
    - P2: interior window bars with non-positive close were NOT excluded —
      a close=0 bar with valid high/low still fed tp into pivot medians and
      could count as a touch, inconsistent with the R5-38 header contract.
      CLOSED: _sr_prior_pivot now NaNs the typical price of any bar with
      missing/non-positive close (fail-closed — a pivot window covering one
      NaNs out), and sr_touch_count excludes such bars from num/den.
    - P2: num = touch.astype(float).where(valid) was redundant (touch
      already & valid). CLOSED: dead .where removed.
    - P2: warmup-edge rows t in [w, 2w) emit fractions over a partial
      (<w) judgeable cohort. ACCEPTED: documented in the sr_touch_count
      docstring (over-valid-fraction contract boundary artifact).
  focused_tests_after_review: 22 passed (SR 9 + channel 13 combined serial
    run after the fixes, 2026-08-19)
