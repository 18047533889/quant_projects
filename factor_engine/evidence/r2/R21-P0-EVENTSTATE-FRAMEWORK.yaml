guards_in_tests:
  - brute-force Python loop oracles independent of implementation helpers
    (no _trailing_map/_strict_event_bool/_state_panel reuse)
  - prefix invariance (full.iloc[:70] == calculate(frame.iloc[:70]) for all
    23 canonicals)
  - causality mutation (late event/state mutation cannot touch earlier rows)
  - sparseness counterexample: single-event panel -> event_decay_window and
    positive_event_age FINITE at/after the event while event_recency_z is NaN
    (both asserted on the same panel)
  - fail-closed NaN in window (all 23: rows [20,30) NaN, before/after finite)
  - invalid input rejection (EventBool [-1,0.5,2,±inf]; SignedEvent
    [-2,0.5,2,±inf]; state ±inf)
  - deliberate-NaN vs deliberate-0 scenarios (censored burst/episode/age NaN;
    confirmed-absence rates/streaks real 0; degenerate direction imbalance NaN)
  - window validation (1/True/5.5/nan/0/-3 rejected) and halflife validation
    (0/-1/inf/True rejected; halflife <= window relational)
  - ParamSpec governance (window int min=2 HORIZON role; halflife float;
    tags causal+pit_safe, no stateful/full_replay)
  - promotion membership (all 23 in _RELATIVE_ALPHA_OPS, none in
    _PRICE_LEVEL_INTERMEDIATE_OPS, all in EXTENDED_ONLY_CANONICALS,
    classify_canonical == "extended")
  - duplicate-shadow check (event_age/event_decay remain the pre-existing
    aliases, not shadowed)
  - state_persistence == state_dwell_pct asserted equal (documented twin)
  - state_age vs state_persistence distinctness on constant panel
    (dwell 1.0 vs episode age censored NaN)
  - categorical_event_family_semantics: deliberate scenario tests for all 7
    new canonicals (category_age, category_frequency, category_transition_rate,
    category_transition_surprise, event_direction_persistence, state_episode_age,
    state_flip_age)
known_limitations:
  - pandas_numpy backend only; no Polars-native implementation (pandas loops
    per column per row — O(n*w); fine for research panels, not hot-path)
  - trailing-window estimators forget episodes/events older than the window
    (censored -> NaN by design, documented)
  - signed family treats NaN as unknown row (fail-closed), not as 0 —
    panels with partial marks yield NaN windows, not partial rates
