problem: >
  Event/State derivation framework lacked trailing-window primitives beyond the
  five R20 canonicals: EVENT_BOOL run/duration/pulse estimators, SIGNED_EVENT
  (-1/0/+1) rate/age/decay/imbalance/flip estimators, and STATE episode-age /
  persistence / churn / alternation estimators. Sparse-event panels (a single
  in-window event) had no robust signal family: event_recency_z needs >= 3
  in-window events and NaNs below that.
fix: >
  New module cleaned_operators/technical/event_state_derivations_v1.py
  following the event_state_v2 idiom exactly (spec table _SPECS +
  _PARAM_SPECS + _RELATIONAL_SPECS, single _register loop, class prefix
  EventStateDerivationsV1_, source=technical_event_state_derivations_v1,
  backend=pandas_numpy, status=production, tags pit_safe/causal/
  production_extension). 23 new canonicals, all strictly causal (trailing
  windows END at t), fail-closed (min_periods=window: any NaN in window ->
  NaN; degenerate denominator -> NaN never 0; censored quantities -> NaN
  never fabricated), dimensionless. Validators: strict EventBool {0,1,NaN}
  (bool family), strict SignedEvent {-1,0,+1,NaN} (signed family), finite-
  state-code-or-NaN (state family) — all reject out-of-domain values with
  ValueError. ParamSpec window (int, min=2, ParamRole.HORIZON) rejects bool/
  non-integral-float/nan; halflife (float, min>0, ECONOMIC) with relational
  spec halflife <= window. Surface classification via
  operator_surface.extend_extended_only({name}) at register time
  (group_state_v1 idiom). state_episode_duration registered as an ALIAS of
  state_age (one canonical). state_persistence is the documented twin of
  state_dwell_pct (same estimator, asserted equal in tests) kept for STATE
  family naming symmetry.
new_canonicals:
  event_bool_family: [event_streak, event_cluster_duration, event_decay_window]
  signed_event_family: [signed_event_rate, positive_event_rate,
    negative_event_rate, positive_event_age, negative_event_age,
    signed_event_decay, event_direction_imbalance, event_flip_density]
  state_family: [state_age, state_persistence, state_transition_count,
    state_transition_rate, state_flip_density]
  categorical_event_family: [category_age, category_frequency,
    category_transition_rate, category_transition_surprise,
    event_direction_persistence, state_episode_age, state_flip_age]
  alias: {state_episode_duration: state_age}
duplicates_skipped:
  event_age: existing registry alias -> ts_days_since (alpha_language_aliases.py;
    full-history NaN-reset bars-since-last-True); registering a same-named
    canonical is impossible (register_alias collision) and would fork the
    semantic. Sparse-event robustness served by windowed positive/negative_event_age.
  event_decay: existing registry alias -> event_decay_asof (state_event.py;
    recursive cumulative decay, full-replay/stateful). Windowed single-pulse
    decay implemented under a distinct name event_decay_window.
  state_episode_duration: NOT skipped outright — implemented as alias of
    state_age (same quantity; one canonical, alias-safe).
  documented_non_duplicates:
    - ts_days_since / ts_true_streak (daily_panel: full-history ConditionBool,
      NaN-reset) vs trailing min_periods=window fail-closed here
    - ts_transition_count (ConditionBool 0/1 flips, carry/break) vs
      multi-valued state-code state_transition_count
    - ts_time_since_change (full-history recursive) vs windowed state_age
    - state_dwell_pct (window fraction) vs state_age (episode age — distinct)
    - state_transition_surprise (z vs uniform-iid null) vs raw count/rate/flip
    - event_cluster_score (count-vs-Poisson z) vs event_cluster_duration
      (live-burst run length)
    - event_recency_z (needs >= 3 events) vs positive/negative_event_age
      (single event suffices — asserted)
