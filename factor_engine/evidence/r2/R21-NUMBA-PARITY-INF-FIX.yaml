status: COMPLETE

## Problem

The `parity_check()` function in `backend/numba_kernel_registry.py` used a single
`np.isfinite(ref) & np.isfinite(num)` mask to filter values before `np.allclose()`.
This silently ignored mismatches in the +Inf / -Inf / NaN masks because:

- Positions where either ref or numba was Inf were excluded from comparison.
- If ref produced NaN at position X but numba produced Inf (or vice versa), the
  position was excluded from `allclose` AND `nan_ok` only checked `isnan()` equality
  (NaN vs Inf shows False, but the combined check still passed because the allclose
  subset was correct).

## Fix (backend/numba_kernel_registry.py)

### 1. Inf parity check decomposed into explicit sub-masks

```python
ref_posinf = np.isposinf(ref)
num_posinf = np.isposinf(num)
ref_neginf = np.isneginf(ref)
num_neginf = np.isneginf(num)
ref_fin = np.isfinite(ref)
num_fin = np.isfinite(num)
```

- `posinf_ok` = `np.array_equal(ref_posinf, num_posinf)`
- `neginf_ok` = `np.array_equal(ref_neginf, num_neginf)`
- `finite_mask_ok` = `np.array_equal(ref_fin, num_fin)`
- `nan_ok` = `np.array_equal(np.isnan(ref), np.isnan(num))`
- `dtype_ok` = `ref.dtype == num.dtype`
- `shape_ok` = `ref.shape == num.shape`
- `finite_match` = `np.allclose(ref[ref_fin], num[ref_fin])` only when `shape_ok`
- Final `match = all of the above`

The result dict now includes all sub-mask booleans for diagnostics.

### 2. Shape guard before indexing

When `shape_ok` is False, `finite_match` is set to False and we skip the
allclose indexing to avoid IndexError.

### 3. Registry dedup (DuplicateKernelRegistrationError)

`NumbaKernelRegistry.register()` now checks whether the kernel_name already exists.
- Same spec (idempotent re-registration): allowed silently.
- Different spec: raises `DuplicateKernelRegistrationError`.

