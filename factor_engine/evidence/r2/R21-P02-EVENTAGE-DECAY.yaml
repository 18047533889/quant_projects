problem: >
  Event/State derivation framework operators lacked availability declarations
  (available_at, same_session_usable) needed for EOD-realised / session-realised
  governance. The operators had correct causal semantics (trailing windows,
  fail-closed, no lookahead) but missing machine-readable availability metadata.
fix: >
  Added available_at='close_of_t' and same_session_usable=False to all event/
  state operators in the _register function. Added 5 regression tests:
  1. test_available_at_declarations - verifies all operators have correct
     availability metadata
  2. test_event_age_no_lookahead - causality check for event decay operators
  3. test_state_age_no_lookahead - causality check for state age operators
  4. test_categorical_event_family_available_at - verifies CategoricalEvent
     family registration
  5. test_nan_in_window_fail_closed - extended to cover CategoricalEvent family
  Also added new CategoricalEvent operators to _RELATIVE_ALPHA_OPS.
causality_verification: >
  All operators use trailing windows ending at t (prefix-causal). Verified by:
  1. Test oracles are independent brute-force loops (no implementation helpers)
  2. Prefix invariance tests confirm full.iloc[:N] == calculate(frame.iloc[:N])
  3. Causality mutation tests confirm late event/state mutation cannot touch
     earlier rows
  4. No lookahead in kernel implementations (all use chunk[lo:r+1] where
     lo = max(0, r - window + 1))
availability_verification: >
  All 23 operators verified to have:
  - available_at='close_of_t' (EOD-realised)
  - same_session_usable=False (no intra-session use)
  Operators: event_streak, event_cluster_duration, event_decay_window,
  signed_event_rate, positive_event_rate, negative_event_rate,
  positive_event_age, negative_event_age, signed_event_decay,
  event_direction_imbalance, event_flip_density, state_age,
  state_persistence, state_transition_count, state_transition_rate,
  state_flip_density, category_age, category_frequency,
  category_transition_rate, category_transition_surprise,
  event_direction_persistence, state_episode_age, state_flip_age
tests_added:
  - test_available_at_declarations
  - test_event_age_no_lookahead
  - test_state_age_no_lookahead
  - test_categorical_event_family_available_at
  - test_nan_in_window_fail_closed (extended)
