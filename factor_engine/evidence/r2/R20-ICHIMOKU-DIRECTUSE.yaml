implementation:
  - Added three causal, dimensionless Ichimoku canonicals:
    tenkan_kijun_cross, chikou_distance_pct, senkou_span_causal_pct.
  - NO future shift anywhere: the classic Senkou A/B 26-bar forward
    displacement is display-only (honouring it would read future bars), and
    the classic Chikou span (close compared against bars 26 AHEAD) is
    future-looking in its standard usage and deliberately NOT used — the
    equilibrium-line distance is computed directly at t.  Both facts are
    documented in the docstrings and the test module header.
  - All windows are trailing and END at t (min_periods=window, rolling-only
    bounded state) => NOT added to _RECURSIVE_EWM (no full_replay
    governance); outputs are prefix-invariant under truncation (asserted).
  - Tenkan/Kijun levels reuse the registered canonicals (ichimoku_tenkan /
    ichimoku_kijun); the midpoint math is never reimplemented.
  - tenkan_kijun_cross: sign((Tenkan - Kijun)/close) bounded {-1,0,+1}; the
    close normalization only localizes the sign (dimensionless); warmup NaN
    until the Kijun window fills; tenkan_window < kijun_window relational
    spec (mirror of _PPO_REL, named _ICHI_REL) prunes swapped search nodes.
  - chikou_distance_pct: (close - Kijun)/close — dimensionless distance
    from the equilibrium line, computed causally at t (the classic Chikou
    span-shift is future-looking and must NOT be used).
  - senkou_span_causal_pct: ((Tenkan_t + Kijun_t)/2 - close)/close — the
    CAUSAL cloud-mid vs price gap, no shift(26); same relational spec as
    tenkan_kijun_cross (the window swap creates a duplicate search node).
  - Non-positive close is bad data (R5-38): strict-positive close masking in
    every canonical (bad close -> NaN, never abs() or laundered 0.0).
  - kijun_deviation_pct deliberately NOT registered: it is mathematically
    identical to chikou_distance_pct ((close - Kijun)/close); no
    near-duplicates in the canonical surface.
  - All params get _WIN_GE2 ParamSpec (HORIZON role), matching the
    ichimoku_* family precedent.
  - Raw ichimoku_tenkan/kijun/senkou_a/senkou_b price levels stay
    intermediate (_PRICE_LEVEL_INTERMEDIATE_OPS); only the dimensionless
    names enter _RELATIVE_ALPHA_OPS.
  - Classified in _TECHNICAL_V2_CANONICALS and promoted to the daily surface
    via _DAILY_ICHIMOKU_PACK_2026_08 (mirrors _DAILY_DONCHIAN_PACK_2026_08)
    so layer governance finalization stays exact (classify_canonical ->
    "daily").
