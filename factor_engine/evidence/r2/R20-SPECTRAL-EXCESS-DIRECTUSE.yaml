contract_semantics:
  causality: "trailing window ENDS at t; pandas rolling(w, min_periods=w).apply(raw=True); no shift, no future data"
  dc_rejection: "EXPLICIT de-mean: window mean subtracted before numpy rfft; bin 0 exactly zero by construction; energy denominator EXCLUDES DC (stated in docstrings + tested via dc_offset_invariance)"
  nan_policy: "fail-closed — any NaN inside the window -> NaN output via min_periods=window; NaNs are NEVER zero-filled before the transform.  A masked non-positive close and a true NaN behave IDENTICALLY under rolling(w, min_periods=w).apply(raw=True): pandas counts non-NaN values in the window, and when the count is < w (ANY NaN, masked or true) the output is NaN and the applied function is never called on a shortened array (mechanism empirically verified by the reviewer on pandas 2.3.3).  Both masked and true NaN therefore NaN exactly the w windows that cover them (t in [bad, bad+w-1]) — the original 'head-count silently drops head-region masks' caveat mis-described the mechanism and has been corrected."
  state: "rolling-only, bounded state; NOT in _RECURSIVE_EWM; tags causal/pit_safe; no stateful/full_replay"
  zero_energy: "constant window (zero total energy) -> 0.0 (documented + tested); not NaN"
  wavelet_note: "full Haar decomposition of a de-meaned window leaves only the zero DC coefficient, so detail=all would be identically 1; the coarsest (half-vs-half) detail is grouped with DC into the trend subspace — a STRUCTURAL split point determined by window length, not a tuned parameter."

