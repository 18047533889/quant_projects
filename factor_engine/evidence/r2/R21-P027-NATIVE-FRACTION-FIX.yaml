# Problem

`plan_native_subgraph_fraction` in `backend/plan_cost_router.py` accepted a
`backend` parameter but **ignored it** for capability checks. Regardless of the
passed `backend` (pandas, polars, duckdb, clickhouse), the function always called
`supports_sql(...)`, meaning:

1. Polars backend reports SQL capability as native fraction — wrong.
2. Pandas backend reports SQL capability as native fraction — wrong.
3. The reported `native_fraction` does not reflect the *actual* chosen backend.

This caused downstream cost estimates and batch routing to misestimate native
coverage when the chosen backend was not SQL.

# Fix

Modified `backend/plan_cost_router.py`, function `plan_native_subgraph_fraction`:

1. **Per-backend capability check**: Instead of always calling `supports_sql()`,
   the function now queries `supports_pandas()`, `supports_polars()`, or
   `supports_sql()` depending on the resolved backend.
2. **No fallback to data_kind**: The function uses the explicitly passed `backend`
   parameter rather than deriving capability from the data source kind.
3. **Return backend key**: The returned dict now includes `"backend"` to identify
   which backend was evaluated.
4. **Unknown backend handling**: Unknown backends conservatively treat all operators
   as unsupported (native_fraction = 0) instead of silently using SQL capability.

