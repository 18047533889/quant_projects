problem:
  "R20-REDTEAM-MATH-1 DEF-1 (P1): SupertrendNative
  (cleaned_operators/common/polars_technical_indicators.py:1307-1353) returned
  EXACTLY (high+low)/2 on every row — the m*ATR bands cancelled algebraically
  in (upper+lower)/2, making window/multiplier dead parameters, with zero
  ratchet state and a simple rolling mean of TR instead of Wilder ATR. Any
  consumer of the polars 'Supertrend' name got a bar-midpoint proxy with zero
  trend information. The pandas Supertrend
  (cleaned_operators/technical/indicators_v2.py:257-321) is the verified
  canonical reference."

fix:
  "Kernel route: per-column NumPy ratchet state machine over Polars column
  arrays (df[col].to_numpy().astype(float)) — NOT a pure native Polars
  expression. (1) TR = max(h-l, |h-pc|, |l-pc|) with NaN propagation
  (np.maximum.reduce semantics — any NaN part -> NaN TR). (2) Wilder ATR =
  pandas ewm(alpha=1/w, adjust=False, min_periods=w) reproduced exactly,
  including NaN semantics: NaN rows hold the previous state forward, leading
  NaNs -> NaN until the first finite observation seeds state, and after k
  consecutive NaN rows the next finite observation re-blends as
  state=(x + r*s)/(1+r) with r=(1-alpha)^(gap+1)/alpha (formula derived and
  verified against pandas ewm on hand series across alpha in {1/14, 0.25,
  0.5, 0.75} x gap in {1,2,3}, then on random panels seeds 5/11/21/31 with
  NaN 0-30% and w 1-20 — all bit-exact). (3) Basic bands mid +/-
  m*ATR; final-band ratchet (upper only falls when basic_u >= final_u[t-1]
  and c[t-1] <= final_u[t-1]; mirrored for lower); trend flips when close
  crosses the active final band; output = active band level (lower in
  uptrend, upper in downtrend); row 0 NaN; post-gap bar publishes UNKNOWN
  (trend=0, out=NaN) then re-asserts direction from close vs band midline
  (R30 §22 policy, matching the audited pandas semantics). Inf fails closed
  (poisoned row -> NaN, no Inf ever leaks to output). Classification:
  PhysicalImplementationSpec _SupertrendSpec added with
  execution_kind=POLARS_NUMPY_KERNEL (NEVER POLARS_NATIVE_EXPR for a per-row
  loop), stateful=True, supports_lazy/streaming=False,
  materializes_full_panel=True, requires_sorted=True, supports_nan=True,
  supports_inf=False, identity hashes *:v2-r21-def1; metadata tags now
  ['time_series','polars','stateful','full_replay','technical']; docstring
  documents the R21-DEF1 fix. No forbidden tokens used (no
  map_elements/map_groups/rolling_map/to_pandas); static audit scans only
  backend/polars_expr_emitter.py _compile_polars blocks so
  cleaned_operators files are out of its scope by construction (verified)."

