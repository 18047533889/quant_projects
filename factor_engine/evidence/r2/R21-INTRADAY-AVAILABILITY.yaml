limitations: |
  All 27 operators are marked `session_close` / `same_session_usable=False`.
  This is correct for operators that require the full session to compute (profiles,
  tail events, range persistence, etc.). Operators like `intra_extreme_bar_return`
  could arguably be `session_open` if they only needed the current bar, but since
  they compute across the entire session column-wise, `session_close` is the safe
  default.
