similarity_novelty_signals:
  - similarity/exact.py SimilarityResult: similarity_score sign-preserving -> orientation derivable; policy currently destroys via abs()
  - novelty/conditional.py NovelyResult: novelty_score [0,1], similar_factor_ids, assessment_method; only impl is result-identity SimpleConditionalNoveltyAssessor
  - residual novelty lives in QE: quant_evaluator/metrics/interactions/conditional.py compute_incremental_ic (residualizes then ICs)
  - wire path: novelty/provider.py EvidenceResult.secondary_metrics can carry incremental_ic via QE adapter; currently nothing populates it

