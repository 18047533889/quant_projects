  - "selection/policy.py L127-136: make_decision gains optional novelty_score/residual_ic/similar_factor_ids params (caller-computed; FA stays evaluation-free)"
  - "selection/policy.py L251-266: abs(sim)>threshold: exact duplicate (novelty_score==0 result-identity) -> SHADOW (recorded, not discarded); residual passes -> approved=True SHADOWED_COEXIST; signal missing -> keep REJECTED_SIMILARITY fail-closed"
  - "selection/policy.py L81-115: SelectionPolicy gains min_novelty_score param (default 0.0)"
  - "assembly/engine.py L113: replace lexicographic sort with evidence-based ranking (score desc then factor_id tiebreak); differentiate pareto_front/family_robust/diverse/manual policies"
  - "assembly/engine.py L136-167: extend family grammar with min_per_family=N"
  - "contracts/factor_set.py: add frozen FactorMembership(factor_id, orientation, family_id, cluster_id, role, selection_decision_ref, evidence_ref, novelty_ref, reason) + FactorSetArtifact(set_id, name, members, created_at, policy_hash, snapshot_ref, universe_ref, split_ref, assembly_hash, spec); FactorSet.memberships=() and FactorSetSpec.split_ref=None defaults (backward compatible)"
  - "assembly/engine.py L120-134: compute assembly_hash (sha256 over sorted factor_ids + spec + decision ids); build memberships from latest_decisions"
  - "contracts/lifecycle.py L16-24: keep LifecycleState pipeline stages; add orthogonal ValidationStatus(UNVALIDATED/PARTIAL/VALIDATED/STALE) + HealthState(ACTIVE/DEPRECATED/RETIRED); FactorAsset gains validation_status/health_state defaulted fields"
  - "contracts/__init__.py + selection/__init__.py + assembly/__init__.py: export new names"

