# =============================================================================
# vectorbt_qs Accurate Batch 完整配置模板
# =============================================================================
# 运行方式（在工作区根目录执行）：
#   python -m vectorbt_qs batch .\vectorbt_qs\configs\configs_module.yaml
#
# 路径规则：
#   所有相对路径均以本 YAML 文件所在目录为基准，而不是命令行当前目录。
#
# standard_accurate_v2 是冻结回测口径：
#   - 本模板把研究矩阵和执行参数全部保留为 YAML 正文字段。
#   - start、end、workers 和三条路径可以修改。
#   - grid 和其余 backtest 参数可以显式保留，但值必须与 V2 契约完全一致；
#     如需改变这些口径，应发布新的版本化 profile。
# =============================================================================

# 市场类型；单位：无。
# 全部选择：ashare。standard_accurate_v2 当前只支持中国 A 股。
market: ashare

input:
  # 目标仓位宽表 parquet 文件。
  # 单位：文件内数值是组合权重，使用小数表示；例如 0.05 = 5%。
  # 格式：行索引为交易日期，列名为证券代码（如 600519.SH），单元格为目标权重。
  # 路径选择：绝对路径，或相对本 YAML 文件的路径。
  positions: ../../benchmarks/gtja191_alpha191_meanvar_hist/results/gtja191_alpha191_meanvar_hist_v1/target_positions.parquet

  # Barra 风险暴露数据根目录；单位：目录路径。
  # 路径选择：绝对路径，或相对本 YAML 文件的路径。
  # 用途：生成组合/基准风格暴露和行业暴露报告，不参与交易撮合。
  barra_root: ../../v2_sbi_mvl_fullA

output:
  # 全部回测结果的根目录；单位：目录路径；不存在时自动创建。
  # 最终结构：
  #   root/仓位文件名/benchmark_index_..._price_type_..._cost.commission_..._freq_.../
  root: ../examples/output/accurate_batch_module

batch:
  # 冻结参数集版本；单位：无。
  # 全部选择：standard_accurate_v2。
  profile: standard_accurate_v2

  # 并行执行交易回测的进程数；单位：进程。
  # 有效范围：任意正整数；1 = 串行，常用值为 2 或 4。
  # 建议：首次试跑使用 1；确认内存充足后使用 2-4。
  workers: 1

  # 冻结研究参数矩阵。以下四个列表必须完整保留，CLI 自动做笛卡尔积。
  grid:
    # 绩效与暴露报告的基准指数代码；单位：无。
    # 全部选择：000300.SH（沪深300）、000905.SH（中证500）、
    #           000852.SH（中证1000）。
    benchmark_index:
      - 000300.SH
      - 000905.SH
      - 000852.SH

    # 成交参考价格；单位：人民币元/股，使用未复权原始行情。
    # 全部选择：open（执行日开盘价）、vwap（执行日成交量加权平均价）。
    price_type:
      - open
      - vwap

    # 双边佣金率；单位：成交金额比例。
    # 全部选择：0.002（0.2%，20 bp）、0.001（0.1%，10 bp）。
    costs.commission:
      - 0.002
      - 0.001

    # 目标仓位采样/调仓频率；单位：交易频率。
    # 全部选择：1D（日频）、1W（周频）。
    freq:
      - 1D
      - 1W

  # 上述矩阵自动生成 3 × 2 × 2 × 2 = 24 份报告。
  # benchmark_index 只改变对比和暴露报告，不改变订单及 NAV，所以实际执行
  # 2 × 2 × 2 = 8 次交易回测，再复用结果生成三个基准版本。

backtest:
  # 回测起始日期（含当天）；单位：自然日期，格式 YYYY-MM-DD。
  # 可选值：任意有效日期；留空或删除时默认 2024-01-01。
  # 若该日不是交易日，实际数据从区间内首个有效交易日开始。
  start: 2024-01-01

  # 回测结束日期（含当天）；单位：自然日期，格式 YYYY-MM-DD。
  # 可选值：任意不早于 start 的有效日期，或 null。
  # null/留空表示使用目标仓位数据的最后日期。
  end: null

  # 执行模式；单位：无。
  # 全部选择：accurate。
  execution_mode: accurate

  # 初始组合现金；单位：人民币元。
  init_cash: 10000000.0

  # 单边成交滑点率；单位：成交价比例。
  # 固定值：0.001 = 0.1% = 10 bp；买入价向上、卖出价向下。
  # 滑点后的最终价格仍受当日高低价和涨跌停价约束。
  slippage: 0.001

  # 是否允许 vectorbt 层再次部分成交；单位：布尔值。
  # 全部选择：false。成交量限制和部分成交由订单规划器显式处理。
  allow_partial: false

  # 是否让所有证券共享一个组合现金账户；单位：布尔值。
  # 全部选择：true。
  cash_sharing: true

  # 同一执行日的订单调用顺序；单位：无。
  # 全部选择：auto，含义为先卖出释放现金，再执行买入。
  call_seq: auto

  # 订单规划器；单位：无。
  # 全部选择：numba。
  planner_engine: numba

  # 涨跌停判断方式；单位：无。
  # 全部选择：strict。
  # strict 使用 high/high_limit 与 low/low_limit 判断是否整日封板。
  limit_check_mode: strict

  # 涨跌停价格比较的相对容差；单位：价格比例。
  limit_price_rtol: 0.00001

  # 涨跌停价格比较的绝对容差；单位：人民币元/股。
  limit_price_atol: 0.00000001

  # 目标仓位信号产生时点；单位：无。
  # 全部选择：close，即交易日收盘后得到目标仓位。
  signal_time: close

  # 信号到成交之间的延迟；单位：交易日。
  # 固定值：1，即 T 日目标仓位在 T+1 日尝试成交。
  execution_lag: 1

  # 是否严格检查仓位证券的行情覆盖；单位：布尔值。
  # 全部选择：true；缺少必要行情时立即报错。
  strict_symbols: true

  # A 股每手数量；单位：股/手。
  # 固定值：100。普通买入和非清仓卖出按整手处理。
  lot_size: 100

  # 绩效指标年化使用的交易日数；单位：交易日/年。
  performance_year_days: 252

  # 夏普比率使用的年化无风险收益率；单位：年化收益比例。
  # 固定值：0.0 = 0%。
  risk_free_rate: 0.0

  # 单只证券每日最多成交量占当日市场成交量的比例；单位：成交量比例。
  # 固定值：0.10 = 10%；未成交部分在后续交易日继续尝试。
  max_participation_rate: 0.10

  costs:
    # Profile 基础佣金率；单位：成交金额比例。
    # 固定基础值：0.00025 = 0.025% = 2.5 bp。
    # 实际 24 组报告中，此值会被 batch.grid 的 0.002 和 0.001 分别覆盖。
    commission: 0.00025

    # 卖出印花税率，仅卖出收取；单位：成交金额比例。
    # 固定值：0.0005 = 0.05% = 5 bp。
    stamp_tax: 0.0005

    # 双边过户费率；单位：成交金额比例。
    # 固定值：0.00001 = 0.001% = 0.1 bp。
    transfer_fee: 0.00001

    # 每笔订单最低佣金；单位：人民币元/笔。
    minimum_commission: 5.0

# =============================================================================
# 数据与分析口径补充说明
# =============================================================================
# 公司行动：
#   数据来源：lqtp_data/StockDividend。
#   CashDividend 单位为人民币元/股，计入现金；
#   StockDividend、StockTransfer 单位为每股派发股数，计入真实持股。
#
# 风险暴露：
#   组合风险模型覆盖率最低 98%；单位：已覆盖组合权重比例。
#   基准风险模型覆盖率最低 99%；单位：已覆盖基准权重比例。
#   风险模型日期不足时，交易回测保留完整区间，暴露分析截断到数据交集。
