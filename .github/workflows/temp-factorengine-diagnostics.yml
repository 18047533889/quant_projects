name: Temporary FactorEngine Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/factorengine-production-hardening'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          OUT=factor_engine/evidence/temp_diagnostics.txt
          : > "$OUT"
          run_case() {
            echo "" >> "$OUT"
            echo "===== $1 =====" >> "$OUT"
            shift
            "$@" >> "$OUT" 2>&1
            code=$?
            echo "EXIT_CODE=$code" >> "$OUT"
          }
          run_case bootstrap python -c "from cleaned_operators import load_all; load_all(); from cleaned_operators.registry import OperatorRegistry; print(len(OperatorRegistry.list_canonical()))"
          run_case technical pytest -q -vv factor_engine/tests/operators/test_technical_extensions.py factor_engine/tests/operators/test_candle_patterns_extended.py
          run_case v2 pytest -q -vv factor_engine/tests/operators/test_v2_operator_expansion.py factor_engine/tests/operators/test_v2_macro_and_intraday_dsl.py factor_engine/tests/operators/test_evidence_fail_closed_v2.py factor_engine/tests/operators/test_fundamental_flow_semantics_v2.py factor_engine/tests/operators/test_analyzer_semantic_warmup_v2.py factor_engine/tests/operators/test_recipe_production_admission_v2.py factor_engine/tests/runtime/test_full_history_replay_contract_v2.py
          run_case runtime_audit python factor_engine/scripts/audit_all_factor_production.py --runtime-only
          run_case primitive_check python factor_engine/scripts/certify_primitive_evidence.py --check
          run_case factor_cert python factor_engine/scripts/certify_factor_operator_evidence.py
          run_case recipe_cert python factor_engine/scripts/certify_recipe_evidence.py
          run_case coverage python factor_cold_start/scripts/report_coverage.py
          git diff -- "$OUT" || true
      - name: Commit diagnostics
        run: |
          git config user.name 'factorengine-diagnostics-bot'
          git config user.email 'factorengine-diagnostics-bot@users.noreply.github.com'
          git add factor_engine/evidence/temp_diagnostics.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Capture temporary FactorEngine diagnostics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
