name: Factor Pack Evaluation

on:
  push:
    branches:
      - main
      - agent/autofactor-gtja185-evaluation
    paths:
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "gtja191/**"
      - "factor_engine/**"
      - "data_access/**"
      - ".github/workflows/factor-pack-evaluation.yml"
  pull_request:
    paths:
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "gtja191/**"
      - "factor_engine/**"
      - "data_access/**"
      - ".github/workflows/factor-pack-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: factor-pack-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluator-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r AutoFactorEvaluation-RECONSTRUCT/requirements.txt
      - name: Enforce provider-neutral core
        run: |
          test ! -d AutoFactorEvaluation-RECONSTRUCT/factor_packs
          test -z "$(grep -RIlE 'factor_packs\.gtja|from gtja191|import gtja191|load_gtja185_pack|gtja185' AutoFactorEvaluation-RECONSTRUCT/evaluation AutoFactorEvaluation-RECONSTRUCT/pipeline.py || true)"
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT
      - name: Core evaluation contracts without GTJA on PYTHONPATH
        run: |
          pytest -q \
            AutoFactorEvaluation-RECONSTRUCT/tests/test_batch_contracts.py \
            AutoFactorEvaluation-RECONSTRUCT/tests/test_quant_platform_integration.py

  external-gtja185:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r AutoFactorEvaluation-RECONSTRUCT/requirements.txt
      - name: External GTJA provider and 185 factor evaluation
        run: |
          python -m compileall -q gtja191
          pytest -q \
            gtja191/tests/test_autofactor_integration.py \
            gtja191/tests/test_full_catalog_factor_engine.py \
            gtja191/tests/test_gtja191.py
      - name: Platform regressions
        run: |
          pytest -q \
            data_access/tests/unit/test_params_validation_strict.py \
            data_access/tests/unit/test_key_policy_deterministic.py \
            factor_engine/tests/test_data_scope_stability.py \
            factor_engine/tests/test_gtja_compat_semantics.py
