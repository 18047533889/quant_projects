name: Apply AutoFactor GTJA185 Migration

on:
  push:
    branches:
      - agent/autofactor-gtja185-evaluation
    paths:
      - ".github/workflows/apply-autofactor-gtja185.yml"
      - ".github/scripts/apply_autofactor_gtja185.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-autofactor-gtja185
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependency
        run: python -m pip install pyyaml
      - name: Apply migration
        run: python .github/scripts/apply_autofactor_gtja185.py
      - name: Verify migration shape
        shell: bash
        run: |
          set -euo pipefail
          test -f AutoFactorEvaluation-RECONSTRUCT/factor_packs/gtja185_pack.json
          test -f AutoFactorEvaluation-RECONSTRUCT/gateway/config.py
          test -f AutoFactorEvaluation-RECONSTRUCT/docs/gtja185_batch_evaluation.md
          grep -q -- '--gtja185' AutoFactorEvaluation-RECONSTRUCT/pipeline.py
          ! grep -RIn 'engine="fastparquet"' AutoFactorEvaluation-RECONSTRUCT --include='*.py'
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT
      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_autofactor_gtja185.py
          rm -f .github/workflows/apply-autofactor-gtja185.yml
          rm -f .github/workflows/autofactor-gtja185-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete GTJA185 AutoFactorEvaluation batch pipeline"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
