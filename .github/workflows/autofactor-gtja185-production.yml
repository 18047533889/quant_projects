name: Finalize Factor Pack Decoupling

on:
  push:
    branches: [agent/autofactor-gtja185-evaluation]
    paths:
      - ".github/scripts/remove_pipeline_gtja_coupling.py"
      - ".github/workflows/autofactor-gtja185-production.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-factor-pack-decoupling
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Remove stale GTJA pipeline entrypoint
        run: python .github/scripts/remove_pipeline_gtja_coupling.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r AutoFactorEvaluation-RECONSTRUCT/requirements.txt
      - name: Validate generic core and external GTJA pack
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT:${{ github.workspace }}/gtja191
          FACTOR_ENGINE_DISABLE_NUMBA: "1"
        run: |
          test ! -d AutoFactorEvaluation-RECONSTRUCT/factor_packs
          test -z "$(grep -RIlE 'factor_packs\.gtja|from gtja191|import gtja191|load_gtja185_pack|gtja185' AutoFactorEvaluation-RECONSTRUCT/evaluation AutoFactorEvaluation-RECONSTRUCT/pipeline.py || true)"
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT gtja191
          pytest -q \
            AutoFactorEvaluation-RECONSTRUCT/tests/test_batch_contracts.py \
            AutoFactorEvaluation-RECONSTRUCT/tests/test_quant_platform_integration.py \
            gtja191/tests/test_autofactor_integration.py \
            gtja191/tests/test_full_catalog_factor_engine.py \
            gtja191/tests/test_gtja191.py
      - name: Commit final decoupling
        run: |
          rm -f .github/scripts/remove_pipeline_gtja_coupling.py
          rm -f .github/workflows/autofactor-gtja185-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove GTJA coupling from AutoFactorEvaluation pipeline"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
