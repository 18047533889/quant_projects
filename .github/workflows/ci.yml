name: CI

# =============================================================================
# P0-01 tiered CI bootstrap pipeline.
#
# CLEAN-CLONE DISCLAIMER: same as before — every job runs its REAL command on
# the freshly-checked-out tree.  No job reads a developer machine's stale
# evidence.  Nothing here is vacuous.
#
# TIER LAYOUT (each tier is a separate GH job; a job only advances to the next
# tier when it passes — enforcement is via GitHub branch-protection required
# checks; the checks below define the order and each is non-skippable):
#
#   CI_BOOTSTRAP   scripts/ci_bootstrap_smoke.sh  (fail-closed env/checkout)
#     -> SUPPLY_CHAIN      scripts/ci_smoke.sh --require-hashes lock install
#     -> PACKAGE_BUILD    wheel builds from own canonical pyprojects
#     -> IMPORT            fresh-venv install + import factor_engine/data_access
#     -> UNIT/DETERMINISM  capability/concurrency + data consistency
#     -> SEMANTIC          numerical oracle / property / cross-package
#     -> PIT_LEAKAGE       PIT audit + leakage properties + HP prefix-invariance
#     -> CROSS_PACKAGE     Task #107 cross-package contract round-trip harness
#     -> BACKEND_PARITY    cross-backend parity suite (tests/backend_parity)
#     -> SCALE             scale gates (1K default-on; 10K default-on;
#                          100K manual-gated/scheduled -> NOT_RUN honest, never
#                          fake PASS)
#   Optional (repo variables), NOT silently skippable when enabled:
#     ASHARE_*            golden = CI job gated on ASHARE_DATA_AVAILABLE.
#
# REQUIRED CHECKS to configure in GitHub branch protection (check names —
# CI cannot set these itself):
#   CI_BOOTSTRAP / SUPPLY_CHAIN / PACKAGE_BUILD / IMPORT
#   UNIT / DETERMINISM / SEMANTIC / PIT_LEAKAGE / CROSS_PACKAGE_CONTRACTS /
#   BACKEND_PARITY
#   FE_EXECUTE_PERSIST_SYNTHETIC_1K / QE_CROSS_ROW_SCALE_1K_10K_100K
#   Manual 100K jobs are optional and report NOT_RUN when not requested.
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_100k:
        description: "Run explicit FE synthetic execution/persistence and QE 100K gates"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Scripts read REPO/PY like fresh_wheel_matrix.sh.  PY is the CI interpreter
  # (system python3 has venv).  Keep the bootstrap smoke hermetic: it does NOT
  # depend on the lock.
  REPO: ${{ github.workspace }}
  PY: python3

jobs:
  # -- Tier 0 ------------------------------------------------------------
  CI_BOOTSTRAP:
    name: CI_BOOTSTRAP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "CI_BOOTSTRAP smoke (fail-closed; NOT silently skippable)"
        run: bash scripts/ci_bootstrap_smoke.sh
        shell: bash -e {0}   # exit != 0 fails the job hard

  # -- Tier 1 ------------------------------------------------------------
  SUPPLY_CHAIN:
    name: SUPPLY_CHAIN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [CI_BOOTSTRAP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock third-party deps (--require-hashes; fail-closed)
        run: bash scripts/ci_smoke.sh
        shell: bash -e {0}
      - name: Verify lock parses & pins truthfully
        run: |
          python3 - <<'PY'
          import re
          lock = open("requirements-production.lock").read()
          internal = ["data-access", "factor-engine", "quant-evaluator", "factor-optimizer", "factor-assets", "factor-preprocess"]
          need_hash = 0
          for line in lock.splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "==" not in line:
                  continue
              pkg = line.split("==")[0]
              if pkg == "python" or pkg in internal:
                  continue
              if "--hash=" not in line:
                  raise SystemExit(f"SUPPLY_CHAIN FAIL: unpinned third-party line: {line}")
              need_hash += 1
          print(f"SUPPLY_CHAIN: {need_hash} third-party pins all carry --hash; lock OK")
          PY
        shell: bash -e {0}

  # -- Tier 2 ------------------------------------------------------------
  PACKAGE_BUILD:
    name: PACKAGE_BUILD
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [CI_BOOTSTRAP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tooling
        run: python3 -m pip install -q "setuptools>=68" wheel build
        shell: bash -e {0}
      - name: Build six canonical wheels from OWN pyprojects
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/wheels"
          mkdir -p "$dist"
          for pkg in factor_engine data_access quant_evaluator factor_optimizer factor_assets factor_preprocess; do
            echo "==> building $pkg"
            # Default build creates an sdist, then builds the wheel from its
            # fresh extraction; stale build/lib modules cannot enter the wheel.
            (cd "$pkg" && python3 -m build --outdir "$dist")
          done
          ls -la "$dist"
      - name: 'Validate NOT-empty wheels (fail-closed: 0-byte/0-module wheel is a FAIL)'
        run: |
          set -euo pipefail
          total=0
          for whl in "$RUNNER_TEMP"/wheels/*.whl; do
            mods=$(python3 -c 'import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(sum(1 for n in z.namelist() if n.endswith(".py")))' "$whl")
            echo "$(basename "$whl"): py-modules=$mods size=$(stat -c%s "$whl")"
            total=$((total + mods))
            if [ "$mods" -eq 0 ]; then
              echo "FATAL: $(basename "$whl") ships 0 python modules — wheel is vacuous" >&2
              exit 1
            fi
          done
          echo "PACKAGE_BUILD: all wheels non-vacuous (total py-modules=$total)"
          (cd "$RUNNER_TEMP/wheels" && sha256sum -- *.whl > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/wheels/
          if-no-files-found: error

  # -- Tier 3 ------------------------------------------------------------
  IMPORT:
    name: IMPORT
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [PACKAGE_BUILD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/wheels/
      - name: Verify exact build artifacts
        run: cd "$RUNNER_TEMP/wheels" && sha256sum --check --strict SHA256SUMS
      - name: Clean venv; install wheels + hashed lock deps; import from wheels
        run: |
          set -euo pipefail
          python3 -m pip install -q "wheel" build
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q --no-deps "$RUNNER_TEMP"/wheels/*.whl
          awk '
            /^#/ { next }
            /^python==/ { next }
            /^data-access==/ || /^factor-engine==/ || /^quant-evaluator==/ || \
            /^factor-optimizer==/ || /^factor-assets==/ || /^factor-preprocess==/ { next }
            { print }
          ' requirements-production.lock > "$RUNNER_TEMP/thirdparty.txt"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q --require-hashes -r "$RUNNER_TEMP/thirdparty.txt"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH "$RUNNER_TEMP/venv/bin/python" -I - <<'PY'
          import factor_engine
          import data_access
          import sys
          from pathlib import Path
          from factor_engine.identity import get_factor_identity
          from factor_engine.runtime.quality.dq_profiles import resolve_input_dq_thresholds
          assert resolve_input_dq_thresholds("us_equity_daily_prod") is not None
          for module in (factor_engine, data_access):
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(Path(sys.prefix).resolve()), path
              print(f"WHEEL_IMPORT: {module.__name__} {path}")
          from factor_engine.cleaned_operators.registry import OperatorRegistry
          import data_access.core.engine  # noqa
          print("IMPORT: factor_engine OK  data_access OK")
          print("IMPORT_RESULT: PASS")
          PY
          env -u PYTHONPATH "$RUNNER_TEMP/venv/bin/factor-engine-serve" --help
        shell: bash -e {0}

  # -- Tier 4 ------------------------------------------------------------
  UNIT:
    name: UNIT
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run UNIT (capability registry + concurrency safety)
        run: |
          python3 -m pytest factor_engine/tests/test_capability_registry.py \
            factor_engine/tests/test_concurrency_safety.py -q -p no:cacheprovider
        shell: bash -e {0}

  DETERMINISM:
    name: DETERMINISM
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run DETERMINISM (data consistency + payload hash)
        run: |
          python3 -m pytest factor_engine/tests/test_comprehensive_data_consistency.py \
            factor_engine/tests/backend/test_r21_def5_payload_hash.py -q -p no:cacheprovider
        shell: bash -e {0}

  # -- Tier 5 ------------------------------------------------------------
  SEMANTIC:
    name: SEMANTIC
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run SEMANTIC (numerical oracle + metamorphic + consistency)
        run: |
          python3 -m pytest quant_evaluator/tests/test_numerical_oracle.py \
            quant_evaluator/tests/test_metamorphic.py \
            quant_evaluator/tests/test_consistency.py -q -p no:cacheprovider
        shell: bash -e {0}

  # -- Tier 6 ------------------------------------------------------------
  PIT_LEAKAGE:
    name: PIT_LEAKAGE
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run PIT_LEAKAGE (PIT audit + leakage + HP prefix-invariance)
        run: |
          python3 -m pytest \
            factor_engine/tests/runtime/test_pit_audit.py \
            factor_engine/tests/runtime/test_label_pit.py \
            factor_engine/tests/runtime/test_r10_pit_tristate.py \
            factor_engine/tests/modeling/test_evaluation_leakage_evidence.py \
            factor_preprocess/tests/contracts/test_leakage_properties.py \
            factor_preprocess/tests/transforms/test_hp_prefix_invariance.py \
            -q -p no:cacheprovider
        shell: bash -e {0}

  # -- Tier 6b (Task #107): cross-package contract integration harness -------
  # Runs integration_tests/ (the round-trip contracts harness) from the repo
  # root.  Hermetic: no parquet / PG / network needed.  The integration
  # conftest pins the source tree for factor_engine/data_access/quant_evaluator/
  # factor_assets/quant_platform and the inner factor_preprocess/factor_optimizer
  # dirs shadow the (potentially stale) venv wheels, so this tier exercises the
  # SAME source the per-package contract tasks are landing.
  CROSS_PACKAGE_CONTRACTS:
    name: CROSS_PACKAGE_CONTRACTS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run CROSS_PACKAGE_CONTRACTS (integration_tests/)
        run: |
          python3 -m pytest integration_tests/ -q -p no:cacheprovider
        shell: bash -e {0}

  # -- Tier 7 ------------------------------------------------------------
  BACKEND_PARITY:
    name: BACKEND_PARITY
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run BACKEND_PARITY suite (tests/backend_parity)
        run: |
          python3 -m pytest tests/backend_parity -q -p no:cacheprovider
        shell: bash -e {0}

  # -- Tier 8: scale gates -------------------------------------------------
  scale:
    name: QE_CROSS_ROW_SCALE_1K_10K_100K
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run all six QE row-scale correctness tests, not FE factor-count scale
        run: |
          python3 -m pytest quant_evaluator/tests/test_scale_gates.py -q \
            -p no:cacheprovider --junitxml="$RUNNER_TEMP/qe-scale.xml"
          python3 scripts/verify_junit_execution.py "$RUNNER_TEMP/qe-scale.xml"

  SCALE_EXECUTION_STATUS:
    if: always()
    needs: [scale, FE_EXECUTE_PERSIST_SYNTHETIC, manual_100k]
    runs-on: ubuntu-latest
    steps:
      - name: Record actual execution state, not production certification
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          states = {"success": "PASS", "failure": "FAIL", "cancelled": "NOT_RUN", "skipped": "NOT_RUN"}
          needs = json.loads(os.environ["RESULTS"])
          payload = {"source_sha": os.environ["SOURCE_SHA"], "production_certification": "NOT_RUN",
                     "jobs": {k: {"status": states[v["result"]], "job_result": v["result"]} for k, v in needs.items()}}
          with open("scale-execution-status.json", "w") as stream:
              json.dump(payload, stream, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scale-execution-status-${{ github.sha }}
          path: scale-execution-status.json
          if-no-files-found: error

  FE_EXECUTE_PERSIST_SYNTHETIC:
    name: FE_EXECUTE_PERSIST_SYNTHETIC_1K
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [SUPPLY_CHAIN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash scripts/ci_smoke.sh
      - name: Actual unique factor execution, sink and exact disk oracle (not lake publication certification)
        env:
          PYTHONPATH: .
          POLARS_MAX_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: >-
          python3 benchmarks/benchmark_run_many_streaming_20260906.py
          --roots 1000 --wave-size 128 --workers 2 --assets 32 --stream-api
          --output "$RUNNER_TEMP/fe-scale-1k"
      - uses: actions/upload-artifact@v4
        with:
          name: fe-execute-persist-1k-${{ github.sha }}
          path: ${{ runner.temp }}/fe-scale-1k/*.json*
          if-no-files-found: error

  manual_100k:
    name: MANUAL_${{ matrix.component }}_100K
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_100k }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [SUPPLY_CHAIN]
    strategy:
      fail-fast: false
      matrix:
        component: [FE_EXECUTE_PERSIST_SYNTHETIC, QE_EVALUATE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
      - name: Run selected component; no QE result certifies FE
        env:
          COMPONENT: ${{ matrix.component }}
          PYTHONPATH: .
          POLARS_MAX_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          if [ "$COMPONENT" = FE_EXECUTE_PERSIST_SYNTHETIC ]; then
            python3 benchmarks/benchmark_run_many_streaming_20260906.py \
              --roots 100000 --wave-size 128 --workers 2 --assets 32 --stream-api \
              --output "$RUNNER_TEMP/fe-scale-100k"
          else
            python3 -m pytest \
              quant_evaluator/tests/test_scale_gates.py::test_100k_runs_without_error \
              quant_evaluator/tests/test_scale_gates.py::test_rank_turnover_reference_parity_at_100k \
              -q --junitxml="$RUNNER_TEMP/qe-scale.xml"
            python3 scripts/verify_junit_execution.py "$RUNNER_TEMP/qe-scale.xml"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-${{ matrix.component }}-100k-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fe-scale-100k/*.json*
            ${{ runner.temp }}/qe-scale.xml
          if-no-files-found: error

  # -- Optional A-share ----------------------------------------------------
  # ASHARE_REAL_DATA_SHADOW requires real data (repo variable); when NOT set the
  # job is skipped by the platform HONESTLY (never a fabricated pass).
  ASHARE_REAL_DATA_SHADOW:
    name: ASHARE_REAL_DATA_SHADOW
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.ASHARE_DATA_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lock deps + pytest
        run: bash scripts/ci_smoke.sh && python3 -m pip install -q pytest
        shell: bash -e {0}
      - name: Run ASHARE_REAL_DATA_SHADOW
        run: |
          set +e
          python3 -m pytest tests/integration/test_real_ashare_shadow.py -q -p no:cacheprovider 2>&1 | tee /tmp/ashare_shadow.log
          rc=${PIPESTATUS[0]}
          passed=$(grep -oE '[0-9]+ passed' /tmp/ashare_shadow.log | grep -oE '[0-9]+' | tail -1)
          passed=${passed:-0}
          if [ "$rc" -eq 0 ] && [ "$passed" -gt 0 ]; then
            echo "ASHARE_REAL_DATA_SHADOW: PASS"
            exit 0
          fi
          if [ "$rc" -eq 0 ] && [ "$passed" -eq 0 ]; then
            echo "ASHARE_REAL_DATA_SHADOW: FAIL — real A-share data expected, all tests skipped; a skip is not a pass"
            exit 1
          fi
          echo "ASHARE_REAL_DATA_SHADOW: FAIL"
          exit 1
