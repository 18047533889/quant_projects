name: Operator Health Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/operator-health-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-health-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build current operator health report
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')
          payload = json.loads((root / 'factor_engine/cleaned_operators/docs/operators_catalog.json').read_text(encoding='utf-8'))
          ops = payload['operators']
          daily = [o for o in ops if o.get('surface') == 'daily']
          def names(rows): return sorted(o['canonical'] for o in rows)

          evidence_files, evidence_names = [], set()
          for p in root.rglob('primitive_verified.json'):
              if '.git' in p.parts: continue
              try: obj = json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              evidence_files.append(str(p))
              sets = [set(v) for v in obj.values() if isinstance(v, list) and all(isinstance(x, str) for x in v)]
              if sets: evidence_names |= set.intersection(*sets)

          cats = {
              'daily_pit_false': names([o for o in daily if o.get('pit_safe') is False]),
              'daily_scope_unknown': names([o for o in daily if o.get('scope') in (None, '', 'unknown')]),
              'daily_no_polars': names([o for o in daily if 'polars' not in (o.get('backends') or [])]),
              'daily_no_sql': names([o for o in daily if 'sql' not in (o.get('backends') or [])]),
              'daily_pandas_only': names([o for o in daily if set(o.get('backends') or []) <= {'pandas_numpy'}]),
              'daily_ts_contract_incomplete': names([
                  o for o in daily
                  if (o.get('scope') in ('ts', 'unknown', None, '') or o['canonical'].startswith(('ts_', 'rolling_', 'expanding_')))
                  and (o.get('lookback') is None or o.get('min_periods') is None)
              ]),
              'daily_without_full_evidence': names([o for o in daily if evidence_names and o['canonical'] not in evidence_names]),
              'stateful_or_recursive': sorted(set(o['canonical'] for o in daily) & {
                  'ATR_WILDER','RSI_WILDER','ema','MACD','MACD_line','MACD_signal','MACD_hist',
                  'KAMA','TRIX','ADX','ADXR','vpmacd','vpmacd_signal'
              }),
          }
          report = {
              'catalog': {'canonical_count': payload.get('canonical_count'), 'surface_counts': payload.get('surface_counts'), 'daily_count': len(daily)},
              'evidence_files': evidence_files,
              'full_evidence_count': len(evidence_names),
              'categories': cats,
              'multi_output_overlap': {
                  'MACD': ['MACD','MACD_line','MACD_signal','MACD_hist'],
                  'AROON': ['AROON','AROON_up','AROON_down'],
                  'Bollinger': ['BollingerBands','BollingerUpper','BollingerLower'],
              },
          }
          Path('operator_health_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          lines = ['# Operator Health Audit', '', f"- canonical: {payload.get('canonical_count')}", f"- daily: {len(daily)}", f"- full evidence intersection: {len(evidence_names)}", '']
          for key, val in cats.items():
              lines += [f'## {key}', f'- count: {len(val)}', '- ' + ', '.join(val), '']
          for key, val in report['multi_output_overlap'].items(): lines.append(f'- overlap {key}: {", ".join(val)}')
          Path('operator_health_report.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(Path('operator_health_report.md').read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: operator-health-audit
          path: |
            operator_health_report.json
            operator_health_report.md
