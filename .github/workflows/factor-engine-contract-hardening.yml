name: FactorEngine Contract Hardening

on:
  push:
    branches: [main, agent/factorengine-consolidated-hardening-20260801]
    paths:
      - "factor_engine/**"
      - "factor_cold_start/**"
      - ".github/workflows/factor-engine-contract-hardening.yml"
  pull_request:
    paths:
      - "factor_engine/**"
      - "factor_cold_start/**"
      - ".github/workflows/factor-engine-contract-hardening.yml"

permissions:
  contents: read

concurrency:
  group: factor-engine-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-fiscal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Compile changed packages
        run: python -m compileall -q factor_engine factor_cold_start
      - name: Run contract and fiscal regressions
        run: |
          pytest -q \
            factor_engine/tests/operators/test_contract_hardening.py \
            factor_engine/tests/operators/test_cos_fiscal_primitives.py \
            factor_engine/tests/operators/test_operator_overhaul.py \
            factor_engine/tests/operators/test_layer_governance.py
      - name: Run cold-start integration regressions
        run: pytest -q factor_cold_start/tests

  full-factor-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Run complete regression suite
        run: pytest -q factor_engine/tests factor_cold_start/tests
