name: Apply AutoFactorEvaluation Platform Migration

on:
  push:
    branches:
      - agent/integrate-autofactor-evaluation
    paths:
      - ".github/workflows/apply-autofactor-platform-migration.yml"
      - ".github/scripts/apply_autofactor_platform_migration.py"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-autofactor-platform-migration.yml"
      - ".github/scripts/apply_autofactor_platform_migration.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-autofactor-platform-migration-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-autofactor-evaluation
          fetch-depth: 0

      - name: Apply migration
        run: python .github/scripts/apply_autofactor_platform_migration.py

      - name: Verify migration shape
        shell: bash
        run: |
          set -euo pipefail
          test ! -d AutoFactorEvaluation-RECONSTRUCT/factor_engine
          test -f AutoFactorEvaluation-RECONSTRUCT/integrations/quant_platform.py
          test -f AutoFactorEvaluation-RECONSTRUCT/tests/test_quant_platform_integration.py
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT

      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_autofactor_platform_migration.py
          rm -f .github/workflows/apply-autofactor-platform-migration.yml
          rm -f .github/workflows/autofactor-integration-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace vendored FactorEngine with current platform integration"
          git push origin HEAD:agent/integrate-autofactor-evaluation
