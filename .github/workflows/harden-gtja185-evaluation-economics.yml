name: Harden GTJA185 Evaluation Economics

on:
  push:
    branches:
      - agent/autofactor-gtja185-evaluation
    paths:
      - ".github/workflows/harden-gtja185-evaluation-economics.yml"
      - ".github/scripts/harden_gtja185_evaluation_economics.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-gtja185-evaluation-economics
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply evaluation hardening
        run: python .github/scripts/harden_gtja185_evaluation_economics.py
      - name: Verify code shape
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
          grep -q 'entry_lag: int = 1' AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
          grep -q 'cost_bps: float = 10.0' AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
          grep -q '_purged_split_mask' AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
          grep -q 'require_point_in_time_universe' AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
          test -f AutoFactorEvaluation-RECONSTRUCT/tests/test_gtja185_evaluation_contracts.py
      - name: Commit hardened evaluation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/harden_gtja185_evaluation_economics.py
          rm -f .github/workflows/harden-gtja185-evaluation-economics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden GTJA185 evaluation economics and PIT universe contracts"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
