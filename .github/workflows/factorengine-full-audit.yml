name: FactorEngine Full Operator Audit

on:
  pull_request:
    paths:
      - "factor_engine/**"
      - "dataaccess/**"
      - "data_access/**"
      - "gtja191/**"
      - ".github/workflows/factorengine-full-audit.yml"
  push:
    branches: [main]
    paths:
      - "factor_engine/**"
      - "dataaccess/**"
      - "data_access/**"
      - "gtja191/**"
      - ".github/workflows/factorengine-full-audit.yml"

permissions:
  contents: read

concurrency:
  group: factorengine-full-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-operator-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
      FACTOR_ENGINE_EVIDENCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FACTOR_ENGINE_MANIFEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload temporary audit source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: factorengine-audit-source
          retention-days: 1
          if-no-files-found: error
          path: |
            factor_engine
            dataaccess
            data_access
            gtja191
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - name: Resolve certified source timestamp
        shell: bash
        run: |
          echo "FACTOR_ENGINE_MANIFEST_GENERATED_AT=$(git show -s --format=%cI \"${FACTOR_ENGINE_EVIDENCE_COMMIT_SHA}\")" >> "$GITHUB_ENV"
      - name: Compile audited runtime
        run: |
          python -m compileall -q factor_engine dataaccess data_access gtja191
          python - <<'PY'
          from cleaned_operators import load_all
          from cleaned_operators.registry import OperatorRegistry
          load_all()
          assert OperatorRegistry.list_canonical()
          print("canonicals", len(OperatorRegistry.list_canonical()))
          PY
      - name: Certify primitive evidence and regenerate governance artifacts
        shell: bash
        run: |
          set -o pipefail
          python factor_engine/scripts/certify_primitive_evidence.py 2>&1 | tee primitive-certification.log
      - name: Upload certified governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factorengine-certified-governance
          if-no-files-found: error
          path: |
            factor_engine/evidence/primitive_verified.json
            factor_engine/benchmarks/operator_manifest.json
            factor_engine/cleaned_operators/docs/operators_catalog.md
            factor_engine/cleaned_operators/docs/operators_catalog.json
            factor_engine/docs/dsl_allowlist.json
            factor_engine/docs/field_manifest.json
            factor_engine/docs/operator_manifest.json
            factor_engine/docs/factor_recipe_manifest.json
            factor_engine/docs/research_tool_manifest.json
            factor_engine/docs/stateful_operator_manifest.json
            factor_engine/docs/operator_usage_report.json
            factor_engine/docs/backend_coverage.md
            factor_engine/docs/backend_evidence_manifest.json
            factor_engine/docs/sql_pushdown_coverage.md
      - name: Run complete semantic and backend regression suite
        shell: bash
        run: |
          set -o pipefail
          pytest -q --import-mode=importlib \
            factor_engine/tests/operators \
            factor_engine/tests/backend \
            factor_engine/tests/backend_parity \
            factor_engine/tests/operator_contracts \
            factor_engine/tests/test_operator_surface.py \
            factor_engine/tests/test_gtja_compat_semantics.py \
            factor_engine/tests/test_scalar_comparison_semantics.py \
            factor_engine/tests/test_data_scope_stability.py \
            factor_engine/tests/test_data_access_source_snapshot_cache.py \
            dataaccess/tests/test_package_alias.py \
            dataaccess/tests/test_cos_contract_core.py \
            dataaccess/tests/test_cos_pit_runtime.py \
            dataaccess/tests/test_cos_pit_edges.py \
            dataaccess/tests/test_cos_read_asof_guard.py \
            dataaccess/tests/test_cos_factor_runtime.py \
            dataaccess/tests/test_cos_registry_runtime.py \
            dataaccess/tests/test_cos_storage_runtime.py \
            gtja191/tests/test_full_catalog_factor_engine.py \
            gtja191/tests/test_gtja191.py \
            --junitxml=factorengine-full-audit.xml \
            2>&1 | tee factorengine-full-audit.log
      - name: Upload complete audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorengine-full-audit-diagnostics
          if-no-files-found: warn
          path: |
            primitive-certification.log
            factorengine-full-audit.xml
            factorengine-full-audit.log
