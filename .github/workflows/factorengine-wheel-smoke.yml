name: FactorEngine Wheel Smoke

on:
  push:
    paths:
      - "factor_engine/**"
      - ".github/workflows/factorengine-wheel-smoke.yml"
  pull_request:
    paths:
      - "factor_engine/**"
      - ".github/workflows/factorengine-wheel-smoke.yml"

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factor_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/factor-engine-dist
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/factor-engine-wheel-venv
          /tmp/factor-engine-wheel-venv/bin/pip install /tmp/factor-engine-dist/*.whl
      - name: Import and registry smoke
        run: |
          /tmp/factor-engine-wheel-venv/bin/python - <<'PY'
          import cleaned_operators
          from factor_recipes import FactorRecipeRegistry
          from runtime.engine import FactorEngine
          from stateful_runtime import execute_stateful_segment
          assert FactorRecipeRegistry.list_names(status="production")
          cleaned_operators.load_all()
          print("wheel imports and registry load passed")
          PY
  no-polars:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factor_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core package without optional backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Load reference registry without Polars
        run: |
          python - <<'PY'
          import importlib.util
          import cleaned_operators
          assert importlib.util.find_spec("polars") is None
          cleaned_operators.load_all()
          print("no-polars registry load passed")
          PY
