name: Regenerate Portable GTJA185 Configs

on:
  push:
    branches:
      - agent/autofactor-gtja185-evaluation
    paths:
      - ".github/workflows/regenerate-portable-gtja185-configs.yml"
      - "gtja191/lib/materialize_config.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-portable-gtja185-configs
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependency
        run: python -m pip install pyyaml
      - name: Regenerate materialize configs
        run: python gtja191/scripts/generate_materialize_configs.py
      - name: Verify portability and stability
        shell: bash
        run: |
          set -euo pipefail
          test "$(find gtja191/examples/materialize -name 'gtja191_alpha_*.yaml' | wc -l)" -eq 185
          ! grep -RInE '/home/|/Users/|[A-Za-z]:\\' gtja191/examples/materialize --include='*.yaml'
          grep -RIn 'data/factors/lake/gtja191' gtja191/examples/materialize --include='*.yaml' >/dev/null
          cp gtja191/examples/materialize/gtja191_alpha_007.yaml /tmp/alpha007.yaml
          python gtja191/scripts/generate_materialize_configs.py
          cmp /tmp/alpha007.yaml gtja191/examples/materialize/gtja191_alpha_007.yaml
      - name: Commit portable configs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/regenerate-portable-gtja185-configs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate portable GTJA185 materialization configs"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
