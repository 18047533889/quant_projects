name: FactorEngine V2 Operator Contract

on:
  pull_request:
    paths:
      - 'factor_engine/**'
      - 'factor_cold_start/**'
      - '.github/workflows/factorengine-v2-operator-contract.yml'
  push:
    branches: [main]
    paths:
      - 'factor_engine/**'
      - 'factor_cold_start/**'

jobs:
  v2-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Compile v2 modules
        run: |
          python -m compileall -q \
            factor_engine/cleaned_operators \
            factor_engine/api \
            factor_engine/backend \
            factor_engine/ir \
            factor_engine/runtime \
            factor_engine/storage/sources \
            factor_engine/factor_recipes \
            factor_cold_start
      - name: Test v2 numerical PIT evidence and history contracts
        run: |
          pytest -q \
            factor_engine/tests/operators/test_v2_operator_expansion.py \
            factor_engine/tests/operators/test_v2_macro_and_intraday_dsl.py \
            factor_engine/tests/operators/test_evidence_fail_closed_v2.py \
            factor_engine/tests/operators/test_fundamental_flow_semantics_v2.py \
            factor_engine/tests/operators/test_expectation_event_semantics_v2.py \
            factor_engine/tests/operators/test_analyzer_semantic_warmup_v2.py \
            factor_engine/tests/operators/test_recipe_production_admission_v2.py \
            factor_engine/tests/runtime/test_full_history_replay_contract_v2.py \
            factor_engine/tests/runtime/test_incremental_history_contract_v2.py \
            factor_engine/tests/runtime/test_source_window_contract_v2.py \
            factor_cold_start/tests
      - name: Audit all factor-shaped runtimes
        run: python factor_engine/scripts/audit_all_factor_production.py --runtime-only
      - name: Verify public classification and production cold-start coverage
        run: |
          python factor_cold_start/scripts/report_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          from cleaned_operators import load_all
          from cleaned_operators.registry import OperatorRegistry
          from cleaned_operators.operator_surface import (
              RESEARCH_ONLY_CANONICALS,
              unclassified_canonicals,
          )

          load_all()
          unclassified = unclassified_canonicals(OperatorRegistry.list_canonical())
          if unclassified:
              raise SystemExit(f'unclassified canonicals: {unclassified}')
          if RESEARCH_ONLY_CANONICALS:
              raise SystemExit(
                  'factor-shaped Research surface must remain empty: '
                  f'{sorted(RESEARCH_ONLY_CANONICALS)}'
              )

          report = json.loads(
              Path('factor_cold_start/reports/coverage.json').read_text()
          )
          for key, row in report['catalogs'].items():
              if row['readiness'] != 'production':
                  continue
              if row['production_operator_coverage_pct'] != 100.0:
                  raise SystemExit(
                      f"{key}: missing={row['missing_production_operators']}"
                  )
          PY
      - name: Verify governance artifacts are parseable
        run: |
          python -m json.tool factor_engine/docs/operator_refactor_v2.json >/dev/null
          python -m py_compile \
            factor_engine/cleaned_operators/fundamental/flow_semantics_v2.py \
            factor_engine/cleaned_operators/fundamental/expectation_v2.py \
            factor_engine/runtime/warmup_service.py \
            factor_engine/runtime/incremental.py \
            factor_engine/runtime/run_window.py \
            factor_engine/runtime/source_window_contract_v2.py \
            factor_engine/storage/sources/intraday_feature_runtime_v2.py