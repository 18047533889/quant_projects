name: FactorEngine Production Completion Runtime Fixes

on:
  push:
    branches:
      - agent/factorengine-production-completion-20260801
    paths:
      - .github/workflows/factorengine-production-completion-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: factorengine-production-completion-runtime-fixes
  cancel-in-progress: false

jobs:
  patch-commit-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/factorengine-production-completion-20260801
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply and persist runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candle = Path('factor_engine/cleaned_operators/price_volume/candle_pattern_engine_v2.py')
          text = candle.read_text(encoding='utf-8')
          old = '    def emit(mask,direction):return sign.mask(mask,float(direction))\n'
          new = '''    def emit(mask,direction):
        if np.isscalar(direction):
            return sign.mask(mask,float(direction))
        if isinstance(direction,pd.DataFrame):
            values=direction.reindex(index=sign.index,columns=sign.columns)
        else:
            values=pd.DataFrame(direction,index=sign.index,columns=sign.columns)
        return sign.where(~mask,values.astype(float))
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('candlestick emit anchor missing')
              text = text.replace(old, new, 1)
              candle.write_text(text, encoding='utf-8')

          audit = Path('factor_engine/scripts/audit_all_factor_production.py')
          text = audit.read_text(encoding='utf-8')
          text = text.replace('    "short_periods": 1,\n', '    "short_periods": 3,\n', 1)
          anchor = '    ("winsorize", "upper"): 0.95,\n'
          additions = '    ("ts_regression_slope", "retval"): "slope",\n    ("yoy_by_period", "denominator"): "signed",\n'
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('audit special-scalar anchor missing')
              text = text.replace(anchor, anchor + additions, 1)
          audit.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q factor_engine factor_cold_start
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factor_engine/cleaned_operators/price_volume/candle_pattern_engine_v2.py factor_engine/scripts/audit_all_factor_production.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix candlestick vector output and production audit parameters"
            git push origin HEAD:agent/factorengine-production-completion-20260801
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest

      - name: Verify runtime audit
        run: |
          pytest -q factor_engine/tests/operators/test_technical_extensions.py factor_engine/tests/operators/test_candle_patterns_extended.py
          python factor_engine/scripts/audit_all_factor_production.py --runtime-only
