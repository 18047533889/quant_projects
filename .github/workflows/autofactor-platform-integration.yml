name: AutoFactorEvaluation Platform Integration

on:
  push:
    branches:
      - main
      - agent/integrate-autofactor-evaluation
    paths:
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "factor_engine/**"
      - "data_access/**"
      - ".github/workflows/autofactor-platform-integration.yml"
  pull_request:
    paths:
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "factor_engine/**"
      - "data_access/**"
      - ".github/workflows/autofactor-platform-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest numpy pandas scipy statsmodels pyarrow polars duckdb pyyaml pydantic requests
      - name: Static integration contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -d AutoFactorEvaluation-RECONSTRUCT/factor_engine
          ! grep -RInE 'AutoFactorEvaluation-RECONSTRUCT/factor_engine|parents\[[0-9]+\].*factor_engine|_FACTOR_ENGINE_ROOT.*AutoFactorEvaluation' AutoFactorEvaluation-RECONSTRUCT --include='*.py'
          ! grep -RInE 'from factor_engine\.|import factor_engine\.' AutoFactorEvaluation-RECONSTRUCT --include='*.py'
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT
      - name: Platform bridge tests
        run: |
          pytest -q AutoFactorEvaluation-RECONSTRUCT/tests/test_quant_platform_integration.py
      - name: Gateway and assetization import smoke
        run: |
          python - <<'PY'
          from initialization.operator_loader import load_operators
          from gateway.scripts.gateway_core import _step2_build_yaml, _step4_tiny_run
          from assetization.scripts.compute import FormulaEvaluator
          count = load_operators()
          assert count > 0
          manifest = {
              "schema_version": "disk.v1",
              "candidate_id": "ci_factor",
              "formula": "ts_mean(close, 3)",
              "market": "ashare",
              "frequency_bucket": "1d",
          }
          assert _step2_build_yaml(manifest).status == "PASS"
          tiny = _step4_tiny_run(manifest)
          assert tiny.status == "PASS", tiny
          assert tiny.detail.get("compile_only") is True
          assert FormulaEvaluator
          PY
      - name: Root platform regression tests
        run: |
          pytest -q \
            data_access/tests/unit/test_params_validation_strict.py \
            data_access/tests/unit/test_key_policy_deterministic.py \
            data_access/tests/unit/test_scan_handle_guard.py \
            factor_engine/tests/test_data_scope_stability.py \
            factor_engine/tests/test_gtja_compat_semantics.py
