name: AutoFactorEvaluation Platform Integration

on:
  push:
    branches:
      - main
      - agent/integrate-autofactor-evaluation
    paths:
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "factor_engine/**"
      - "dataaccess/**"
      - ".github/workflows/autofactor-platform-integration.yml"
  pull_request:
    paths:
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "factor_engine/**"
      - "dataaccess/**"
      - ".github/workflows/autofactor-platform-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
      AUTOFAC_PLATFORM_MODE: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest numpy pandas scipy statsmodels pyarrow polars duckdb pyyaml pydantic requests
      - name: Static standalone distribution contract
        shell: bash
        run: |
          set -euo pipefail
          test -d AutoFactorEvaluation-RECONSTRUCT/factor_engine
          test -d AutoFactorEvaluation-RECONSTRUCT/data_access
          test -f AutoFactorEvaluation-RECONSTRUCT/embedded_platform_manifest.json
          test -f AutoFactorEvaluation-RECONSTRUCT/factor_engine/cleaned_operators/semantic_hardening.py
          test -f AutoFactorEvaluation-RECONSTRUCT/data_access/config/datasets.yaml
          python AutoFactorEvaluation-RECONSTRUCT/scripts/sync_embedded_platform.py --check
          ! grep -RInE \
            'parents\[[0-9]+\].*factor_engine|_FACTOR_ENGINE_ROOT.*AutoFactorEvaluation|sys\.path.*parents' \
            AutoFactorEvaluation-RECONSTRUCT \
            --include='*.py' \
            --exclude-dir=factor_engine \
            --exclude-dir=data_access
          ! grep -RInE \
            '^(from|import)[[:space:]]+(api|backend|runtime|storage|cleaned_operators|data_access)(\.|[[:space:]])' \
            AutoFactorEvaluation-RECONSTRUCT \
            --include='*.py' \
            --exclude='quant_platform.py' \
            --exclude='platform_bootstrap.py' \
            --exclude-dir=factor_engine \
            --exclude-dir=data_access
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT
      - name: Standalone doctor and platform bridge tests
        run: |
          python AutoFactorEvaluation-RECONSTRUCT/standalone.py doctor
          pytest -q \
            AutoFactorEvaluation-RECONSTRUCT/tests/test_standalone_distribution.py \
            AutoFactorEvaluation-RECONSTRUCT/tests/test_quant_platform_integration.py
      - name: Gateway and assetization import smoke
        run: |
          python - <<'PY'
          from initialization.operator_loader import load_operators
          from gateway.scripts.gateway_core import _step2_build_yaml, _step4_tiny_run
          from assetization.scripts.compute import FormulaEvaluator
          count = load_operators()
          assert count > 0
          manifest = {
              "schema_version": "disk.v1",
              "candidate_id": "ci_factor",
              "formula": "ts_mean(close, 3)",
              "market": "ashare",
              "frequency_bucket": "1d",
          }
          assert _step2_build_yaml(manifest).status == "PASS"
          tiny = _step4_tiny_run(manifest)
          assert tiny.status == "PASS", tiny
          assert tiny.detail.get("compile_only") is True
          assert FormulaEvaluator
          PY
      - name: Root platform regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine
          AUTOFAC_PLATFORM_MODE: external
          AUTOFAC_PLATFORM_ROOT: ${{ github.workspace }}
        run: |
          pytest -q \
            dataaccess/tests/unit/test_params_validation_strict.py \
            dataaccess/tests/unit/test_key_policy_deterministic.py \
            dataaccess/tests/unit/test_scan_handle_guard.py \
            factor_engine/tests/test_data_scope_stability.py \
            factor_engine/tests/test_gtja_compat_semantics.py
