name: Operator Surface Gate

on:
  push:
    branches: [main, agent/operator-surface-cleanup, agent/factor-engine-cos-contracts]
    paths:
      - "factor_engine/**"
      - "dataaccess/**"
      - "gtja191/**"
      - "week2_pv_factors/**"
      - ".github/workflows/operator-surface-gate.yml"
  pull_request:
    paths:
      - "factor_engine/**"
      - "dataaccess/**"
      - "gtja191/**"
      - "week2_pv_factors/**"
      - ".github/workflows/operator-surface-gate.yml"

permissions:
  contents: read

concurrency:
  group: operator-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-dsl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Validate deterministic runtime governance artifacts
        run: |
          python factor_engine/scripts/sync_primitive_evidence.py --check
          python factor_engine/scripts/certify_primitive_evidence.py --check
          python factor_engine/scripts/certify_recipe_evidence.py --check
          python factor_engine/scripts/generate_backend_evidence_manifest.py --check
          generate_all() {
            python factor_engine/scripts/generate_operators_catalog.py
            python factor_engine/scripts/export_dsl_allowlist.py
            python factor_engine/scripts/generate_layer_manifests.py
            python factor_engine/scripts/generate_operator_usage_report.py
            python factor_engine/scripts/sync_backend_docs.py
            python factor_engine/scripts/generate_backend_evidence_manifest.py
          }
          generated_files=(
            factor_engine/cleaned_operators/docs/operators_catalog.md
            factor_engine/cleaned_operators/docs/operators_catalog.json
            factor_engine/docs/dsl_allowlist.json
            factor_engine/docs/field_manifest.json
            factor_engine/docs/operator_manifest.json
            factor_engine/docs/factor_recipe_manifest.json
            factor_engine/docs/research_tool_manifest.json
            factor_engine/docs/stateful_operator_manifest.json
            factor_engine/docs/operator_usage_report.json
            factor_engine/docs/backend_coverage.md
            factor_engine/docs/backend_evidence_manifest.json
            factor_engine/docs/sql_pushdown_coverage.md
          )
          generate_all
          git diff --exit-code -- "${generated_files[@]}"
          sha256sum "${generated_files[@]}" > /tmp/generated-1.sha
          generate_all
          sha256sum "${generated_files[@]}" > /tmp/generated-2.sha
          diff -u /tmp/generated-1.sha /tmp/generated-2.sha
          pytest -q factor_engine/tests/test_operator_surface.py
          python factor_engine/scripts/validate_public_factor_formulas.py
      - name: COS contract and unit regressions
        run: pytest -q dataaccess/tests/test_cos_contract_core.py
      - name: COS filing PIT regressions
        run: |
          pytest -q \
            dataaccess/tests/test_cos_pit_runtime.py \
            dataaccess/tests/test_cos_pit_edges.py \
            dataaccess/tests/test_cos_read_asof_guard.py
      - name: COS factor and storage regressions
        run: |
          pytest -q \
            dataaccess/tests/test_cos_factor_runtime.py \
            dataaccess/tests/test_cos_registry_runtime.py \
            dataaccess/tests/test_cos_storage_runtime.py
      - name: Fiscal and backend semantic regression
        run: pytest -q factor_engine/tests/operators/test_cos_fiscal_primitives.py
      - name: Stateful segmented runtime regression
        run: pytest -q factor_engine/tests/operators/test_stateful_segment_runtime.py
      - name: Operator overhaul compatibility regression
        run: pytest -q factor_engine/tests/operators/test_operator_overhaul.py
      - name: GTJA185 factor pack regression
        run: |
          pytest -q \
            gtja191/tests/test_full_catalog_factor_engine.py \
            gtja191/tests/test_gtja191.py
      - name: FactorEngine runtime governance regression
        run: |
          pytest -q \
            factor_engine/tests/operators/test_layer_governance.py \
            factor_engine/tests/operators/test_composite_fastpath.py \
            factor_engine/tests/operators/test_recipe_runtime.py \
            factor_engine/tests/operators/test_stateful_checkpoint_contract.py \
            factor_engine/tests/operators/test_production_convergence.py \
            factor_engine/tests/operators/test_operator_usage.py \
            factor_engine/tests/test_gtja_compat_semantics.py \
            factor_engine/tests/test_data_scope_stability.py
