name: Operator Surface Gate

on:
  push:
    branches: [main, agent/operator-surface-cleanup, agent/factor-engine-cos-contracts, agent/factor-engine-final-audit]
    paths:
      - "factor_engine/**"
      - "data_access/**"
      - "gtja191/**"
      - "week2_pv_factors/**"
      - ".github/workflows/operator-surface-gate.yml"
  pull_request:
    paths:
      - "factor_engine/**"
      - "data_access/**"
      - "gtja191/**"
      - "week2_pv_factors/**"
      - ".github/workflows/operator-surface-gate.yml"

permissions:
  contents: read

concurrency:
  group: operator-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-dsl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - name: Generate operator catalog
        id: catalog
        continue-on-error: true
        run: python factor_engine/scripts/generate_operators_catalog.py > /tmp/catalog.log 2>&1
      - name: Upload catalog traceback
        if: steps.catalog.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: factor-engine-catalog-traceback
          path: /tmp/catalog.log
      - name: Stop after catalog failure
        if: steps.catalog.outcome == 'failure'
        run: exit 1
      - name: Generate public DSL allowlist
        run: python factor_engine/scripts/export_dsl_allowlist.py
      - name: Generate executable layer manifests
        run: python factor_engine/scripts/generate_layer_manifests.py
      - name: Generate usage report
        run: python factor_engine/scripts/generate_operator_usage_report.py
      - name: Synchronize exact-active evidence cases
        run: python factor_engine/scripts/sync_primitive_evidence.py
      - name: Generate active backend capabilities
        run: python factor_engine/scripts/sync_backend_docs.py
      - name: Verify deterministic artifacts and public surface
        run: |
          generated_files=(
            factor_engine/cleaned_operators/docs/operators_catalog.md
            factor_engine/cleaned_operators/docs/operators_catalog.json
            factor_engine/docs/dsl_allowlist.json
            factor_engine/docs/field_manifest.json
            factor_engine/docs/operator_manifest.json
            factor_engine/docs/factor_recipe_manifest.json
            factor_engine/docs/research_tool_manifest.json
            factor_engine/docs/stateful_operator_manifest.json
            factor_engine/docs/operator_usage_report.json
            factor_engine/docs/backend_capabilities.json
            factor_engine/docs/backend_coverage.md
            factor_engine/docs/sql_pushdown_coverage.md
            factor_engine/evidence/primitive_case_registry.json
          )
          sha256sum "${generated_files[@]}" > /tmp/generated-1.sha
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_primitive_evidence.py
          python factor_engine/scripts/sync_backend_docs.py
          sha256sum "${generated_files[@]}" > /tmp/generated-2.sha
          diff -u /tmp/generated-1.sha /tmp/generated-2.sha
          pytest -q factor_engine/tests/test_operator_surface.py
          python factor_engine/scripts/validate_public_factor_formulas.py
      - name: Final registry and backend audit
        run: pytest -q factor_engine/tests/operators/test_final_registry_audit.py
      - name: Native Polars and rolling OLS fusion
        run: pytest -q factor_engine/tests/operators/test_final_native_and_fusion.py
      - name: COS time-model rejection contract
        run: pytest -q data_access/tests/test_cos_contract.py::test_panel_contracts_fail_closed
      - name: COS market return-unit contract
        run: pytest -q data_access/tests/test_cos_contract.py::test_return_units_are_market_specific
      - name: COS panel filter and normalization contract
        run: pytest -q data_access/tests/test_cos_contract.py::test_runtime_enforces_filter_and_normalizes_return
      - name: COS filing PIT as-of contract
        run: pytest -q data_access/tests/test_cos_contract.py::test_event_asof_uses_publication_time_and_staleness
      - name: COS factor panel runtime regression
        run: pytest -q data_access/tests/test_cos_factor_runtime.py
      - name: Fiscal and backend semantic regression
        run: pytest -q factor_engine/tests/operators/test_cos_fiscal_primitives.py
      - name: Stateful segmented runtime regression
        run: pytest -q factor_engine/tests/operators/test_stateful_segment_runtime.py
      - name: Operator overhaul compatibility regression
        run: pytest -q factor_engine/tests/operators/test_operator_overhaul.py
      - name: GTJA185 factor pack regression
        run: |
          pytest -q \
            gtja191/tests/test_full_catalog_factor_engine.py \
            gtja191/tests/test_gtja191.py
      - name: FactorEngine runtime governance regression
        run: |
          pytest -q \
            factor_engine/tests/operators/test_layer_governance.py \
            factor_engine/tests/operators/test_composite_fastpath.py \
            factor_engine/tests/operators/test_recipe_runtime.py \
            factor_engine/tests/operators/test_recipe_planner_bridge.py \
            factor_engine/tests/operators/test_stateful_checkpoint_contract.py \
            factor_engine/tests/operators/test_operator_usage.py \
            factor_engine/tests/test_gtja_compat_semantics.py \
            factor_engine/tests/test_data_scope_stability.py
