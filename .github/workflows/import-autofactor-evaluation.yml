name: Import AutoFactorEvaluation RECONSTRUCT

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/import-autofactor-evaluation.yml"

permissions:
  contents: write

concurrency:
  group: import-autofactor-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Clone upstream RECONSTRUCT branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/AutoFactorEvaluation
          git clone --depth 1 --branch RECONSTRUCT \
            https://github.com/HKUST-QUANT-SOCIETY/AutoFactorEvaluation.git \
            /tmp/AutoFactorEvaluation
          git -C /tmp/AutoFactorEvaluation submodule update --init --recursive --depth 1 || true
          if command -v git-lfs >/dev/null 2>&1; then
            git -C /tmp/AutoFactorEvaluation lfs install --local
            git -C /tmp/AutoFactorEvaluation lfs pull
          fi
          echo "UPSTREAM_SHA=$(git -C /tmp/AutoFactorEvaluation rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate and vendor upstream tree
        shell: bash
        run: |
          set -euo pipefail
          target="AutoFactorEvaluation"
          rm -rf "$target"

          large_files=$(find /tmp/AutoFactorEvaluation -type f -size +95M -print)
          if [ -n "$large_files" ]; then
            echo "Refusing to import files larger than 95 MiB:" >&2
            echo "$large_files" >&2
            exit 1
          fi

          suspicious=$(find /tmp/AutoFactorEvaluation -type f \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) \
            -not -name '*.example' -not -name '*.sample' -print)
          if [ -n "$suspicious" ]; then
            echo "Refusing to import possible credential files:" >&2
            echo "$suspicious" >&2
            exit 1
          fi

          mkdir -p "$target"
          rsync -a --exclude='.git' /tmp/AutoFactorEvaluation/ "$target"/
          find "$target" -name '.git' -prune -exec rm -rf {} +

          cat > "$target/UPSTREAM.md" <<EOF
          # Upstream provenance

          This directory vendors the upstream project below without rewriting its source files.

          - Repository: https://github.com/HKUST-QUANT-SOCIETY/AutoFactorEvaluation
          - Branch: \`RECONSTRUCT\`
          - Commit: \`${UPSTREAM_SHA}\`
          - Imported by: \`quant_projects\` GitHub Actions
          - Imported at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          The upstream license and notices, when present, are retained inside this directory.
          Local integration changes should be tracked separately from upstream synchronization.
          EOF

      - name: Commit import to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AutoFactorEvaluation
          git rm .github/workflows/import-autofactor-evaluation.yml
          git commit -m "Vendor AutoFactorEvaluation RECONSTRUCT"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
