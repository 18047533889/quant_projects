name: Import AutoFactorEvaluation RECONSTRUCT

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/import-autofactor-evaluation.yml"

permissions:
  contents: write

concurrency:
  group: import-autofactor-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download upstream RECONSTRUCT archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autofactor-src /tmp/autofactor.zip /tmp/import-debug.log
          mkdir -p /tmp/autofactor-src
          {
            echo "Downloading public source archive..."
            curl --fail --location --retry 3 --retry-delay 2 \
              --output /tmp/autofactor.zip \
              https://codeload.github.com/HKUST-QUANT-SOCIETY/AutoFactorEvaluation/zip/refs/heads/RECONSTRUCT
            unzip -q /tmp/autofactor.zip -d /tmp/autofactor-src
            source_dir=$(find /tmp/autofactor-src -mindepth 1 -maxdepth 1 -type d | head -n 1)
            test -n "$source_dir"
            echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

            upstream_sha=$(curl --fail --silent --show-error --location \
              https://api.github.com/repos/HKUST-QUANT-SOCIETY/AutoFactorEvaluation/commits/RECONSTRUCT \
              | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
            test -n "$upstream_sha"
            echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"
          } 2>&1 | tee /tmp/import-debug.log

      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofactor-import-diagnostics
          path: /tmp/import-debug.log
          if-no-files-found: ignore

      - name: Validate and vendor upstream tree
        shell: bash
        run: |
          set -euo pipefail
          target="AutoFactorEvaluation"
          rm -rf "$target"

          large_files=$(find "$SOURCE_DIR" -type f -size +95M -print)
          if [ -n "$large_files" ]; then
            echo "Refusing to import files larger than 95 MiB:" >&2
            echo "$large_files" >&2
            exit 1
          fi

          suspicious=$(find "$SOURCE_DIR" -type f \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) \
            -not -name '*.example' -not -name '*.sample' -print)
          if [ -n "$suspicious" ]; then
            echo "Refusing to import possible credential files:" >&2
            echo "$suspicious" >&2
            exit 1
          fi

          mkdir -p "$target"
          rsync -a --exclude='.git' "$SOURCE_DIR"/ "$target"/
          find "$target" -name '.git' -prune -exec rm -rf {} +

          cat > "$target/UPSTREAM.md" <<EOF
          # Upstream provenance

          This directory vendors the upstream project below without rewriting its source files.

          - Repository: https://github.com/HKUST-QUANT-SOCIETY/AutoFactorEvaluation
          - Branch: \`RECONSTRUCT\`
          - Commit: \`${UPSTREAM_SHA}\`
          - Imported by: \`quant_projects\` GitHub Actions
          - Imported at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          The upstream license and notices, when present, are retained inside this directory.
          Local integration changes should be tracked separately from upstream synchronization.
          EOF

      - name: Commit import to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AutoFactorEvaluation
          git rm .github/workflows/import-autofactor-evaluation.yml
          git commit -m "Vendor AutoFactorEvaluation RECONSTRUCT"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
