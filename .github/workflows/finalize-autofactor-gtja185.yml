name: Finalize AutoFactor GTJA185

on:
  push:
    branches:
      - agent/autofactor-gtja185-evaluation
    paths:
      - ".github/workflows/finalize-autofactor-gtja185.yml"
      - ".github/scripts/add_gtja185_validation_selection_fdr.py"
      - ".github/scripts/parameterize_gtja185_universe_dataset.py"
      - ".github/scripts/vectorize_gtja185_evaluation_metrics.py"
      - ".github/scripts/add_gtja185_hac_performance.py"
      - ".github/scripts/make_gtja185_resume_skip_compute.py"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-autofactor-gtja185.yml"
      - ".github/scripts/add_gtja185_validation_selection_fdr.py"
      - ".github/scripts/parameterize_gtja185_universe_dataset.py"
      - ".github/scripts/vectorize_gtja185_evaluation_metrics.py"
      - ".github/scripts/add_gtja185_hac_performance.py"
      - ".github/scripts/make_gtja185_resume_skip_compute.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-autofactor-gtja185
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply all outstanding migrations idempotently
        shell: bash
        run: |
          set -euo pipefail
          evaluator='AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py'
          datasets='data_access/config/datasets.yaml'

          if ! grep -q 'fdr_alpha: float = 0.10' "$evaluator"; then
            python .github/scripts/add_gtja185_validation_selection_fdr.py
          fi
          if ! grep -A4 '^ashare_universe_daily:' "$datasets" | grep -q 'kind: parametric'; then
            python .github/scripts/parameterize_gtja185_universe_dataset.py
          fi
          if ! grep -q 'def _matrix_row_correlation' "$evaluator"; then
            python .github/scripts/vectorize_gtja185_evaluation_metrics.py
          fi
          if ! grep -q '"hac_sharpe"' "$evaluator"; then
            python .github/scripts/add_gtja185_hac_performance.py
          fi
          if ! grep -q 'resumed_records:' "$evaluator"; then
            python .github/scripts/make_gtja185_resume_skip_compute.py
          fi

      - name: Verify final source contracts
        shell: bash
        run: |
          set -euo pipefail
          evaluator='AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py'
          tests='AutoFactorEvaluation-RECONSTRUCT/tests/test_gtja185_evaluation_contracts.py'
          python -m compileall -q \
            AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py \
            AutoFactorEvaluation-RECONSTRUCT/pipeline.py
          grep -q 'fdr_alpha: float = 0.10' "$evaluator"
          grep -q 'benjamini_hochberg' "$evaluator"
          grep -q 'def _matrix_row_correlation' "$evaluator"
          grep -q 'Vectorized daily cross-sectional MAD' "$evaluator"
          grep -q '"hac_sharpe"' "$evaluator"
          grep -q 'resumed_records:' "$evaluator"
          grep -A4 '^ashare_universe_daily:' data_access/config/datasets.yaml | grep -q 'kind: parametric'
          grep -q -- '--gtja-fdr-alpha' AutoFactorEvaluation-RECONSTRUCT/pipeline.py
          grep -q 'test_benjamini_hochberg_controls_185_factor_family' "$tests"
          grep -q 'test_hac_sharpe_penalizes_positive_overlap_autocorrelation' "$tests"
          grep -q 'test_resume_skips_factor_compile_and_execute' "$tests"

      - name: Remove one-time migration machinery
        shell: bash
        run: |
          rm -f \
            .github/scripts/add_gtja185_validation_selection_fdr.py \
            .github/scripts/parameterize_gtja185_universe_dataset.py \
            .github/scripts/vectorize_gtja185_evaluation_metrics.py \
            .github/scripts/add_gtja185_hac_performance.py \
            .github/scripts/make_gtja185_resume_skip_compute.py \
            .github/workflows/add-gtja185-validation-selection-fdr.yml \
            .github/workflows/finalize-autofactor-gtja185.yml

      - name: Commit finalized GTJA185 pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No outstanding migration changes'
            exit 0
          fi
          git commit -m "Finalize GTJA185 evaluation selection, performance, and scaling"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
