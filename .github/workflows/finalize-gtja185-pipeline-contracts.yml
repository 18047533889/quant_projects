name: Finalize GTJA185 Pipeline Contracts

on:
  push:
    branches:
      - agent/autofactor-gtja185-evaluation
    paths:
      - ".github/workflows/finalize-gtja185-pipeline-contracts.yml"
      - ".github/scripts/finalize_gtja185_pipeline_contracts.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-gtja185-pipeline-contracts
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Finalize contracts
        run: python .github/scripts/finalize_gtja185_pipeline_contracts.py
      - name: Verify final shape
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py AutoFactorEvaluation-RECONSTRUCT/pipeline.py
          grep -q -- '--gtja-cost-bps' AutoFactorEvaluation-RECONSTRUCT/pipeline.py
          grep -q 'ashare_universe_daily:' data_access/config/datasets.yaml
          ! grep -q 'def _subset_by_split' AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
          ! grep -q 'def _split_mask' AutoFactorEvaluation-RECONSTRUCT/evaluation/gtja185_batch.py
      - name: Commit final contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finalize_gtja185_pipeline_contracts.py
          rm -f .github/workflows/finalize-gtja185-pipeline-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize GTJA185 CLI and point-in-time universe contracts"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
