name: FactorEngine Root-Cause Hotfix

on:
  push:
    branches:
      - agent/factorengine-production-completion-20260801
    paths:
      - .github/workflows/factorengine-rootcause-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-completion-20260801
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply audited root-cause fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fiscal = Path('factor_engine/cleaned_operators/fiscal_strict.py')
          text = fiscal.read_text(encoding='utf-8')
          old = '''    def _pl_period_ordinal_expr(column: str):
              text = pl.col(column).cast(pl.Utf8, strict=False).str.strip_chars().str.to_uppercase()
              year = text.str.extract(r"(\\d{4})", 1).cast(pl.Int64, strict=False)
              quarter = text.str.extract(r"(?:Q|[^0-9]?)([1-4])$", 1).cast(pl.Int64, strict=False)
              numeric = pl.col(column).cast(pl.Float64, strict=False)
              parsed_date = text.str.to_date(strict=False)
              date_ordinal = parsed_date.dt.year() * 4 + ((parsed_date.dt.month() - 1) // 3)
              return (
                  pl.when(year.is_not_null() & quarter.is_not_null())
                  .then(year * 4 + quarter - 1)
                  .when(parsed_date.is_not_null())
                  .then(date_ordinal)
                  .otherwise(numeric)
                  .cast(pl.Float64)
              )
          '''
          new = '''    def _pl_period_ordinal_expr(column: str):
              raw = pl.col(column)
              text = raw.cast(pl.Utf8, strict=False).str.strip_chars().str.to_uppercase()

              # Mixed fiscal identifiers, ISO dates, compact dates and numeric
              # ordinals are valid in one panel. Polars automatic date inference
              # can still raise for the whole expression with strict=False, so
              # extract only the year/month components needed for the ordinal.
              fiscal_match = text.str.contains(r"^\\d{4}\\D*Q?[1-4]$")
              fiscal_year = text.str.extract(r"^(\\d{4})", 1).cast(pl.Int64, strict=False)
              fiscal_quarter = text.str.extract(r"([1-4])$", 1).cast(pl.Int64, strict=False)

              date_pattern = r"^(\\d{4})[-/](\\d{1,2})[-/]\\d{1,2}"
              delimited_year = text.str.extract(date_pattern, 1).cast(pl.Int64, strict=False)
              delimited_month = text.str.extract(date_pattern, 2).cast(pl.Int64, strict=False)
              compact_pattern = r"^(\\d{4})(\\d{2})(\\d{2})(?:T.*)?$"
              compact_year = text.str.extract(compact_pattern, 1).cast(pl.Int64, strict=False)
              compact_month = text.str.extract(compact_pattern, 2).cast(pl.Int64, strict=False)
              date_year = pl.coalesce([delimited_year, compact_year])
              date_month = pl.coalesce([delimited_month, compact_month])
              valid_date = date_year.is_not_null() & date_month.is_between(1, 12, closed="both")
              date_ordinal = date_year * 4 + ((date_month - 1) // 3)

              numeric = raw.cast(pl.Float64, strict=False)
              return (
                  pl.when(fiscal_match & fiscal_year.is_not_null() & fiscal_quarter.is_not_null())
                  .then(fiscal_year * 4 + fiscal_quarter - 1)
                  .when(valid_date)
                  .then(date_ordinal)
                  .otherwise(numeric)
                  .cast(pl.Float64)
              )
          '''
          if old not in text:
              raise SystemExit('fiscal parser source block changed; refusing blind patch')
          fiscal.write_text(text.replace(old, new), encoding='utf-8')

          repairs = Path('factor_engine/cleaned_operators/production_repairs.py')
          text = repairs.read_text(encoding='utf-8')
          import_line = 'from cleaned_operators.base import OperatorMetadata, SeriesOperator, register_operator\n'
          if 'from cleaned_operators.overhaul.regression import _rolling_regression\n' not in text:
              text = text.replace(
                  import_line,
                  import_line + 'from cleaned_operators.overhaul.regression import _rolling_regression\n',
              )
          old = '''    def _calculate_series(
              self,
              x: pd.DataFrame,
              y: pd.DataFrame,
              window: int,
              add_intercept: bool = True,
          ) -> pd.DataFrame:
              lookback = int(window)
              if lookback <= 0:
                  raise ValueError("ts_regression_slope window must be positive")
              if not isinstance(add_intercept, (bool, np.bool_)):
                  raise TypeError("ts_regression_slope add_intercept must be boolean")
              x_frame, y_frame = _aligned_float_frames(x, y)
              xv = x_frame.to_numpy(dtype=float)
              yv = y_frame.to_numpy(dtype=float)
              result = np.full(xv.shape, np.nan, dtype=float)
              rows, cols = xv.shape

              for col in range(cols):
                  for end in range(lookback - 1, rows):
                      start = end - lookback + 1
                      xs = xv[start:end + 1, col]
                      ys = yv[start:end + 1, col]
                      valid = np.isfinite(xs) & np.isfinite(ys)
                      if valid.sum() < 3:
                          continue
                      xs = xs[valid]
                      ys = ys[valid]
                      if bool(add_intercept):
                          centered = xs - xs.mean()
                          denom = float(np.dot(centered, centered))
                          if denom <= 0:
                              continue
                          slope = float(np.dot(centered, ys - ys.mean()) / denom)
                      else:
                          denom = float(np.dot(xs, xs))
                          if denom <= 0:
                              continue
                          slope = float(np.dot(xs, ys) / denom)
                      result[end, col] = slope
              return pd.DataFrame(result, index=x_frame.index, columns=x_frame.columns)
          '''
          new = '''    def _calculate_series(
              self,
              y: pd.DataFrame,
              x: pd.DataFrame,
              window: int,
              *positional_contract,
              min_periods: int | None = None,
              add_intercept: bool = True,
              lag: int | None = None,
              retval: str | None = None,
              **_,
          ) -> pd.DataFrame:
              """Execute both canonical and retained GTJA call contracts."""
              if len(positional_contract) > 2:
                  raise TypeError("ts_regression accepts at most two optional positional arguments")

              if len(positional_contract) == 2 and isinstance(positional_contract[1], str):
                  lag = positional_contract[0]
                  retval = positional_contract[1]
              else:
                  if positional_contract:
                      min_periods = positional_contract[0]
                  if len(positional_contract) == 2:
                      add_intercept = positional_contract[1]

              lookback = int(window)
              if lookback <= 0:
                  raise ValueError("ts_regression_slope window must be positive")
              if not isinstance(add_intercept, (bool, np.bool_)):
                  raise TypeError("ts_regression_slope add_intercept must be boolean")

              lag_i = 0 if lag is None else int(lag)
              if lag_i < 0:
                  return pd.DataFrame(np.nan, index=y.index, columns=y.columns, dtype=float)
              if lag_i:
                  x = x.shift(lag_i)

              requested = str(retval or "slope").lower()
              output = {
                  "slope": "slope",
                  "beta": "slope",
                  "intercept": "intercept",
                  "residual": "resid",
                  "resid": "resid",
                  "r_squared": "r2",
                  "r2": "r2",
                  "tstat": "tstat",
                  "t_stat": "tstat",
              }.get(requested)
              if output is None:
                  raise ValueError(f"unsupported regression retval: {retval!r}")

              y_frame, x_frame = _aligned_float_frames(y, x)
              return _rolling_regression(
                  y_frame,
                  x_frame,
                  lookback,
                  min_periods,
                  bool(add_intercept),
                  output,
              )
          '''
          if old not in text:
              raise SystemExit('regression repair source block changed; refusing blind patch')
          repairs.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile \
            factor_engine/cleaned_operators/fiscal_strict.py \
            factor_engine/cleaned_operators/production_repairs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factor_engine/cleaned_operators/fiscal_strict.py factor_engine/cleaned_operators/production_repairs.py
          git commit -m 'Fix fiscal Polars parsing and regression compatibility'
          git push origin HEAD:agent/factorengine-production-completion-20260801
