name: FactorEngine Artifact Commit

on:
  pull_request:
    paths:
      - "factor_engine/**"
      - ".github/workflows/factor-engine-artifact-commit.yml"

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factor-engine-final-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - run: |
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_primitive_evidence.py
          python factor_engine/scripts/sync_backend_docs.py
      - run: |
          git config user.name "factor-engine-governance-bot"
          git config user.email "factor-engine-governance-bot@users.noreply.github.com"
          git add \
            factor_engine/cleaned_operators/docs/operators_catalog.md \
            factor_engine/cleaned_operators/docs/operators_catalog.json \
            factor_engine/docs/dsl_allowlist.json \
            factor_engine/docs/field_manifest.json \
            factor_engine/docs/operator_manifest.json \
            factor_engine/docs/factor_recipe_manifest.json \
            factor_engine/docs/research_tool_manifest.json \
            factor_engine/docs/stateful_operator_manifest.json \
            factor_engine/docs/operator_usage_report.json \
            factor_engine/docs/backend_capabilities.json \
            factor_engine/docs/backend_coverage.md \
            factor_engine/docs/sql_pushdown_coverage.md \
            factor_engine/evidence/primitive_case_registry.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current"
          else
            git commit -m "Regenerate FactorEngine governance artifacts"
            git push origin HEAD:agent/factor-engine-final-audit
          fi
