name: Temporary FactorEngine Governance Regeneration

on:
  push:
    branches:
      - agent/factorengine-production-routing-lqtp-20260731
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-routing-lqtp-20260731
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Run diagnostics, recertify, regenerate and persist result
        shell: bash
        run: |
          set +e
          : > .factorengine_tmp_regen.log

          echo "== focused tests ==" >> .factorengine_tmp_regen.log
          pytest -q factor_engine/tests/test_lqtp_production_runtime.py >> .factorengine_tmp_regen.log 2>&1
          focused_rc=$?
          echo "focused_rc=$focused_rc" >> .factorengine_tmp_regen.log

          echo "== sync primitive evidence ==" >> .factorengine_tmp_regen.log
          python factor_engine/scripts/sync_primitive_evidence.py >> .factorengine_tmp_regen.log 2>&1
          sync_rc=$?
          echo "sync_rc=$sync_rc" >> .factorengine_tmp_regen.log

          echo "== certify primitive evidence ==" >> .factorengine_tmp_regen.log
          python factor_engine/scripts/certify_primitive_evidence.py >> .factorengine_tmp_regen.log 2>&1
          primitive_rc=$?
          echo "primitive_rc=$primitive_rc" >> .factorengine_tmp_regen.log

          echo "== certify recipe evidence ==" >> .factorengine_tmp_regen.log
          python factor_engine/scripts/certify_recipe_evidence.py >> .factorengine_tmp_regen.log 2>&1
          recipe_rc=$?
          echo "recipe_rc=$recipe_rc" >> .factorengine_tmp_regen.log

          regen_rc=0
          if [ "$focused_rc" -eq 0 ] && [ "$sync_rc" -eq 0 ] && [ "$primitive_rc" -eq 0 ] && [ "$recipe_rc" -eq 0 ]; then
            echo "== regenerate deterministic governance artifacts ==" >> .factorengine_tmp_regen.log
            python factor_engine/scripts/generate_operators_catalog.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
            python factor_engine/scripts/export_dsl_allowlist.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
            python factor_engine/scripts/generate_layer_manifests.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
            python factor_engine/scripts/generate_operator_usage_report.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
            python factor_engine/scripts/sync_backend_docs.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
            python factor_engine/scripts/generate_backend_evidence_manifest.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
            python factor_cold_start/scripts/report_coverage.py >> .factorengine_tmp_regen.log 2>&1 || regen_rc=$?
          else
            echo "regeneration skipped because a prerequisite failed" >> .factorengine_tmp_regen.log
            regen_rc=99
          fi
          echo "regen_rc=$regen_rc" >> .factorengine_tmp_regen.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .factorengine_tmp_regen.log
          if [ "$regen_rc" -eq 0 ]; then
            git add factor_engine/evidence \
                    factor_engine/cleaned_operators/docs \
                    factor_engine/docs \
                    factor_cold_start/reports
          fi
          if git diff --cached --quiet; then
            echo "No diagnostic or generated changes"
            exit 0
          fi
          git commit -m "Record FactorEngine regeneration diagnostics"
          git push origin HEAD:agent/factorengine-production-routing-lqtp-20260731
