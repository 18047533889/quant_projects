name: Temporary FactorEngine Governance Regeneration

on:
  push:
    branches:
      - agent/factorengine-production-routing-lqtp-20260731

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-routing-lqtp-20260731
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Re-certify backend and recipe evidence
        run: |
          python factor_engine/scripts/sync_primitive_evidence.py
          python factor_engine/scripts/certify_primitive_evidence.py
          python factor_engine/scripts/certify_recipe_evidence.py
      - name: Regenerate deterministic governance artifacts
        run: |
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_backend_docs.py
          python factor_engine/scripts/generate_backend_evidence_manifest.py
          python factor_cold_start/scripts/report_coverage.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factor_engine/evidence \
                  factor_engine/cleaned_operators/docs \
                  factor_engine/docs \
                  factor_cold_start/reports
          if git diff --cached --quiet; then
            echo "No generated artifact changes"
            exit 0
          fi
          git commit -m "Regenerate FactorEngine governance and evidence"
          git push origin HEAD:agent/factorengine-production-routing-lqtp-20260731
