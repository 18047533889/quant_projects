name: FactorEngine Production Contract

on:
  pull_request:
    paths:
      - 'factor_engine/**'
      - 'factor_cold_start/**'
      - '.github/workflows/factorengine-production-contract.yml'
  push:
    branches: [main]
    paths:
      - 'factor_engine/**'
      - 'factor_cold_start/**'
      - '.github/workflows/factorengine-production-contract.yml'

permissions:
  contents: write

jobs:
  refresh-certification:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Apply final warning-safe chart implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('factor_engine/cleaned_operators/price_volume/structure_patterns_extra_v2.py')
          text=path.read_text(encoding='utf-8')
          old='def _similar(values,tol):\n    stack=np.stack([v.to_numpy(float) for v in values]);mx=np.nanmax(stack,axis=0);mn=np.nanmin(stack,axis=0);mid=np.nanmean(np.abs(stack),axis=0);score=np.clip(1-(mx-mn)/np.where(mid>0,mid,np.nan)/tol,0,1);return pd.DataFrame(score,index=values[0].index,columns=values[0].columns)\n'
          new='''def _similar(values,tol):
    stack=np.stack([v.to_numpy(float) for v in values])
    valid=np.isfinite(stack)
    count=valid.sum(axis=0)
    mx=np.max(np.where(valid,stack,-np.inf),axis=0)
    mn=np.min(np.where(valid,stack,np.inf),axis=0)
    abs_sum=np.where(valid,np.abs(stack),0.0).sum(axis=0)
    mid=np.divide(abs_sum,count,out=np.full(count.shape,np.nan,dtype=float),where=count>0)
    complete=count==len(values)
    denom=mid*float(tol)
    ratio=np.full(count.shape,np.nan,dtype=float)
    np.divide(mx-mn,denom,out=ratio,where=complete&(denom>0))
    score=np.where(complete,np.clip(1-ratio,0,1),np.nan)
    return pd.DataFrame(score,index=values[0].index,columns=values[0].columns)
'''
          if old in text:
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          elif new not in text:
              raise SystemExit('chart-pattern similarity anchor missing')
          PY
          python -m compileall -q factor_engine factor_cold_start
      - name: Verify production runtimes before signing
        run: |
          set -euo pipefail
          python factor_engine/scripts/audit_all_factor_production.py --runtime-only
          pytest -q \
            factor_engine/tests/operators/test_v2_macro_and_intraday_dsl.py \
            factor_engine/tests/operators/test_technical_extensions.py \
            factor_engine/tests/operators/test_candle_patterns_extended.py \
            factor_engine/tests/runtime/test_source_window_contract_v2.py \
            factor_engine/tests/runtime/test_incremental_history_contract_v2.py \
            factor_engine/tests/runtime/test_full_history_replay_contract_v2.py
      - name: Rebuild all implementation-bound evidence and governed artifacts
        run: |
          set -euo pipefail
          python factor_engine/scripts/sync_primitive_evidence.py
          python factor_engine/scripts/certify_primitive_evidence.py
          python factor_engine/scripts/certify_factor_operator_evidence.py
          python factor_engine/scripts/certify_recipe_evidence.py
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_backend_docs.py
          python factor_engine/scripts/generate_backend_evidence_manifest.py
          python factor_engine/scripts/generate_lqtp_compatibility_manifest.py
          python factor_cold_start/scripts/report_coverage.py
      - name: Persist certified source and evidence
        run: |
          set -euo pipefail
          git config user.name factorengine-certification-bot
          git config user.email factorengine-certification-bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Certify FactorEngine production implementation and evidence'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  production-contract:
    needs: refresh-certification
    if: always() && (needs.refresh-certification.result == 'success' || needs.refresh-certification.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Verify backend factor and recipe evidence
        run: |
          set -euo pipefail
          python factor_engine/scripts/sync_primitive_evidence.py --check
          python factor_engine/scripts/certify_primitive_evidence.py --check
          python factor_engine/scripts/certify_factor_operator_evidence.py --check
          python factor_engine/scripts/certify_recipe_evidence.py --check
      - name: Audit every Factor DSL production operator
        run: python factor_engine/scripts/audit_all_factor_production.py
      - name: Regression test production contracts
        run: |
          pytest -q \
            factor_engine/tests/operators/test_promoted_production_repairs.py \
            factor_engine/tests/operators/test_technical_extensions.py \
            factor_engine/tests/operators/test_candle_patterns_extended.py \
            factor_engine/tests/operators/test_v2_operator_expansion.py \
            factor_engine/tests/operators/test_v2_macro_and_intraday_dsl.py \
            factor_engine/tests/operators/test_evidence_fail_closed_v2.py \
            factor_engine/tests/operators/test_fundamental_flow_semantics_v2.py \
            factor_engine/tests/operators/test_expectation_event_semantics_v2.py \
            factor_engine/tests/operators/test_analyzer_semantic_warmup_v2.py \
            factor_engine/tests/operators/test_recipe_production_admission_v2.py \
            factor_engine/tests/runtime/test_full_history_replay_contract_v2.py \
            factor_engine/tests/runtime/test_incremental_history_contract_v2.py \
            factor_engine/tests/runtime/test_source_window_contract_v2.py \
            factor_engine/tests/runtime/test_logical_source_production_contracts.py
      - name: Verify cold-start production admission and coverage
        run: |
          pytest -q factor_cold_start/tests
          python factor_cold_start/scripts/report_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('factor_cold_start/reports/coverage.json').read_text())
          errors=[]
          for key,row in report['catalogs'].items():
              if row['readiness']!='production':
                  continue
              if not key.endswith('_daily'):
                  errors.append(f'{key}: production catalog must be daily-output')
              if row['factor_count']<=0:
                  errors.append(f'{key}: empty production cold-start catalog')
              if row['production_operator_coverage_pct']!=100.0:
                  errors.append(f"{key}: missing={row['missing_production_operators']}")
          if errors:
              raise SystemExit('\n'.join(errors))
          PY
      - name: Smoke deployment backend calibration
        run: |
          python factor_engine/scripts/calibrate_backend_costs.py --rows 200 500 --repeats 1 --output /tmp/backend_cost_smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/backend_cost_smoke.json').read_text())
          assert payload['provenance']['measured'] is True
          assert payload['operators'], 'empty calibration corpus'
          failures=[]
          measured=0
          for canonical,row in payload['operators'].items():
              for backend,result in row.items():
                  measured+=1
                  if isinstance(result,dict) and result.get('error'):
                      failures.append(f"{canonical}/{backend}: {result['error']}")
          assert measured>0, 'no production-safe backend candidates were calibrated'
          if failures:
              raise SystemExit('calibration failures:\n'+'\n'.join(failures))
          PY
      - name: Compile production modules
        run: python -m compileall -q factor_engine factor_cold_start
