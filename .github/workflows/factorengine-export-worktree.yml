name: FactorEngine Tree Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/factorengine-export-worktree.yml

permissions:
  contents: read

jobs:
  export-tree:
    if: github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-completion-20260801
          fetch-depth: 1
      - name: Export tree metadata
        run: |
          mkdir -p metadata
          git rev-parse HEAD > metadata/head_sha.txt
          git rev-parse 'HEAD^{tree}' > metadata/base_tree_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: factorengine-tree-metadata
          path: metadata
          if-no-files-found: error
          retention-days: 1
