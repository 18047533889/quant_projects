name: Export Corrupt FactorEngine Payload Part

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/factorengine-export-worktree.yml

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-completion-20260801
          fetch-depth: 1
      - name: Copy payload part
        run: |
          mkdir -p payload-export
          cp .factorengine-payload/part02 payload-export/part02
          wc -c payload-export/part02
          sha256sum payload-export/part02
      - uses: actions/upload-artifact@v4
        with:
          name: factorengine-corrupt-part02
          path: payload-export/part02
          if-no-files-found: error
          retention-days: 1
