name: Inspect FactorEngine Fix Payload

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/factorengine-export-worktree.yml
      - .factorengine-payload/**

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-completion-20260801
          fetch-depth: 1
      - name: Record payload metadata
        run: |
          wc -c .factorengine-payload/part*
          sha256sum .factorengine-payload/part*
          cat .factorengine-payload/part* > .factorengine-payload/combined.b64
          wc -c .factorengine-payload/combined.b64
      - uses: actions/upload-artifact@v4
        with:
          name: factorengine-fix-payload
          path: .factorengine-payload
          if-no-files-found: error
          retention-days: 1
