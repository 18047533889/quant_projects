name: Apply FactorEngine Fix Payload

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/factorengine-export-worktree.yml
      - .factorengine-payload/**

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-completion-20260801
          fetch-depth: 0
      - name: Apply audited FactorEngine changes
        shell: bash
        run: |
          set -euo pipefail
          cat .factorengine-payload/part* > /tmp/factorengine-fix.b64
          base64 --decode /tmp/factorengine-fix.b64 > /tmp/factorengine-fix.tar.gz
          echo '49a07d4e3bd3a3428fc8afb8e7d9bb49d4d573ff1defbd77282446bde9958f78  /tmp/factorengine-fix.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/factorengine-fix.tar.gz -C .
          rm -rf .factorengine-payload
          rm -f .github/workflows/factorengine-export-worktree.yml
          git diff --check
          python -m compileall -q \
            factor_engine/cleaned_operators/fiscal_strict.py \
            factor_engine/cleaned_operators/production_repairs.py \
            factor_engine/cleaned_operators/layer_governance.py \
            factor_engine/cleaned_operators/operator_surface.py \
            factor_engine/cleaned_operators/price_volume/liquidity_naming_v2.py \
            factor_cold_start/catalog.py \
            factor_cold_start/generator.py \
            factor_cold_start/v2_operator_seeds.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix FactorEngine fiscal, regression, surface, and cold-start contracts'
          git push origin HEAD:agent/factorengine-production-completion-20260801
