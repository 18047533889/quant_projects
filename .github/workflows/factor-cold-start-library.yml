name: Factor Cold Start Library

on:
  push:
    branches: [main]
    paths:
      - "factor_cold_start/**"
      - "factor_engine/**"
      - "week2_pv_factors/**"
      - "gtja191/**"
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - ".github/workflows/factor-cold-start-library.yml"
  pull_request:
    paths:
      - "factor_cold_start/**"
      - "factor_engine/**"
      - "week2_pv_factors/**"
      - "gtja191/**"
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - ".github/workflows/factor-cold-start-library.yml"

permissions:
  contents: read

concurrency:
  group: factor-cold-start-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - name: Compile cold-start package
        run: python -m compileall -q factor_cold_start
      - name: Enforce deterministic coverage reports
        shell: bash
        run: |
          python factor_cold_start/scripts/report_coverage.py
          git diff --exit-code -- factor_cold_start/reports
      - name: Run cold-start unit and integration tests
        run: pytest -q factor_cold_start/tests
      - name: Validate every generated factor
        run: python factor_cold_start/scripts/validate_catalog.py --all
