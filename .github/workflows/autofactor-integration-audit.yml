name: AutoFactorEvaluation Integration Audit

on:
  push:
    branches:
      - agent/integrate-autofactor-evaluation
    paths:
      - ".github/workflows/autofactor-integration-audit.yml"
      - "AutoFactorEvaluation-RECONSTRUCT/**"
      - "factor_engine/**"
      - "data_access/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integration inventory
        shell: bash
        run: |
          set -euo pipefail
          root="AutoFactorEvaluation-RECONSTRUCT"
          test -d "$root"
          mkdir -p integration-audit
          {
            echo "# FILE TREE"
            find "$root" -type f | sort
            echo
            echo "# NESTED FACTOR ENGINE FILES"
            find "$root" -path '*/factor_engine/*' -type f | sort
            echo
            echo "# FACTOR ENGINE IMPORTS"
            grep -RInE '(^|[^A-Za-z0-9_])(from|import)[[:space:]]+factor_engine|from[[:space:]]+(api|backend|ir|planner|runtime|storage)\.' "$root" --include='*.py' || true
            echo
            echo "# PATH HACKS"
            grep -RInE 'sys\.path|FACTOR_ENGINE_ROOT|MONOREPO_ROOT|Path\(__file__\)' "$root" --include='*.py' || true
            echo
            echo "# DIRECT DATA IO"
            grep -RInE 'read_parquet|scan_parquet|read_csv|read_json|to_parquet|write_parquet|glob\(|rglob\(|StockDailyBar|market_data_path|database/' "$root" --include='*.py' || true
            echo
            echo "# DATA ACCESS IMPORTS"
            grep -RInE '(^|[^A-Za-z0-9_])(from|import)[[:space:]]+data_access' "$root" --include='*.py' || true
            echo
            echo "# EXECUTION ENTRYPOINTS"
            grep -RInE 'def (main|run_|process_|evaluate|execute|materialize)|if __name__ == .__main__.' "$root" --include='*.py' || true
            echo
            echo "# TEST FILES"
            find "$root" -type f \( -name 'test_*.py' -o -name '*_test.py' \) | sort
            echo
            echo "# DEPENDENCY FILES"
            find "$root" -maxdepth 3 -type f \( -name 'requirements*.txt' -o -name 'pyproject.toml' -o -name 'setup.py' -o -name 'setup.cfg' -o -name 'environment.yml' \) -print -exec sh -c 'echo --- $1; sed -n "1,240p" "$1"' _ {} \;
          } > integration-audit/report.txt

          python - <<'PY'
          import ast, json
          from pathlib import Path
          root = Path('AutoFactorEvaluation-RECONSTRUCT')
          rows = []
          for path in sorted(root.rglob('*.py')):
              try:
                  tree = ast.parse(path.read_text(encoding='utf-8', errors='replace'))
              except Exception as exc:
                  rows.append({'path': str(path), 'parse_error': f'{type(exc).__name__}: {exc}'})
                  continue
              imports = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.append(node.module or '')
              rows.append({'path': str(path), 'imports': sorted(set(imports))})
          Path('integration-audit/imports.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          PY

      - name: Baseline import and tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest numpy pandas pyarrow polars duckdb scipy pyyaml
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/factor_engine:$GITHUB_WORKSPACE/AutoFactorEvaluation-RECONSTRUCT"
          {
            echo "# PYTHON VERSION"
            python --version
            echo "# COMPILEALL"
            python -m compileall -q AutoFactorEvaluation-RECONSTRUCT
            echo "# PYTEST COLLECTION"
            pytest --collect-only -q AutoFactorEvaluation-RECONSTRUCT
            echo "# PYTEST"
            pytest -q AutoFactorEvaluation-RECONSTRUCT --disable-warnings --maxfail=50
          } 2>&1 | tee integration-audit/baseline-tests.txt

      - name: Upload integration audit
        uses: actions/upload-artifact@v4
        with:
          name: autofactor-integration-audit
          path: integration-audit/
          if-no-files-found: error
