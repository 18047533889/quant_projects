name: Regenerate FactorEngine Certified Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/factorengine-regenerate-artifacts-temp.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factorengine-production-completion-20260801
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Apply audited FactorEngine source repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'repair target not found: {path_str}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'factor_engine/tests/operators/test_production_convergence.py',
              '''def test_explicit_backend_preference_cannot_bypass_production_evidence() -> None:\n    # ts_ewm_std is implemented natively but is not independently production-certified.\n    from backend.operator_capability import UnsupportedOperatorBackendError\n\n''',
              '''def test_explicit_backend_preference_cannot_bypass_production_evidence() -> None:\n    # This routing assertion requires a current Pandas factor-operator artifact.\n    # Primitive evidence is certified first, so stale/missing factor evidence is\n    # covered by dedicated fail-closed tests rather than creating a bootstrap loop.\n    from backend.factor_operator_evidence import factor_operator_evidence_valid\n    from backend.operator_capability import UnsupportedOperatorBackendError\n\n    if not factor_operator_evidence_valid():\n        pytest.skip("requires current factor-operator evidence")\n\n''',
          )

          replace_once(
              'factor_engine/cleaned_operators/price_volume/candle_pattern_engine_v2.py',
              '''    sign=pd.DataFrame(0.0,index=o.index,columns=o.columns)\n    def emit(mask,direction):return sign.mask(mask,float(direction))\n''',
              '''    sign=pd.DataFrame(0.0,index=o.index,columns=o.columns)\n    def emit(mask,direction):\n        if np.isscalar(direction):\n            resolved=float(direction)\n        elif isinstance(direction,pd.DataFrame):\n            resolved=direction.astype(float)\n        else:\n            resolved=pd.DataFrame(np.asarray(direction,dtype=float),index=o.index,columns=o.columns)\n        return sign.mask(mask,resolved)\n''',
          )

          replace_once(
              'factor_engine/scripts/audit_all_factor_production.py',
              '''_SPECIAL_SCALARS: dict[tuple[str, str], Any] = {\n    ("cs_rank_gaussian", "method"): "blom",\n''',
              '''_SPECIAL_SCALARS: dict[tuple[str, str], Any] = {\n    ("fin_trend_acceleration", "short_periods"): 4,\n    ("fin_trend_acceleration", "long_periods"): 8,\n    ("ts_regression_slope", "retval"): "slope",\n    ("yoy_by_period", "denominator"): "signed",\n    ("cs_rank_gaussian", "method"): "blom",\n''',
          )
          PY
      - name: Compile FactorEngine sources
        run: |
          python -m compileall -q \
            factor_engine/backend \
            factor_engine/cleaned_operators \
            factor_engine/api \
            factor_engine/ir \
            factor_engine/runtime \
            factor_engine/storage/sources \
            factor_engine/factor_recipes \
            factor_engine/scripts \
            factor_cold_start
      - name: Certify production evidence
        run: |
          python factor_engine/scripts/sync_primitive_evidence.py --check
          if ! python factor_engine/scripts/certify_primitive_evidence.py --check; then
            python factor_engine/scripts/certify_primitive_evidence.py
          fi
          if ! python factor_engine/scripts/certify_factor_operator_evidence.py --check; then
            python factor_engine/scripts/certify_factor_operator_evidence.py
          fi
          if ! python factor_engine/scripts/certify_recipe_evidence.py --check; then
            python factor_engine/scripts/certify_recipe_evidence.py
          fi
      - name: Regenerate governed artifacts
        run: |
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_backend_docs.py
          python factor_engine/scripts/generate_backend_evidence_manifest.py
          python factor_engine/scripts/generate_lqtp_compatibility_manifest.py
          python factor_cold_start/scripts/report_coverage.py
      - name: Validate certified artifacts
        run: |
          python factor_engine/scripts/certify_primitive_evidence.py --check
          python factor_engine/scripts/certify_factor_operator_evidence.py --check
          python factor_engine/scripts/certify_recipe_evidence.py --check
          python factor_engine/scripts/generate_backend_evidence_manifest.py --check
          python factor_engine/scripts/generate_lqtp_compatibility_manifest.py --check
          python factor_engine/scripts/audit_all_factor_production.py
          pytest -q \
            factor_engine/tests/test_operator_surface.py \
            factor_engine/tests/operators/test_v2_operator_expansion.py \
            factor_engine/tests/operators/test_v2_macro_and_intraday_dsl.py \
            factor_engine/tests/operators/test_evidence_fail_closed_v2.py \
            factor_engine/tests/operators/test_fundamental_flow_semantics_v2.py \
            factor_engine/tests/operators/test_analyzer_semantic_warmup_v2.py \
            factor_engine/tests/operators/test_recipe_production_admission_v2.py \
            factor_engine/tests/runtime/test_full_history_replay_contract_v2.py \
            factor_engine/tests/operators/test_cos_fiscal_primitives.py \
            factor_engine/tests/operators/test_production_convergence.py
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('factor_cold_start/reports/coverage.json').read_text())
          print(min(v['eligible_operator_coverage_pct'] for k, v in payload['catalogs'].items() if k.endswith('_extended')))
          PY
          )" = "100.0"
      - name: Commit source and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/factorengine-regenerate-artifacts-temp.yml
          python - <<'PY'
          import subprocess
          allowed = (
              'factor_engine/tests/operators/test_production_convergence.py',
              'factor_engine/cleaned_operators/price_volume/candle_pattern_engine_v2.py',
              'factor_engine/scripts/audit_all_factor_production.py',
              'factor_engine/evidence/',
              'factor_engine/benchmarks/operator_manifest.json',
              'factor_engine/cleaned_operators/docs/',
              'factor_engine/docs/',
              'factor_cold_start/reports/',
              '.github/workflows/factorengine-regenerate-artifacts-temp.yml',
          )
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          unexpected = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if not any(path == prefix or path.startswith(prefix) for prefix in allowed):
                  unexpected.append(path)
          if unexpected:
              raise SystemExit(f'unexpected generated changes: {unexpected}')
          PY
          git config user.name 'factorengine-evidence-bot'
          git config user.email 'factorengine-evidence-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh certified FactorEngine production artifacts'
          git push origin HEAD:agent/factorengine-production-completion-20260801
