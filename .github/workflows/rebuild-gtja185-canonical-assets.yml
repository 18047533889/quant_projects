name: Rebuild GTJA185 Canonical Assets

on:
  push:
    branches:
      - agent/autofactor-gtja185-evaluation
    paths:
      - ".github/workflows/rebuild-gtja185-canonical-assets.yml"
      - ".github/scripts/rebuild_gtja185_canonical_assets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-gtja185-canonical-assets
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-gtja185-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependencies
        run: python -m pip install pyyaml
      - name: Rebuild all canonical assets
        run: python .github/scripts/rebuild_gtja185_canonical_assets.py
      - name: Verify generated assets are stable
        shell: bash
        run: |
          set -euo pipefail
          cp gtja191/dsl/gtja191_dsl_catalog.json /tmp/gtja_catalog.json
          cp AutoFactorEvaluation-RECONSTRUCT/factor_packs/gtja185_pack.json /tmp/gtja_pack.json
          python gtja191/scripts/convert_and_build_delivery.py
          python gtja191/scripts/generate_materialize_configs.py
          python AutoFactorEvaluation-RECONSTRUCT/scripts/generate_gtja185_pack.py
          cmp /tmp/gtja_catalog.json gtja191/dsl/gtja191_dsl_catalog.json
          cmp /tmp/gtja_pack.json AutoFactorEvaluation-RECONSTRUCT/factor_packs/gtja185_pack.json
      - name: Commit canonical assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/rebuild_gtja185_canonical_assets.py
          rm -f .github/workflows/rebuild-gtja185-canonical-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize GTJA185 VWAP semantics and PIT metadata"
          git push origin HEAD:agent/autofactor-gtja185-evaluation
