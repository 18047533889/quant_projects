name: Operator Overhaul Autofix

on:
  push:
    branches: [agent/factor-engine-operator-overhaul]

permissions:
  contents: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factor-engine-operator-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - name: Regenerate operator artifacts
        run: |
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            factor_engine/cleaned_operators/docs/operators_catalog.md \
            factor_engine/cleaned_operators/docs/operators_catalog.json \
            factor_engine/docs/dsl_allowlist.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate operator artifacts [skip ci]"
            git push origin HEAD:agent/factor-engine-operator-overhaul
          fi
      - name: Run overhaul tests
        run: |
          pytest -q factor_engine/tests/operators/test_operator_overhaul.py
          pytest -q factor_engine/tests/test_operator_surface.py
          python factor_engine/scripts/validate_public_factor_formulas.py
