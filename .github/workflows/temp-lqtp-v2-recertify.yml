name: Temporary LQTP V2 Recertification
on:
  push:
    branches: [agent/lqtp-compat-v2-full-20260731]
  pull_request:
    branches: [main]
    paths:
      - "factor_engine/**"
      - ".github/workflows/temp-lqtp-v2-recertify.yml"
permissions:
  contents: write
jobs:
  recertify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lqtp-compat-v2-full-20260731
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Test, recertify and regenerate
        run: |
          pytest -q factor_engine/tests/test_lqtp_production_runtime.py factor_engine/tests/test_lqtp_v2_source_runtime.py
          python factor_engine/scripts/sync_primitive_evidence.py
          python factor_engine/scripts/certify_primitive_evidence.py
          python factor_engine/scripts/certify_recipe_evidence.py
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_backend_docs.py
          python factor_engine/scripts/generate_backend_evidence_manifest.py
          python factor_engine/scripts/generate_lqtp_compatibility_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factor_engine/evidence factor_engine/cleaned_operators/docs factor_engine/docs
          if ! git diff --cached --quiet; then
            git commit -m "Recertify FactorEngine after LQTP v2 changes"
            git push origin HEAD:agent/lqtp-compat-v2-full-20260731
          fi
