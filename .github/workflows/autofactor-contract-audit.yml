name: AutoFactorEvaluation Compatibility Patch

on:
  push:
    branches: [agent/autofactor-standalone-reconstruct]
    paths:
      - ".github/workflows/autofactor-contract-audit.yml"
      - "AutoFactorEvaluation-RECONSTRUCT/.contract-audit-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-standalone-reconstruct
      - name: Restore bridge compatibility API
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AutoFactorEvaluation-RECONSTRUCT/integrations/quant_platform.py")
          text = path.read_text(encoding="utf-8")
          old = "from platform_bootstrap import activate_platform\n\nPLATFORM_LAYOUT = activate_platform()\n"
          new = '''from platform_bootstrap import PlatformLayout, activate_platform


def bootstrap_quant_platform() -> PlatformLayout:
    """Activate and return the reviewed AutoFactorEvaluation platform runtime.

    This compatibility entrypoint is intentionally retained because Gateway,
    Assetization and Evaluation modules call it before importing platform APIs.
    Resolution remains bundled-first and idempotent.
    """

    return activate_platform()


PLATFORM_LAYOUT = bootstrap_quant_platform()
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "def bootstrap_quant_platform()" not in text:
              raise RuntimeError("platform activation block not found")
          text = text.replace(
              "用仓库根最新 FactorEngine 做真实 parser/analyzer/planner 编译。",
              "用内嵌受审计 FactorEngine 做真实 parser/analyzer/planner 编译。",
          )
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AutoFactorEvaluation-RECONSTRUCT/integrations/quant_platform.py
          git commit -m "Restore standalone platform bootstrap compatibility" || exit 0
          git push origin HEAD:agent/autofactor-standalone-reconstruct
