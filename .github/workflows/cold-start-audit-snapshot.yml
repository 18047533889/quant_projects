name: Cold Start Audit Snapshot

on:
  push:
    branches: [agent/expand-factor-cold-start-20260801]
    paths:
      - ".github/workflows/cold-start-audit-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cold-start-audit-source
          retention-days: 1
          if-no-files-found: error
          path: |
            factor_engine
            factor_cold_start
            factor-pool-standard
            week2_pv_factors
            gtja191
            AutoFactorEvaluation-RECONSTRUCT
            requirements.txt
            pytest.ini
