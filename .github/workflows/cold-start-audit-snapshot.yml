name: Apply and Validate Cold Start Expansion

# Atomic payload staging; removed after the validated source commit lands.
on:
  push:
    branches: [agent/expand-factor-cold-start-20260801]
    paths:
      - ".github/workflows/cold-start-audit-snapshot.yml"
      - ".cold_start_patch/**"

permissions:
  contents: write

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/AutoFactorEvaluation-RECONSTRUCT:${{ github.workspace }}/dataaccess
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
      FACTOR_ENGINE_RUN_MODE: research
      QUANT_PRODUCTION_MODE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/expand-factor-cold-start-20260801
      - name: Apply audited expansion patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import lzma
          payload = Path('.cold_start_patch/payload.b85')
          if not payload.is_file():
              raise SystemExit('cold-start patch payload missing')
          Path('/tmp/cold_start_v2.patch').write_bytes(
              lzma.decompress(base64.b85decode(payload.read_text(encoding='utf-8').encode('ascii')))
          )
          PY
          patch -p1 --forward --batch < /tmp/cold_start_v2.patch
          rm -rf .cold_start_patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - name: Compile and rebuild coverage
        run: |
          python -m compileall -q factor_cold_start
          python factor_cold_start/scripts/report_coverage.py
      - name: Run cold-start tests
        run: pytest -q factor_cold_start/tests
      - name: Parse and validate all generated factors
        run: python factor_cold_start/scripts/validate_catalog.py --all
      - name: Publish validated expansion
        shell: bash
        run: |
          rm -f .github/workflows/cold-start-audit-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand cold-start library across all FactorEngine surfaces"
          git push origin HEAD:agent/expand-factor-cold-start-20260801
