name: FactorEngine Runner Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bare-runner:
    if: github.event.pull_request.head.ref == 'agent/factorengine-production-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bare runner diagnostics
        run: |
          python3 --version
          test -f requirements.txt
          test -f factor_engine/cleaned_operators/price_volume/technical_extensions.py
          python3 -m py_compile \
            factor_engine/cleaned_operators/price_volume/technical_extensions.py \
            factor_engine/cleaned_operators/price_volume/technical_structure_repairs.py \
            factor_engine/cleaned_operators/price_volume/candle_patterns_extended.py \
            factor_engine/cleaned_operators/production_hardening.py \
            factor_engine/cleaned_operators/production_certification_overlay.py \
            factor_engine/ir/analyzer.py \
            factor_engine/backend/pandas_first_signature.py \
            factor_cold_start/technical_extension_seeds.py \
            factor_cold_start/candle_pattern_seeds.py
