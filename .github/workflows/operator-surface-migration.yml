name: Apply Operator Surface Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply_operator_surface_cleanup.py"
      - ".github/workflows/operator-surface-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operator-surface-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-surface-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply migration
        run: python .github/scripts/apply_operator_surface_cleanup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate public catalogs
        run: |
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
      - name: Compile FactorEngine
        run: python -m compileall -q factor_engine
      - name: Operator surface tests
        run: pytest -q factor_engine/tests/test_operator_surface.py
      - name: Repository formula validation
        run: python factor_engine/scripts/validate_public_factor_formulas.py
      - name: GTJA185 compatibility
        run: pytest -q gtja191/tests/test_full_catalog_factor_engine.py gtja191/tests/test_gtja191.py
      - name: FactorEngine regressions
        run: pytest -q factor_engine/tests/test_gtja_compat_semantics.py factor_engine/tests/test_data_scope_stability.py
      - name: Upload migrated tree on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-surface-migration-diagnostics
          path: |
            factor_engine/cleaned_operators/operator_surface.py
            factor_engine/backend/cleaned_bridge.py
            factor_engine/cleaned_operators/_dedupe.py
            factor_engine/tests/test_operator_surface.py
            factor_engine/docs/dsl_allowlist.json
            factor_engine/cleaned_operators/docs/operators_catalog.json
      - name: Commit migrated implementation
        run: |
          rm -f .github/scripts/apply_operator_surface_cleanup.py
          rm -f .github/workflows/operator-surface-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate daily, research, unsafe, and legacy operator surfaces"
          git push origin HEAD:agent/operator-surface-cleanup
