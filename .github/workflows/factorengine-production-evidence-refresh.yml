name: FactorEngine Production Evidence Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'agent/factorengine-production-hardening' ||
       github.event.pull_request.head.ref == 'agent/factorengine-production-completion-20260801')
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./dataaccess
          python -m pip install pytest pyyaml
      - name: Apply audited source-contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('factor_engine/scripts/audit_all_factor_production.py')
          text = audit.read_text(encoding='utf-8')
          anchor = '    ("period_lag", "revision_policy"): "latest_available",\n'
          insertion = (
              anchor
              + '    ("fin_trend_acceleration", "short_periods"): 4,\n'
              + '    ("fin_trend_acceleration", "long_periods"): 8,\n'
              + '    ("ts_regression_slope", "retval"): "slope",\n'
              + '    ("yoy_by_period", "denominator"): "signed",\n'
          )
          if '("ts_regression_slope", "retval")' not in text:
              if anchor not in text:
                  raise SystemExit('audit special-scalar anchor missing')
              text = text.replace(anchor, insertion, 1)
          audit.write_text(text, encoding='utf-8')

          candle = Path(
              'factor_engine/cleaned_operators/price_volume/'
              'candle_pattern_engine_v2.py'
          )
          text = candle.read_text(encoding='utf-8')
          old = '    def emit(mask,direction):return sign.mask(mask,float(direction))\n'
          new = '''    def emit(mask,direction):
        if np.isscalar(direction):
            return sign.mask(mask,float(direction))
        values=np.asarray(direction,dtype=float)
        if values.shape!=sign.shape:
            values=np.broadcast_to(values,sign.shape)
        active=mask.fillna(False).to_numpy(dtype=bool)
        return pd.DataFrame(np.where(active,values,0.0),index=o.index,columns=o.columns)
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'values=np.asarray(direction,dtype=float)' not in text:
              raise SystemExit('candlestick emit anchor missing')
          candle.write_text(text, encoding='utf-8')

          Path('.github/workflows/factorengine-source-patch-temp.yml').unlink(
              missing_ok=True
          )
          PY
      - name: Compile semantic source before certification
        run: |
          python -m compileall -q \
            factor_engine/backend \
            factor_engine/cleaned_operators \
            factor_engine/api \
            factor_engine/ir \
            factor_engine/runtime \
            factor_engine/storage/sources \
            factor_engine/factor_recipes \
            factor_cold_start
      - name: Refresh stale production evidence only
        run: |
          python factor_engine/scripts/sync_primitive_evidence.py --check
          if ! python factor_engine/scripts/certify_primitive_evidence.py --check; then
            python factor_engine/scripts/certify_primitive_evidence.py
          fi
          if ! python factor_engine/scripts/certify_factor_operator_evidence.py --check; then
            python factor_engine/scripts/certify_factor_operator_evidence.py
          fi
          if ! python factor_engine/scripts/certify_recipe_evidence.py --check; then
            python factor_engine/scripts/certify_recipe_evidence.py
          fi
      - name: Regenerate governed artifacts
        run: |
          python factor_engine/scripts/generate_operators_catalog.py
          python factor_engine/scripts/export_dsl_allowlist.py
          python factor_engine/scripts/generate_layer_manifests.py
          python factor_engine/scripts/generate_operator_usage_report.py
          python factor_engine/scripts/sync_backend_docs.py
          python factor_engine/scripts/generate_backend_evidence_manifest.py
          python factor_engine/scripts/generate_lqtp_compatibility_manifest.py
          python factor_cold_start/scripts/report_coverage.py
      - name: Validate refreshed artifacts and all factor operators
        run: |
          python factor_engine/scripts/certify_primitive_evidence.py --check
          python factor_engine/scripts/certify_factor_operator_evidence.py --check
          python factor_engine/scripts/certify_recipe_evidence.py --check
          python factor_engine/scripts/audit_all_factor_production.py
          pytest -q \
            factor_engine/tests/test_operator_surface.py \
            factor_engine/tests/operators/test_v2_operator_expansion.py \
            factor_engine/tests/operators/test_v2_macro_and_intraday_dsl.py \
            factor_engine/tests/operators/test_evidence_fail_closed_v2.py \
            factor_engine/tests/operators/test_fundamental_flow_semantics_v2.py \
            factor_engine/tests/operators/test_analyzer_semantic_warmup_v2.py \
            factor_engine/tests/operators/test_recipe_production_admission_v2.py \
            factor_engine/tests/runtime/test_full_history_replay_contract_v2.py \
            factor_cold_start/tests
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('factor_cold_start/reports/coverage.json').read_text())
          failures=[]
          for key,row in report['catalogs'].items():
              if row['readiness'] != 'production':
                  continue
              if row['production_operator_coverage_pct'] != 100.0:
                  failures.append(f"{key}: {row['missing_production_operators']}")
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - name: Commit certified source and artifacts
        run: |
          if git diff --quiet; then
            echo 'No source or evidence changes.'
            exit 0
          fi
          git config user.name 'factorengine-evidence-bot'
          git config user.email 'factorengine-evidence-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh production contracts and cold-start evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}