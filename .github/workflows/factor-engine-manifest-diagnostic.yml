name: FactorEngine Manifest Diagnostic

on:
  push:
    branches: [agent/factor-engine-final-audit]
    paths:
      - "factor_engine/**"
      - ".github/workflows/factor-engine-manifest-diagnostic.yml"
  pull_request:
    paths:
      - "factor_engine/**"
      - ".github/workflows/factor-engine-manifest-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/factor_engine:${{ github.workspace }}/gtja191
      FACTOR_ENGINE_DISABLE_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml
      - id: manifests
        continue-on-error: true
        run: python factor_engine/scripts/generate_layer_manifests.py > /tmp/manifests.log 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-engine-manifest-traceback
          path: /tmp/manifests.log
      - if: steps.manifests.outcome == 'failure'
        run: exit 1
