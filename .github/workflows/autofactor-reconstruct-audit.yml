name: AutoFactorEvaluation Reconstruct Audit

on:
  push:
    branches: [agent/autofactor-standalone-reconstruct]
    paths:
      - ".github/workflows/autofactor-reconstruct-audit.yml"
      - "AutoFactorEvaluation-RECONSTRUCT/.assistant-audit-trigger"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autofactor-standalone-reconstruct
          fetch-depth: 0
      - name: Build repository audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="AutoFactorEvaluation-RECONSTRUCT"
          OUT="$ROOT/.assistant_platform_audit.txt"
          test -d "$ROOT"
          {
            echo "# MODULE SIZES"
            du -sh factor_engine data_access "$ROOT" || true
            echo
            echo "# MODULE FILE COUNTS"
            printf 'factor_engine\t'; find factor_engine -type f | wc -l
            printf 'data_access\t'; find data_access -type f | wc -l
            echo
            echo "# FACTOR_ENGINE TOP LEVEL"
            find factor_engine -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort
            echo
            echo "# DATA_ACCESS TOP LEVEL"
            find data_access -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort
            echo
            echo "# DATA_ACCESS IMPORTS"
            grep -RInE '^(from|import) ' data_access --include='*.py' | head -600 || true
            echo
            echo "# FACTOR_ENGINE PACKAGE IMPORT ROOTS"
            grep -RInE '^(from|import) (api|backend|cleaned_operators|expr|ir|planner|runtime|storage|data_access)' factor_engine --include='*.py' | head -800 || true
            echo
            for f in data_access/__init__.py data_access/store.py data_access/config/datasets.yaml factor_engine/requirements.txt factor_engine/pyproject.toml; do
              if [ -f "$f" ]; then
                echo
                echo "===== $f ====="
                sed -n '1,320p' "$f"
              fi
            done
          } > "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Capture embedded platform dependency audit" || exit 0
          git push origin HEAD:agent/autofactor-standalone-reconstruct
