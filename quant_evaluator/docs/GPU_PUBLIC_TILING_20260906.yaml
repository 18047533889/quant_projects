evidence_details:
  - Small real-GPU RankIC matches pandas/scipy independent CPU rank oracles including ties, NaN and explicit validity.
  - 129 factors use natural 128+1 device tiles; output order and one label upload are asserted.
  - Simulated OutOfMemoryError retries 4 to 2 only when policy allows, then completes on real CUDA.
  - Two concurrent threads retain separate CuPy allocator pools and restore the original allocator.
  - Memmap factor slices share storage; the public API does not copy all host factors.
limitations:
  - 100000-factor small synthetic panel acceptance passed, but no full real datasets. Host FactorBatch and requested result arrays still have total logical extent. Caller must stream batches or provide memmap inputs.
  - Memory estimate is conservative and calibrated for rank-family working sets; insufficient single-factor budget fails closed.
  - Label staging allocation failure is propagated, not retried. Per-session budgets do not reserve global memory across competing processes.
  - Labels remain resident across factor tiles within one evaluation; evaluate_many still creates a session per label horizon.
  - Context-aware CUDA metrics are explicitly unsupported rather than silently ignoring context.
  - OOM recovery is tested using injected errors, not by exhausting GPU memory.
