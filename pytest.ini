# Monorepo 根配置：子项目（如 factor_layer/factor_engine）可有各自的 pytest 配置；
# 此处主要统一「标记」说明，便于在 CI 或本机跳过重依赖用例。
#
# 示例（仅跑 backtest 单元测试，跳过 integration）：
#   pytest backtest_layer/tests -q -m "not integration"
#
# 示例（跑全量含 integration，需已安装 backtrader）：
#   pip install -e "factor_layer/factor_engine[backtest]"
#   pytest backtest_layer/tests -q

[pytest]
markers =
    integration: 依赖 backtrader、端到端或重 IO；可用 -m "not integration" 跳过
