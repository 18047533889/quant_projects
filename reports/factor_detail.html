<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>因子详情</title>
<style>
:root{--fg:#18202a;--muted:#5d6878;--line:#d9dee7;--bg:#f6f8fb;--panel:#fff;--blue:#255f9e}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:var(--fg);background:var(--bg);line-height:1.65}header{padding:28px 48px 22px;background:#fff;border-bottom:1px solid var(--line)}header>div,main{max-width:1280px;margin:auto}main{padding:24px}h1{margin:5px 0;font-size:27px}h2{margin:30px 0 13px;border-left:4px solid var(--blue);padding-left:10px;font-size:20px}.muted{color:var(--muted)}a{color:#165a9f;text-decoration:none}.notice,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}.notice{background:#eef6ff;border-color:#c9def5}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px}.metric b{display:block;color:var(--blue);font-size:21px}.metric span{color:var(--muted);font-size:11px}.chart{min-height:280px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;overflow:auto;display:flex;align-items:center;justify-content:center}.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eaf3fc;color:var(--blue);font-size:11px}pre{max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:6px;padding:12px;font-size:12px}.acf-bars{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center}.bar-track{height:16px;background:#edf1f5;border-radius:9px;position:relative;overflow:hidden}.bar-fill{height:100%;background:#4b83b6;border-radius:9px}
@media(max-width:900px){header{padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div><a href="index.html">← 返回汇总</a><h1 id="title">因子详情</h1><p class="muted" id="subtitle"></p></div></header>
<main><div class="notice">TopK平台暂未返回结果；其余指标按Week3口径完成。</div>
<section><h2>因子定义</h2><div class="panel"><span class="tag" id="route"></span><pre id="source"></pre></div></section>
<section><h2>① RankIC</h2><div class="metrics" id="rankic"></div><div class="chart" id="rankic-chart">—</div></section>
<section><h2>② 十分组</h2><div class="metrics" id="deciles"></div><div class="chart" id="decile-chart">—</div></section>
<section><h2>③ 多空（G10−G1）</h2><div class="metrics" id="ls"></div><div class="chart" id="ls-chart">—</div></section>
<section><h2>④ TopK OPEN</h2><div class="metrics" id="topk"></div><div class="chart">平台结果待补</div></section>
<section><h2>⑤ 因子自相关</h2><p class="muted">每日截面排名在lag 1/5/20的相关性，数值越高表示信号越持久。</p><div class="metrics" id="acf"></div><div class="panel acf-bars" id="acf-bars"></div></section>
</main><script src="report_data.js"></script><script>
(()=>{const key=new URLSearchParams(location.search).get('factor'),f=(window.REPORT_DATA?.factors||[]).find(x=>x.factor_key===key);if(!f){document.querySelector('main').innerHTML='<div class="notice">未找到因子。</div>';return}const m=f.metrics||{},s=f.series||{},a=f.autocorrelation||{},fmt=(v,d=4)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(d),pct=v=>v==null||!Number.isFinite(Number(v))?'—':(Number(v)*100).toFixed(2)+'%',metric=(v,l)=>`<div class="metric"><b>${v}</b><span>${l}</span></div>`;document.title=f.factor_name;document.querySelector('#title').textContent=f.factor_name;document.querySelector('#subtitle').textContent=`${f.factor_key} · ${f.run_metadata?.begin_date||'—'} ~ ${f.run_metadata?.end_date||'—'}`;document.querySelector('#route').textContent=f.route_label||f.route;document.querySelector('#source').textContent=f.source_payload||'—';document.querySelector('#rankic').innerHTML=metric(fmt(m.mean_rank_ic),'Mean RankIC')+metric(fmt(m.std_rank_ic),'Std RankIC')+metric(fmt(m.rank_ic_ir),'RankICIR')+metric(pct(m.rank_ic_positive_ratio),'胜率')+metric(pct(m.coverage),'覆盖率')+metric((s.daily_rank_ic||[]).length,'有效日数');document.querySelector('#deciles').innerHTML=(s.decile_terminal_returns||[]).map((v,i)=>metric(pct(v),`G${i+1}累计`)).join('');document.querySelector('#ls').innerHTML=metric(pct(m.ls_total_return_gross),'累计 gross')+metric(pct(m.ls_total_return_net),'累计 net')+metric(fmt(m.ls_sharpe_gross,3),'Sharpe gross')+metric(fmt(m.ls_sharpe_net,3),'Sharpe net')+metric(pct(m.ls_max_drawdown_net),'最大回撤 net');document.querySelector('#topk').innerHTML=metric('—','累计收益')+metric('—','年化收益')+metric('—','最大回撤')+metric('—','Sharpe');document.querySelector('#acf').innerHTML=metric(fmt(a.lag_1,3),'ACF(1)')+metric(fmt(a.lag_5,3),'ACF(5)')+metric(fmt(a.lag_20,3),'ACF(20)');document.querySelector('#acf-bars').innerHTML=[1,5,20].map(l=>{const v=Number(a[`lag_${l}`]),w=Number.isFinite(v)?Math.max(0,Math.min(100,(v+1)*50)):0;return `<div class="bar-row"><b>Lag ${l}</b><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><span>${fmt(v,3)}</span></div>`}).join('');
 const colors=['#255f9e','#c23b33','#2f8f68','#8b63b6','#d48b27','#4a91a8','#b7658e','#697b30','#7d6d61','#263f73'];function draw(id,items,zero=false){const box=document.querySelector(id),valid=items.filter(x=>Array.isArray(x.points)&&x.points.length);if(!valid.length)return;box.innerHTML='';const c=document.createElement('canvas');c.width=1120;c.height=290;c.style.width='100%';c.style.minWidth='720px';box.appendChild(c);const q=c.getContext('2d'),pad={l:58,r:18,t:24,b:35},W=c.width-pad.l-pad.r,H=c.height-pad.t-pad.b,vals=valid.flatMap(x=>x.points.map(p=>Number(p.value)).filter(Number.isFinite));let lo=Math.min(...vals),hi=Math.max(...vals);if(zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}if(lo===hi){lo-=1;hi+=1}const y=v=>pad.t+(hi-v)/(hi-lo)*H;q.font='11px sans-serif';q.fillStyle='#5d6878';for(let i=0;i<5;i++){const yy=pad.t+H*i/4;q.strokeStyle='#e2e6ec';q.beginPath();q.moveTo(pad.l,yy);q.lineTo(pad.l+W,yy);q.stroke();q.fillText((hi-(hi-lo)*i/4).toFixed(3),3,yy+4)}valid.forEach((it,j)=>{q.strokeStyle=colors[j%colors.length];q.lineWidth=1.5;q.beginPath();let on=false;it.points.forEach((p,i)=>{const v=Number(p.value);if(!Number.isFinite(v))return;const x=pad.l+i/Math.max(1,it.points.length-1)*W;if(!on){q.moveTo(x,y(v));on=true}else q.lineTo(x,y(v))});q.stroke();q.fillStyle=q.strokeStyle;q.fillText(it.name,pad.l+j*95,15)});q.fillStyle='#5d6878';q.fillText(String(valid[0].points[0]?.date||''),pad.l,pad.t+H+24);q.textAlign='right';q.fillText(String(valid[0].points.at(-1)?.date||''),pad.l+W,pad.t+H+24)}
 draw('#rankic-chart',[{name:'Daily RankIC',points:s.daily_rank_ic||[]}],true);draw('#decile-chart',Object.entries(s.decile_daily_returns||{}).map(([name,points])=>({name,points})));draw('#ls-chart',[{name:'Gross',points:s.long_short_nav_gross||[]},{name:'Net',points:s.long_short_nav_net||[]}]);})();
</script></body></html>
